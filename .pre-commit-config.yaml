# Pre-commit hooks - fulfil the promise in
# .github/instructions/generic-scope.instructions.md § Enforcement that
# "the same checks that CI runs" also run locally before a push.
#
# Install once:
#   make hooks-install
# This repository uses core.hooksPath=.githooks, whose tracked pre-commit hook
# delegates here. pre-commit ships in the `dev` extra; no extra pip install is
# needed.
#
# Run explicitly against everything:
#   uv run pre-commit run --all-files
#
# Worker-session hooks keep commits cheap and deterministic. Full strict mypy,
# diff-selected tests, and repository-wide gates run once per stable batch
# through `make validation-run`; CI remains the authoritative merge gate.

repos:
  # 1. Ruff - fast Python lint + format check. `ruff format --check`
  #    replaces black; `ruff` replaces isort + flake8-* stack per
  #    pyproject.toml [tool.ruff].
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: ["--no-fix"]
      - id: ruff-format
        args: ["--check"]

  # 2. Baseline hygiene - trailing whitespace, missing newline at EOF,
  #    large-file guard, merge-conflict marker guard.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Governed bundle manifests are exact canonical JSON bytes; a trailing
        # newline makes parse_skill_bundle_manifest reject the artifact.
        exclude: ^extensions/code-assurance/src/fdai_code_assurance/assets/skill-bundle\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # 3. Repo-specific gates - the five scripts wired into CI as separate
  #    jobs. Kept as `system` hooks so the exact CI script runs (no
  #    shim). `pass_filenames: false` because each script walks the
  #    tracked file set itself.
  - repo: local
    hooks:
      - id: resign-integrity
        name: resign-if-surface-staged.sh (auto re-sign manifest, upstream signer only)
        entry: bash scripts/integrity/resign-if-surface-staged.sh
        language: system
        pass_filenames: false
        # No-op unless the upstream private key is present AND a framework-
        # surface file is staged. Runs before check-integrity so the fresh
        # signature is what gets verified. Forks never have the key -> no-op.
        files: ^(services/core-control-plane/src/fdai/(core/|composition\.py|composition/|shared/providers/|shared/contracts/|agents/)|rule-catalog/schema/|\.github/instructions/)
      - id: check-punctuation
        name: check-punctuation.sh
        entry: bash scripts/quality/repository/check-punctuation.sh
        language: system
        require_serial: true
      - id: check-readable-hangul
        name: check-readable-hangul.py
        entry: python3 scripts/quality/localization/check-readable-hangul.py
        language: system
        require_serial: true
      - id: check-guids
        name: check-guids.sh
        entry: bash scripts/quality/repository/check-guids.sh
        language: system
        require_serial: true
      - id: check-translations
        name: check-translations.sh
        entry: bash scripts/quality/localization/check-translations.sh
        language: system
        pass_filenames: false
        files: ^(README(?:-ko)?\.md|docs/.*\.md)$
        exclude: ^docs/internals/
      - id: check-design-doc-impact
        name: check-design-doc-impact.py (staged paths)
        entry: python3 scripts/quality/architecture/check-design-doc-impact.py --cached
        language: system
        pass_filenames: false
      - id: check-core-imports
        name: check-core-imports.sh
        entry: bash scripts/quality/architecture/check-core-imports.sh
        language: system
        pass_filenames: false
        files: ^services/core-control-plane/src/fdai/core/
      - id: check-integrity
        name: check-integrity.sh (framework-surface signature, offline)
        entry: bash scripts/integrity/check-integrity.sh
        language: system
        pass_filenames: false
        # Only run when a framework-surface path (or the manifest itself)
        # changes - the offline signature + content check is unnecessary on
        # commits that touch nothing under the surface. Fork mode hard-fails
        # on a surface edit; upstream is advisory (re-sign before release).
        files: ^(services/core-control-plane/src/fdai/(core/|composition\.py|composition/|shared/providers/|shared/contracts/|agents/)|rule-catalog/schema/|\.github/instructions/|security/integrity/)
