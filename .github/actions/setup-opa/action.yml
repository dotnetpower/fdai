# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Set up OPA
description: "Install the checksum-pinned OPA binary used by deterministic policy tests."

runs:
  using: composite
  steps:
    - name: Install OPA policy runner
      shell: bash
      run: |
        set -euo pipefail
        opa_dir="$RUNNER_TEMP/fdai-opa/bin"
        mkdir -p "$opa_dir"
        curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
          --retry-max-time 120 --connect-timeout 10 --max-time 90 -o "$opa_dir/opa" \
          "https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static"
        echo "dfd5081fc6f930dfeaf2a225e31e616fc227dc0c7b43019b73d6f8fb8a1de1aa  $opa_dir/opa" \
          | sha256sum -c -
        chmod +x "$opa_dir/opa"
        echo "$opa_dir" >> "$GITHUB_PATH"
        "$opa_dir/opa" version
