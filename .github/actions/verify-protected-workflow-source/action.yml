name: Verify protected workflow source
description: "Verify an exact commit and workflow definition against protected origin/main."

inputs:
  target-commit-sha:
    description: Exact commit to verify.
    required: true
  workflow-path:
    description: Repository-relative workflow path that must match protected main.
    required: true
  origin-url:
    description: Authenticated repository Git URL.
    required: true
  github-token:
    description: Token used only to fetch protected repository objects and policy.
    required: true
  repository:
    description: Repository that owns the optional deployment Environment.
    required: false
    default: ""
  environment:
    description: Optional deployment Environment to verify.
    required: false
    default: ""
  required-approvals:
    description: Required reviewer approvals when an Environment is provided.
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Verify exact protected source
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        TARGET_COMMIT_SHA: ${{ inputs.target-commit-sha }}
        PROTECTED_WORKFLOW_PATH: ${{ inputs.workflow-path }}
        PROTECTED_ORIGIN_URL: ${{ inputs.origin-url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        [[ "$TARGET_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
          echo "target commit must be a lowercase 40-character git SHA." >&2
          exit 1
        }
        [[ "$PROTECTED_WORKFLOW_PATH" =~ ^[.]github/workflows/[A-Za-z0-9._-]+[.]ya?ml$ ]] || {
          echo "workflow path must identify a workflow under .github/workflows." >&2
          exit 1
        }
        guard_repo="$RUNNER_TEMP/fdai-protected-origin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.git"
        rm -rf -- "$guard_repo"
        git init --bare "$guard_repo" >/dev/null
        trap 'rm -rf -- "$guard_repo"' EXIT
        auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
        echo "::add-mask::$auth_header"
        GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
          git -C "$guard_repo" fetch --force --no-tags \
            "$PROTECTED_ORIGIN_URL" \
            "+refs/heads/main:refs/remotes/origin/main" "$TARGET_COMMIT_SHA"
        unset auth_header
        git -C "$guard_repo" merge-base --is-ancestor "$TARGET_COMMIT_SHA" \
          refs/remotes/origin/main || {
          echo "target commit must be an ancestor of protected origin/main." >&2
          exit 1
        }
        git -C "$guard_repo" diff --quiet \
          "$TARGET_COMMIT_SHA:$PROTECTED_WORKFLOW_PATH" \
          "refs/remotes/origin/main:$PROTECTED_WORKFLOW_PATH" || {
          echo "workflow controls differ from protected origin/main." >&2
          exit 1
        }
    - name: Verify protected environment policy
      if: ${{ inputs.environment != '' }}
      shell: bash
      env:
        TARGET_REPOSITORY: ${{ inputs.repository }}
        TARGET_ENVIRONMENT: ${{ inputs.environment }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REQUIRED_APPROVALS: ${{ inputs.required-approvals }}
      run: |
        set -euo pipefail
        [[ "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
         echo "repository must identify one GitHub repository." >&2
         exit 1
        }
        [[ "$TARGET_ENVIRONMENT" =~ ^(dev|staging|prod)$ ]] || {
         echo "environment is unsupported." >&2
         exit 1
        }
        [[ "$REQUIRED_APPROVALS" == "1" ]] || {
         echo "GitHub Environment supports exactly one required approval." >&2
         exit 1
        }
        payload="$RUNNER_TEMP/fdai-environment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
        trap 'rm -f -- "$payload"' EXIT
        curl --fail --silent --show-error \
         --retry 2 --retry-delay 1 --retry-all-errors \
         --connect-timeout 10 --max-time 30 \
         --header "Accept: application/vnd.github+json" \
         --header "Authorization: Bearer $GITHUB_TOKEN" \
         --header "X-GitHub-Api-Version: 2022-11-28" \
         "$GITHUB_API_URL/repos/$TARGET_REPOSITORY/environments/$TARGET_ENVIRONMENT" \
         > "$payload"
        python3 "${{ github.action_path }}/verify_environment.py" \
         "$payload" --required-approvals "$REQUIRED_APPROVALS"
