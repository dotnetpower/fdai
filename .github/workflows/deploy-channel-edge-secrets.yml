name: deploy-channel-edge-secrets

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact CI-verified protected-main revision."
        type: string
        required: true

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: deploy-channel-edge-secrets-dev
  cancel-in-progress: false

jobs:
  materialize:
    if: github.ref == 'refs/heads/main' && inputs.commit_sha == github.sha
    environment: dev
    runs-on: [self-hosted, fdai-deploy, fdai-deploy-candidate]
    timeout-minutes: 20
    env:
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      DEPLOY_RUNNER_CLIENT_ID: ${{ vars.DEPLOY_RUNNER_CLIENT_ID }}
      DEPLOY_RUNNER_PRINCIPAL_ID: ${{ vars.DEPLOY_RUNNER_PRINCIPAL_ID }}
    steps:
      - name: Checkout protected workflow verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .github/actions/verify-protected-workflow-source
          path: .fdai-protected-workflow-verifier

      - name: Verify protected workflow source
        id: protected-source
        uses: ./.fdai-protected-workflow-verifier/.github/actions/verify-protected-workflow-source
        with:
          target-commit-sha: ${{ inputs.commit_sha }}
          workflow-path: .github/workflows/deploy-channel-edge-secrets.yml
          origin-url: ${{ github.server_url }}/${{ github.repository }}.git
          github-token: ${{ github.token }}

      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false

      - name: Verify required CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/repos/"
              + os.environ["GITHUB_REPOSITORY"]
              + "/commits/"
              + os.environ["TARGET_COMMIT_SHA"]
              + "/check-runs?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"required CI lookup failed with HTTP {exc.code}") from exc
          checks = [
              item
              for item in payload.get("check_runs", [])
              if item.get("name") == "required"
          ]
          checks.sort(key=lambda item: item.get("completed_at") or "")
          if not checks or checks[-1].get("conclusion") != "success":
              raise SystemExit(
                  "the exact commit does not have a successful required CI check"
              )
          PY

      - name: Authenticate and verify stable deploy identity
        run: |
          bash scripts/deployment/azure/login-deploy-identity.sh \
            "$ARM_SUBSCRIPTION_ID" "$ARM_TENANT_ID" \
            "$DEPLOY_RUNNER_CLIENT_ID" "$DEPLOY_RUNNER_PRINCIPAL_ID"

      - name: Resolve private development vault
        run: |
          set -euo pipefail
          inventory="$RUNNER_TEMP/channel-edge-vaults.json"
          az keyvault list \
            --subscription "$ARM_SUBSCRIPTION_ID" \
            --query "[].{name:name,tags:tags}" \
            --output json --only-show-errors >"$inventory"
          selection="$(
            jq -c '
              [.[] | select(
                .tags["fdai:managed"] == "true" and
                .tags["fdai:env"] == "dev" and
                .tags["fdai:layer"] == "control-plane"
              )]
            ' "$inventory"
          )"
          [[ "$(jq 'length' <<<"$selection")" == "1" ]] || {
            echo "exactly one deployment-owned development Key Vault must match the FDAI tags" >&2
            exit 1
          }
          vault_name="$(jq -er '.[0].name' <<<"$selection")"
          vault_uri="https://${vault_name}.vault.azure.net"
          echo "::add-mask::$vault_name"
          echo "::add-mask::$vault_uri"
          printf 'CHANNEL_EDGE_VAULT_URI=%s\n' "$vault_uri" >>"$GITHUB_ENV"

      - name: Materialize and verify channel-edge secrets
        env:
          CHANNEL_EDGE_SLACK_SIGNING_SECRET: ${{ secrets.CHANNEL_EDGE_SLACK_SIGNING_SECRET }}
          CHANNEL_EDGE_SLACK_BOT_TOKEN: ${{ secrets.CHANNEL_EDGE_SLACK_BOT_TOKEN }}
          CHANNEL_EDGE_SLACK_TEAM_ID: ${{ secrets.CHANNEL_EDGE_SLACK_TEAM_ID }}
          CHANNEL_EDGE_SLACK_PRINCIPAL_MAP_JSON: ${{ secrets.CHANNEL_EDGE_SLACK_PRINCIPAL_MAP_JSON }}
          CHANNEL_EDGE_PRINCIPAL_SCOPES_JSON: ${{ secrets.CHANNEL_EDGE_PRINCIPAL_SCOPES_JSON }}
        run: >-
          uv run --frozen --package fdai-operator-service python
          scripts/deployment/azure/materialize_channel_edge_secrets.py
          --vault-uri "$CHANNEL_EDGE_VAULT_URI"

      - name: Clean runner artifacts
        if: always() && steps.protected-source.outcome == 'success'
        run: |
          set -euo pipefail
          inventory="$RUNNER_TEMP/channel-edge-vaults.json"
          if [[ -f "$inventory" ]]; then
            shred --force --remove "$inventory"
          fi
          if [[ -n "${AZURE_CONFIG_DIR:-}" && -d "$AZURE_CONFIG_DIR" ]]; then
            find "$AZURE_CONFIG_DIR" -type f -exec shred --force --remove {} +
            rm -rf -- "$AZURE_CONFIG_DIR"
          fi
