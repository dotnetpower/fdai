name: model-lifecycle-reconcile

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact protected origin/main commit to reconcile."
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: model-lifecycle-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, fdai-deploy, fdai-deploy-candidate]
    timeout-minutes: 30
    env:
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      DEPLOY_RUNNER_CLIENT_ID: ${{ vars.DEPLOY_RUNNER_CLIENT_ID }}
      DEPLOY_RUNNER_PRINCIPAL_ID: ${{ vars.DEPLOY_RUNNER_PRINCIPAL_ID }}
      AZURE_REGION: ${{ vars.AZURE_REGION }}
      MODEL_RESOLVER_DEPLOYER_OBJECT_ID: ${{ vars.MODEL_RESOLVER_DEPLOYER_OBJECT_ID }}
      MODEL_RESOLVER_ACCOUNT_NAME: ${{ vars.MODEL_RESOLVER_ACCOUNT_NAME }}
      MODEL_RESOLVER_RESOURCE_GROUP: ${{ vars.MODEL_RESOLVER_RESOURCE_GROUP }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout protected workflow verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .github/actions/verify-protected-workflow-source
          path: .fdai-protected-workflow-verifier

      - name: Verify protected workflow source
        uses: ./.fdai-protected-workflow-verifier/.github/actions/verify-protected-workflow-source
        with:
          target-commit-sha: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.sha }}
          workflow-path: .github/workflows/model-lifecycle-reconcile.yml
          origin-url: ${{ github.server_url }}/${{ github.repository }}.git
          github-token: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Install pinned uv for lifecycle resolution
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.32"
          enable-cache: false

      - name: Authenticate and verify stable deploy identity
        run: >-
          bash scripts/deployment/azure/login-deploy-identity.sh
          "$ARM_SUBSCRIPTION_ID" "$AZURE_TENANT_ID"
          "$DEPLOY_RUNNER_CLIENT_ID" "$DEPLOY_RUNNER_PRINCIPAL_ID"

      - name: Resolve lifecycle candidate
        id: candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/model-lifecycle"
          evidence="$RUNNER_TEMP/model-lifecycle/evidence.json"
          candidate="$RUNNER_TEMP/model-lifecycle/candidate.json"
          deprecations="$RUNNER_TEMP/model-lifecycle/deprecations.json"
          current="services/assets/resolved-models.json"

          if [[ ! "$MODEL_RESOLVER_DEPLOYER_OBJECT_ID" =~ ^[0-9a-fA-F-]{36}$ \
            || -z "$MODEL_RESOLVER_ACCOUNT_NAME" \
            || -z "$MODEL_RESOLVER_RESOURCE_GROUP" ]]; then
            python3 scripts/deployment/azure/model_lifecycle_reconciler.py \
              --current "$current" --provider-error unavailable --out "$evidence"
            echo "status=abstained" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/services/core-control-plane/src:$GITHUB_WORKSPACE/packages/service-contracts/src" \
            uv run --frozen --package fdai-core-control-plane python \
              -m fdai.rule_catalog.schema.llm_resolver_cli \
              --registry rule-catalog/llm-registry.yaml \
              --region "$AZURE_REGION" \
              --subscription-id "$ARM_SUBSCRIPTION_ID" \
              --deployer-object-id "$MODEL_RESOLVER_DEPLOYER_OBJECT_ID" \
              --use-azure-cli \
              --assess-fail-on critical \
              --out "$candidate"
          resolver_exit=$?
          set -e
          if [[ "$resolver_exit" -ne 0 ]]; then
            python3 scripts/deployment/azure/model_lifecycle_reconciler.py \
              --current "$current" --provider-error unavailable --out "$evidence"
            echo "status=abstained" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          az cognitiveservices account list-models \
            --name "$MODEL_RESOLVER_ACCOUNT_NAME" \
            --resource-group "$MODEL_RESOLVER_RESOURCE_GROUP" \
            --only-show-errors --output json > "$RUNNER_TEMP/model-lifecycle/provider-models.json"
          provider_exit=$?
          set -e
          if [[ "$provider_exit" -ne 0 ]]; then
            python3 scripts/deployment/azure/model_lifecycle_reconciler.py \
              --current "$current" --provider-error unavailable --out "$evidence"
            echo "status=abstained" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          python3 scripts/deployment/azure/model_lifecycle_provider.py \
            --provider-models "$RUNNER_TEMP/model-lifecycle/provider-models.json" \
            --as-of "$(date -u +%F)" \
            --horizon-days 60 \
            --out "$deprecations"
          provider_parse_exit=$?
          set -e
          if [[ "$provider_parse_exit" -ne 0 ]]; then
            python3 scripts/deployment/azure/model_lifecycle_reconciler.py \
              --current "$current" --provider-error unsupported_response --out "$evidence"
            echo "status=abstained" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/deployment/azure/model_lifecycle_reconciler.py \
            --current "$current" \
            --candidate "$candidate" \
            --deprecations "$deprecations" \
            --out "$evidence"
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$evidence")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"

      - name: Retain sanitized reconciliation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-lifecycle/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish idempotent proposal branch
        id: proposal_branch
        if: ${{ steps.candidate.outputs.status == 'proposal' }}
        env:
          EVIDENCE_PATH: ${{ steps.candidate.outputs.evidence }}
        run: |
          set -euo pipefail
          read -r proposal_digest activation_authority < <(
            python3 -c 'import json,os; value=json.load(open(os.environ["EVIDENCE_PATH"], encoding="utf-8")); print(value.get("proposal_digest", ""), str(value.get("activation_authority", True)).lower())'
          )
          if [[ ! "$proposal_digest" =~ ^[0-9a-f]{64}$ \
            || "$activation_authority" != "false" ]]; then
            echo "model lifecycle proposal is not safe to publish" >&2
            exit 1
          fi
          source_commit="$(git rev-parse HEAD)"
          branch="automation/model-lifecycle-${proposal_digest:0:12}"
          proposal="config/model-lifecycle-proposals/${proposal_digest}.json"
          remote_head="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          if [[ -n "$remote_head" ]]; then
            echo "The proposal branch already exists for proposal_digest=$proposal_digest"
            git fetch --no-tags origin "$remote_head"
            if [[ "$(git rev-list --parents -n 1 "$remote_head" | wc -w)" -ne 2 ]]; then
              echo "model lifecycle proposal branch must contain one single-parent commit" >&2
              exit 1
            fi
            source_commit="$(git rev-parse "$remote_head^")"
            if ! git merge-base --is-ancestor "$source_commit" HEAD; then
              echo "model lifecycle proposal source is not protected main history" >&2
              exit 1
            fi
          else
            mkdir -p "$(dirname "$proposal")"
            cp "$EVIDENCE_PATH" "$proposal"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add -- "$proposal"
            git commit -m "chore(models): propose lifecycle mapping review"
            git push --set-upstream origin "$branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "proposal=$proposal" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Ensure idempotent draft registry proposal
        if: ${{ steps.candidate.outputs.status == 'proposal' }}
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          PROPOSAL_BRANCH: ${{ steps.proposal_branch.outputs.branch }}
          PROPOSAL_PATH: ${{ steps.proposal_branch.outputs.proposal }}
          PR_JSON_PATH: ${{ runner.temp }}/model-lifecycle/pull-request.json
          PR_PROPOSAL_PATH: ${{ runner.temp }}/model-lifecycle/pull-request-proposal.json
          PROPOSAL_SOURCE_COMMIT: ${{ steps.proposal_branch.outputs.source_commit }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const branch = process.env.PROPOSAL_BRANCH;
            const proposalPath = process.env.PROPOSAL_PATH;
            const sourceCommit = process.env.PROPOSAL_SOURCE_COMMIT;
            const { owner, repo } = context.repo;
            if (
              !/^automation\/model-lifecycle-[0-9a-f]{12}$/.test(branch) ||
              !/^[0-9a-f]{40}$/.test(sourceCommit)
            ) {
              throw new Error("model lifecycle proposal identity is invalid");
            }
            const ref = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${branch}`,
            });
            const headSha = ref.data.object.sha;
            if (!/^[0-9a-f]{40}$/.test(headSha)) {
              throw new Error("model lifecycle proposal head is invalid");
            }
            const commit = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: headSha,
            });
            if (
              commit.data.parents.length !== 1 ||
              commit.data.parents[0].sha !== sourceCommit
            ) {
              throw new Error("model lifecycle proposal source commit is invalid");
            }
            const content = await github.rest.repos.getContent({
              owner,
              repo,
              path: proposalPath,
              ref: headSha,
            });
            if (Array.isArray(content.data) || content.data.encoding !== "base64") {
              throw new Error("model lifecycle proposal content is unavailable");
            }
            const proposalBytes = Buffer.from(content.data.content, "base64");
            if (proposalBytes.length === 0 || proposalBytes.length > 1048576) {
              throw new Error("model lifecycle proposal content exceeds its bound");
            }
            const proposal = JSON.parse(proposalBytes.toString("utf8"));
            const proposalDigest = proposal.proposal_digest;
            if (
              !/^[0-9a-f]{64}$/.test(proposalDigest) ||
              proposalPath !== `config/model-lifecycle-proposals/${proposalDigest}.json` ||
              proposal.status !== "proposal" ||
              proposal.activation_authority !== false
            ) {
              throw new Error("model lifecycle proposal contract is invalid");
            }
            fs.writeFileSync(process.env.PR_PROPOSAL_PATH, proposalBytes);
            await exec.exec("python3", [
              "scripts/deployment/azure/model_lifecycle_receipt.py",
              "--proposal",
              process.env.PR_PROPOSAL_PATH,
              "--verify-proposal-only",
            ]);
            const matches = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              per_page: 100,
            });
            if (matches.length > 1) {
              throw new Error("multiple open model lifecycle proposals share one branch");
            }
            let pull = matches[0];
            if (pull === undefined) {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                base: "main",
                head: branch,
                draft: true,
                title: `chore(models): review lifecycle proposal ${proposalDigest.slice(0, 12)}`,
                body: "This draft carries sanitized model-family and deprecation evidence. It has no activation authority and does not deploy, promote, or swap a live mapping. Compatibility impact and the exact proposal digest are recorded in the added manifest. Human review and frozen-scenario shadow replay are separate required gates before activation.",
              });
              pull = created.data;
            }
            if (
              pull.draft !== true ||
              pull.head.sha !== headSha ||
              pull.head.ref !== branch ||
              pull.base.ref !== "main" ||
              pull.user?.login !== "github-actions[bot]"
            ) {
              throw new Error("model lifecycle pull request readback is invalid");
            }
            fs.writeFileSync(
              process.env.PR_JSON_PATH,
              JSON.stringify({
                number: pull.number,
                headRefOid: headSha,
                isDraft: true,
              })
            );

      - name: Build governed draft receipt
        id: publish
        if: ${{ steps.candidate.outputs.status == 'proposal' }}
        env:
          SOURCE_COMMIT: ${{ steps.proposal_branch.outputs.source_commit }}
        run: |
          set -euo pipefail
          pr_json="$RUNNER_TEMP/model-lifecycle/pull-request.json"
          pr_proposal="$RUNNER_TEMP/model-lifecycle/pull-request-proposal.json"
          receipt="$RUNNER_TEMP/model-lifecycle/receipt.json"
          python3 scripts/deployment/azure/model_lifecycle_receipt.py \
            --proposal "$pr_proposal" \
            --pull-request "$pr_json" \
            --source-commit "$SOURCE_COMMIT" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --out "$receipt"
          echo "receipt=$receipt" >> "$GITHUB_OUTPUT"

      - name: Upload governed draft receipt
        if: ${{ steps.candidate.outputs.status == 'proposal' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-lifecycle-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.publish.outputs.receipt }}
          if-no-files-found: error
          retention-days: 30
