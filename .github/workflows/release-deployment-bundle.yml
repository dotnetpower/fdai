name: release-deployment-bundle

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact protected origin/main commit to release."
        type: string
        required: true
      bundle_version:
        description: "Semantic version for the deployment bundle."
        type: string
        required: true
      release_channel:
        description: "Signed release channel carried by the bundle manifest."
        type: choice
        options: [stable, beta, development]
        default: development
      min_cli_version:
        description: "Minimum compatible fdaictl version."
        type: string
        default: "0.0.0"
      max_cli_version:
        description: "Optional maximum compatible fdaictl version."
        type: string
        required: false
      publish_release:
        description: "Create a GitHub Release after reproducibility and verification pass."
        type: boolean
        default: false
      publish_pypi:
        description: "Publish the matching fdai wheel and sdist to PyPI. Requires publish_release."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deployment-bundle-${{ inputs.bundle_version }}
  cancel-in-progress: false

jobs:
  guard:
    name: verify protected release source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify protected workflow source
        env:
          TARGET_COMMIT_SHA: ${{ inputs.commit_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PROTECTED_ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}.git
          PROTECTED_WORKFLOW_PATH: .github/workflows/release-deployment-bundle.yml
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit_sha must be a lowercase 40-character git SHA." >&2
            exit 1
          }
          guard_repo="$RUNNER_TEMP/fdai-protected-origin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.git"
          git init --bare "$guard_repo" >/dev/null
          trap 'rm -rf -- "$guard_repo"' EXIT
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
            git -C "$guard_repo" fetch --force --no-tags \
              "$PROTECTED_ORIGIN_URL" \
              "+refs/heads/main:refs/remotes/origin/main" "$TARGET_COMMIT_SHA"
          unset auth_header
          git -C "$guard_repo" merge-base --is-ancestor "$TARGET_COMMIT_SHA" \
            refs/remotes/origin/main
          git -C "$guard_repo" diff --quiet \
            "$TARGET_COMMIT_SHA:$PROTECTED_WORKFLOW_PATH" \
            "refs/remotes/origin/main:$PROTECTED_WORKFLOW_PATH"

  verify:
    name: clean checkout, live database, and package verification
    needs: guard
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fdai
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fdai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fdai -d fdai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FDAI_DATABASE_URL: postgresql+psycopg://fdai:ci@localhost:5432/fdai
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Validate release publication inputs
        if: ${{ inputs.publish_pypi && !inputs.publish_release }}
        run: |
          echo "publish_pypi requires publish_release so the matching signed bundle is public." >&2
          exit 1

      - name: Confirm clean checkout
        run: test -z "$(git status --porcelain)"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install locked project and console
        run: |
          uv sync --extra dev --frozen
          npm --prefix console ci --no-audit --no-fund

      - name: Install pinned OPA
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/opa \
            "https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static"
          echo "dfd5081fc6f930dfeaf2a225e31e616fc227dc0c7b43019b73d6f8fb8a1de1aa  /tmp/opa" \
            | sha256sum -c -
          chmod +x /tmp/opa
          sudo mv /tmp/opa /usr/local/bin/opa

      - name: Upgrade disposable database
        run: uv run alembic upgrade head

      - name: Run full repository verification
        run: uv run bash scripts/verify.sh --all

      - name: Run productization and isolated wheel verification
        run: bash scripts/deployment/release/verify-productization.sh

      - name: Confirm verification did not rewrite tracked source
        run: git diff --exit-code

  dependency-audit:
    name: dependency vulnerability audit
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: .

  python-package:
    name: build verified Python distributions
    runs-on: ubuntu-24.04
    needs: [verify, dependency-audit]
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Validate package and bundle versions
        env:
          BUNDLE_VERSION: ${{ inputs.bundle_version }}
        run: |
          package_version="$(python3 - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              project = tomllib.load(stream)["project"]
          print(project["version"])
          PY
          )"
          if [ "$package_version" != "$BUNDLE_VERSION" ]; then
            echo "Python package and deployment bundle versions must match." >&2
            exit 1
          fi

      - name: Build and check Python distributions
        run: |
          uv build --out-dir python-dist
          uvx --from twine twine check python-dist/*

      - name: Upload verified Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fdai-python-${{ inputs.bundle_version }}
          path: python-dist/
          if-no-files-found: error
          retention-days: 30

  bundle:
    runs-on: ubuntu-24.04
    needs: [verify, dependency-audit]
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Install locked project
        run: uv sync --frozen

      - name: Build twice and verify reproducibility
        env:
          BUNDLE_VERSION: ${{ inputs.bundle_version }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          MIN_CLI_VERSION: ${{ inputs.min_cli_version }}
          MAX_CLI_VERSION: ${{ inputs.max_cli_version }}
          BUNDLE_SIGNING_KEY_PEM: ${{ secrets.FDAI_BUNDLE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          signing_key="$(mktemp)"
          trap 'rm -f "$signing_key"' EXIT
          printf '%s' "$BUNDLE_SIGNING_KEY_PEM" > "$signing_key"
          if [ ! -s "$signing_key" ]; then
            echo "FDAI_BUNDLE_SIGNING_KEY_PEM is required." >&2
            exit 1
          fi
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p release-artifacts first second
          build_bundle() {
            local output_root="$1"
            local archive="$2"
            local public_key="$3"
            args=(
              --source "$GITHUB_WORKSPACE"
              --destination "$output_root"
              --archive "$archive"
              --private-key "$signing_key"
              --public-key-output "$public_key"
              --bundle-version "$BUNDLE_VERSION"
              --release-channel "$RELEASE_CHANNEL"
              --min-cli-version "$MIN_CLI_VERSION"
            )
            if [ -n "$MAX_CLI_VERSION" ]; then
              args+=(--max-cli-version "$MAX_CLI_VERSION")
            fi
            uv run python scripts/deployment/release/build-deployment-bundle.py "${args[@]}"
          }
          build_bundle first/bundle first/bundle.tar.gz first/bundle-public.pem
          build_bundle second/bundle second/bundle.tar.gz second/bundle-public.pem
          diff -qr first/bundle second/bundle
          cmp first/bundle.tar.gz second/bundle.tar.gz
          cmp first/bundle-public.pem second/bundle-public.pem
          uv run fdaictl bundle verify \
            --bundle first/bundle --public-key first/bundle-public.pem --output json
          cp first/bundle.tar.gz \
            "release-artifacts/fdai-deployment-bundle-${BUNDLE_VERSION}.tar.gz"
          cp first/bundle-public.pem \
            "release-artifacts/fdai-deployment-bundle-${BUNDLE_VERSION}.public.pem"
          cp first/bundle/manifest.json \
            "release-artifacts/fdai-deployment-bundle-${BUNDLE_VERSION}.manifest.json"
          cp first/bundle/manifest.json.sig \
            "release-artifacts/fdai-deployment-bundle-${BUNDLE_VERSION}.manifest.json.sig"
          sha256sum release-artifacts/* > release-artifacts/SHA256SUMS

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fdai-deployment-bundle-${{ inputs.bundle_version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_VERSION: ${{ inputs.bundle_version }}
        run: |
          set -euo pipefail
          gh release create "deployment-bundle-${BUNDLE_VERSION}" \
            release-artifacts/* \
            --target "${{ inputs.commit_sha }}" \
            --title "FDAI deployment bundle ${BUNDLE_VERSION}" \
            --notes "Reproducibly built, Ed25519-signed FDAI deployment bundle."

  publish-pypi:
    name: publish Python distributions to PyPI
    if: ${{ inputs.publish_pypi }}
    runs-on: ubuntu-24.04
    needs: [python-package, bundle]
    environment:
      name: pypi
      url: https://pypi.org/p/fdai
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fdai-python-${{ inputs.bundle_version }}
          path: python-dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@2834a314042ef964da07689278dd1e9d773e8afd # v1.14.1
        with:
          packages-dir: python-dist/
