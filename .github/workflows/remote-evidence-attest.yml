name: remote-evidence-attest

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Protected-main commit containing the final remote evidence aggregate."
        type: string
        required: true

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write
  packages: read

jobs:
  verify-and-attest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout protected workflow verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .github/actions/verify-protected-workflow-source
          path: .fdai-protected-workflow-verifier

      - name: Verify protected workflow source
        uses: ./.fdai-protected-workflow-verifier/.github/actions/verify-protected-workflow-source
        with:
          target-commit-sha: ${{ inputs.commit_sha }}
          workflow-path: .github/workflows/remote-evidence-attest.yml
          origin-url: ${{ github.server_url }}/${{ github.repository }}.git
          github-token: ${{ github.token }}

      - name: Checkout exact evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify protected-main ancestry
        env:
          TARGET_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_COMMIT_SHA" origin/main
          [[ "$(git rev-parse HEAD)" == "$TARGET_COMMIT_SHA" ]]

      - name: Verify customer-agnostic aggregate
        run: python3 scripts/quality/architecture/check-remote-service-evidence.py

      - name: Authenticate GHCR read access
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1, Node 24
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Bind aggregate to GitHub runs and artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/quality/architecture/verify_remote_github_evidence.py

      - name: Attest final remote evidence aggregate
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0, Node 24
        with:
          subject-path: config/independent-service-remote-evidence.json

      - name: Upload portable attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: independent-service-remote-evidence-attestation-${{ inputs.commit_sha }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
