name: infra-drift

# Scheduled drift detection: run refresh-only Terraform plans against live
# remote state on the self-hosted VNet runner. Desired code changes stay in
# protected deploy plans, so incomplete dispatch inputs cannot propose deletes.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/infra-drift.yml"
      - "infra/bootstrap/check-runner-storage-posture.sh"
      - "scripts/deployment/service/drift_contract.py"
  schedule:
    - cron: "17 6 * * 1-5" # weekdays 06:17 UTC
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment."
        type: choice
        options: [dev, staging, prod]
        default: dev
      scope:
        description: "Drift roots to verify."
        type: choice
        options: [all, runner]
        default: all
      commit_sha:
        description: "Exact protected origin/main commit for a manual drift plan."
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: drift-${{ inputs.environment || 'dev' }}
  cancel-in-progress: true

jobs:
  drift:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, fdai-deploy, fdai-deploy-candidate]
    defaults:
      run:
        working-directory: infra
    env:
      ARM_USE_AZUREAD: "true"
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      DEPLOY_RUNNER_CLIENT_ID: ${{ vars.DEPLOY_RUNNER_CLIENT_ID }}
      DEPLOY_RUNNER_PRINCIPAL_ID: ${{ vars.DEPLOY_RUNNER_PRINCIPAL_ID }}
      STATE_RESOURCE_GROUP: ${{ vars.STATE_RESOURCE_GROUP }}
      STATE_STORAGE_ACCOUNT: ${{ vars.STATE_STORAGE_ACCOUNT }}
      STATE_CONTAINER: tfstate
      TF_VAR_env: ${{ inputs.environment || 'dev' }}
      TF_VAR_region: ${{ vars.AZURE_REGION }}
      TF_VAR_region_short: ${{ vars.AZURE_REGION_SHORT }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_enable_private_networking: "true"
      TF_VAR_runner_vnet_id: ${{ vars.OPS_VNET_ID }}
      TF_VAR_runner_vnet_name: ${{ vars.OPS_VNET_NAME }}
      TF_VAR_ops_resource_group_name: ${{ vars.OPS_RESOURCE_GROUP_NAME }}
      TF_VAR_runner_vm_size: Standard_D4ds_v5
      TF_VAR_runner_vm_name: ${{ vars.DEPLOY_RUNNER_VM_NAME }}
      TF_VAR_core_image: ${{ vars.CORE_IMAGE || vars.OPERATOR_API_IMAGE }}
      TF_VAR_postgres_admin_login: ${{ secrets.POSTGRES_ADMIN_LOGIN }}
      TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
    steps:
      - name: Checkout protected workflow verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .github/actions/verify-protected-workflow-source
          path: .fdai-protected-workflow-verifier

      - name: Verify protected workflow source
        uses: ./.fdai-protected-workflow-verifier/.github/actions/verify-protected-workflow-source
        with:
          target-commit-sha: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
          workflow-path: .github/workflows/infra-drift.yml
          origin-url: ${{ github.server_url }}/${{ github.repository }}.git
          github-token: ${{ github.token }}

      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Authenticate and verify stable deploy identity
        working-directory: ${{ github.workspace }}
        run: >-
          bash scripts/deployment/azure/login-deploy-identity.sh
          "$ARM_SUBSCRIPTION_ID" "$ARM_TENANT_ID"
          "$DEPLOY_RUNNER_CLIENT_ID" "$DEPLOY_RUNNER_PRINCIPAL_ID"

      - name: Activate remote state backend
        run: cp backend.azurerm.tf.example backend.tf

      - name: Activate bootstrap remote state backend
        working-directory: infra/bootstrap
        run: cp backend.azurerm.tf.example backend.tf

      - name: Initialize legacy state
        if: inputs.scope != 'runner'
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=fdai-${{ inputs.environment || 'dev' }}.tfstate"

      - name: Plan legacy root
        if: inputs.scope != 'runner'
        id: legacy_drift
        continue-on-error: true
        run: >-
          terraform plan -refresh-only -input=false -lock-timeout=300s
          -detailed-exitcode

      - name: Plan independent service roots
        if: inputs.scope != 'runner'
        id: service_drift
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          SERVICE_DEPLOY_TFVARS_JSON: ${{ secrets.SERVICE_DEPLOY_TFVARS_JSON }}
          RESOLVED_MODELS_JSON: ${{ vars.RESOLVED_MODELS_JSON }}
          WEB_SEARCH_ENABLED: ${{ vars.OPERATOR_API_WEB_SEARCH_ENABLED == 'true' }}
          WEB_SEARCH_ALLOWED_DOMAINS_JSON: ${{ vars.OPERATOR_API_WEB_SEARCH_ALLOWED_DOMAINS_JSON || '[]' }}
        run: |
          set -euo pipefail
          [[ -n "$SERVICE_DEPLOY_TFVARS_JSON" ]] || {
            echo "SERVICE_DEPLOY_TFVARS_JSON is required for service drift detection." >&2
            exit 1
          }
          temp_root="$RUNNER_TEMP/service-drift"
          rm -rf -- "$temp_root"
          mkdir -m 700 "$temp_root"
          trap 'rm -rf -- "$temp_root"' EXIT
          printf '%s' "$SERVICE_DEPLOY_TFVARS_JSON" >"$temp_root/all-services.json"
          chmod 600 "$temp_root/all-services.json"
          terraform -chdir=infra show -json >"$temp_root/platform-state.json"
          platform_inputs="$(python3 scripts/deployment/service/drift_contract.py \
            platform-inputs --state-json "$temp_root/platform-state.json")"
          database_host="$(jq -er '.database_host' <<<"$platform_inputs")"
          event_topic="$(jq -er '.event_topic' <<<"$platform_inputs")"
          pipeline_stage_topic="$(jq -er '.pipeline_stage_topic' <<<"$platform_inputs")"
          pantheon_object_topic="$(jq -er '.pantheon_object_topic' <<<"$platform_inputs")"
          model_endpoints_json="$(jq -cer '.model_endpoints' <<<"$platform_inputs")"
          resolved_models_digest="$(
            python3 -c 'import hashlib,json,sys; payload=json.load(sys.stdin); canonical=json.dumps(payload,separators=(",",":"),sort_keys=True).encode(); print(hashlib.sha256(canonical).hexdigest())' \
              <<<"$RESOLVED_MODELS_JSON"
          )"
          roots_json="$(python3 scripts/deployment/service/drift_contract.py roots \
            --environment "$ENVIRONMENT")"
          service_count="$(jq '[.[] | select(.kind == "service")] | length' \
            <<<"$roots_json")"
          [[ "$service_count" -eq 5 ]] || {
            echo "Drift root contract must resolve exactly five service roots." >&2
            exit 1
          }
          drift_found=0
          while IFS=$'\t' read -r root_id terraform_root backend_key; do
            service="${root_id#service:}"
            resolved_model_args=()
            if [[ "$service" == "core-control-plane" ]]; then
              resolved_model_args+=(--model-binding-transition)
            fi
            terraform -chdir="$terraform_root" init -input=false -lockfile=readonly \
              -backend-config="resource_group_name=$STATE_RESOURCE_GROUP" \
              -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
              -backend-config="container_name=$STATE_CONTAINER" \
              -backend-config="key=$backend_key" \
              -backend-config="use_azuread_auth=true"
            terraform -chdir="$terraform_root" show -json >"$temp_root/$service-state.json"
            image_ref="$(python3 scripts/deployment/service/drift_contract.py stored-image \
              --service "$service" \
              --environment "$ENVIRONMENT" \
              --repository "$GITHUB_REPOSITORY" \
              --state-json "$temp_root/$service-state.json")"
            python3 scripts/deployment/service/hydrate_database_host.py \
                --service "$service" \
                --environment "$ENVIRONMENT" \
                --database-host "$database_host" \
                <"$temp_root/all-services.json" \
              | python3 scripts/deployment/service/hydrate_event_topic.py \
                  --service "$service" \
                  --environment "$ENVIRONMENT" \
                  --event-topic "$event_topic" \
                    --pipeline-stage-topic "$pipeline_stage_topic" \
                    --pantheon-object-topic "$pantheon_object_topic" \
              | MODEL_ENDPOINTS_JSON="$model_endpoints_json" \
                RESOLVED_MODELS_DIGEST="$resolved_models_digest" \
                python3 scripts/deployment/service/materialize_tfvars.py \
                  --service "$service" \
                  --environment "$ENVIRONMENT" \
                  "${resolved_model_args[@]}" \
                  --output "$temp_root/$service.tfvars.json"
            set +e
            terraform -chdir="$terraform_root" plan \
              -refresh-only \
              -input=false \
              -lock-timeout=5m \
              -detailed-exitcode \
              -var-file="$temp_root/$service.tfvars.json" \
              -var="image=$image_ref"
            plan_status=$?
            set -e
            case "$plan_status" in
              0) echo "No drift: $root_id" ;;
              2) echo "Drift detected: $root_id" >&2; drift_found=1 ;;
              *) echo "Drift evidence failed: $root_id" >&2; exit 1 ;;
            esac
            rm -rf -- "$terraform_root/.terraform"
          done < <(jq -r \
            '.[] | select(.kind == "service") | [.root_id, .terraform_root, .backend_key] | @tsv' \
            <<<"$roots_json")
          [[ "$drift_found" -eq 0 ]]

      - name: Initialize bootstrap state
        working-directory: infra/bootstrap
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="resource_group_name=$STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=ops/bootstrap/${{ inputs.environment || 'dev' }}.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Verify runner storage and identity posture
        id: runner_storage_posture
        continue-on-error: true
        working-directory: infra/bootstrap
        run: |
          set -euo pipefail
          runner_vm_name="$(terraform output -raw runner_vm_name)"
          ./check-runner-storage-posture.sh \
            "$ARM_SUBSCRIPTION_ID" \
            "$ARM_TENANT_ID" \
            "$TF_VAR_ops_resource_group_name" \
            "$runner_vm_name" \
            "$TF_VAR_runner_vm_size" \
            "$DEPLOY_RUNNER_PRINCIPAL_ID"

      - name: Plan bootstrap root
        id: bootstrap_drift
        continue-on-error: true
        working-directory: infra/bootstrap
        env:
          TF_VAR_state_storage_account_name: ${{ vars.STATE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          state_json="$RUNNER_TEMP/bootstrap-pre-refresh-state.json"
          refresh_plan="$RUNNER_TEMP/bootstrap-refresh.tfplan"
          refresh_plan_json="$RUNNER_TEMP/bootstrap-refresh-plan.json"
          trap 'rm -f "$state_json" "$refresh_plan" "$refresh_plan_json"' EXIT
          terraform show -json >"$state_json"
          if stored_inputs="$(python3 ../../scripts/deployment/service/drift_contract.py \
            bootstrap-inputs --state-json "$state_json" 2>/dev/null)"; then
            app_resource_group_name="$(jq -er '.app_resource_group_name' <<<"$stored_inputs")"
            runner_ssh_public_key="$(jq -er '.runner_ssh_public_key' <<<"$stored_inputs")"
          else
            app_resource_group_name="$(terraform output -raw app_resource_group_name)"
            runner_ssh_public_key="$(awk 'NF >= 2 && $1 ~ /^ssh-/ {print; exit}' \
              "$HOME/.ssh/authorized_keys")"
            [[ -n "$app_resource_group_name" && -n "$runner_ssh_public_key" ]]
            echo "Recovered promoted runner plan inputs from authoritative host readback."
          fi
          export TF_VAR_app_resource_group_name="$app_resource_group_name"
          export TF_VAR_runner_ssh_public_key="$runner_ssh_public_key"
          set +e
          terraform plan \
            -refresh-only \
            -input=false \
            -lock-timeout=300s \
            -detailed-exitcode \
            -out="$refresh_plan"
          plan_status=$?
          set -e
          [[ "$plan_status" -eq 0 || "$plan_status" -eq 2 ]] || exit "$plan_status"
          terraform show -json "$refresh_plan" >"$refresh_plan_json"
          drift_count="$(jq '
            . as $plan
            | ([($plan.resource_drift // [])[] | select(.change.actions != ["no-op"])] | length)
            + ([($plan.output_changes // {}) | to_entries[] | select(.value.actions != ["no-op"])] | length)
          ' "$refresh_plan_json")"
          [[ "$drift_count" -eq 0 ]] || {
            echo "Bootstrap Terraform drift was detected." >&2
            exit 1
          }
          echo "No bootstrap Terraform drift detected."
          exit 0

      - name: Enforce complete drift evidence
        if: always()
        env:
          DRIFT_SCOPE: ${{ inputs.scope || 'all' }}
          LEGACY_OUTCOME: ${{ steps.legacy_drift.outcome }}
          SERVICE_OUTCOME: ${{ steps.service_drift.outcome }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap_drift.outcome }}
          RUNNER_STORAGE_OUTCOME: ${{ steps.runner_storage_posture.outcome }}
        run: |
          set -euo pipefail
          if [[ "$DRIFT_SCOPE" != "runner" ]]; then
            [[ "$LEGACY_OUTCOME" == "success" ]] || {
              echo "Legacy Terraform drift was detected or could not be evaluated." >&2
              exit 1
            }
            [[ "$SERVICE_OUTCOME" == "success" ]] || {
              echo "Independent-service Terraform drift was detected or could not be evaluated." >&2
              exit 1
            }
          fi
          [[ "$BOOTSTRAP_OUTCOME" == "success" ]] || {
            echo "Bootstrap Terraform drift was detected or could not be evaluated." >&2
            exit 1
          }
          [[ "$RUNNER_STORAGE_OUTCOME" == "success" ]] || {
            echo "Runner storage posture drift was detected or could not be evaluated." >&2
            exit 1
          }
