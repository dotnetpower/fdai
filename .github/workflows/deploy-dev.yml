name: deploy-dev

# Deploys the dev environment from a self-hosted runner inside the ops VNet.
# On a policy-locked ("private-everything") tenant this is the ONLY host with
# line-of-sight to the app's private endpoints (Key Vault, state storage), so
# the deploy cannot run on a GitHub-hosted runner or an operator laptop.
#
# Prerequisites (see infra/bootstrap/README.md):
#   - `infra/bootstrap` applied: ops VNet + state storage + registered runner
#     with labels [self-hosted, fdai-deploy] and a system-assigned MI holding
#     Contributor on the app RG + Storage Blob Data Contributor on the state SA.
#   - Repo variables (Settings > Secrets and variables > Actions > Variables):
#       ARM_SUBSCRIPTION_ID, AZURE_REGION, AZURE_REGION_SHORT, AZURE_TENANT_ID,
#       OPS_RESOURCE_GROUP_NAME, OPS_VNET_ID, OPS_VNET_NAME, STATE_STORAGE_ACCOUNT,
#       DEPLOY_PREFLIGHT_INPUT_JSON (non-secret complete live-probe profile),
#       ENTRA_CONSOLE_SPA_CLIENT_ID (required when deploy_console=true),
#       RESOLVED_CAPABILITIES_JSON, OPERATOR_API_AUDIENCE, RBAC_*_GROUP_ID,
#       OPERATOR_API_WEB_SEARCH_ENABLED, OPERATOR_API_WEB_SEARCH_ALLOWED_DOMAINS_JSON,
#       INGESTION_CORS_ALLOW_ORIGINS, CLAMAV_IMAGE,
#       SCHEDULER_TICK_CRON_EXPRESSION, ANALYZER_TICK_CRON_EXPRESSION,
#       ANALYZER_TARGETS_JSON, ANALYZER_WINDOW_SECONDS, ANALYZER_BUDGET_SECONDS,
#       DEV_OPERATIONS_GATEWAY_PRIVATE_PROBES_JSON (optional server-owned probe map),
#       ENABLE_EMAIL_NOTIFICATIONS, NOTIFICATION_EMAIL_RECIPIENTS_JSON
#       (required when deploy_document_ingestion=true; prod images use digests)
#   - Repo secrets:
#       POSTGRES_ADMIN_LOGIN, POSTGRES_ADMIN_PASSWORD,
#       CHATOPS_WEBHOOK_URL, CHATOPS_WEBHOOK_SECRET
#   - Production workflow inputs:
#       digest-pinned image, alert email, monthly budget, budget-alert email JSON.
#
# Default run is plan-only (shadow). Set the `apply` input to true to enforce.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment."
        type: choice
        options: [dev, staging, prod]
        default: dev
      apply:
        description: "Apply the plan (true) or plan-only (false, default)."
        type: boolean
        default: false
      resume_verification:
        description: "Resume post-apply verification from an existing exact apply claim."
        type: boolean
        default: false
      request_id:
        description: "Optional fdaictl plan request id."
        type: string
        required: false
      context_digest:
        description: "Optional SHA-256 digest of the fdaictl deployment context."
        type: string
        required: false
      commit_sha:
        description: "Optional exact commit requested by fdaictl."
        type: string
        required: false
      plan_id:
        description: "Protected plan id required for exact apply."
        type: string
        required: false
      plan_digest:
        description: "Protected plan SHA-256 digest required for exact apply."
        type: string
        required: false
      deploy_console:
        description: "Provision the operator console Static Web App (enable_console)."
        type: boolean
        default: false
      deploy_design_mocks:
        description: "Provision and publish the authenticated design-mocks Static Web App."
        type: boolean
        default: false
      deploy_operator_api:
        description: "Provision the console Operator API Container App + migration job (enable_operator_api)."
        type: boolean
        default: false
      deploy_isolated_executor:
        description: "Provision the internal shadow-only isolated Executor Container App."
        type: boolean
        default: false
      cutover_isolated_executor_authority:
        description: "Move direct-API authority from Core to the isolated Executor."
        type: boolean
        default: false
      verify_executor_effect:
        description: "Run the reversible SD-08 NSG effect and independent-observer verification."
        type: boolean
        default: false
      runtime_image_revision:
        description: "Optional source commit for the verified runtime image; defaults to the checkout commit."
        type: string
        required: false
      promote_runtime_image:
        description: "Explicitly import the verified runtime image from GHCR to ACR during plan."
        type: boolean
        default: false
      deploy_dev_operations_gateway:
        description: "Provision the dev-only private-resource operations Function gateway."
        type: boolean
        default: false
      deploy_document_ingestion:
        description: "Provision ADLS Gen2 HNS storage and the document-ingestion gateway."
        type: boolean
        default: false
      production_core_image:
        description: "Prod-only signed image reference pinned by sha256 digest."
        type: string
        required: false
      production_alert_email:
        description: "Prod-only Azure Monitor alert destination."
        type: string
        required: false
      production_monthly_budget:
        description: "Prod-only positive monthly budget amount."
        type: string
        required: false
      production_budget_alert_emails_json:
        description: "Prod-only JSON string list of budget alert emails."
        type: string
        required: false

permissions:
  attestations: read
  contents: read
  packages: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: [self-hosted, fdai-deploy]
    environment: ${{ inputs.apply && inputs.environment || 'plan-only' }}
    defaults:
      run:
        working-directory: infra
    env:
      # AAD auth for both the azurerm provider and the state backend blob,
      # using the runner's system-assigned managed identity (az login below).
      ARM_USE_AZUREAD: "true"
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      # tfvars-equivalent inputs (non-secret via Variables, secret via Secrets).
      TF_VAR_env: ${{ inputs.environment }}
      TF_VAR_region: ${{ vars.AZURE_REGION }}
      TF_VAR_region_short: ${{ vars.AZURE_REGION_SHORT }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_enable_private_networking: "true"
      TF_VAR_enable_private_postgres: ${{ inputs.environment == 'prod' }}
      TF_VAR_enable_console: ${{ inputs.deploy_console }}
      TF_VAR_enable_design_mocks: ${{ inputs.deploy_design_mocks }}
      TF_VAR_enable_operator_api: ${{ inputs.deploy_operator_api }}
      TF_VAR_enable_isolated_executor: ${{ inputs.deploy_isolated_executor }}
      TF_VAR_enable_isolated_executor_authority_cutover: ${{ inputs.cutover_isolated_executor_authority }}
      TF_VAR_enable_dev_operations_gateway: ${{ inputs.environment == 'dev' && inputs.deploy_dev_operations_gateway }}
      TF_CLI_ARGS_plan: ${{ inputs.deploy_design_mocks && '-target=module.design_mocks' || inputs.deploy_dev_operations_gateway && '-target=terraform_data.isolated_executor_authority_cutover_contract -target=azurerm_function_app_flex_consumption.dev_gateway[0] -target=module.compute.azurerm_container_app.core -target=module.compute.azurerm_container_app_job.canary[0] -target=module.compute.azurerm_container_app_job.inventory[0] -target=module.operator_api[0] -target=module.ingestion_gateway[0] -target=module.isolated_executor[0] -target=azurerm_role_assignment.inventory_eventhubs_raw_sender -target=azurerm_eventgrid_system_topic_event_subscription.inventory_resource_changes[0] -target=azurerm_role_assignment.operator_api_acr_pull -target=azurerm_role_assignment.operator_api_kv_secrets_user -target=azurerm_role_assignment.operator_api_reader -target=azurerm_role_assignment.read_api_acr_pull -target=azurerm_role_assignment.read_api_kv_secrets_user -target=azurerm_role_assignment.read_api_reader -target=module.operator_api_identity[0].azurerm_user_assigned_identity.primary -target=module.read_api[0].azurerm_container_app.read_api -target=module.read_api[0].azurerm_container_app_job.migrate -target=module.read_api_identity[0].azurerm_user_assigned_identity.primary -target=module.llm_azure_openai[0].azurerm_cognitive_account.primary -target=module.llm_azure_openai[0].azurerm_role_assignment.additional_openai_user -target=azurerm_role_assignment.runtime_startup_probe_eventhubs_owner' || '' }}
      TF_VAR_dev_operations_gateway_private_probes_json: "${{ vars.DEV_OPERATIONS_GATEWAY_PRIVATE_PROBES_JSON || '{}' }}"
      TF_VAR_enable_document_ingestion: ${{ inputs.deploy_document_ingestion }}
      TF_VAR_enable_llm: ${{ inputs.deploy_document_ingestion || vars.ENABLE_LLM == 'true' || vars.OPERATOR_API_WEB_SEARCH_ENABLED == 'true' }}
      TF_VAR_resolved_capabilities: "${{ vars.RESOLVED_CAPABILITIES_JSON }}"
      TF_VAR_core_image: ${{ vars.CORE_IMAGE || vars.OPERATOR_API_IMAGE }}
      # Operator API image + Entra/RBAC ids (tenant-specific; via repo Variables,
      # never committed). Empty when deploy_operator_api is false.
      TF_VAR_operator_api_image: ${{ vars.OPERATOR_API_IMAGE }}
      TF_VAR_operator_api_resolved_models_path: ${{ vars.OPERATOR_API_RESOLVED_MODELS_PATH }}
      TF_VAR_operator_api_web_search_enabled: ${{ vars.OPERATOR_API_WEB_SEARCH_ENABLED == 'true' }}
      TF_VAR_operator_api_web_search_allowed_domains: "${{ vars.OPERATOR_API_WEB_SEARCH_ALLOWED_DOMAINS_JSON || '[]' }}"
      TF_VAR_operator_api_audience: ${{ vars.OPERATOR_API_AUDIENCE }}
      TF_VAR_rbac_readers_group_id: ${{ vars.RBAC_READERS_GROUP_ID }}
      TF_VAR_rbac_contributors_group_id: ${{ vars.RBAC_CONTRIBUTORS_GROUP_ID }}
      TF_VAR_rbac_approvers_group_id: ${{ vars.RBAC_APPROVERS_GROUP_ID }}
      TF_VAR_rbac_owners_group_id: ${{ vars.RBAC_OWNERS_GROUP_ID }}
      TF_VAR_rbac_break_glass_group_id: ${{ vars.RBAC_BREAK_GLASS_GROUP_ID }}
      TF_VAR_operator_api_cors_allow_origins: ${{ vars.OPERATOR_API_CORS_ALLOW_ORIGINS }}
      TF_VAR_operator_api_iam_directory_provider: ${{ inputs.deploy_operator_api && 'entra' || '' }}
      TF_VAR_stewardship_maintainers: ${{ vars.STEWARDSHIP_MAINTAINERS }}
      TF_VAR_stewardship_agent_bindings: "${{ vars.STEWARDSHIP_AGENT_BINDINGS_JSON || '{}' }}"
      TF_VAR_ingestion_image: ${{ vars.INGESTION_IMAGE }}
      TF_VAR_clamav_image: ${{ vars.CLAMAV_IMAGE || 'clamav/clamav:stable' }}
      TF_VAR_ingestion_cors_allow_origins: ${{ vars.INGESTION_CORS_ALLOW_ORIGINS }}
      TF_VAR_ingestion_embedding_capability: ${{ vars.INGESTION_EMBEDDING_CAPABILITY || 't1.embedding' }}
      TF_VAR_scheduler_tick_cron_expression: ${{ vars.SCHEDULER_TICK_CRON_EXPRESSION }}
      TF_VAR_analyzer_tick_cron_expression: ${{ vars.ANALYZER_TICK_CRON_EXPRESSION }}
      TF_VAR_analyzer_targets_json: ${{ vars.ANALYZER_TARGETS_JSON }}
      TF_VAR_analyzer_window_seconds: ${{ vars.ANALYZER_WINDOW_SECONDS }}
      TF_VAR_analyzer_budget_seconds: ${{ vars.ANALYZER_BUDGET_SECONDS }}
      TF_VAR_enable_email_notifications: ${{ vars.ENABLE_EMAIL_NOTIFICATIONS == 'true' }}
      TF_VAR_notification_email_recipients: "${{ vars.NOTIFICATION_EMAIL_RECIPIENTS_JSON || '[]' }}"
      TF_VAR_import_existing_email_notifications: ${{ inputs.environment == 'dev' && vars.IMPORT_EXISTING_EMAIL_NOTIFICATIONS == 'true' }}
      TF_VAR_runner_vnet_id: ${{ vars.OPS_VNET_ID }}
      TF_VAR_runner_vnet_name: ${{ vars.OPS_VNET_NAME }}
      TF_VAR_ops_resource_group_name: ${{ vars.OPS_RESOURCE_GROUP_NAME }}
      PREFLIGHT_EGRESS_HOSTS_JSON: ${{ vars.PREFLIGHT_EGRESS_HOSTS_JSON || '["api.github.com","management.azure.com","login.microsoftonline.com","registry.terraform.io","pypi.org","files.pythonhosted.org"]' }}
      PREFLIGHT_NETWORK_CHECKS_JSON: ${{ vars.PREFLIGHT_NETWORK_CHECKS_JSON || '' }}
      DEPLOY_PREFLIGHT_INPUT_JSON: ${{ vars.DEPLOY_PREFLIGHT_INPUT_JSON }}
      TF_VAR_postgres_admin_login: ${{ secrets.POSTGRES_ADMIN_LOGIN }}
      TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      TF_VAR_enable_chatops_hil: ${{ secrets.CHATOPS_WEBHOOK_URL != '' && secrets.CHATOPS_WEBHOOK_SECRET != '' }}
      TF_VAR_chatops_webhook_url: ${{ secrets.CHATOPS_WEBHOOK_URL }}
      TF_VAR_chatops_webhook_secret: ${{ secrets.CHATOPS_WEBHOOK_SECRET }}
    steps:
      - name: Prepare self-hosted runner workspace
        run: |
          set -euo pipefail
          legacy_cache="$GITHUB_WORKSPACE/infra/None"
          if [[ -e "$legacy_cache" ]]; then
            sudo -n rm -rf -- "$legacy_cache"
          fi
          azure_config_dir="$RUNNER_TEMP/azure-cli"
          mkdir -p "$azure_config_dir"
          echo "AZURE_CONFIG_DIR=$azure_config_dir" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Validate runtime image request
        env:
          APPLY: ${{ inputs.apply }}
          CUTOVER_ISOLATED_EXECUTOR_AUTHORITY: ${{ inputs.cutover_isolated_executor_authority }}
          DEPLOY_DEV_OPERATIONS_GATEWAY: ${{ inputs.deploy_dev_operations_gateway }}
          DEPLOY_ISOLATED_EXECUTOR: ${{ inputs.deploy_isolated_executor }}
          VERIFY_EXECUTOR_EFFECT: ${{ inputs.verify_executor_effect }}
          PLAN_REQUEST_ID: ${{ inputs.request_id }}
          PROMOTE_RUNTIME_IMAGE: ${{ inputs.promote_runtime_image }}
          RUNTIME_IMAGE_REVISION: ${{ inputs.runtime_image_revision }}
        run: |
          set -euo pipefail
          if [[ "$PROMOTE_RUNTIME_IMAGE" == "true" && "$DEPLOY_ISOLATED_EXECUTOR" != "true" ]]; then
            echo "promote_runtime_image requires deploy_isolated_executor." >&2
            exit 1
          fi
          if [[ "$CUTOVER_ISOLATED_EXECUTOR_AUTHORITY" == "true" \
            && ( "$DEPLOY_ISOLATED_EXECUTOR" != "true" \
              || "$DEPLOY_DEV_OPERATIONS_GATEWAY" != "true" ) ]]; then
            echo "authority cutover requires deploy_isolated_executor and deploy_dev_operations_gateway." >&2
            exit 1
          fi
          if [[ "$VERIFY_EXECUTOR_EFFECT" == "true" \
            && ( "$APPLY" != "true" || "$DEPLOY_DEV_OPERATIONS_GATEWAY" != "true" ) ]]; then
            echo "executor effect verification requires apply and deploy_dev_operations_gateway." >&2
            exit 1
          fi
          if [[ -n "$RUNTIME_IMAGE_REVISION" && "$DEPLOY_ISOLATED_EXECUTOR" != "true" ]]; then
            echo "runtime_image_revision requires deploy_isolated_executor." >&2
            exit 1
          fi
          if [[ "$APPLY" == "true" && "$PROMOTE_RUNTIME_IMAGE" == "true" ]]; then
            echo "runtime image promotion is not allowed during exact apply." >&2
            exit 1
          fi
          if [[ "$PROMOTE_RUNTIME_IMAGE" == "true" && -z "$PLAN_REQUEST_ID" ]]; then
            echo "runtime image promotion requires a protected plan request." >&2
            exit 1
          fi

      - name: Validate design-mocks-only request
        if: ${{ inputs.deploy_design_mocks }}
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_CONSOLE: ${{ inputs.deploy_console }}
          DEPLOY_OPERATOR_API: ${{ inputs.deploy_operator_api }}
          DEPLOY_ISOLATED_EXECUTOR: ${{ inputs.deploy_isolated_executor }}
          DEPLOY_DEV_OPERATIONS_GATEWAY: ${{ inputs.deploy_dev_operations_gateway }}
          DEPLOY_DOCUMENT_INGESTION: ${{ inputs.deploy_document_ingestion }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_ENVIRONMENT" != "dev" ]]; then
            echo "design-mocks deployment is restricted to the dev environment." >&2
            exit 1
          fi
          if [[ "$DEPLOY_CONSOLE" == "true" \
            || "$DEPLOY_OPERATOR_API" == "true" \
            || "$DEPLOY_ISOLATED_EXECUTOR" == "true" \
            || "$DEPLOY_DEV_OPERATIONS_GATEWAY" == "true" \
            || "$DEPLOY_DOCUMENT_INGESTION" == "true" ]]; then
            echo "deploy_design_mocks cannot be combined with another deployment target." >&2
            exit 1
          fi

      - name: Validate remote plan request
        if: ${{ !inputs.apply && inputs.request_id != '' }}
        env:
          PLAN_REQUEST_ID: ${{ inputs.request_id }}
          PLAN_CONTEXT_DIGEST: ${{ inputs.context_digest }}
          PLAN_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$PLAN_REQUEST_ID" =~ ^plan-[0-9a-f]{24}$ ]]; then
            echo "request_id must be a bounded fdaictl plan id." >&2
            exit 1
          fi
          if [[ ! "$PLAN_CONTEXT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "context_digest must be a lowercase SHA-256 digest." >&2
            exit 1
          fi
          if [[ ! "$PLAN_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a lowercase git SHA." >&2
            exit 1
          fi
          if [[ "$PLAN_COMMIT_SHA" != "$(git rev-parse HEAD)" ]]; then
            echo "requested commit does not match the workflow checkout." >&2
            exit 1
          fi
          if [[ -z "$DEPLOY_PREFLIGHT_INPUT_JSON" ]]; then
            echo "DEPLOY_PREFLIGHT_INPUT_JSON is required for protected plans." >&2
            exit 1
          fi

      - name: Validate exact apply request
        if: ${{ inputs.apply }}
        env:
          APPLY_REQUEST_ID: ${{ inputs.request_id }}
          APPLY_CONTEXT_DIGEST: ${{ inputs.context_digest }}
          APPLY_COMMIT_SHA: ${{ inputs.commit_sha }}
          APPLY_PLAN_ID: ${{ inputs.plan_id }}
          APPLY_PLAN_DIGEST: ${{ inputs.plan_digest }}
        run: |
          set -euo pipefail
          if [[ ! "$APPLY_REQUEST_ID" =~ ^apply-[0-9a-f]{24}$ ]]; then
            echo "apply request_id must be a bounded fdaictl id." >&2
            exit 1
          fi
          if [[ ! "$APPLY_CONTEXT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "apply context_digest must be a lowercase SHA-256 digest." >&2
            exit 1
          fi
          if [[ ! "$APPLY_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "apply commit_sha must be a lowercase git SHA." >&2
            exit 1
          fi
          if [[ "$APPLY_COMMIT_SHA" != "$(git rev-parse HEAD)" ]]; then
            echo "requested apply commit does not match the workflow checkout." >&2
            exit 1
          fi
          if [[ ! "$APPLY_PLAN_ID" =~ ^plan-[1-9][0-9]*-[1-9][0-9]*$ ]]; then
            echo "plan_id is invalid." >&2
            exit 1
          fi
          if [[ ! "$APPLY_PLAN_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "plan_digest must be a lowercase SHA-256 digest." >&2
            exit 1
          fi

      - name: Install readiness gate dependency
        if: inputs.environment == 'prod'
        run: python3 -m pip install --quiet pyyaml
        working-directory: ${{ github.workspace }}

      - name: Verify production architecture-review evidence
        if: inputs.environment == 'prod'
        run: python3 scripts/governance/check-arb-readiness.py --require-production-ready
        working-directory: ${{ github.workspace }}

      - name: Bind production Terraform inputs
        if: inputs.environment == 'prod'
        env:
          PROD_CORE_IMAGE: ${{ inputs.production_core_image }}
          PROD_ALERT_EMAIL: ${{ inputs.production_alert_email }}
          PROD_MONTHLY_BUDGET_AMOUNT: ${{ inputs.production_monthly_budget }}
          PROD_BUDGET_ALERT_EMAILS_JSON: ${{ inputs.production_budget_alert_emails_json }}
        run: |
          if [[ ! "$PROD_CORE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "PROD_CORE_IMAGE must be digest-pinned." >&2
            exit 1
          fi
          if [[ -z "$PROD_ALERT_EMAIL" ]]; then
            echo "production_alert_email is required." >&2
            exit 1
          fi
          if [[ ! "$PROD_MONTHLY_BUDGET_AMOUNT" =~ ^[1-9][0-9]*([.][0-9]+)?$ ]]; then
            echo "PROD_MONTHLY_BUDGET_AMOUNT must be positive." >&2
            exit 1
          fi
          python3 -c 'import json, os; value=json.loads(os.environ["PROD_BUDGET_ALERT_EMAILS_JSON"]); assert isinstance(value, list) and value and all(isinstance(item, str) and item for item in value)'
          {
            echo "TF_VAR_core_image=$PROD_CORE_IMAGE"
            echo "TF_VAR_enable_resource_locks=true"
            echo "TF_VAR_kv_purge_protection_enabled=true"
            echo "TF_VAR_kv_soft_delete_retention_days=90"
            echo "TF_VAR_postgres_backup_retention_days=35"
            echo "TF_VAR_postgres_geo_redundant_backup=true"
                        echo "TF_VAR_postgres_high_availability_mode=ZoneRedundant"
            echo "TF_VAR_acr_sku=Premium"
            echo "TF_VAR_enable_monitoring=true"
            echo "TF_VAR_alert_email=$PROD_ALERT_EMAIL"
            echo "TF_VAR_monthly_budget_amount=$PROD_MONTHLY_BUDGET_AMOUNT"
            echo "TF_VAR_budget_alert_emails=$PROD_BUDGET_ALERT_EMAILS_JSON"
          } >> "$GITHUB_ENV"

      - name: Azure login (runner managed identity)
        run: |
          az account clear
          az login --identity --allow-no-subscriptions

      - name: Verify exact Azure context
        # The job defaults to `infra`, so a repository-root script path only
        # resolves from the workspace root.
        working-directory: ${{ github.workspace }}
        run: |
          bash scripts/deployment/azure/verify-azure-context.sh \
            "$ARM_SUBSCRIPTION_ID" "$TF_VAR_tenant_id"

      - name: Ensure protected storage containers
        # Created data-plane from the runner (inside the VNet, over the blob
        # private endpoint) since the account is private + key-auth is
        # policy-forbidden. Idempotent.
        run: |
          az storage container create \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --name tfstate --auth-mode login --public-access off --only-show-errors \
            --output none
          az storage container create \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --name deployment-plans --auth-mode login --public-access off --only-show-errors \
            --output none

      - name: Activate remote state backend
        run: cp backend.azurerm.tf.example backend.tf

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.OPS_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=fdai-${{ inputs.environment }}.tfstate"

      - name: Install pinned GitHub CLI for image verification
        if: ${{ !inputs.apply && inputs.deploy_isolated_executor }}
        env:
          GH_VERSION: "2.97.0"
          GH_LINUX_AMD64_SHA256: "a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112"
        run: |
          set -euo pipefail
          archive="gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            --retry-all-errors --connect-timeout 5 --max-time 120 \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GH_LINUX_AMD64_SHA256" "$RUNNER_TEMP/$archive" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Bind exact isolated Executor runtime image
        if: ${{ !inputs.apply && inputs.deploy_isolated_executor }}
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          PROMOTE_RUNTIME_IMAGE: ${{ inputs.promote_runtime_image }}
          RUNTIME_IMAGE_REVISION: ${{ inputs.runtime_image_revision }}
        run: |
          set -euo pipefail
          checkout_revision="$(git rev-parse HEAD)"
          revision="${RUNTIME_IMAGE_REVISION:-$checkout_revision}"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "runtime_image_revision must be a lowercase git SHA." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$revision" "$checkout_revision"; then
            echo "runtime image revision must be an ancestor of the workflow checkout." >&2
            exit 1
          fi

          source_repository="${GITHUB_REPOSITORY,,}"
          registry_token="$(
            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              --retry-all-errors --connect-timeout 5 --max-time 30 \
              --user "$GITHUB_ACTOR:$GHCR_TOKEN" \
              "https://ghcr.io/token?scope=repository:${source_repository}:pull" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])'
          )"
          source_digest="$(
            curl --fail --silent --show-error --head --retry 3 --retry-delay 2 \
              --retry-all-errors --connect-timeout 5 --max-time 30 \
              -H "Authorization: Bearer $registry_token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${source_repository}/manifests/sha-${revision}" \
              | tr -d '\r' \
              | awk -F': ' 'tolower($1) == "docker-content-digest" {print $2}'
          )"
          if [[ ! "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "verified runtime image tag did not resolve to one manifest digest." >&2
            exit 1
          fi
          timeout 60s gh attestation verify \
            "oci://ghcr.io/${source_repository}@${source_digest}" \
            --repo "$GITHUB_REPOSITORY" >/dev/null

          login_server="$(terraform output -raw container_registry_login_server)"
          registry_name="${login_server%%.*}"
          if [[ ! "$registry_name" =~ ^[a-z0-9]+$ ]]; then
            echo "Terraform returned an invalid ACR login server." >&2
            exit 1
          fi
          if [[ "$PROMOTE_RUNTIME_IMAGE" == "true" ]]; then
            timeout 600s az acr import \
              --name "$registry_name" \
              --source "ghcr.io/${source_repository}@${source_digest}" \
              --image "fdai:sha-${revision}" \
              --username "$GITHUB_ACTOR" \
              --password "$GHCR_TOKEN" \
              --force --only-show-errors --output none
          fi
          target_digest=""
          for attempt in 1 2 3 4 5; do
            target_digest="$(
              timeout 30s az acr manifest list-metadata \
                --registry "$registry_name" \
                --name fdai \
                --query "[?tags != null && contains(tags, 'sha-${revision}')].digest | [0]" \
                --output tsv --only-show-errors || true
            )"
            if [[ "$target_digest" == "$source_digest" ]]; then
              break
            fi
            sleep "$((attempt * 2))"
          done
          if [[ -z "$target_digest" ]]; then
            echo "Verified runtime image is not present in ACR; submit an authorized plan with promote_runtime_image=true." >&2
            exit 1
          fi
          if [[ "$target_digest" != "$source_digest" ]]; then
            echo "ACR runtime image digest does not match the verified GHCR subject." >&2
            exit 1
          fi
          {
            echo "TF_VAR_core_image=${login_server}/fdai@${target_digest}"
            echo "FDAI_RUNTIME_IMAGE_REVISION=${revision}"
            echo "FDAI_RUNTIME_IMAGE_DIGEST=${target_digest}"
          } >> "$GITHUB_ENV"

      - name: Adopt existing Azure resources
        if: ${{ !inputs.deploy_design_mocks }}
        run: |
          set -euo pipefail
          rg="rg-fdai-${TF_VAR_env}-${TF_VAR_region_short}"
          namespace="evhns-fdai-${TF_VAR_env}-${TF_VAR_region_short}"

          import_if_missing() {
            local address="$1"
            local resource_id="$2"
            [ -z "$resource_id" ] && return 0
            if terraform state show "$address" >/dev/null 2>&1; then
              return 0
            fi
            echo "adopting $address"
            terraform import -input=false "$address" "$resource_id"
          }

          resource_id() {
            az resource show --resource-group "$rg" --name "$1" \
              --resource-type "$2" --query id -o tsv 2>/dev/null || true
          }

          import_if_missing 'azurerm_application_insights.core' \
            "$(resource_id "appi-fdai-${TF_VAR_env}-${TF_VAR_region_short}" 'Microsoft.Insights/components')"
          if [ "${TF_VAR_enable_dev_operations_gateway}" = "true" ]; then
            gateway_function_id="$(az resource list --resource-group "$rg" \
              --resource-type 'Microsoft.Web/sites' \
              --query "[?starts_with(name, 'func-fdai-${TF_VAR_env}-${TF_VAR_region_short}-devgw-')].id | [0]" \
              -o tsv 2>/dev/null || true)"
            import_if_missing 'azurerm_function_app_flex_consumption.dev_gateway[0]' \
              "$gateway_function_id"
          fi
          import_if_missing 'module.inventory_identity.azurerm_user_assigned_identity.primary' \
            "$(az identity show --resource-group "$rg" --name "id-fdai-${TF_VAR_env}-${TF_VAR_region_short}-inventory" --query id -o tsv 2>/dev/null || true)"
          import_if_missing 'module.compute.azurerm_container_app_job.inventory[0]' \
            "$(az containerapp job show --resource-group "$rg" --name "ca-fdai-${TF_VAR_env}-${TF_VAR_region_short}-core-inventory" --query id -o tsv 2>/dev/null || true)"
          import_if_missing 'module.compute.azurerm_container_app_job.scheduler_tick[0]' \
            "$(az containerapp job show --resource-group "$rg" --name "ca-fdai-${TF_VAR_env}-${TF_VAR_region_short}-core-scheduler" --query id -o tsv 2>/dev/null || true)"
          import_if_missing 'module.compute.azurerm_container_app_job.analyzer_tick[0]' \
            "$(az containerapp job show --resource-group "$rg" --name "ca-fdai-${TF_VAR_env}-${TF_VAR_region_short}-core-analyzer" --query id -o tsv 2>/dev/null || true)"

          inventory_principal="$(az identity show --resource-group "$rg" --name "id-fdai-${TF_VAR_env}-${TF_VAR_region_short}-inventory" --query principalId -o tsv 2>/dev/null || true)"
          subscription_scope="/subscriptions/${ARM_SUBSCRIPTION_ID}"
          acr_scope="$(az acr show --resource-group "$rg" --name "crfdai${TF_VAR_env}${TF_VAR_region_short}" --query id -o tsv 2>/dev/null || true)"
          eventhubs_scope="$(az eventhubs eventhub show --resource-group "$rg" --namespace-name "$namespace" --name aw.change.events --query id -o tsv 2>/dev/null || true)"

          role_assignment_id() {
            local scope="$1"
            local role="$2"
            az role assignment list --scope "$scope" --assignee "$inventory_principal" \
              --query "[?roleDefinitionName=='$role'].id | [0]" -o tsv 2>/dev/null || true
          }

          import_if_missing 'azurerm_role_assignment.inventory_reader' \
            "$(role_assignment_id "$subscription_scope" 'Reader')"
          import_if_missing 'azurerm_role_assignment.inventory_acr_pull' \
            "$(role_assignment_id "$acr_scope" 'AcrPull')"
          import_if_missing 'azurerm_role_assignment.inventory_eventhubs_sender' \
            "$(role_assignment_id "$eventhubs_scope" 'Azure Event Hubs Data Sender')"

          if [ "${TF_VAR_enable_llm}" = "true" ]; then
            import_if_missing 'module.llm_azure_openai[0].azurerm_cognitive_account.primary' \
              "$(az cognitiveservices account show --resource-group "$rg" --name "oai-fdai-${TF_VAR_env}-${TF_VAR_region_short}" --query id -o tsv 2>/dev/null || true)"
          fi

          for topic in aw.pantheon.objects; do
            id="$(az eventhubs eventhub show --resource-group "$rg" --namespace-name "$namespace" --name "$topic" --query id -o tsv 2>/dev/null || true)"
            import_if_missing "module.event_bus.azurerm_eventhub.topic[\"$topic\"]" "$id"
          done
          for topic in aw.pantheon.objects; do
            name="$topic.dlq"
            id="$(az eventhubs eventhub show --resource-group "$rg" --namespace-name "$namespace" --name "$name" --query id -o tsv 2>/dev/null || true)"
            import_if_missing "module.event_bus.azurerm_eventhub.dlq[\"$topic\"]" "$id"
          done
          for topic in aw.hil.decisions aw.pipeline.stages; do
            id="$(az eventhubs eventhub show --resource-group "$rg" --namespace-name "$namespace" --name "$topic" --query id -o tsv 2>/dev/null || true)"
            import_if_missing "module.event_bus.azurerm_eventhub.auxiliary[\"$topic\"]" "$id"
          done

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Build development operations gateway source artifact
        if: ${{ !inputs.apply && inputs.deploy_dev_operations_gateway }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("../delivery/dev_operations_gateway")
          target = Path("fdai-dev-operations-gateway.zip")
          excluded_names = {".funcignore", "README.md"}
          with ZipFile(target, "w", compression=ZIP_DEFLATED) as archive:
            for path in sorted(source.rglob("*")):
              if (
                not path.is_file()
                or path.name in excluded_names
                or path.suffix == ".pyc"
                or "__pycache__" in path.parts
              ):
                continue
              archive.write(path, path.relative_to(source).as_posix())
          required = {"function_app.py", "gateway.py", "host.json", "requirements.txt"}
          with ZipFile(target) as archive:
            missing = required.difference(archive.namelist())
          if missing:
            raise SystemExit(f"gateway source artifact is missing: {sorted(missing)}")
          PY

      - name: Run runner egress preflight
        run: |
          set -euo pipefail
          trap 'rm -f runner-network-connectivity-manifest.json runner-network-connectivity.json' EXIT
          printf '%s\n' "$PREFLIGHT_EGRESS_HOSTS_JSON" > runner-egress-hosts.json
          python3 ../scripts/deployment/azure/check-runner-egress.py runner-egress-hosts.json \
            --output runner-egress-evidence.json --timeout-seconds 5
          export PREFLIGHT_EVENT_BUS_PRIMARY="$(terraform output -raw "event_bus_kafka_bootstrap" 2>/dev/null || true)"
          export PREFLIGHT_EVENT_BUS_OPERATIONAL="$(terraform output -raw "event_bus_operational_kafka_bootstrap" 2>/dev/null || true)"
          export PREFLIGHT_POSTGRES="$(terraform output -raw "postgres_fqdn" 2>/dev/null || true)"
          export PREFLIGHT_KEY_VAULT="$(terraform output -raw "key_vault_uri" 2>/dev/null || true)"
          export PREFLIGHT_ACR="$(terraform output -raw "container_registry_login_server" 2>/dev/null || true)"
          export PREFLIGHT_LLM="$(terraform output -raw "llm_endpoint" 2>/dev/null || true)"
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import urlsplit

          with open("runner-egress-hosts.json", encoding="utf-8") as stream:
            hosts = json.load(stream)
          if not isinstance(hosts, list):
            raise SystemExit("PREFLIGHT_EGRESS_HOSTS_JSON must be an array")
          checks = [
            {
              "id": f"egress-{index:02d}",
              "host": host,
              "port": 443,
              "required": True,
              "expected_ip": "any",
            }
            for index, host in enumerate(hosts, start=1)
          ]
          private_networking = os.environ.get(
            "TF_VAR_enable_private_networking", "false"
          ).lower() == "true"
          private_policy = "private" if private_networking else "public"
          acr_is_private = (
            private_networking
            and os.environ.get("TF_VAR_acr_sku", "Basic").lower() == "premium"
          )
          state_targets = (
            ("event-bus-primary", "PREFLIGHT_EVENT_BUS_PRIMARY", 9093, private_policy),
            ("event-bus-operational", "PREFLIGHT_EVENT_BUS_OPERATIONAL", 9093, private_policy),
            ("postgres", "PREFLIGHT_POSTGRES", 5432, private_policy),
            ("key-vault", "PREFLIGHT_KEY_VAULT", 443, private_policy),
            ("container-registry", "PREFLIGHT_ACR", 443, "private" if acr_is_private else "public"),
            ("azure-openai", "PREFLIGHT_LLM", 443, private_policy),
          )
          for check_id, env_key, port, expected_ip in state_targets:
            value = os.environ.get(env_key, "").strip()
            if not value:
              continue
            parsed = urlsplit(value if "://" in value else f"//{value}")
            if not parsed.hostname:
              raise SystemExit(f"Terraform output for {check_id} has no hostname")
            checks.append(
              {
                "id": check_id,
                "host": parsed.hostname,
                "port": port,
                "required": True,
                "expected_ip": expected_ip,
              }
            )
          extra_raw = os.environ.get("PREFLIGHT_NETWORK_CHECKS_JSON", "").strip()
          if extra_raw:
            extra = json.loads(extra_raw)
            if (
              not isinstance(extra, dict)
              or extra.get("schema_version") != "fdai.network-connectivity-manifest.v1"
              or not isinstance(extra.get("checks"), list)
            ):
              raise SystemExit("PREFLIGHT_NETWORK_CHECKS_JSON is not a valid manifest")
            checks.extend(extra["checks"])
          manifest = {
            "schema_version": "fdai.network-connectivity-manifest.v1",
            "checks": checks,
          }
          with open("runner-network-connectivity-manifest.json", "w", encoding="utf-8") as stream:
            json.dump(manifest, stream, sort_keys=True, separators=(",", ":"))
            stream.write("\n")
          PY
          python3 ../scripts/deployment/azure/check-network-connectivity.py \
            --profile custom --manifest runner-network-connectivity-manifest.json \
            --redact --output runner-network-connectivity.json --timeout-seconds 5
          python3 - <<'PY'
          import json

          with open("runner-egress-evidence.json", encoding="utf-8") as stream:
            egress = json.load(stream)
          with open("runner-network-connectivity.json", encoding="utf-8") as stream:
            network = json.load(stream)
          egress["network_connectivity"] = network
          with open("runner-egress-evidence.json", "w", encoding="utf-8") as stream:
            json.dump(egress, stream, sort_keys=True, separators=(",", ":"))
            stream.write("\n")
          PY

      - name: Terraform plan
        if: ${{ !inputs.apply }}
        run: terraform plan -input=false -lock-timeout=300s -out=dev.plan

      - name: Enforce design-mocks-only Terraform plan
        if: ${{ !inputs.apply && inputs.deploy_design_mocks }}
        run: |
          set -euo pipefail
          terraform show -json dev.plan > design-mocks-plan.json
          trap 'rm -f design-mocks-plan.json' EXIT
          python3 - <<'PY'
          import json

          with open("design-mocks-plan.json", encoding="utf-8") as stream:
            plan = json.load(stream)
          allowed = {
              "module.design_mocks[0].azurerm_static_web_app.design_mocks",
          }
          changed = {
              str(change.get("address", "unknown"))
              for change in plan.get("resource_changes", [])
              if change.get("change", {}).get("actions", []) not in (["no-op"], ["read"])
          }
          unexpected = sorted(changed.difference(allowed))
          if unexpected:
            print("Design-mocks-only plan contains changes outside the Static Web App:")
            for address in unexpected:
              print(f"- {address}")
            raise SystemExit(1)
          print(f"Design-mocks-only plan accepted: {sorted(changed)}")
          PY

      - name: Reject destructive protected plan
        if: ${{ !inputs.apply && inputs.request_id != '' }}
        run: |
          set -euo pipefail
          terraform show -json dev.plan > dev.plan.review.json
          trap 'rm -f dev.plan.review.json' EXIT
          python3 - <<'PY'
          import json

          with open("dev.plan.review.json", encoding="utf-8") as stream:
            plan = json.load(stream)
          permitted_retirements = {
            "module.state_store.azurerm_postgresql_flexible_server_firewall_rule."
            "allow_azure_services[0]": (),
            "azurerm_role_assignment.ingestion_eventhubs_receiver[0]": (
              "azurerm_role_assignment.ingestion_worker_pantheon_receiver[0]",
            ),
            "azurerm_role_assignment.ingestion_worker_eventhubs_receiver[0]": (
              "azurerm_role_assignment.ingestion_worker_pantheon_receiver[0]",
            ),
            "azurerm_role_assignment.ingestion_worker_pantheon_receiver[0]": (
              "azurerm_role_assignment.ingestion_eventhubs_receiver[0]",
            ),
            "azurerm_role_assignment.ingestion_kv_secrets_user[0]": (
              "azurerm_role_assignment.ingestion_api_kv_secrets_user[0]",
            ),
            "module.llm_azure_openai[0].azurerm_role_assignment."
            "additional_openai_user[\"ingestion\"]": (
              "module.llm_azure_openai[0].azurerm_role_assignment."
              "additional_openai_user[\"ingestion_api\"]",
              "module.llm_azure_openai[0].azurerm_role_assignment."
              "additional_openai_user[\"ingestion_worker\"]",
            ),
          }
          actions_by_address = {
            str(change.get("address", "unknown")): tuple(
              change.get("change", {}).get("actions", [])
            )
            for change in plan.get("resource_changes", [])
          }
          destructive = sorted(
            (
              str(change.get("address", "unknown")),
              tuple(change.get("change", {}).get("actions", [])),
            )
            for change in plan.get("resource_changes", [])
            if "delete" in change.get("change", {}).get("actions", [])
          )
          unexpected = [
            address
            for address, actions in destructive
            if (
              address not in permitted_retirements
              or actions != ("delete",)
              or any(
                actions_by_address.get(successor) != ("create",)
                for successor in permitted_retirements.get(address, ())
              )
            )
          ]
          if unexpected:
            print("Protected plans reject delete or replacement actions:")
            for address in unexpected:
              print(f"- {address}")
            raise SystemExit(1)
          for address, _actions in destructive:
            successors = permitted_retirements[address]
            successor_text = ", ".join(successors) if successors else "closed public path"
            print(
              "Protected plan permits bounded security retirement: "
              f"{address} -> {successor_text}"
            )
          PY

      - name: Install pinned uv for live preflight
        if: ${{ !inputs.apply && inputs.request_id != '' }}
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.8.22"
          enable-cache: true
          prune-cache: false

      - name: Install locked FDAI CLI
        if: ${{ !inputs.apply && inputs.request_id != '' }}
        working-directory: ${{ github.workspace }}
        run: uv sync --locked

      - name: Run complete Azure live preflight
        if: ${{ !inputs.apply && inputs.request_id != '' }}
        env:
          PREFLIGHT_ENVIRONMENT: ${{ inputs.environment }}
          PREFLIGHT_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
          PREFLIGHT_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          PREFLIGHT_REGION: ${{ vars.AZURE_REGION }}
        run: |
          set -euo pipefail
          printf '%s' "$DEPLOY_PREFLIGHT_INPUT_JSON" > runner-live-preflight-input.json
          created_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          export CREATED_AT="$created_at"
          python3 - <<'PY'
          import json
          import os

          required = {
            "identity_rbac",
            "policy_guardrail",
            "quota_capacity",
            "secret_config",
          }
          with open("runner-live-preflight-input.json", encoding="utf-8") as stream:
            profile = json.load(stream)
          live = profile.get("azure_live")
          if not isinstance(live, dict) or set(live.get("required_categories", ())) != required:
            raise SystemExit("runner preflight profile must require all Azure live categories")
          profile["mode"] = "enforce"
          profile["generated_at"] = os.environ["CREATED_AT"]
          profile["scope"] = "resource-group-equivalent:deployment"
          with open("runner-live-preflight-input.json", "w", encoding="utf-8") as stream:
            json.dump(profile, stream, sort_keys=True, separators=(",", ":"))
            stream.write("\n")
          environment = {
            "schema_version": "fdai.deployment.environment.v1",
            "environment": os.environ["PREFLIGHT_ENVIRONMENT"],
            "azure": {
              "subscription_id": os.environ["PREFLIGHT_SUBSCRIPTION_ID"],
              "tenant_id": os.environ["PREFLIGHT_TENANT_ID"],
              "region": os.environ["PREFLIGHT_REGION"],
            },
            "execution_target": "remote-runner",
            "autonomy_mode_default": "shadow",
          }
          with open("runner-environment.json", "w", encoding="utf-8") as stream:
            json.dump(environment, stream, sort_keys=True, separators=(",", ":"))
            stream.write("\n")
          PY
          terraform show -json dev.plan > dev.plan.json
          trap 'rm -f dev.plan.json runner-live-preflight-input.json runner-environment.json' EXIT
          set +e
          ../.venv/bin/fdaictl deploy preflight \
          --input runner-live-preflight-input.json \
          --terraform-plan dev.plan.json \
          --environment-config runner-environment.json \
          --output json > azure-preflight-evidence.json
          preflight_exit=$?
          set -e
          export PREFLIGHT_EXIT="$preflight_exit"
          python3 - <<'PY'
          import json
          import os

          required = {
            "identity_rbac",
            "policy_guardrail",
            "quota_capacity",
            "secret_config",
          }
          with open("azure-preflight-evidence.json", encoding="utf-8") as stream:
            payload = json.load(stream)
          report = payload.get("report")
          if not isinstance(report, dict):
            detail = payload.get("error")
            if not isinstance(detail, str) or not detail or len(detail) > 512:
              detail = "preflight did not return a bounded error"
            detail = detail.replace("\r", " ").replace("\n", " ")
            print(f"Azure live preflight incomplete: {detail}")
            raise SystemExit(
              "Azure live preflight report is missing "
              f"(CLI exit {os.environ['PREFLIGHT_EXIT']})"
            )
          sanitized = {
            "verdict": report.get("verdict"),
            "blocks_deploy": report.get("blocks_deploy"),
            "checks": report.get("checks"),
            "findings": report.get("findings"),
          }
          print("Azure live preflight sanitized report:")
          print(json.dumps(sanitized, sort_keys=True))
          checks = report.get("checks")
          if not isinstance(checks, list):
            raise SystemExit("Azure live preflight check coverage is missing")
          categories = {
            check.get("category") for check in checks if isinstance(check, dict)
          }
          if not required.issubset(categories):
            raise SystemExit("Azure live preflight did not execute every required category")
          if report.get("verdict") != "clear" or report.get("blocks_deploy") is not False:
            raise SystemExit("Azure live preflight did not produce a clear report")
          PY

      - name: Cleanup expired protected plans
        if: ${{ !inputs.apply && inputs.request_id != '' }}
        run: |
          set -euo pipefail
          az storage blob list \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans --auth-mode login \
            --num-results 1001 --only-show-errors --output json > plan-blobs.json
          python3 ../scripts/deployment/azure/cleanup-deployment-plans.py plan-blobs.json > expired-plan-blobs.txt
          deleted="$(wc -l < expired-plan-blobs.txt)"
          if [ "$deleted" -gt 0 ]; then
            xargs -r -P 8 -I '{}' az storage blob delete \
              --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
              --container-name deployment-plans --name '{}' \
              --auth-mode login --only-show-errors --output none \
              < expired-plan-blobs.txt
          fi
          echo "Expired protected plan blobs deleted: $deleted" >> "$GITHUB_STEP_SUMMARY"

      - name: Store protected plan artifact
        if: ${{ !inputs.apply && inputs.request_id != '' }}
        env:
          PLAN_REQUEST_ID: ${{ inputs.request_id }}
          PLAN_CONTEXT_DIGEST: ${{ inputs.context_digest }}
          PLAN_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          plan_id="plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          plan_digest="$(sha256sum dev.plan | cut -d' ' -f1)"
          source_artifact="fdai-dev-operations-gateway.zip"
          if [ ! -f "$source_artifact" ]; then
            : > "$source_artifact"
          fi
          source_artifact_digest="$(sha256sum "$source_artifact" | cut -d' ' -f1)"
          preflight_evidence_digest="$(sha256sum runner-egress-evidence.json | cut -d' ' -f1)"
          azure_preflight_evidence_digest="$(sha256sum azure-preflight-evidence.json | cut -d' ' -f1)"
          created_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          expires_at="$(date -u -d '+1 hour' '+%Y-%m-%dT%H:%M:%SZ')"
          export PLAN_ID="$plan_id" PLAN_DIGEST="$plan_digest" \
            SOURCE_ARTIFACT_DIGEST="$source_artifact_digest" \
            PREFLIGHT_EVIDENCE_DIGEST="$preflight_evidence_digest" CREATED_AT="$created_at" \
            AZURE_PREFLIGHT_EVIDENCE_DIGEST="$azure_preflight_evidence_digest" \
            EXPIRES_AT="$expires_at"
          python3 - <<'PY'
          import json
          import os

          runtime_image_revision = os.environ.get("FDAI_RUNTIME_IMAGE_REVISION", "")
          runtime_image_digest = os.environ.get("FDAI_RUNTIME_IMAGE_DIGEST", "")
          if bool(runtime_image_revision) != bool(runtime_image_digest):
              raise SystemExit("runtime image plan evidence is incomplete")
          metadata = {
              "schema_version": "fdai.deployment-plan.v1",
              "plan_id": os.environ["PLAN_ID"],
              "plan_digest": os.environ["PLAN_DIGEST"],
              "source_artifact_digest": os.environ["SOURCE_ARTIFACT_DIGEST"],
              "context_digest": os.environ["PLAN_CONTEXT_DIGEST"],
              "preflight_evidence_digest": os.environ["PREFLIGHT_EVIDENCE_DIGEST"],
              "azure_preflight_evidence_digest": os.environ[
                  "AZURE_PREFLIGHT_EVIDENCE_DIGEST"
              ],
              "preflight_blocks": False,
              "commit_sha": os.environ["PLAN_COMMIT_SHA"],
              "request_id": os.environ["PLAN_REQUEST_ID"],
              "created_at": os.environ["CREATED_AT"],
              "expires_at": os.environ["EXPIRES_AT"],
              "status": "ready",
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
          }
          if runtime_image_revision:
              metadata["runtime_image"] = {
                  "source_revision": runtime_image_revision,
                  "digest": runtime_image_digest,
              }
          with open("plan-metadata.json", "w", encoding="utf-8") as stream:
              json.dump(metadata, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          PY
          blob_prefix="${TF_VAR_env}/${plan_id}"
          az storage blob upload \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans \
            --name "${blob_prefix}/terraform.plan" \
            --file dev.plan --auth-mode login --overwrite false --only-show-errors \
            --output none
          az storage blob upload \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans \
            --name "${blob_prefix}/metadata.json" \
            --file plan-metadata.json --auth-mode login --overwrite false --only-show-errors \
            --content-type application/json --output none
          az storage blob upload \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans \
            --name "${blob_prefix}/source-artifact.zip" \
            --file "$source_artifact" --auth-mode login --overwrite false \
            --only-show-errors --content-type application/zip --output none
          az storage blob upload \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans \
            --name "${blob_prefix}/preflight-evidence.json" \
            --file runner-egress-evidence.json --auth-mode login --overwrite false \
            --only-show-errors --content-type application/json --output none
          az storage blob upload \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans \
            --name "${blob_prefix}/azure-preflight-evidence.json" \
            --file azure-preflight-evidence.json --auth-mode login --overwrite false \
            --only-show-errors --content-type application/json --output none
          {
            echo "Plan id: \`$plan_id\`"
            echo "Plan digest: \`$plan_digest\`"
            echo "Expires at: \`$expires_at\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized plan metadata
        if: ${{ !inputs.apply && inputs.request_id != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deployment-plan-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/plan-metadata.json
          if-no-files-found: error
          retention-days: 1

      - name: Restore and verify exact protected plan
        if: ${{ inputs.apply }}
        env:
          APPLY_CONTEXT_DIGEST: ${{ inputs.context_digest }}
          APPLY_COMMIT_SHA: ${{ inputs.commit_sha }}
          APPLY_PLAN_ID: ${{ inputs.plan_id }}
          APPLY_PLAN_DIGEST: ${{ inputs.plan_digest }}
        run: |
          set -euo pipefail
          blob_prefix="${TF_VAR_env}/${APPLY_PLAN_ID}"
          az storage blob download \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans \
            --name "${blob_prefix}/terraform.plan" --file dev.plan \
            --auth-mode login --overwrite --only-show-errors --output none
          az storage blob download \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans \
            --name "${blob_prefix}/metadata.json" --file plan-metadata.json \
            --auth-mode login --overwrite --only-show-errors --output none
          az storage blob download \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans \
            --name "${blob_prefix}/source-artifact.zip" \
            --file fdai-dev-operations-gateway.zip \
            --auth-mode login --overwrite --only-show-errors --output none
          az storage blob download \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans \
            --name "${blob_prefix}/preflight-evidence.json" \
            --file plan-preflight-evidence.json \
            --auth-mode login --overwrite --only-show-errors --output none
          az storage blob download \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans \
            --name "${blob_prefix}/azure-preflight-evidence.json" \
            --file plan-azure-preflight-evidence.json \
            --auth-mode login --overwrite --only-show-errors --output none
          python3 ../scripts/deployment/azure/verify-deployment-plan.py \
            --plan dev.plan --source-artifact fdai-dev-operations-gateway.zip \
            --metadata plan-metadata.json \
            --preflight-evidence plan-preflight-evidence.json \
            --azure-preflight-evidence plan-azure-preflight-evidence.json \
            --plan-id "$APPLY_PLAN_ID" --plan-digest "$APPLY_PLAN_DIGEST" \
            --context-digest "$APPLY_CONTEXT_DIGEST" --commit-sha "$APPLY_COMMIT_SHA"

      - name: Claim exact plan apply
        if: ${{ inputs.apply && !inputs.resume_verification }}
        env:
          APPLY_PLAN_ID: ${{ inputs.plan_id }}
          APPLY_PLAN_DIGEST: ${{ inputs.plan_digest }}
          APPLY_CONTEXT_DIGEST: ${{ inputs.context_digest }}
        run: |
          set -euo pipefail
          claimed_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          export CLAIMED_AT="$claimed_at" APPLY_PLAN_ID APPLY_PLAN_DIGEST \
            APPLY_CONTEXT_DIGEST
          python3 - <<'PY'
          import json
          import os

          claim = {
              "schema_version": "fdai.deployment-apply-claim.v1",
              "plan_id": os.environ["APPLY_PLAN_ID"],
              "plan_digest": os.environ["APPLY_PLAN_DIGEST"],
              "context_digest": os.environ["APPLY_CONTEXT_DIGEST"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "claimed_at": os.environ["CLAIMED_AT"],
          }
          with open("apply-claim.json", "w", encoding="utf-8") as stream:
              json.dump(claim, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          PY
          az storage blob upload \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans \
            --name "${TF_VAR_env}/${APPLY_PLAN_ID}/apply-claim.json" \
            --file apply-claim.json --auth-mode login --overwrite false \
            --only-show-errors --content-type application/json --output none

      - name: Verify existing exact apply claim
        if: ${{ inputs.apply && inputs.resume_verification }}
        env:
          APPLY_PLAN_ID: ${{ inputs.plan_id }}
          APPLY_PLAN_DIGEST: ${{ inputs.plan_digest }}
          APPLY_CONTEXT_DIGEST: ${{ inputs.context_digest }}
        run: |
          set -euo pipefail
          blob_prefix="${TF_VAR_env}/${APPLY_PLAN_ID}"
          receipt_exists="$(az storage blob exists \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans \
            --name "${blob_prefix}/apply-receipt.json" \
            --auth-mode login --only-show-errors --query exists -o tsv)"
          if [[ "$receipt_exists" == "true" ]]; then
            echo "apply receipt already exists; verification resume is not allowed." >&2
            exit 1
          fi
          az storage blob download \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans \
            --name "${blob_prefix}/apply-claim.json" --file apply-claim.json \
            --auth-mode login --overwrite --only-show-errors --output none
          export APPLY_PLAN_ID APPLY_PLAN_DIGEST APPLY_CONTEXT_DIGEST
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime

          with open("apply-claim.json", encoding="utf-8") as stream:
              claim = json.load(stream)
          expected_fields = {
              "schema_version",
              "plan_id",
              "plan_digest",
              "context_digest",
              "workflow_run_id",
              "workflow_run_attempt",
              "claimed_at",
          }
          if not isinstance(claim, dict) or set(claim) != expected_fields:
              raise SystemExit("existing apply claim schema is invalid")
          expected = {
              "schema_version": "fdai.deployment-apply-claim.v1",
              "plan_id": os.environ["APPLY_PLAN_ID"],
              "plan_digest": os.environ["APPLY_PLAN_DIGEST"],
              "context_digest": os.environ["APPLY_CONTEXT_DIGEST"],
          }
          if any(claim.get(key) != value for key, value in expected.items()):
              raise SystemExit("existing apply claim does not match the exact plan")
          try:
              datetime.fromisoformat(str(claim["claimed_at"]).replace("Z", "+00:00"))
          except ValueError as exc:
              raise SystemExit("existing apply claim timestamp is invalid") from exc
          if not all(str(claim[key]).isdigit() for key in ("workflow_run_id", "workflow_run_attempt")):
              raise SystemExit("existing apply claim workflow identity is invalid")
          PY

      - name: Publish sanitized apply claim
        if: ${{ inputs.apply && !inputs.resume_verification }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deployment-apply-claim-${{ inputs.plan_id }}
          path: infra/apply-claim.json
          if-no-files-found: error
          retention-days: 1

      - name: Terraform apply
        if: ${{ inputs.apply && !inputs.resume_verification }}
        run: |
          if [[ "${{ inputs.verify_executor_effect }}" == "true" ]]; then
            echo "FDAI_AUTHORITY_TRANSITION_STARTED_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          fi
          terraform apply -input=false -lock-timeout=300s dev.plan

      - name: Verify Terraform convergence
        if: ${{ inputs.apply }}
        run: |
          set +e
          terraform plan -input=false -lock-timeout=300s -detailed-exitcode \
            -out=post-apply.plan
          plan_exit=$?
          set -e
          rm -f post-apply.plan
          if [ "$plan_exit" -eq 1 ]; then
            echo "post-apply Terraform convergence check failed." >&2
            exit 1
          fi
          if [ "$plan_exit" -eq 2 ]; then
            echo "post-apply Terraform state is not converged." >&2
            exit 1
          fi

      - name: Reconcile Foundry web-search agent
        if: ${{ inputs.apply && !inputs.deploy_design_mocks && vars.OPERATOR_API_WEB_SEARCH_ENABLED == 'true' }}
        env:
          WEB_SEARCH_ALLOWED_DOMAINS_JSON: "${{ vars.OPERATOR_API_WEB_SEARCH_ALLOWED_DOMAINS_JSON || '[]' }}"
        run: |
          set -euo pipefail
          project_endpoint="$(terraform output -raw foundry_web_search_project_endpoint)"
          agent_name="$(terraform output -raw foundry_web_search_agent_name)"
          model_deployment="$(terraform output -raw foundry_web_search_model_deployment)"
          args=(
            --project-endpoint "$project_endpoint"
            --agent-name "$agent_name"
            --model-deployment "$model_deployment"
          )
          while IFS= read -r domain; do
            args+=(--allowed-domain "$domain")
          done < <(python3 -c 'import json, os; values = json.loads(os.environ["WEB_SEARCH_ALLOWED_DOMAINS_JSON"]); assert isinstance(values, list) and all(isinstance(value, str) for value in values); print("\n".join(values))')
          PYTHONPATH=../src python3 -m fdai.delivery.azure.foundry_agent_reconciler "${args[@]}"

      - name: Prepare exact development operations gateway source
        if: ${{ inputs.apply && inputs.deploy_dev_operations_gateway }}
        env:
          APPLY_CONTEXT_DIGEST: ${{ inputs.context_digest }}
          APPLY_COMMIT_SHA: ${{ inputs.commit_sha }}
          APPLY_PLAN_ID: ${{ inputs.plan_id }}
          APPLY_PLAN_DIGEST: ${{ inputs.plan_digest }}
        run: |
          set -euo pipefail
          source_artifact="fdai-dev-operations-gateway.zip"
          python3 ../scripts/deployment/azure/verify-deployment-plan.py \
            --plan dev.plan --source-artifact "$source_artifact" \
            --metadata plan-metadata.json \
            --preflight-evidence plan-preflight-evidence.json \
            --azure-preflight-evidence plan-azure-preflight-evidence.json \
            --plan-id "$APPLY_PLAN_ID" --plan-digest "$APPLY_PLAN_DIGEST" \
            --context-digest "$APPLY_CONTEXT_DIGEST" --commit-sha "$APPLY_COMMIT_SHA"

          rg="$(terraform output -raw resource_group_name)"
          app="$(terraform output -raw dev_operations_gateway_app_name)"
          if [ -z "$rg" ] || [ -z "$app" ]; then
            echo "gateway deployment outputs are empty after apply." >&2
            exit 1
          fi
          resource_id="$(az functionapp show --resource-group "$rg" --name "$app" --query id -o tsv)"
          az functionapp config appsettings delete \
            --resource-group "$rg" --name "$app" \
            --setting-names AzureWebJobsStorage DEPLOYMENT_STORAGE_CONNECTION_STRING \
            --only-show-errors --output none
          az functionapp restart --resource-group "$rg" --name "$app" --only-show-errors
          echo "GATEWAY_FUNCTION_APP=$app" >> "$GITHUB_ENV"
          echo "GATEWAY_FUNCTION_RESOURCE_ID=$resource_id" >> "$GITHUB_ENV"
          echo "GATEWAY_DEPLOYMENT_STARTED_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Publish exact development operations gateway source
        if: ${{ inputs.apply && inputs.deploy_dev_operations_gateway }}
        uses: Azure/functions-action@v1.5.6
        with:
          app-name: ${{ env.GATEWAY_FUNCTION_APP }}
          package: infra/fdai-dev-operations-gateway.zip
          remote-build: true

      - name: Verify exact development operations gateway source
        if: ${{ inputs.apply && inputs.deploy_dev_operations_gateway }}
        run: |
          set -euo pipefail
          resource_id="$GATEWAY_FUNCTION_RESOURCE_ID"
          started_epoch="$GATEWAY_DEPLOYMENT_STARTED_EPOCH"

          source_deployed=false
          for _ in $(seq 1 30); do
            deployments="$(az rest --method get \
              --uri "https://management.azure.com${resource_id}/deployments?api-version=2024-04-01" \
              -o json 2>/dev/null || true)"
            if DEPLOYMENTS="$deployments" STARTED_EPOCH="$started_epoch" python3 -c \
              'import json, os, re; from datetime import datetime; payload, _ = json.JSONDecoder().raw_decode(os.environ["DEPLOYMENTS"].lstrip()); values = payload.get("value", []); latest = max(values, key=lambda item: item.get("properties", {}).get("received_time", "")); deployment = latest["properties"]; received_text = re.sub(r"(\.\d{6})\d+", r"\1", str(deployment["received_time"]).replace("Z", "+00:00")); received = datetime.fromisoformat(received_text).timestamp(); status = deployment.get("status"); sync_only = status == 6 and str(deployment.get("status_text", "")).startswith("Function triggers synchronization failed"); valid = received >= int(os.environ["STARTED_EPOCH"]) - 5 and deployment.get("complete") is True and deployment.get("remoteBuild") is True and (status == 4 or sync_only); raise SystemExit(0 if valid else 1)' \
              2>/dev/null; then
              source_deployed=true
              break
            fi
            sleep 10
          done
          if [ "$source_deployed" != "true" ]; then
            echo "gateway remote build did not produce a current completed source deployment." >&2
            exit 1
          fi

          triggers_registered=false
          for _ in $(seq 1 30); do
            functions="$(az rest --method get \
              --uri "https://management.azure.com${resource_id}/functions?api-version=2024-04-01" \
              --query 'value[].name' -o tsv 2>/dev/null || true)"
            if grep -q '/health$' <<<"$functions" && grep -q '/invoke$' <<<"$functions"; then
              triggers_registered=true
              break
            fi
            az rest --method post \
              --uri "https://management.azure.com${resource_id}/syncfunctiontriggers?api-version=2024-04-01" \
              --output none 2>/dev/null || true
            sleep 20
          done
          if [ "$triggers_registered" != "true" ]; then
            echo "gateway deployment completed without the required Function triggers." >&2
            exit 1
          fi

      - name: Synchronize console Entra redirect URI
        if: ${{ inputs.apply && inputs.deploy_console }}
        env:
          EXPECTED_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ENTRA_CONSOLE_SPA_CLIENT_ID: ${{ vars.ENTRA_CONSOLE_SPA_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_AZURE_TENANT_ID" ]]; then
            echo "AZURE_TENANT_ID is required when deploy_console=true." >&2
            exit 1
          fi
          if [[ -z "$ENTRA_CONSOLE_SPA_CLIENT_ID" ]]; then
            echo "ENTRA_CONSOLE_SPA_CLIENT_ID is required when deploy_console=true." >&2
            exit 1
          fi
          hostname="$(terraform output -raw console_default_hostname)"
          if [[ -z "$hostname" ]]; then
            static_site_id="$(terraform state show -no-color \
              'module.console[0].azurerm_static_web_app.console' 2>/dev/null \
              | sed -n 's/^ *id *= *"\(.*\)"/\1/p' | head -1)"
            if [[ -z "$static_site_id" ]]; then
              echo "console state resource is unavailable after console deployment." >&2
              exit 1
            fi
            hostname="$(az resource show --ids "$static_site_id" --api-version 2023-12-01 \
              --query properties.defaultHostname -o tsv)"
          fi
          if [[ -z "$hostname" ]]; then
            echo "console hostname is unavailable after console deployment." >&2
            exit 1
          fi
          python3 ../scripts/deployment/azure/sync-entra-spa-redirect.py \
            --tenant-id "$EXPECTED_AZURE_TENANT_ID" \
            --spa-client-id "$ENTRA_CONSOLE_SPA_CLIENT_ID" \
            --origin "https://$hostname"

      - name: Build allowlisted design-mocks artifact
        if: ${{ inputs.apply && inputs.deploy_design_mocks }}
        working-directory: ${{ github.workspace }}
        run: python3 scripts/deployment/azure/build_design_mocks_artifact.py tmp/design-mocks-dist

      - name: Read design-mocks deployment token
        if: ${{ inputs.apply && inputs.deploy_design_mocks }}
        id: design_mocks_token
        run: |
          set -euo pipefail
          resource_id="$(terraform output -raw design_mocks_static_web_app_id)"
          if [[ -z "$resource_id" ]]; then
            echo "design-mocks Static Web App id is unavailable after apply." >&2
            exit 1
          fi
          token="$(az rest --method post \
            --url "https://management.azure.com${resource_id}/listSecrets?api-version=2023-12-01" \
            --query properties.apiKey -o tsv)"
          if [[ -z "$token" ]]; then
            echo "design-mocks deployment token is unavailable." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish design-mocks static artifact
        if: ${{ inputs.apply && inputs.deploy_design_mocks }}
        working-directory: ${{ github.workspace }}
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ steps.design_mocks_token.outputs.token }}
        run: |
          npx --yes @azure/static-web-apps-cli@2.0.10 deploy \
            tmp/design-mocks-dist --env production

      - name: Verify design-mocks authentication boundary
        if: ${{ inputs.apply && inputs.deploy_design_mocks }}
        run: |
          set -euo pipefail
          hostname="$(terraform output -raw design_mocks_default_hostname)"
          if [[ -z "$hostname" ]]; then
            echo "design-mocks hostname is unavailable after deployment." >&2
            exit 1
          fi
          authenticated=false
          for _ in $(seq 1 12); do
            headers="$(mktemp)"
            status="$(curl --silent --show-error --dump-header "$headers" \
              --output /dev/null --connect-timeout 5 --max-time 10 \
              --write-out '%{http_code}' "https://$hostname/" || true)"
            if [[ "$status" == "302" ]] && grep -qi '^location:.*[.]auth/login/aad' "$headers"; then
              authenticated=true
              rm -f "$headers"
              break
            fi
            rm -f "$headers"
          done
          if [[ "$authenticated" != "true" ]]; then
            echo "design-mocks site did not enforce the Entra authentication redirect." >&2
            exit 1
          fi
          echo "Design mocks: https://$hostname" >> "$GITHUB_STEP_SUMMARY"

      - name: Run schema migration
        if: ${{ inputs.apply && (inputs.deploy_operator_api || inputs.deploy_document_ingestion) }}
        run: |
          set -euo pipefail
          rg="$(terraform output -raw resource_group_name)"
          jobs=()
          if [ "${{ inputs.deploy_operator_api }}" = "true" ]; then
            jobs+=("$(terraform output -raw operator_api_migrate_job_name)")
          fi
          if [ "${{ inputs.deploy_document_ingestion }}" = "true" ]; then
            jobs+=("$(terraform output -raw ingestion_migrate_job_name)")
          fi
          for job in "${jobs[@]}"; do
            [ -z "$job" ] && continue
            echo "starting migration job $job in $rg..."
            az containerapp job start --name "$job" --resource-group "$rg" >/dev/null
            completed=false
            for _ in $(seq 1 30); do
              exec_name="$(az containerapp job execution list --name "$job" --resource-group "$rg" \
                --query "sort_by([], &properties.startTime)[-1].name" -o tsv 2>/dev/null || true)"
              status="$(az containerapp job execution show --name "$job" --resource-group "$rg" \
                --job-execution-name "$exec_name" --query "properties.status" -o tsv 2>/dev/null || echo Running)"
              echo "$job migration status: $status"
              if [ "$status" = "Succeeded" ]; then completed=true; break; fi
              [ "$status" = "Failed" ] && { echo "$job migration failed"; exit 1; }
              sleep 12
            done
            [ "$completed" = "true" ] || { echo "$job migration did not complete in time"; exit 1; }
          done

      - name: Verify deployed health endpoints
        if: ${{ inputs.apply && !inputs.deploy_design_mocks }}
        run: |
          set -euo pipefail
          rg="$(terraform output -raw resource_group_name)"
          apps=("$(terraform output -raw core_app_name)")
          targets=()
          if [ "${{ inputs.deploy_operator_api }}" = "true" ]; then
            apps+=("$(terraform output -raw operator_api_name)")
            targets+=("https://$(terraform output -raw operator_api_fqdn)/healthz")
          fi
          if [ "${{ inputs.deploy_isolated_executor }}" = "true" ]; then
            executor_app="$(terraform output -json isolated_executor_shadow | python3 -c \
              'import json, sys; print(json.load(sys.stdin)["app_name"])')"
            apps+=("$executor_app")
          fi
          if [ "${{ inputs.deploy_document_ingestion }}" = "true" ]; then
            apps+=("$(terraform output -raw ingestion_gateway_name)")
            targets+=("https://$(terraform output -raw ingestion_gateway_fqdn)/healthz")
            worker="$(terraform output -raw ingestion_worker_name)"
            [ -z "$worker" ] || apps+=("$worker")
          fi
          for app in "${apps[@]}"; do
            revision="$(az containerapp show --name "$app" --resource-group "$rg" \
              --query properties.latestRevisionName -o tsv)"
            ready=false
            for _ in $(seq 1 24); do
              state="$(az containerapp revision show --name "$app" --resource-group "$rg" \
                --revision "$revision" \
                --query '[properties.provisioningState, properties.healthState] | join(`:`, @)' \
                -o tsv 2>/dev/null || true)"
              echo "$app latest revision $revision state: $state"
              if [ "$state" = "Provisioned:Healthy" ]; then ready=true; break; fi
              sleep 5
            done
            [ "$ready" = "true" ] || { echo "$app latest revision is not healthy"; exit 1; }
          done
          for target in "${targets[@]}"; do
            payload="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 \
              --retry-all-errors --connect-timeout 5 --max-time 10 "$target")"
            printf '%s' "$payload" | python3 -c \
              'import json, sys; value=json.load(sys.stdin); assert value == {"status": "ok"}'
          done

      - name: Verify independent Executor effect and rollback
        if: ${{ inputs.apply && inputs.verify_executor_effect }}
        env:
          AUTHORITY_CUTOVER: ${{ inputs.cutover_isolated_executor_authority }}
        run: |
          set -euo pipefail
          rg="$(terraform output -raw resource_group_name)"
          core_app="$(terraform output -raw core_app_name)"
          executor_app="$(terraform output -json isolated_executor_shadow | python3 -c \
            'import json, sys; value=json.load(sys.stdin); print((value or {}).get("app_name", ""))')"
          nsg="$(az network nsg list --resource-group "$rg" --query '[0].name' -o tsv)"
          rule="fdai-sd08-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          transition_started="${FDAI_AUTHORITY_TRANSITION_STARTED_EPOCH:-$(date -u +%s)}"
          observed_started_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          transport="local"
          [[ "$AUTHORITY_CUTOVER" == "true" ]] && transport="isolated"
          cleanup_direct() {
            az network nsg rule delete --resource-group "$rg" --nsg-name "$nsg" \
              --name "$rule" --only-show-errors >/dev/null 2>&1 || true
          }
          trap cleanup_direct EXIT

          run_probe() {
            local operation="$1"
            local key="$2"
            az containerapp exec --name "$core_app" --resource-group "$rg" \
              --command "fdai-executor-authority-probe --transport $transport --operation $operation --resource-group $rg --nsg-name $nsg --rule-name $rule --idempotency-key $key"
          }
          json_line() {
            grep -E '\{.*"action_id".*\}' | tail -1 | sed 's/^[^{]*//'
          }
          wait_present() {
            for _ in $(seq 1 30); do
              access="$(az network nsg rule show --resource-group "$rg" --nsg-name "$nsg" \
                --name "$rule" --query access -o tsv 2>/dev/null || true)"
              [[ "$access" == "Deny" ]] && return 0
              sleep 2
            done
            return 1
          }
          wait_absent() {
            for _ in $(seq 1 30); do
              if ! az network nsg rule show --resource-group "$rg" --nsg-name "$nsg" \
                --name "$rule" --only-show-errors >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          receipt_offsets() {
            local command_id="$1"
            az containerapp logs show --name "$executor_app" --resource-group "$rg" \
              --type console --tail 300 --format json 2>/dev/null \
              | sed 's/\\"/"/g' \
              | grep -F "$command_id" \
              | grep -F 'isolated_executor_receipt_published' \
              | sed -n 's/.*"command_offset":\([0-9][0-9]*\).*/\1/p' \
              | sort -n -u
          }

          upsert_key="sd08-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-upsert"
          upsert_output="$(run_probe upsert "$upsert_key")"
          upsert_json="$(printf '%s\n' "$upsert_output" | json_line | tail -1)"
          [[ -n "$upsert_json" ]] || { echo "authority probe returned no receipt" >&2; exit 1; }
          wait_present || { echo "independent ARM observer did not see the probe rule" >&2; exit 1; }

          duplicate_output="$(run_probe upsert "$upsert_key")"
          duplicate_json="$(printf '%s\n' "$duplicate_output" | json_line | tail -1)"
          [[ -n "$duplicate_json" ]] || { echo "duplicate authority probe returned no receipt" >&2; exit 1; }

          command_id=""
          offsets=""
          if [[ "$transport" == "isolated" ]]; then
            command_id="$(printf '%s' "$upsert_json" | python3 -c \
              'import json, sys; print(json.load(sys.stdin)["command_id"])')"
            for _ in $(seq 1 30); do
              offsets="$(receipt_offsets "$command_id")"
              [[ "$(printf '%s\n' "$offsets" | sed '/^$/d' | wc -l)" -ge 2 ]] && break
              sleep 2
            done
            mapfile -t offset_rows < <(printf '%s\n' "$offsets" | sed '/^$/d')
            [[ "${#offset_rows[@]}" -ge 2 ]] || {
              echo "terminal isolated Executor receipts were not observed" >&2
              exit 1
            }
            [[ "${offset_rows[1]}" -gt "${offset_rows[0]}" ]] || {
              echo "Executor command offsets did not advance" >&2
              exit 1
            }
          else
            outcome="$(printf '%s' "$upsert_json" | python3 -c \
              'import json, sys; print(json.load(sys.stdin)["outcome"])')"
            [[ "$outcome" == "dispatched" || "$outcome" == "already_applied" ]] || {
              echo "in-process rollback topology did not execute the probe" >&2
              exit 1
            }
          fi

          rule_id="$(az network nsg show --resource-group "$rg" --name "$nsg" --query id -o tsv)/securityRules/$rule"
          write_count=""
          for _ in $(seq 1 30); do
            write_count="$(az monitor activity-log list --resource-id "$rule_id" \
              --start-time "$observed_started_at" --offset 1h --status Succeeded \
              --query "[?operationName.value=='Microsoft.Network/networkSecurityGroups/securityRules/write'] | length(@)" \
              -o tsv 2>/dev/null || true)"
            [[ "$write_count" == "1" ]] && break
            sleep 5
          done
          [[ "$write_count" == "1" ]] || {
            echo "duplicate probe produced an unexpected successful write count: ${write_count:-unknown}" >&2
            exit 1
          }

          delete_key="sd08-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-delete"
          delete_output="$(run_probe delete "$delete_key")"
          delete_json="$(printf '%s\n' "$delete_output" | json_line | tail -1)"
          [[ -n "$delete_json" ]] || { echo "cleanup probe returned no receipt" >&2; exit 1; }
          wait_absent || { echo "independent ARM observer still sees the probe rule" >&2; exit 1; }
          trap - EXIT

          transition_completed="$(date -u +%s)"
          elapsed="$((transition_completed - transition_started))"
          [[ "$elapsed" -lt 900 ]] || {
            echo "authority topology transition exceeded the 900-second rollback budget" >&2
            exit 1
          }
          export AUTHORITY_CUTOVER="$AUTHORITY_CUTOVER" COMMAND_ID="$command_id" ELAPSED="$elapsed"
          export OBSERVED_STARTED_AT="$observed_started_at" TRANSPORT="$transport" WRITE_COUNT="$write_count"
          export OFFSETS_JSON="$(printf '%s\n' "$offsets" | sed '/^$/d' | python3 -c \
            'import json, sys; print(json.dumps([int(line) for line in sys.stdin if line.strip()]))')"
          python3 - <<'PY'
          import json
          import os

          receipt = {
              "schema_version": "fdai.executor-authority-effect-receipt.v1",
              "authority_cutover": os.environ["AUTHORITY_CUTOVER"] == "true",
              "command_id": os.environ["COMMAND_ID"] or None,
              "command_offsets": json.loads(os.environ["OFFSETS_JSON"]),
              "duplicate_effect_count": int(os.environ["WRITE_COUNT"]),
              "effect_observer": "azure-resource-manager",
              "effect_verified": True,
              "elapsed_seconds": int(os.environ["ELAPSED"]),
              "max_elapsed_seconds": 900,
              "observed_started_at": os.environ["OBSERVED_STARTED_AT"],
              "rollback_verified": True,
              "transport": os.environ["TRANSPORT"],
          }
          with open("authority-effect-receipt.json", "w", encoding="utf-8") as stream:
              json.dump(receipt, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          PY
          az storage blob upload --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans \
            --name "${TF_VAR_env}/${{ inputs.plan_id }}/authority-effect-receipt.json" \
            --file authority-effect-receipt.json --auth-mode login --overwrite false \
            --only-show-errors --content-type application/json --output none
          echo "Executor authority effect verified in ${elapsed}s via ${transport}." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Executor authority effect receipt
        if: ${{ inputs.apply && inputs.verify_executor_effect && success() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: executor-authority-effect-receipt-${{ inputs.plan_id }}
          path: infra/authority-effect-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Run canary publisher smoke
        if: ${{ inputs.apply && !inputs.deploy_design_mocks }}
        run: |
          set -euo pipefail
          rg="$(terraform output -raw resource_group_name)"
          job="$(terraform output -raw canary_job_name)"
          if [ -z "$job" ]; then
            echo "canary job is disabled; deployment verification cannot continue" >&2
            exit 1
          fi
          az containerapp job start --name "$job" --resource-group "$rg" >/dev/null
          completed=false
          for _ in $(seq 1 20); do
            exec_name="$(az containerapp job execution list --name "$job" --resource-group "$rg" \
              --query "sort_by([], &properties.startTime)[-1].name" -o tsv 2>/dev/null || true)"
            status="$(az containerapp job execution show --name "$job" --resource-group "$rg" \
              --job-execution-name "$exec_name" --query "properties.status" -o tsv 2>/dev/null || echo Running)"
            echo "$job canary publisher status: $status"
            if [ "$status" = "Succeeded" ]; then completed=true; break; fi
            [ "$status" = "Failed" ] && { echo "$job canary publisher failed"; exit 1; }
            sleep 6
          done
          [ "$completed" = "true" ] || { echo "$job canary publisher did not complete in time"; exit 1; }

      - name: Record exact plan apply receipt
        if: ${{ inputs.apply && success() }}
        env:
          APPLY_PLAN_ID: ${{ inputs.plan_id }}
          APPLY_PLAN_DIGEST: ${{ inputs.plan_digest }}
        run: |
          set -euo pipefail
          applied_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          export APPLIED_AT="$applied_at" APPLY_PLAN_ID APPLY_PLAN_DIGEST
          python3 - <<'PY'
          import json
          import os

          receipt = {
              "schema_version": "fdai.deployment-apply-receipt.v1",
              "plan_id": os.environ["APPLY_PLAN_ID"],
              "plan_digest": os.environ["APPLY_PLAN_DIGEST"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "applied_at": os.environ["APPLIED_AT"],
              "status": "applied",
          }
          with open("apply-receipt.json", "w", encoding="utf-8") as stream:
              json.dump(receipt, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          PY
          az storage blob upload \
            --account-name "${{ vars.STATE_STORAGE_ACCOUNT }}" \
            --container-name deployment-plans \
            --name "${TF_VAR_env}/${APPLY_PLAN_ID}/apply-receipt.json" \
            --file apply-receipt.json --auth-mode login --overwrite false \
            --only-show-errors --content-type application/json --output none
          echo "Applied protected plan: \`$APPLY_PLAN_ID\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized apply receipt
        if: ${{ inputs.apply && success() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deployment-apply-receipt-${{ inputs.plan_id }}
          path: infra/apply-receipt.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish console API endpoints
        if: ${{ inputs.apply && inputs.deploy_console }}
        run: |
          operator_api="$(terraform output -raw operator_api_fqdn)"
          ingestion="$(terraform output -raw ingestion_gateway_fqdn)"
          {
            echo "VITE_OPERATOR_API_BASE_URL=${operator_api:+https://$operator_api}"
            echo "VITE_INGESTION_API_BASE_URL=${ingestion:+https://$ingestion}"
          } >> "$GITHUB_STEP_SUMMARY"
