name: devbox-rename

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact protected origin/main commit containing this maintenance workflow."
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: devbox-maintenance
  cancel-in-progress: false

jobs:
  rename:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.DEVBOX_RUNNER_LABEL != '' &&
      vars.DEVBOX_RUNNER_NAME != ''
    runs-on:
      - self-hosted
      - ${{ vars.DEVBOX_RUNNER_LABEL }}
    timeout-minutes: 10
    steps:
      - name: Verify protected workflow source
        working-directory: ${{ runner.temp }}
        env:
          TARGET_COMMIT_SHA: ${{ inputs.commit_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PROTECTED_ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}.git
          PROTECTED_WORKFLOW_PATH: .github/workflows/devbox-rename.yml
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          guard_repo="$RUNNER_TEMP/fdai-devbox-rename-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.git"
          rm -rf -- "$guard_repo"
          git init --bare "$guard_repo" >/dev/null
          trap 'rm -rf -- "$guard_repo"' EXIT
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
            git -C "$guard_repo" fetch --force --no-tags \
              "$PROTECTED_ORIGIN_URL" \
              "+refs/heads/main:refs/remotes/origin/main" "$TARGET_COMMIT_SHA"
          unset auth_header
          git -C "$guard_repo" merge-base --is-ancestor "$TARGET_COMMIT_SHA" \
            refs/remotes/origin/main
          diff --brief \
            <(git -C "$guard_repo" show "$TARGET_COMMIT_SHA:$PROTECTED_WORKFLOW_PATH") \
            <(git -C "$guard_repo" show "refs/remotes/origin/main:$PROTECTED_WORKFLOW_PATH")

      - name: Schedule supported interactive-runner rename
        env:
          REMOVE_TOKEN: ${{ secrets.DEVBOX_RUNNER_REMOVE_TOKEN }}
          REGISTRATION_TOKEN: ${{ secrets.DEVBOX_RUNNER_REGISTRATION_TOKEN }}
          TARGET_RUNNER_NAME: ${{ vars.DEVBOX_RUNNER_NAME }}
          TARGET_RUNNER_LABEL: ${{ vars.DEVBOX_RUNNER_LABEL }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          ORIGINAL_RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          runner_root="$(dirname "$(dirname "$RUNNER_WORKSPACE")")"
          remove_token_available=false
          registration_token_available=false
          config_available=false
          root_writable=false
          service_mode=false
          [[ -n "$REMOVE_TOKEN" ]] && remove_token_available=true
          [[ -n "$REGISTRATION_TOKEN" ]] && registration_token_available=true
          [[ -x "$runner_root/config.sh" ]] && config_available=true
          [[ -w "$runner_root" ]] && root_writable=true
          [[ -f "$runner_root/.service" ]] && service_mode=true
          {
            printf 'Removal credential available: `%s`\n' "$remove_token_available"
            printf 'Registration credential available: `%s`\n' \
              "$registration_token_available"
            printf 'Runner configuration available: `%s`\n' "$config_available"
            printf 'Runner root writable: `%s`\n' "$root_writable"
            printf 'Service mode: `%s`\n' "$service_mode"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$remove_token_available" == true ]]
          [[ "$registration_token_available" == true ]]
          [[ "$config_available" == true ]]
          [[ "$root_writable" == true ]]
          if [[ "$service_mode" == true ]]; then
            echo "Service-mode runner rename requires a direct host authentication handoff." >&2
            exit 1
          fi
          [[ -n "$TARGET_RUNNER_NAME" ]]
          [[ -n "$TARGET_RUNNER_LABEL" ]]
          export FDAI_RUNNER_ROOT="$runner_root"
          export FDAI_REPOSITORY_URL="$REPOSITORY_URL"
          export FDAI_ORIGINAL_RUNNER_NAME="$ORIGINAL_RUNNER_NAME"
          export FDAI_TARGET_RUNNER_NAME="$TARGET_RUNNER_NAME"
          export FDAI_TARGET_RUNNER_LABEL="$TARGET_RUNNER_LABEL"
          env -u RUNNER_TRACKING_ID nohup setsid bash -c '
            set -euo pipefail
            cd "$FDAI_RUNNER_ROOT"
            start_runner() {
              env -i HOME="$HOME" USER="$USER" \
                PATH="/usr/local/bin:/usr/bin:/bin" \
                nohup ./run.sh >> _diag/fdai-devbox-runner.log 2>&1 < /dev/null &
            }
            rollback() {
              status=$?
              if [[ ! -f .runner ]]; then
                ./config.sh --unattended --url "$FDAI_REPOSITORY_URL" \
                  --token "$REGISTRATION_TOKEN" \
                  --name "$FDAI_ORIGINAL_RUNNER_NAME" \
                  --labels "WSL,$FDAI_TARGET_RUNNER_LABEL" --work _work --replace
              fi
              unset REMOVE_TOKEN REGISTRATION_TOKEN
              start_runner
              exit "$status"
            }
            trap rollback ERR
            for _ in {1..120}; do
              if ! pgrep -f "^$FDAI_RUNNER_ROOT/bin/Runner.Worker" >/dev/null; then
                break
              fi
              sleep 1
            done
            ! pgrep -f "^$FDAI_RUNNER_ROOT/bin/Runner.Worker" >/dev/null
            listener_pid="$(pgrep -f "^$FDAI_RUNNER_ROOT/bin/Runner.Listener run" | head -n 1)"
            [[ -n "$listener_pid" ]]
            kill -TERM "$listener_pid"
            for _ in {1..30}; do
              if ! kill -0 "$listener_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            ! kill -0 "$listener_pid" 2>/dev/null
            ./config.sh remove --token "$REMOVE_TOKEN"
            ./config.sh --unattended --url "$FDAI_REPOSITORY_URL" \
              --token "$REGISTRATION_TOKEN" --name "$FDAI_TARGET_RUNNER_NAME" \
              --labels "WSL,$FDAI_TARGET_RUNNER_LABEL" --work _work --replace
            trap - ERR
            unset REMOVE_TOKEN REGISTRATION_TOKEN
            start_runner
          ' > "$runner_root/_diag/fdai-devbox-rename.log" 2>&1 < /dev/null &
          printf 'Runner rename scheduled after this job exits.\n' >> "$GITHUB_STEP_SUMMARY"
