name: service-deploy

# Plans or applies exactly one independently owned service root. Shared platform
# resources remain owned by deploy-dev.yml and are never present in this plan.
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Independent runtime service to deploy."
        type: choice
        options:
          - core-control-plane
          - operator-service
          - document-ingestion-api
          - document-processing-worker
          - isolated-executor
        required: true
      environment:
        description: "Target deployment environment."
        type: choice
        options: [dev, staging, prod]
        default: dev
        required: true
      commit_sha:
        description: "Exact lowercase 40-character commit to plan or apply."
        type: string
        required: true
      image_ref:
        description: "Selected service GHCR image pinned by sha256 digest."
        type: string
        required: true
      apply:
        description: "Explicitly apply a previously protected plan. Defaults to plan-only."
        type: boolean
        default: false
      migrate_state:
        description: "Explicitly move this service from legacy state with verified backups."
        type: boolean
        default: false
      initial_cutover:
        description: "Explicit one-time transition from the legacy runtime contract."
        type: boolean
        default: false
      plan_run_id:
        description: "Plan workflow run id. Required only for apply."
        type: string
        required: false
      plan_run_attempt:
        description: "Exact plan workflow run attempt. Required only for apply."
        type: string
        required: false
      plan_digest:
        description: "Binary Terraform plan SHA-256. Required only for apply."
        type: string
        required: false
      context_digest:
        description: "Sealed service deployment context SHA-256. Required only for apply."
        type: string
        required: false

permissions:
  actions: read
  attestations: read
  contents: read
  packages: read

concurrency:
  group: service-deploy-${{ inputs.service }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  protected-service-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, fdai-deploy]
    environment: ${{ inputs.migrate_state && format('service-state-migration-{0}', inputs.environment) || inputs.initial_cutover && format('service-initial-cutover-{0}', inputs.environment) || inputs.apply && format('service-apply-{0}', inputs.environment) || 'plan-only' }}
    env:
      ARM_USE_AZUREAD: "true"
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      STATE_RESOURCE_GROUP: ${{ vars.STATE_RESOURCE_GROUP }}
      STATE_STORAGE_ACCOUNT: ${{ vars.STATE_STORAGE_ACCOUNT }}
      STATE_CONTAINER: ${{ vars.STATE_CONTAINER || 'tfstate' }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Verify protected workflow source
        working-directory: ${{ runner.temp }}
        env:
          TARGET_COMMIT_SHA: ${{ inputs.commit_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PROTECTED_ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit_sha must be a lowercase 40-character git SHA." >&2
            exit 1
          }
          guard_repo="$RUNNER_TEMP/fdai-protected-origin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.git"
          rm -rf -- "$guard_repo"
          git init --bare "$guard_repo" >/dev/null
          trap 'rm -rf -- "$guard_repo"' EXIT
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
            git -C "$guard_repo" fetch --force --no-tags \
              "$PROTECTED_ORIGIN_URL" \
              "+refs/heads/main:refs/remotes/origin/main" "$TARGET_COMMIT_SHA"
          unset auth_header
          git -C "$guard_repo" merge-base --is-ancestor "$TARGET_COMMIT_SHA" \
            refs/remotes/origin/main || {
            echo "commit_sha must be an ancestor of protected origin/main." >&2
            exit 1
          }

      - name: Checkout protected deployment controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          clean: true
          path: trusted-controls

      - name: Verify protected ancestry and explicit apply inputs
        env:
          APPLY: ${{ inputs.apply }}
          MIGRATE_STATE: ${{ inputs.migrate_state }}
          INITIAL_CUTOVER: ${{ inputs.initial_cutover }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_RUN_ATTEMPT: ${{ inputs.plan_run_attempt }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          CONTEXT_DIGEST: ${{ inputs.context_digest }}
        run: |
          set -euo pipefail
          TRUSTED_CONTROLS="$GITHUB_WORKSPACE/trusted-controls"
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit_sha must be a lowercase 40-character git SHA." >&2
            exit 1
          }
          git -C "$TRUSTED_CONTROLS" fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          git -C "$TRUSTED_CONTROLS" fetch --no-tags origin "$COMMIT_SHA"
          git -C "$TRUSTED_CONTROLS" merge-base --is-ancestor \
            "$COMMIT_SHA" refs/remotes/origin/main || {
            echo "commit_sha must be an ancestor of protected origin/main." >&2
            exit 1
          }
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/service-deploy.yml@refs/heads/main"
          [[ "$GITHUB_WORKFLOW_REF" == "$expected_workflow_ref" ]] || {
            echo "service-deploy must run from protected main." >&2
            exit 1
          }
          controls_commit_sha="$(git -C "$TRUSTED_CONTROLS" rev-parse HEAD)"
          [[ "$controls_commit_sha" == "$(git -C "$TRUSTED_CONTROLS" rev-parse refs/remotes/origin/main)" ]] || {
            echo "deployment controls do not match protected origin/main." >&2
            exit 1
          }
          {
            echo "TRUSTED_CONTROLS=$TRUSTED_CONTROLS"
            echo "CONTROLS_COMMIT_SHA=$controls_commit_sha"
          } >> "$GITHUB_ENV"
          if [[ "$APPLY" == "true" && "$MIGRATE_STATE" == "true" ]]; then
            echo "apply and migrate_state are mutually exclusive." >&2
            exit 1
          fi
          if [[ "$MIGRATE_STATE" == "true" && "$INITIAL_CUTOVER" == "true" ]]; then
            echo "migrate_state and initial_cutover are mutually exclusive." >&2
            exit 1
          fi
          if [[ "$APPLY" == "true" ]]; then
            [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]] || {
              echo "apply requires a numeric plan_run_id." >&2
              exit 1
            }
            [[ "$PLAN_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
              echo "apply requires a positive plan_run_attempt." >&2
              exit 1
            }
            [[ "$PLAN_DIGEST" =~ ^[0-9a-f]{64}$ ]] || {
              echo "apply requires a lowercase SHA-256 plan_digest." >&2
              exit 1
            }
            [[ "$CONTEXT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || {
              echo "apply requires a lowercase SHA-256 context_digest." >&2
              exit 1
            }
          elif [[ -n "$PLAN_RUN_ID$PLAN_RUN_ATTEMPT$PLAN_DIGEST$CONTEXT_DIGEST" ]]; then
            echo "plan-only requests must not supply apply artifact inputs." >&2
            exit 1
          fi

      - name: Resolve closed service contract
        id: contract
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          python3 "$TRUSTED_CONTROLS/scripts/deployment/service/service_contract.py" \
            --service "${{ inputs.service }}" \
            --environment "${{ inputs.environment }}" \
            --repository "$GITHUB_REPOSITORY" \
            --image "$IMAGE_REF" \
            --github-output "$GITHUB_OUTPUT"

      - name: Bind target Terraform root
        run: |
          echo "TERRAFORM_ROOT=$TRUSTED_CONTROLS/${{ steps.contract.outputs.terraform_root }}" >> "$GITHUB_ENV"

      - name: Install pinned GitHub CLI
        env:
          GH_CLI_VERSION: "2.94.0"
          GH_CLI_ARCHIVE_SHA256: "a757f1ba6db18f4de8cbadb244843a5f89bc75b5e7c6fc127d2bd77fbd12ed62"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh-cli.tar.gz"
          install_root="$RUNNER_TEMP/gh-cli"
          rm -rf -- "$install_root"
          mkdir -m 700 "$install_root"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 5 --max-time 60 \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${GH_CLI_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_root" --strip-components=1
          rm -f -- "$archive"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          "$install_root/bin/gh" --version

      - name: Install pinned uv for service migrations
        if: ${{ inputs.apply }}
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.32"
          enable-cache: false

      - name: Verify immutable service image attestation
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ inputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.contract.outputs.image_digest }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          ATTESTATION_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/container-supply-chain.yml
          MODEL_PREDICATE_TYPE: https://github.com/${{ github.repository }}/attestations/resolved-models/v1
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          image_path="${IMAGE_REF#ghcr.io/}"
          image_path="${image_path%@sha256:*}"
          registry_token="$(
            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              --retry-all-errors --connect-timeout 5 --max-time 30 \
              --user "$GITHUB_ACTOR:$GHCR_TOKEN" \
              "https://ghcr.io/token?scope=repository:${image_path}:pull" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])'
          )"
          commit_digest="$(
            curl --fail --silent --show-error --head --retry 3 --retry-delay 2 \
              --retry-all-errors --connect-timeout 5 --max-time 30 \
              -H "Authorization: Bearer $registry_token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${image_path}/manifests/sha-${COMMIT_SHA}" \
              | tr -d '\r' \
              | awk -F': ' 'tolower($1) == "docker-content-digest" {print $2}'
          )"
          [[ "$commit_digest" == "$IMAGE_DIGEST" ]] || {
            echo "service image digest does not match the exact commit build." >&2
            exit 1
          }
          timeout 60s gh attestation verify \
            "oci://${IMAGE_REF}" \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$COMMIT_SHA" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --signer-workflow "$ATTESTATION_SIGNER_WORKFLOW" >/dev/null
          timeout 60s gh attestation verify \
            "oci://${IMAGE_REF}" \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$COMMIT_SHA" \
            --predicate-type "https://spdx.dev/Document/v2.3" \
            --signer-workflow "$ATTESTATION_SIGNER_WORKFLOW" >/dev/null
          resolved_models_digest=""
          if [[ "$SERVICE" == "core-control-plane" ]]; then
            model_attestations="$RUNNER_TEMP/resolved-models-attestations.json"
            timeout 60s gh attestation verify \
              "oci://${IMAGE_REF}" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$COMMIT_SHA" \
              --predicate-type "$MODEL_PREDICATE_TYPE" \
              --signer-workflow "$ATTESTATION_SIGNER_WORKFLOW" \
              --format json >"$model_attestations"
            mapfile -t model_digests < <(
              jq -er \
                '.[].verificationResult.statement.predicate.resolved_models.canonical_json_sha256' \
                "$model_attestations" | sort -u
            )
            if [[ ${#model_digests[@]} -ne 1 || ! "${model_digests[0]}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Core image must have one canonical resolved-models digest." >&2
              exit 1
            fi
            resolved_models_digest="${model_digests[0]}"
          fi
          echo "RESOLVED_MODELS_DIGEST=$resolved_models_digest" >> "$GITHUB_ENV"

      - name: Authenticate runner managed identity
        run: |
          set -euo pipefail
          [[ -n "$ARM_SUBSCRIPTION_ID" && -n "$ARM_TENANT_ID" ]] || {
            echo "ARM_SUBSCRIPTION_ID and AZURE_TENANT_ID repository variables are required." >&2
            exit 1
          }
          azure_config="$RUNNER_TEMP/service-deploy-azure"
          rm -rf "$azure_config"
          mkdir -m 700 "$azure_config"
          echo "AZURE_CONFIG_DIR=$azure_config" >> "$GITHUB_ENV"
          export AZURE_CONFIG_DIR="$azure_config"
          az account clear >/dev/null 2>&1 || true
          az login --identity --allow-no-subscriptions --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          actual_subscription="$(az account show --query id --output tsv)"
          actual_tenant="$(az account show --query tenantId --output tsv)"
          [[ "$actual_subscription" == "$ARM_SUBSCRIPTION_ID" ]] || {
            echo "runner identity is authenticated to the wrong subscription." >&2
            exit 1
          }
          [[ "$actual_tenant" == "$ARM_TENANT_ID" ]] || {
            echo "runner identity is authenticated to the wrong tenant." >&2
            exit 1
          }

      - name: Validate isolated backend mapping
        env:
          BACKEND_KEY: ${{ steps.contract.outputs.backend_key }}
        run: |
          set -euo pipefail
          [[ -n "$STATE_RESOURCE_GROUP" && -n "$STATE_STORAGE_ACCOUNT" && -n "$STATE_CONTAINER" ]] || {
            echo "STATE_RESOURCE_GROUP, STATE_STORAGE_ACCOUNT, and STATE_CONTAINER are required." >&2
            exit 1
          }
          terraform -chdir="$TERRAFORM_ROOT" init \
            -input=false \
            -backend-config="resource_group_name=$STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=$BACKEND_KEY" \
            -backend-config="use_azuread_auth=true"
          terraform -chdir="$TERRAFORM_ROOT" validate

      - name: Verify service state cutover ownership
        if: ${{ !inputs.migrate_state }}
        env:
          SERVICE: ${{ inputs.service }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          cat >"$TRUSTED_CONTROLS/infra/service-state-backend.tf" <<'EOF'
          terraform {
            backend "azurerm" {}
          }
          EOF
          terraform -chdir="$TRUSTED_CONTROLS/infra" init \
            -input=false \
            -backend-config="resource_group_name=$STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=fdai-${ENVIRONMENT}.tfstate" \
            -backend-config="use_azuread_auth=true"
          terraform -chdir="$TRUSTED_CONTROLS/infra" state pull \
            >"$RUNNER_TEMP/legacy-service-state.json"
          terraform -chdir="$TERRAFORM_ROOT" state pull \
            >"$RUNNER_TEMP/independent-service-state.json"
          mapfile -t migration_coordinates < <(
            python3 "$TRUSTED_CONTROLS/scripts/deployment/service/state_migration.py" \
              coordinates \
              --service "$SERVICE" \
              --environment "$ENVIRONMENT"
          )
          [[ ${#migration_coordinates[@]} -eq 4 ]] || {
            echo "state migration coordinates are incomplete." >&2
            exit 1
          }
          python3 "$TRUSTED_CONTROLS/scripts/deployment/service/state_migration.py" verify \
            --source-state "$RUNNER_TEMP/legacy-service-state.json" \
            --destination-state "$RUNNER_TEMP/independent-service-state.json" \
            --source-address "${migration_coordinates[2]}" \
            --destination-address "${migration_coordinates[3]}" \
            --phase post

      - name: Migrate service state ownership
        if: ${{ inputs.migrate_state }}
        env:
          SERVICE: ${{ inputs.service }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          cat >"$TRUSTED_CONTROLS/infra/service-state-backend.tf" <<'EOF'
          terraform {
            backend "azurerm" {}
          }
          EOF
          terraform -chdir="$TRUSTED_CONTROLS/infra" init \
            -input=false \
            -backend-config="resource_group_name=$STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=fdai-${ENVIRONMENT}.tfstate" \
            -backend-config="use_azuread_auth=true"
          backup_dir="$RUNNER_TEMP/service-state-migration-${SERVICE}-${ENVIRONMENT}"
          bash "$TRUSTED_CONTROLS/scripts/deployment/service/migrate_state.sh" \
            "$SERVICE" \
            "$ENVIRONMENT" \
            "$TRUSTED_CONTROLS/infra" \
            "$TERRAFORM_ROOT" \
            "$backup_dir" \
            --execute

      - name: Verify migrated service state ownership
        if: ${{ inputs.migrate_state }}
        env:
          SERVICE: ${{ inputs.service }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          mapfile -t migration_coordinates < <(
            python3 "$TRUSTED_CONTROLS/scripts/deployment/service/state_migration.py" \
              coordinates --service "$SERVICE" --environment "$ENVIRONMENT"
          )
          terraform -chdir="$TRUSTED_CONTROLS/infra" state pull \
            >"$RUNNER_TEMP/legacy-service-state-after.json"
          terraform -chdir="$TERRAFORM_ROOT" state pull \
            >"$RUNNER_TEMP/independent-service-state-after.json"
          python3 "$TRUSTED_CONTROLS/scripts/deployment/service/state_migration.py" verify \
            --source-state "$RUNNER_TEMP/legacy-service-state-after.json" \
            --destination-state "$RUNNER_TEMP/independent-service-state-after.json" \
            --source-address "${migration_coordinates[2]}" \
            --destination-address "${migration_coordinates[3]}" \
            --phase post

      - name: Capture peer states before deployment
        if: ${{ !inputs.migrate_state }}
        run: |
          "$TRUSTED_CONTROLS/scripts/deployment/service/capture_peer_states.sh" \
            "${{ inputs.service }}" \
            "${{ inputs.environment }}" \
            "$TRUSTED_CONTROLS" \
            "$TRUSTED_CONTROLS/scripts/deployment/service" \
            before \
            "$RUNNER_TEMP/service-peer-state-before"

      - name: Materialize selected service inputs
        if: ${{ !inputs.apply && !inputs.migrate_state }}
        env:
          SERVICE_TFVARS_JSON: ${{ secrets.SERVICE_DEPLOY_TFVARS_JSON }}
        run: |
          set -euo pipefail
          [[ -n "$SERVICE_TFVARS_JSON" ]] || {
            echo "SERVICE_DEPLOY_TFVARS_JSON is required for planning." >&2
            exit 1
          }
          printf '%s' "$SERVICE_TFVARS_JSON" \
            | python3 "$TRUSTED_CONTROLS/scripts/deployment/service/materialize_tfvars.py" \
                --service "${{ inputs.service }}" \
                --environment "${{ inputs.environment }}" \
                --output "$RUNNER_TEMP/service.tfvars.json"

      - name: Create and guard service plan
        if: ${{ !inputs.apply && !inputs.migrate_state }}
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          INITIAL_CUTOVER: ${{ inputs.initial_cutover }}
        run: |
          set -euo pipefail
          terraform -chdir="$TERRAFORM_ROOT" plan \
            -input=false \
            -lock-timeout=5m \
            -out="$RUNNER_TEMP/service.plan" \
            -var-file="$RUNNER_TEMP/service.tfvars.json" \
            -var="image=$IMAGE_REF"
          terraform -chdir="$TERRAFORM_ROOT" show \
            -json "$RUNNER_TEMP/service.plan" > "$RUNNER_TEMP/service-plan.json"
          cutover_args=()
          [[ "$INITIAL_CUTOVER" == "true" ]] && cutover_args+=(--initial-cutover)
          python3 "$TRUSTED_CONTROLS/scripts/deployment/service/guard_plan.py" \
            --plan-json "$RUNNER_TEMP/service-plan.json" \
            --service "${{ inputs.service }}" \
            --environment "${{ inputs.environment }}" \
            --image-ref "$IMAGE_REF" \
            "${cutover_args[@]}"

      - name: Capture peer states after plan
        if: ${{ !inputs.apply && !inputs.migrate_state }}
        run: |
          "$TRUSTED_CONTROLS/scripts/deployment/service/capture_peer_states.sh" \
            "${{ inputs.service }}" \
            "${{ inputs.environment }}" \
            "$TRUSTED_CONTROLS" \
            "$TRUSTED_CONTROLS/scripts/deployment/service" \
            after \
            "$RUNNER_TEMP/service-peer-state-after"

      - name: Seal plan artifact and context
        if: ${{ !inputs.apply && !inputs.migrate_state }}
        id: seal
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          INITIAL_CUTOVER: ${{ inputs.initial_cutover }}
        run: |
          set -euo pipefail
          cutover_args=()
          [[ "$INITIAL_CUTOVER" == "true" ]] && cutover_args+=(--initial-cutover)
          python3 "$TRUSTED_CONTROLS/scripts/deployment/service/plan_bundle.py" create \
            --plan "$RUNNER_TEMP/service.plan" \
            --plan-json "$RUNNER_TEMP/service-plan.json" \
            --context "$RUNNER_TEMP/service-context.json" \
            --metadata "$RUNNER_TEMP/service-plan-metadata.json" \
            --service "${{ inputs.service }}" \
            --environment "${{ inputs.environment }}" \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --image-ref "$IMAGE_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --tenant-id "$ARM_TENANT_ID" \
            --subscription-id "$ARM_SUBSCRIPTION_ID" \
            --backend-resource-group "$STATE_RESOURCE_GROUP" \
            --backend-storage-account "$STATE_STORAGE_ACCOUNT" \
            --backend-container "$STATE_CONTAINER" \
            --controls-commit-sha "$CONTROLS_COMMIT_SHA" \
            --resolved-models-digest "$RESOLVED_MODELS_DIGEST" \
            --attestation-signer-workflow "$GITHUB_REPOSITORY/.github/workflows/container-supply-chain.yml" \
            "${cutover_args[@]}" >/dev/null
          python3 - "$RUNNER_TEMP/service-plan-metadata.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          metadata = json.load(open(sys.argv[1], encoding="utf-8"))
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"plan_digest={metadata['plan_digest']}\n")
              output.write(f"context_digest={metadata['context_digest']}\n")
          PY

      - name: Upload protected service plan
        if: ${{ !inputs.apply && !inputs.migrate_state }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: service-plan-${{ inputs.service }}-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/service.plan
            ${{ runner.temp }}/service-plan.json
            ${{ runner.temp }}/service-context.json
            ${{ runner.temp }}/service-plan-metadata.json
          if-no-files-found: error
          retention-days: 1

      - name: Report protected plan coordinates
        if: ${{ !inputs.apply && !inputs.migrate_state }}
        run: |
          {
            echo "### Protected service plan"
            echo "- Service: \`${{ inputs.service }}\`"
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Deployment mode: \`${{ inputs.initial_cutover && 'initial-cutover' || 'standard' }}\`"
            echo "- Commit: \`${{ inputs.commit_sha }}\`"
            echo "- Plan run id: \`$GITHUB_RUN_ID\`"
            echo "- Plan run attempt: \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Plan digest: \`${{ steps.seal.outputs.plan_digest }}\`"
            echo "- Context digest: \`${{ steps.seal.outputs.context_digest }}\`"
            echo "- Backend key: \`${{ steps.contract.outputs.backend_key }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify source workflow run provenance
        if: ${{ inputs.apply }}
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_RUN_ATTEMPT: ${{ inputs.plan_run_attempt }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID")"
          jq -e \
            --argjson run_id "$PLAN_RUN_ID" \
            --argjson run_attempt "$PLAN_RUN_ATTEMPT" \
            '.id == $run_id and
             .run_attempt == $run_attempt and
             .conclusion == "success" and
             .event == "workflow_dispatch" and
             (.head_sha | test("^[0-9a-f]{40}$")) and
             .path == ".github/workflows/service-deploy.yml"' \
            <<<"$run_json" >/dev/null || {
            echo "source plan run provenance does not match exact apply inputs." >&2
            exit 1
          }
          source_head_sha="$(jq -er '.head_sha' <<<"$run_json")"
          git -C "$TRUSTED_CONTROLS" fetch --no-tags origin "$source_head_sha"
          git -C "$TRUSTED_CONTROLS" merge-base --is-ancestor \
            "$source_head_sha" "$CONTROLS_COMMIT_SHA" || {
            echo "source plan controls are not an ancestor of current protected main." >&2
            exit 1
          }
          git -C "$TRUSTED_CONTROLS" diff --quiet \
            "$source_head_sha" "$CONTROLS_COMMIT_SHA" -- \
            .github/workflows/service-deploy.yml scripts/deployment/service || {
            echo "source plan deployment controls differ from current protected main." >&2
            exit 1
          }
          echo "SOURCE_PLAN_HEAD_SHA=$source_head_sha" >> "$GITHUB_ENV"

      - name: Download exact protected service plan
        if: ${{ inputs.apply }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: service-plan-${{ inputs.service }}-${{ inputs.environment }}-${{ inputs.plan_run_id }}-${{ inputs.plan_run_attempt }}
          path: ${{ runner.temp }}/service-plan-bundle
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.plan_run_id }}

      - name: Verify plan controls checkout provenance
        if: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/service-plan-bundle/service-plan-metadata.json"
          plan_controls_commit_sha="$(jq -er '.controls_commit_sha' "$metadata")"
          [[ "$plan_controls_commit_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "plan metadata controls commit must be a lowercase git SHA." >&2
            exit 1
          }
          git -C "$TRUSTED_CONTROLS" fetch --no-tags origin "$plan_controls_commit_sha"
          git -C "$TRUSTED_CONTROLS" merge-base --is-ancestor \
            "$SOURCE_PLAN_HEAD_SHA" "$plan_controls_commit_sha" || {
            echo "plan controls checkout predates or diverges from the source workflow run." >&2
            exit 1
          }
          git -C "$TRUSTED_CONTROLS" merge-base --is-ancestor \
            "$plan_controls_commit_sha" "$CONTROLS_COMMIT_SHA" || {
            echo "plan controls checkout is not an ancestor of current protected main." >&2
            exit 1
          }
          git -C "$TRUSTED_CONTROLS" diff --quiet \
            "$plan_controls_commit_sha" "$CONTROLS_COMMIT_SHA" -- \
            .github/workflows/service-deploy.yml scripts/deployment/service || {
            echo "plan deployment controls differ from current protected main." >&2
            exit 1
          }
          echo "PLAN_CONTROLS_COMMIT_SHA=$plan_controls_commit_sha" >> "$GITHUB_ENV"

      - name: Verify exact plan bundle and action boundary
        if: ${{ inputs.apply }}
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          INITIAL_CUTOVER: ${{ inputs.initial_cutover }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/service-plan-bundle"
          cutover_args=()
          [[ "$INITIAL_CUTOVER" == "true" ]] && cutover_args+=(--initial-cutover)
          python3 "$TRUSTED_CONTROLS/scripts/deployment/service/plan_bundle.py" verify \
            --plan "$bundle/service.plan" \
            --plan-json "$bundle/service-plan.json" \
            --context "$bundle/service-context.json" \
            --metadata "$bundle/service-plan-metadata.json" \
            --service "${{ inputs.service }}" \
            --environment "${{ inputs.environment }}" \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --image-ref "$IMAGE_REF" \
            --plan-digest "${{ inputs.plan_digest }}" \
            --context-digest "${{ inputs.context_digest }}" \
            --plan-run-id "${{ inputs.plan_run_id }}" \
            --workflow-run-attempt "${{ inputs.plan_run_attempt }}" \
            --tenant-id "$ARM_TENANT_ID" \
            --subscription-id "$ARM_SUBSCRIPTION_ID" \
            --backend-resource-group "$STATE_RESOURCE_GROUP" \
            --backend-storage-account "$STATE_STORAGE_ACCOUNT" \
            --backend-container "$STATE_CONTAINER" \
            --controls-commit-sha "$PLAN_CONTROLS_COMMIT_SHA" \
            --resolved-models-digest "$RESOLVED_MODELS_DIGEST" \
            --attestation-signer-workflow "$GITHUB_REPOSITORY/.github/workflows/container-supply-chain.yml" \
            "${cutover_args[@]}" >/dev/null
          terraform -chdir="$TERRAFORM_ROOT" show \
            -json "$bundle/service.plan" > "$RUNNER_TEMP/replayed-service-plan.json"
          cmp "$bundle/service-plan.json" "$RUNNER_TEMP/replayed-service-plan.json" || {
            echo "binary plan and sealed plan JSON disagree." >&2
            exit 1
          }
          python3 "$TRUSTED_CONTROLS/scripts/deployment/service/guard_plan.py" \
            --plan-json "$RUNNER_TEMP/replayed-service-plan.json" \
            --service "${{ inputs.service }}" \
            --environment "${{ inputs.environment }}" \
            --image-ref "$IMAGE_REF" \
            "${cutover_args[@]}"

      - name: Apply service-owned database migrations
        if: ${{ inputs.apply }}
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          migration_secret_name="$(
            jq -er --arg service "$SERVICE" \
              '.services[$service].migration_dsn_secret_name' \
              "$TRUSTED_CONTROLS/scripts/deployment/service/service-matrix.json"
          )"
          service_resource_id="$(
            jq -er '.target.service_resource_id' \
              "$RUNNER_TEMP/service-plan-bundle/service-context.json"
          )"
          role_secret_url="$(
            timeout 60s az containerapp show \
              --ids "$service_resource_id" \
              --query "properties.configuration.secrets[?name=='database-dsn'].keyVaultUrl | [0]" \
              --only-show-errors \
              --output tsv
          )"
          vault_name="$(
            ROLE_SECRET_URL="$role_secret_url" python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlparse

          parsed = urlparse(os.environ["ROLE_SECRET_URL"])
          match = re.fullmatch(r"([a-z0-9-]{3,24})\.vault\.azure\.net", parsed.hostname or "")
          if parsed.scheme != "https" or match is None or not parsed.path.startswith("/secrets/"):
              raise SystemExit("database-dsn must be an Azure Key Vault HTTPS secret reference")
          print(match.group(1))
          PY
          )"
          migration_dsn="$(
            timeout 60s az keyvault secret show \
              --vault-name "$vault_name" \
              --name "$migration_secret_name" \
              --query value \
              --only-show-errors \
              --output tsv
          )"
          [[ -n "$migration_dsn" ]] || {
            echo "service migration DSN is unavailable" >&2
            exit 1
          }
          echo "::add-mask::$migration_dsn"
          FDAI_DATABASE_URL="$migration_dsn" \
            "$TRUSTED_CONTROLS/service-migrations/bin/$SERVICE" upgrade head
          unset migration_dsn

      - name: Capture pre-apply rollback snapshot
        if: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/service-plan-bundle"
          rollback_dir="$RUNNER_TEMP/service-rollback"
          mkdir -m 700 "$rollback_dir"
          jq -e '.planned_values.outputs.rollback_contract.value' \
            "$bundle/service-plan.json" >"$rollback_dir/rollback-contract.json"
          az account show --only-show-errors --output json >"$rollback_dir/account.json"
          resource_id="$(jq -er '.target.service_resource_id' "$bundle/service-context.json")"
          resource_group="$(jq -er '.target.resource_group' "$bundle/service-context.json")"
          service_name="$(jq -er '.target.service_name' "$bundle/service-context.json")"
          timeout 60s az containerapp show \
            --ids "$resource_id" \
            --only-show-errors \
            --output json >"$rollback_dir/app.json"
          previous_revision="$(jq -er '.properties.latestRevisionName' "$rollback_dir/app.json")"
          timeout 60s az containerapp revision show \
            --resource-group "$resource_group" \
            --name "$service_name" \
            --revision "$previous_revision" \
            --only-show-errors \
            --output json >"$rollback_dir/revision.json"
          python3 "$TRUSTED_CONTROLS/scripts/deployment/service/deployment_recovery.py" capture \
            --context "$bundle/service-context.json" \
            --account "$rollback_dir/account.json" \
            --app "$rollback_dir/app.json" \
            --revision "$rollback_dir/revision.json" \
            --rollback-contract "$rollback_dir/rollback-contract.json" \
            --output "$rollback_dir/snapshot.json"
          echo "PREVIOUS_REVISION=$previous_revision" >> "$GITHUB_ENV"

      - name: Apply exact protected service plan
        if: ${{ inputs.apply }}
        id: apply
        continue-on-error: true
        run: |
          set -euo pipefail
          terraform -chdir="$TERRAFORM_ROOT" apply \
            -input=false \
            -lock-timeout=5m \
            "$RUNNER_TEMP/service-plan-bundle/service.plan"

      - name: Verify post-apply service health
        if: ${{ inputs.apply && steps.apply.outcome == 'success' }}
        id: health
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$TERRAFORM_ROOT"
          "$TRUSTED_CONTROLS/scripts/deployment/service/verify_health.sh" \
            "$RUNNER_TEMP/service-plan-bundle/service-context.json" \
            "$PREVIOUS_REVISION" \
            "$TRUSTED_CONTROLS/scripts/deployment/service"

      - name: Capture peer states after apply
        if: ${{ inputs.apply && steps.apply.outcome == 'success' && steps.health.outcome == 'success' }}
        run: |
          "$TRUSTED_CONTROLS/scripts/deployment/service/capture_peer_states.sh" \
            "${{ inputs.service }}" \
            "${{ inputs.environment }}" \
            "$TRUSTED_CONTROLS" \
            "$TRUSTED_CONTROLS/scripts/deployment/service" \
            after \
            "$RUNNER_TEMP/service-peer-state-after"

      - name: Verify peer isolation and seal receipt
        if: ${{ !inputs.migrate_state && (!inputs.apply || (steps.apply.outcome == 'success' && steps.health.outcome == 'success')) }}
        env:
          DEPLOYMENT_MODE: ${{ inputs.apply && 'apply' || 'plan' }}
          IMAGE_REF: ${{ inputs.image_ref }}
          PLAN_RUN_ID: ${{ inputs.apply && inputs.plan_run_id || github.run_id }}
          PLAN_RUN_ATTEMPT: ${{ inputs.apply && inputs.plan_run_attempt || github.run_attempt }}
          PLAN_DIGEST: ${{ inputs.apply && inputs.plan_digest || steps.seal.outputs.plan_digest }}
          CONTEXT_DIGEST: ${{ inputs.apply && inputs.context_digest || steps.seal.outputs.context_digest }}
        run: |
          set -euo pipefail
          python3 "$TRUSTED_CONTROLS/scripts/deployment/service/peer_state.py" verify \
            --before "$RUNNER_TEMP/service-peer-state-before/manifest.json" \
            --after "$RUNNER_TEMP/service-peer-state-after/manifest.json" \
            --mode "$DEPLOYMENT_MODE" \
            --service "${{ inputs.service }}" \
            --environment "${{ inputs.environment }}" \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --image-ref "$IMAGE_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --plan-run-id "$PLAN_RUN_ID" \
            --plan-run-attempt "$PLAN_RUN_ATTEMPT" \
            --plan-digest "$PLAN_DIGEST" \
            --context-digest "$CONTEXT_DIGEST" \
            --output "$RUNNER_TEMP/service-peer-isolation-receipt.json"

      - name: Upload peer isolation receipt
        if: ${{ !inputs.migrate_state && (!inputs.apply || (steps.apply.outcome == 'success' && steps.health.outcome == 'success')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: service-peer-isolation-${{ inputs.service }}-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/service-peer-isolation-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Roll back unhealthy service revision
        if: ${{ inputs.apply && (steps.apply.outcome == 'failure' || steps.health.outcome == 'failure') }}
        id: rollback
        continue-on-error: true
        run: |
          set -euo pipefail
          rollback_dir="$RUNNER_TEMP/service-rollback"
          mapfile -d '' -t rollback_command < <(
            python3 "$TRUSTED_CONTROLS/scripts/deployment/service/deployment_recovery.py" \
              rollback-command \
              --snapshot "$rollback_dir/snapshot.json" \
              --revision-suffix "rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          )
          mapfile -t previous_secrets < <(
            jq -r '.previous_secrets[] | "\(.name)=keyvaultref:\(.key_vault_url),identityref:\(.identity)"' \
              "$rollback_dir/snapshot.json"
          )
          mapfile -t previous_secret_names < <(
            jq -r '.previous_secrets[].name' "$rollback_dir/snapshot.json"
          )
          timeout 60s az containerapp show \
            --ids "$(jq -er '.service_resource_id' "$rollback_dir/snapshot.json")" \
            --only-show-errors \
            --output json >"$rollback_dir/app-before-secret-restore.json"
          mapfile -t extra_secret_names < <(
            jq -r --argjson expected "$(printf '%s\n' "${previous_secret_names[@]}" | jq -Rsc 'split("\n")[:-1]')" \
              '.properties.configuration.secrets[].name | select(. as $name | $expected | index($name) | not)' \
              "$rollback_dir/app-before-secret-restore.json"
          )
          if [[ ${#extra_secret_names[@]} -gt 0 ]]; then
            timeout 60s az containerapp secret remove \
              --resource-group "$(jq -er '.resource_group' "$rollback_dir/snapshot.json")" \
              --name "$(jq -er '.service_name' "$rollback_dir/snapshot.json")" \
              --secret-names "${extra_secret_names[@]}" \
              --only-show-errors \
              --output none
          fi
          if [[ ${#previous_secrets[@]} -gt 0 ]]; then
            timeout 60s az containerapp secret set \
              --resource-group "$(jq -er '.resource_group' "$rollback_dir/snapshot.json")" \
              --name "$(jq -er '.service_name' "$rollback_dir/snapshot.json")" \
              --secrets "${previous_secrets[@]}" \
              --only-show-errors \
              --output none
          fi
          "${rollback_command[@]}" >"$rollback_dir/rollback-result.json"
          resource_id="$(jq -er '.service_resource_id' "$rollback_dir/snapshot.json")"
          resource_group="$(jq -er '.resource_group' "$rollback_dir/snapshot.json")"
          service_name="$(jq -er '.service_name' "$rollback_dir/snapshot.json")"
          for _attempt in $(seq 1 36); do
            timeout 60s az containerapp show \
              --ids "$resource_id" \
              --only-show-errors \
              --output json >"$rollback_dir/app-after.json"
            recovery_revision="$(jq -er '.properties.latestRevisionName' "$rollback_dir/app-after.json")"
            timeout 60s az containerapp revision show \
              --resource-group "$resource_group" \
              --name "$service_name" \
              --revision "$recovery_revision" \
              --only-show-errors \
              --output json >"$rollback_dir/revision-after.json"
            if jq -e '.properties.provisioningState == "Provisioned" and .properties.healthState == "Healthy" and .properties.active == true' \
              "$rollback_dir/revision-after.json" >/dev/null; then
              break
            fi
            sleep 5
          done
          az account show --only-show-errors --output json >"$rollback_dir/account-after.json"
          python3 "$TRUSTED_CONTROLS/scripts/deployment/service/deployment_recovery.py" \
            verify-rollback \
            --snapshot "$rollback_dir/snapshot.json" \
            --account "$rollback_dir/account-after.json" \
            --app "$rollback_dir/app-after.json" \
            --revision "$rollback_dir/revision-after.json"

      - name: Fail deployment after automatic rollback
        if: ${{ always() && inputs.apply && (steps.apply.outcome == 'failure' || steps.health.outcome == 'failure') }}
        run: |
          rollback_dir="$RUNNER_TEMP/service-rollback"
          if [[ "${{ steps.rollback.outcome }}" != "success" ]]; then
            echo "service apply or post-apply health failed; automatic image rollback was not verified and operator recovery is required." >&2
            exit 1
          fi
          if jq -e '.platform_rollback_required == true' "$rollback_dir/snapshot.json" >/dev/null; then
            echo "service apply or post-apply health failed; the previous image was restored and verified, but authority was unchanged; a protected platform rollback is required before Core authority can be claimed." >&2
          else
            echo "service apply or post-apply health failed; the previous image was restored and verified." >&2
          fi
          exit 1

      - name: Remove temporary deployment material
        if: ${{ always() }}
        run: |
          rm -f \
            "$RUNNER_TEMP/service.tfvars.json" \
            "$RUNNER_TEMP/service.plan" \
            "$RUNNER_TEMP/service-plan.json" \
            "$RUNNER_TEMP/service-context.json" \
            "$RUNNER_TEMP/service-plan-metadata.json" \
            "$RUNNER_TEMP/replayed-service-plan.json" \
            "$RUNNER_TEMP/legacy-service-state.json" \
            "$RUNNER_TEMP/independent-service-state.json"
          rm -rf "$RUNNER_TEMP/service-plan-bundle" "$RUNNER_TEMP/service-deploy-azure"
          rm -rf "$RUNNER_TEMP/service-rollback"
          rm -rf "$RUNNER_TEMP/service-peer-state-before" "$RUNNER_TEMP/service-peer-state-after"
          rm -f "$RUNNER_TEMP/service-peer-isolation-receipt.json"
          rm -rf "$RUNNER_TEMP/legacy-terraform-data"
