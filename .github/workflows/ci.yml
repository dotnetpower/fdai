name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel only superseded PR runs. Integrated and manually requested revisions
# retain independent terminal evidence.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privileged default; individual jobs elevate only when required.
permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  changes:
    name: test change scope
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.scope.outputs.python }}
      docs: ${{ steps.scope.outputs.docs }}
      terraform: ${{ steps.scope.outputs.terraform }}
      operator: ${{ steps.scope.outputs.operator }}
      evaluation: ${{ steps.scope.outputs.evaluation }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      scenarios: ${{ steps.scope.outputs.scenarios }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve test scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            range="$PR_BASE_SHA...HEAD"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            range="$PUSH_BEFORE_SHA...HEAD"
          else
            range="HEAD^...HEAD"
          fi
          python3 scripts/quality/ci/resolve_test_scope.py --range "$range"

  python-tests:
    name: pytest regression shard ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FDAI_NARRATOR_AUTO_OPEN_AOAI: "0"
      FDAI_PYTEST_MAX_WORKERS: "4"
      FDAI_PYTEST_MODE: regression
      FDAI_PYTEST_SHARD_COUNT: "4"
      FDAI_PYTEST_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv (Python 3.13)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.11"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ matrix.shard == 1 }}

      - name: Install dependencies
        run: |
          extras=(--extra dev --extra pdf-report)
          if [[ "${{ matrix.shard }}" == "1" ]]; then
            extras+=(--extra azure-mcp)
          fi
          uv sync "${extras[@]}" --frozen

      - name: Run lint and static contracts
        if: matrix.shard == 1
        run: |
          uv run ruff format --check services packages tests extensions/code-assurance
          uv run ruff check services packages tests extensions/code-assurance
          uv run mypy
          uv run python scripts/quality/documentation/check-action-runbooks.py
          uv run python scripts/quality/repository/check-reference-only-sources.py
          uv run python scripts/quality/architecture/check-independent-services.py

      - name: Materialize resolved model manifest
        env:
          RESOLVED_MODELS_JSON: ${{ vars.RESOLVED_MODELS_JSON }}
        run: python3 scripts/quality/ci/materialize-resolved-models.py

      - name: Install OPA (Rego runner)
        uses: ./.github/actions/setup-opa

      - name: Run regression shard
        run: bash scripts/quality/ci/run-python-tests.sh

  python-coverage-shards:
    name: pytest safety-core coverage shard ${{ matrix.shard }}/2
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FDAI_NARRATOR_AUTO_OPEN_AOAI: "0"
      FDAI_PYTEST_MAX_WORKERS: "4"
      FDAI_PYTEST_MODE: coverage
      FDAI_PYTEST_SHARD_COUNT: "2"
      FDAI_PYTEST_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv (Python 3.13)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.11"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Materialize resolved model manifest
        env:
          RESOLVED_MODELS_JSON: ${{ vars.RESOLVED_MODELS_JSON }}
        run: python3 scripts/quality/ci/materialize-resolved-models.py

      - name: Install OPA (Rego runner)
        uses: ./.github/actions/setup-opa

      - name: Run safety-core coverage shard
        run: bash scripts/quality/ci/run-python-tests.sh

      - name: Prepare coverage data
        run: mv .coverage ".coverage.${{ matrix.shard }}"

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safety-coverage-data-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  python-coverage:
    name: pytest • safety-core coverage
    needs:
      - changes
      - python-coverage-shards
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv (Python 3.13)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.11"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false

      - name: Install coverage tooling
        run: uv sync --extra dev --frozen

      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: safety-coverage-data-*
          path: coverage-data
          merge-multiple: true

      - name: Enforce aggregate safety-core coverage
        run: |
          uv run coverage combine coverage-data
          uv run coverage report --fail-under=90

  operator-surfaces:
    name: console and CLI tests • typecheck • build
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            cli/package-lock.json

      - name: Install locked console dependencies
        run: npm --prefix console ci --no-audit --no-fund

      - name: Install locked CLI dependencies
        run: npm --prefix cli ci --no-audit --no-fund

      - name: Test, typecheck, and build operator surfaces
        run: bash scripts/quality/ci/run-operator-surfaces.sh

  contracts:
    name: repository and design contracts
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install contract check dependencies
        run: python3 -m pip install --quiet pyyaml

      - name: Check documentation source contracts
        if: needs.changes.outputs.docs == 'true'
        run: |
          bash scripts/quality/localization/check-translations.sh
          python3 scripts/quality/localization/check-derived-sources.py

      - name: Validate changed design contracts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            range="$PR_BASE_SHA...HEAD"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            range="$PUSH_BEFORE_SHA...HEAD"
          else
            range="HEAD^...HEAD"
          fi
          python3 scripts/quality/architecture/check-design-routes.py
          python3 scripts/quality/architecture/check-constitution.py
          python3 scripts/quality/architecture/check-fork-runtime-independence.py
          python3 scripts/quality/architecture/check-venue-capability-contract.py
          python3 scripts/quality/architecture/check-design-doc-impact.py "$range"
          python3 scripts/quality/architecture/check-document-size.py "$range"
          bash scripts/integrity/check-protected-paths.sh "$range"

      - name: Run repository policy and boundary checks
        run: |
          set -uo pipefail
          failed=0
          run_check() {
            local label="$1"
            shift
            echo "::group::$label"
            "$@"
            local result=$?
            echo "::endgroup::"
            if (( result != 0 )); then
              echo "::error::$label failed with exit code $result"
              failed=1
            fi
          }
          run_check "Message catalog parity" \
            bash scripts/quality/localization/check-catalog-parity.sh
          run_check "Clean-checkout CI contracts" \
            python3 scripts/quality/ci/check-ci-contracts.py
          run_check "Generated service contracts" \
            python3 scripts/quality/contracts/generate_service_contracts.py --check
          run_check "ASCII punctuation" \
            bash scripts/quality/repository/check-punctuation.sh
          run_check "Readable Hangul" \
            python3 scripts/quality/localization/check-readable-hangul.py
          run_check "Generic GUID scope" \
            bash scripts/quality/repository/check-guids.sh
          run_check "Repository root layout" \
            python3 scripts/quality/repository/check-root-layout.py
          run_check "Architecture review readiness" \
            python3 scripts/governance/check-arb-readiness.py
          run_check "Agent stewardship" \
            bash scripts/governance/check-stewardship.sh
          run_check "Core import boundary" \
            bash scripts/quality/architecture/check-core-imports.sh
          run_check "Report format boundary" \
            python3 scripts/quality/architecture/check-report-format-boundary.py
          run_check "Agent import boundary" \
            bash scripts/quality/architecture/check-agents-imports.sh
          run_check "Evaluation package boundaries" \
            python3 scripts/quality/architecture/check-evaluation-boundaries.py
          run_check "Operator API boundary" \
            python3 scripts/quality/architecture/check-operator-api-boundaries.py
          run_check "File LOC" env FILE_LOC_MODE=enforce \
            bash scripts/quality/architecture/check-file-loc.sh
          run_check "Subsystem fan-out" env SUBSYSTEM_FANOUT_MODE=enforce \
            bash scripts/quality/architecture/check-subsystem-fanout.sh
          run_check "Documentation links" \
            bash scripts/quality/repository/check-doc-links.sh
          exit "$failed"

  governance-runtime-contracts:
    name: catalog and governance runtime contracts
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.11"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false

      - name: Install frozen runtime workspace
        run: uv sync --frozen --package fdai-core-control-plane --no-dev

      - name: Enforce governance review authority
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUSTED_APP_ID: ${{ vars.FDAI_GOVERNANCE_IDENTITY_APP_ID }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/governance-changed-files.txt"
          git diff --no-renames --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" > "$changed"
          if ! grep -Eq '^(config/notifications-matrix\.yaml$|rule-catalog/(rules|rule-sets|assignments|exemptions|overrides|retirements)/|rule-catalog/override-parameter-bounds\.yaml$|policies/risk|.*risk-classification)' "$changed"; then
            echo "No governed catalog changes require identity review."
            exit 0
          fi
          if [[ ! "$TRUSTED_APP_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::FDAI_GOVERNANCE_IDENTITY_APP_ID must name the trusted Entra verifier GitHub App"
            exit 1
          fi
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            > "$RUNNER_TEMP/governance-reviews.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA" \
            > "$RUNNER_TEMP/governance-commit.json"
          gh api --paginate --slurp -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/check-runs?per_page=100" \
            > "$RUNNER_TEMP/governance-checks.json"
          uv run python scripts/governance/check-governance-review-authority.py \
            --event "$GITHUB_EVENT_PATH" \
            --commit "$RUNNER_TEMP/governance-commit.json" \
            --reviews "$RUNNER_TEMP/governance-reviews.json" \
            --checks "$RUNNER_TEMP/governance-checks.json" \
            --changed-files "$changed" \
            --trusted-app-id "$TRUSTED_APP_ID"

      - name: Install OPA (Rego runner)
        uses: ./.github/actions/setup-opa

      - name: Run catalog and governance runtime checks
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          failed=0
          run_check() {
            local label="$1"
            shift
            echo "::group::$label"
            "$@"
            local result=$?
            echo "::endgroup::"
            if (( result != 0 )); then
              echo "::error::$label failed with exit code $result"
              failed=1
            fi
          }
          validate_exemptions() {
            shopt -s nullglob
            local files=(rule-catalog/exemptions/*.json)
            if (( ${#files[@]} == 0 )); then
              echo "No exemption artifacts to validate."
              return 0
            fi
            uv run python -m fdai.rule_catalog.schema.exemption_cli "${files[@]}"
          }
          validate_governance_transitions() {
            local base
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              git fetch --no-tags --depth=1 origin "$PR_BASE_REF"
              base="origin/$PR_BASE_REF"
            elif [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              echo "No prior commit to compare; skipping governance transitions."
              return 0
            else
              base="$PUSH_BEFORE_SHA"
            fi
            uv run python scripts/governance/check-governance-transitions.py --base "$base"
          }
          run_check "Rule semantic drift" env \
            PYTHONPATH=services/core-control-plane/src:packages/service-contracts/src \
            uv run python scripts/catalog/sync-rule-semantics.py --check
          run_check "Chaos scenario catalog" \
            bash scripts/catalog/check-chaos-scenarios.sh
          echo "::group::Exemption artifacts"
          validate_exemptions
          result=$?
          echo "::endgroup::"
          if (( result != 0 )); then
            echo "::error::Exemption artifacts failed with exit code $result"
            failed=1
          fi
          echo "::group::Governance transitions"
          validate_governance_transitions
          result=$?
          echo "::endgroup::"
          if (( result != 0 )); then
            echo "::error::Governance transitions failed with exit code $result"
            failed=1
          fi
          exit "$failed"

  evaluation-packages:
    name: evaluation SDK and external-adapter packages
    needs: changes
    if: needs.changes.outputs.evaluation == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.11"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false

      - name: Install frozen workspace
        run: uv sync --all-packages --extra dev --frozen

      - name: Test evaluation packages
        run: |
          uv run pytest -q evaluation-sdk/tests --cov=fdai_evaluation_sdk --cov-branch --cov-fail-under=90 -o addopts=''
          uv run pytest -q benchmarks/sregym/tests --cov=fdai_bench_sregym --cov-branch --cov-fail-under=90 -o addopts=''
          uv run pytest -q benchmarks/cybergym/tests --cov=fdai_bench_cybergym --cov-branch --cov-fail-under=90 -o addopts=''

      - name: Lint and type-check evaluation packages
        run: |
          uv run ruff check evaluation-sdk/src evaluation-sdk/tests benchmarks/sregym benchmarks/cybergym
          uv run mypy --strict evaluation-sdk/src/fdai_evaluation_sdk
          uv run mypy --strict benchmarks/sregym/src/fdai_bench_sregym
          uv run mypy --strict benchmarks/cybergym/src/fdai_bench_cybergym

      - name: Build independent wheels
        run: |
          uv build --wheel evaluation-sdk
          uv build --wheel benchmarks/sregym
          uv build --wheel benchmarks/cybergym

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history keeps exact commit ranges available to both the
          # action and manual protected-main revalidation.
          fetch-depth: 0

      - name: Run gitleaks
        if: github.event_name != 'workflow_dispatch'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run gitleaks on exact snapshot
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -m 700 "$install_dir"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --retry-max-time 120 \
            --connect-timeout 5 --max-time 60 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $archive" \
            | sha256sum --check
          tar -xzf "$archive" -C "$install_dir" gitleaks
          "$install_dir/gitleaks" git \
            --log-opts="HEAD^..HEAD" \
            --redact \
            --exit-code 2 \
            --report-format sarif \
            --report-path results.sarif

  deps-audit:
    name: pip-audit (dependency vulnerabilities)
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.11"
          enable-cache: false

      - name: Export frozen runtime dependencies
        run: >-
          uv export --format requirements.txt --frozen --no-dev
          --no-emit-workspace --output-file audit-requirements.txt

      - name: pip-audit against frozen runtime dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: audit-requirements.txt

  freeze-scenarios:
    name: Frozen scenario-set immutability (PR only)
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.scenarios == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so we can diff against the base ref.
          fetch-depth: 0

      - name: Detect modifications / deletions in frozen versions
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
            echo "The immutable pull-request base commit is unavailable."
            exit 1
          fi
          base_sha="$PR_BASE_SHA"
          frozen_patterns=(
            'services/core-control-plane/tests/scenarios/v*/*.json'
            'services/core-control-plane/tests/scenarios/enrichment/v*/*.json'
            'services/core-control-plane/tests/scenarios/manifests/v*.json'
            'services/core-control-plane/tests/scenarios/cross-objective/v*.json'
          )
          # A new manifest version admits one complete new corpus. Once that
          # manifest exists on the base ref, every artifact in the version is
          # immutable: scenarios, enrichments, conflict specs, and manifest.
          changed=$(git diff --name-only --diff-filter=MDRT "$base_sha...HEAD" \
                    -- "${frozen_patterns[@]}" || true)
          added_to_frozen=""
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              */manifests/v*.json)
                version=$(basename "$file" .json)
                ;;
              */cross-objective/v*.json)
                name=$(basename "$file")
                version=${name%%-*}
                ;;
              */enrichment/v*/*.json|*/scenarios/v*/*.json)
                version=$(basename "$(dirname "$file")")
                ;;
              *)
                echo "Unable to resolve frozen scenario version: $file"
                exit 1
                ;;
            esac
            manifest="services/core-control-plane/tests/scenarios/manifests/${version}.json"
            if git cat-file -e "$base_sha:$manifest" 2>/dev/null; then
              added_to_frozen+="${file}"$'\n'
            fi
          done < <(git diff --name-only --diff-filter=A "$base_sha...HEAD" \
                    -- "${frozen_patterns[@]}")
          changed=$(printf '%s\n%s' "$changed" "$added_to_frozen" | sed '/^$/d')
          if [[ -n "$changed" ]]; then
            echo "Frozen scenario files modified or deleted:"
            while IFS= read -r file; do
              printf '  - %s\n' "$file"
            done <<< "$changed"
            echo ""
            echo "Frozen versions are immutable - create a new version directory instead."
            exit 1
          fi
          echo "No frozen scenario files were modified."
          python3 scripts/quality/ci/check-frozen-scenario-additions.py \
            --base-sha "$base_sha"

  db-integration:
    name: database and provider integration shard ${{ matrix.shard }}/2
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fdai
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fdai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fdai -d fdai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      FDAI_DATABASE_URL: postgresql+psycopg://fdai:ci@localhost:5432/fdai
      FDAI_PYTEST_MODE: integration
      FDAI_PYTEST_SHARD_COUNT: "2"
      FDAI_PYTEST_SHARD_INDEX: ${{ matrix.shard }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv (Python 3.13)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.11"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run alembic upgrade head
        run: uv run alembic upgrade head

      - name: Install OPA (Rego runner)
        uses: ./.github/actions/setup-opa

      - name: Run integration test shard
        run: bash scripts/quality/ci/run-python-tests.sh

      - name: Prepare service migration database
        if: matrix.shard == 1
        run: |
          uv run python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit

          import psycopg

          source_url = os.environ["FDAI_DATABASE_URL"]
          source = urlsplit(source_url)
          service_url = urlunsplit(source._replace(path="/fdai_services"))
          connection_url = source_url.replace("postgresql+psycopg://", "postgresql://", 1)
          with psycopg.connect(connection_url, autocommit=True) as connection:
              connection.execute("CREATE DATABASE fdai_services")
          print(f"::add-mask::{service_url}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"FDAI_SERVICE_DATABASE_URL={service_url}\n")
          PY

      - name: Run service-owned migrations
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          export FDAI_DATABASE_URL="$FDAI_SERVICE_DATABASE_URL"
          uv run alembic upgrade head
          evidence_dir="${RUNNER_TEMP}/service-migration-adoption"
          mkdir -p "$evidence_dir"
          migration_order="$(
            PYTHONPATH=service-migrations \
              uv run python service-migrations/migrate.py all order
          )"
          mapfile -t migration_services <<< "$migration_order"
          [[ "${#migration_services[@]}" -eq 5 ]] || {
            echo "service migration order must contain all five services" >&2
            exit 1
          }
          for service in "${migration_services[@]}"; do
            PYTHONPATH=service-migrations \
              "service-migrations/bin/${service}" bootstrap \
                --evidence-output "${evidence_dir}/${service}.json" \
                --schema-output "${evidence_dir}/${service}-schema.json" \
                --rollback-reference \
                  "git:${GITHUB_SHA}:service-migrations/branches/${service}/adoption.json#rollback"
          done

      - name: Run serial service migration lifecycle tests
        if: matrix.shard == 1
        env:
          FDAI_DATABASE_URL: ${{ env.FDAI_SERVICE_DATABASE_URL }}
          FDAI_SERIAL_MIGRATION_TESTS: "1"
        run: >-
          uv run pytest -q --no-cov
          services/core-control-plane/tests/persistence/test_catalog_lifecycle_integration.py

      - name: Run service-owned database tests
        if: matrix.shard == 1
        env:
          FDAI_SERVICE_MIGRATIONS_READY: "1"
          FDAI_DATABASE_URL: ${{ env.FDAI_SERVICE_DATABASE_URL }}
        run: >-
          uv run pytest -q --no-cov
          services/operator-service/tests/test_read_investigation_completion_store.py::test_postgres_allocates_attempt_turns_and_reuses_duplicate_slot
          services/core-control-plane/tests/persistence/test_postgres_kubernetes_lifecycle.py::test_lease_reacquire_duplicate_and_reorder_are_safe
          services/core-control-plane/tests/persistence/test_postgres_inventory_snapshot.py
          services/core-control-plane/tests/persistence/test_postgres_ontology_instance.py::test_postgres_inventory_coverage_scopes_reconciliation_markers

      - name: Start loopback provider stack
        if: matrix.shard == 2
        env:
          POSTGRES_PASSWORD: ci
        run: docker compose -f infra/local/docker-compose.yml up -d --wait postgres-validation redpanda

      - name: Prepare isolated provider database URL
        if: matrix.shard == 2
        env:
          POSTGRES_PASSWORD: ci
        run: |
          python3 - <<'PY'
          import os

          database_url = (
              "postgresql+psycopg://fdai:"
              f"{os.environ['POSTGRES_PASSWORD']}@127.0.0.1:5433/fdai_validation"
          )
          print(f"::add-mask::{database_url}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"FDAI_DATABASE_URL={database_url}\n")
          PY

      - name: Run the shared provider contract matrix
        if: matrix.shard == 2
        env:
          FDAI_PROVIDER_CONTRACT_BACKENDS: real
          FDAI_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:19092
        run: >-
          uv run pytest -q --no-cov
          services/core-control-plane/tests/providers/test_contracts.py

      - name: Stop loopback provider stack
        if: always() && matrix.shard == 2
        run: docker compose -f infra/local/docker-compose.yml down -v

  terraform-validate:
    name: Terraform fmt + validate + config tests
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform fmt (recursive check)
        run: terraform fmt -check -recursive

      - name: terraform init (no backend - offline validate)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      # Plan-level configuration contracts. `mock_provider` supplies synthetic
      # provider responses, so these run with no subscription, no credentials,
      # and no network - the same posture a disconnected tenant has.
      - name: terraform test (mocked providers)
        run: terraform test

      - name: terraform test (bootstrap, mocked providers)
        run: |
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap test

      - name: terraform validate (scenario lab)
        run: |
          terraform -chdir=scenario-lab init -backend=false -input=false
          terraform -chdir=scenario-lab validate

      - name: Install Terraform security scanners
        working-directory: .
        env:
          TRIVY_VERSION: "0.72.0"
          CHECKOV_VERSION: "3.2.256"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            --retry-max-time 120 --connect-timeout 10 --max-time 90 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy
          pipx install "checkov==${CHECKOV_VERSION}"

      - name: Trivy Terraform misconfiguration scan
        working-directory: .
        run: trivy config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL infra

      - name: Checkov Terraform scan
        working-directory: .
        run: checkov -d infra --quiet --compact --framework terraform

  required:
    name: required
    if: always()
    needs:
      - changes
      - python-tests
      - python-coverage-shards
      - python-coverage
      - operator-surfaces
      - contracts
      - governance-runtime-contracts
      - evaluation-packages
      - secret-scan
      - deps-audit
      - freeze-scenarios
      - db-integration
      - terraform-validate
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job to pass or skip
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: detail["result"]
              for name, detail in results.items()
              if detail["result"] not in {"success", "skipped"}
          }
          if failed:
              for name, result in sorted(failed.items()):
                  print(f"::error::{name} finished with {result}")
              raise SystemExit(1)
          print("All required CI jobs passed or were intentionally skipped.")
          PY
