name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (typical PR workflow).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privileged default; individual jobs elevate only when required.
permissions:
  contents: read

jobs:
  changes:
    name: test change scope
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.scope.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve test scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            range="$PR_BASE_SHA...HEAD"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            range="$PUSH_BEFORE_SHA...HEAD"
          else
            range="HEAD^...HEAD"
          fi
          python3 scripts/quality/ci/resolve_test_scope.py --range "$range"

  lint:
    name: ruff • mypy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (Python 3.13)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra azure-mcp --frozen

      - name: ruff format --check
        run: uv run ruff format --check services packages tests extensions/code-assurance

      - name: ruff check
        run: uv run ruff check services packages tests extensions/code-assurance

      - name: mypy --strict
        run: uv run mypy

      - name: ActionType operator-runbook coverage
        run: uv run python scripts/quality/documentation/check-action-runbooks.py

      - name: Reference-only source snapshot guard
        run: uv run python scripts/quality/repository/check-reference-only-sources.py

      - name: Independent service boundaries
        run: uv run python scripts/quality/architecture/check-independent-services.py

      - name: Build code-assurance extension
        run: uv build --package fdai-code-assurance

  python-regression:
    name: pytest regression shard ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    env:
      FDAI_NARRATOR_AUTO_OPEN_AOAI: "0"
      FDAI_PYTEST_MAX_WORKERS: "4"
      FDAI_PYTEST_MODE: full
      FDAI_PYTEST_SHARD_COUNT: "3"
      FDAI_PYTEST_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (Python 3.13)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          save-cache: false

      - name: Install dependencies
        run: uv sync --extra dev --extra pdf-report --extra azure-mcp --frozen

      - name: Materialize resolved model manifest
        env:
          RESOLVED_MODELS_JSON: ${{ vars.RESOLVED_MODELS_JSON }}
        run: python3 scripts/quality/ci/materialize-resolved-models.py

      - name: Install OPA (Rego runner)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            --retry-max-time 120 --connect-timeout 10 --max-time 90 -o /tmp/opa \
            "https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static"
          echo "dfd5081fc6f930dfeaf2a225e31e616fc227dc0c7b43019b73d6f8fb8a1de1aa  /tmp/opa" \
            | sha256sum -c -
          chmod +x /tmp/opa
          sudo mv /tmp/opa /usr/local/bin/opa

      - name: Run regression shard
        run: bash scripts/quality/ci/run-python-tests.sh

  python-tests:
    name: pytest • safety-core coverage
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    env:
      FDAI_NARRATOR_AUTO_OPEN_AOAI: "0"
      FDAI_PYTEST_MAX_WORKERS: "8"
      FDAI_PYTEST_MODE: coverage
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (Python 3.13)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          save-cache: false

      - name: Install dependencies
        run: uv sync --extra dev --extra pdf-report --extra azure-mcp --frozen

      - name: Materialize resolved model manifest
        env:
          RESOLVED_MODELS_JSON: ${{ vars.RESOLVED_MODELS_JSON }}
        run: python3 scripts/quality/ci/materialize-resolved-models.py

      - name: Validate clean-checkout contracts
        run: python3 scripts/quality/ci/check-ci-contracts.py

      - name: Install OPA (Rego runner)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            --retry-max-time 120 --connect-timeout 10 --max-time 90 -o /tmp/opa \
            "https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static"
          echo "dfd5081fc6f930dfeaf2a225e31e616fc227dc0c7b43019b73d6f8fb8a1de1aa  /tmp/opa" \
            | sha256sum -c -
          chmod +x /tmp/opa
          sudo mv /tmp/opa /usr/local/bin/opa
          opa version

      - name: Focused safety-core coverage
        run: bash scripts/quality/ci/run-python-tests.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  operator-surfaces:
    name: console and CLI tests • typecheck • build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            cli/package-lock.json

      - name: Install locked console dependencies
        run: npm --prefix console ci --no-audit --no-fund

      - name: Install locked CLI dependencies
        run: npm --prefix cli ci --no-audit --no-fund

      - name: Test, typecheck, and build operator surfaces
        run: bash scripts/quality/ci/run-operator-surfaces.sh

  translations:
    name: documentation source contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install documentation check dependencies
        run: python3 -m pip install --quiet pyyaml

      - name: Check translation pairs
        run: bash scripts/quality/localization/check-translations.sh

      - name: Check derived source revisions
        run: python3 scripts/quality/localization/check-derived-sources.py

  design-contracts:
    name: instruction routes and docs-after contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate instruction and design routes
        run: |
          python3 scripts/quality/architecture/check-design-routes.py
          python3 scripts/quality/architecture/check-constitution.py
          python3 scripts/quality/architecture/check-fork-runtime-independence.py
          python3 scripts/quality/architecture/check-venue-capability-contract.py

      - name: Resolve changed range
        id: range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            echo "value=$PR_BASE_SHA...HEAD" >> "$GITHUB_OUTPUT"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            echo "value=$PUSH_BEFORE_SHA...HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "value=HEAD^...HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Require owning design documentation
        run: |
          python3 scripts/quality/architecture/check-design-doc-impact.py "${{ steps.range.outputs.value }}"
          python3 scripts/quality/architecture/check-document-size.py "${{ steps.range.outputs.value }}"

      - name: Check protected framework paths
        run: bash scripts/integrity/check-protected-paths.sh "${{ steps.range.outputs.value }}"

  repository-contracts:
    name: repository policy and boundary contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject generated service-contract drift
        run: python3 scripts/quality/contracts/generate_service_contracts.py --check

      - name: Install repository check dependencies
        run: python3 -m pip install --quiet pyyaml

      - name: Run repository policy and boundary checks
        run: |
          set -uo pipefail
          failed=0
          run_check() {
            local label="$1"
            shift
            echo "::group::$label"
            "$@"
            local result=$?
            echo "::endgroup::"
            if (( result != 0 )); then
              echo "::error::$label failed with exit code $result"
              failed=1
            fi
          }
          run_check "Message catalog parity" \
            bash scripts/quality/localization/check-catalog-parity.sh
          run_check "ASCII punctuation" \
            bash scripts/quality/repository/check-punctuation.sh
          run_check "Readable Hangul" \
            python3 scripts/quality/localization/check-readable-hangul.py
          run_check "Generic GUID scope" \
            bash scripts/quality/repository/check-guids.sh
          run_check "Repository root layout" \
            python3 scripts/quality/repository/check-root-layout.py
          run_check "Architecture review readiness" \
            python3 scripts/governance/check-arb-readiness.py
          run_check "Agent stewardship" \
            bash scripts/governance/check-stewardship.sh
          run_check "Core import boundary" \
            bash scripts/quality/architecture/check-core-imports.sh
          run_check "Report format boundary" \
            python3 scripts/quality/architecture/check-report-format-boundary.py
          run_check "Agent import boundary" \
            bash scripts/quality/architecture/check-agents-imports.sh
          run_check "Evaluation package boundaries" \
            python3 scripts/quality/architecture/check-evaluation-boundaries.py
          run_check "Operator API boundary" \
            python3 scripts/quality/architecture/check-operator-api-boundaries.py
          run_check "File LOC" env FILE_LOC_MODE=enforce \
            bash scripts/quality/architecture/check-file-loc.sh
          run_check "Subsystem fan-out" env SUBSYSTEM_FANOUT_MODE=enforce \
            bash scripts/quality/architecture/check-subsystem-fanout.sh
          run_check "Documentation links" \
            bash scripts/quality/repository/check-doc-links.sh
          exit "$failed"

  governance-runtime-contracts:
    name: catalog and governance runtime contracts
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install frozen runtime workspace
        run: uv sync --frozen --package fdai-core-control-plane --no-dev

      - name: Enforce governance review authority
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUSTED_APP_ID: ${{ vars.FDAI_GOVERNANCE_IDENTITY_APP_ID }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/governance-changed-files.txt"
          git diff --no-renames --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" > "$changed"
          if ! grep -Eq '^(rule-catalog/(rules|rule-sets|assignments|exemptions|overrides|retirements)/|rule-catalog/override-parameter-bounds\.yaml$|policies/risk|.*risk-classification)' "$changed"; then
            echo "No governed catalog changes require identity review."
            exit 0
          fi
          if [[ ! "$TRUSTED_APP_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::FDAI_GOVERNANCE_IDENTITY_APP_ID must name the trusted Entra verifier GitHub App"
            exit 1
          fi
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            > "$RUNNER_TEMP/governance-reviews.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA" \
            > "$RUNNER_TEMP/governance-commit.json"
          gh api --paginate --slurp -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/check-runs?per_page=100" \
            > "$RUNNER_TEMP/governance-checks.json"
          uv run python scripts/governance/check-governance-review-authority.py \
            --event "$GITHUB_EVENT_PATH" \
            --commit "$RUNNER_TEMP/governance-commit.json" \
            --reviews "$RUNNER_TEMP/governance-reviews.json" \
            --checks "$RUNNER_TEMP/governance-checks.json" \
            --changed-files "$changed" \
            --trusted-app-id "$TRUSTED_APP_ID"

      - name: Install OPA (Rego runner)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            --retry-max-time 120 --connect-timeout 10 --max-time 90 -o /tmp/opa \
            "https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static"
          echo "dfd5081fc6f930dfeaf2a225e31e616fc227dc0c7b43019b73d6f8fb8a1de1aa  /tmp/opa" \
            | sha256sum -c -
          chmod +x /tmp/opa
          sudo mv /tmp/opa /usr/local/bin/opa
          opa version

      - name: Run catalog and governance runtime checks
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          failed=0
          run_check() {
            local label="$1"
            shift
            echo "::group::$label"
            "$@"
            local result=$?
            echo "::endgroup::"
            if (( result != 0 )); then
              echo "::error::$label failed with exit code $result"
              failed=1
            fi
          }
          validate_exemptions() {
            shopt -s nullglob
            local files=(rule-catalog/exemptions/*.json)
            if (( ${#files[@]} == 0 )); then
              echo "No exemption artifacts to validate."
              return 0
            fi
            uv run python -m fdai.rule_catalog.schema.exemption_cli "${files[@]}"
          }
          validate_governance_transitions() {
            local base
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              git fetch --no-tags --depth=1 origin "$PR_BASE_REF"
              base="origin/$PR_BASE_REF"
            elif [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              echo "No prior commit to compare; skipping governance transitions."
              return 0
            else
              base="$PUSH_BEFORE_SHA"
            fi
            uv run python scripts/governance/check-governance-transitions.py --base "$base"
          }
          run_check "Rule semantic drift" env \
            PYTHONPATH=services/core-control-plane/src:packages/service-contracts/src \
            uv run python scripts/catalog/sync-rule-semantics.py --check
          run_check "Chaos scenario catalog" \
            bash scripts/catalog/check-chaos-scenarios.sh
          run_check "Exemption artifacts" validate_exemptions
          run_check "Governance transitions" validate_governance_transitions
          exit "$failed"

  evaluation-packages:
    name: evaluation SDK and external-adapter packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install frozen workspace
        run: uv sync --all-packages --extra dev --frozen

      - name: Test evaluation packages
        run: |
          uv run pytest -q evaluation-sdk/tests --cov=fdai_evaluation_sdk --cov-branch --cov-fail-under=90 -o addopts=''
          uv run pytest -q benchmarks/sregym/tests --cov=fdai_bench_sregym --cov-branch --cov-fail-under=90 -o addopts=''
          uv run pytest -q benchmarks/cybergym/tests --cov=fdai_bench_cybergym --cov-branch --cov-fail-under=90 -o addopts=''

      - name: Lint and type-check evaluation packages
        run: |
          uv run ruff check evaluation-sdk/src evaluation-sdk/tests benchmarks/sregym benchmarks/cybergym
          uv run mypy --strict evaluation-sdk/src/fdai_evaluation_sdk
          uv run mypy --strict benchmarks/sregym/src/fdai_bench_sregym
          uv run mypy --strict benchmarks/cybergym/src/fdai_bench_cybergym

      - name: Build independent wheels
        run: |
          uv build --wheel evaluation-sdk
          uv build --wheel benchmarks/sregym
          uv build --wheel benchmarks/cybergym

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks scans every commit in a PR.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Export frozen runtime dependencies
        run: >-
          uv export --format requirements.txt --frozen --no-dev
          --no-emit-workspace --output-file audit-requirements.txt

      - name: pip-audit against frozen runtime dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: audit-requirements.txt

  freeze-scenarios:
    name: Frozen scenario-set immutability (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so we can diff against the base ref.
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}

      - name: Detect modifications / deletions in frozen versions
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse origin/${{ github.base_ref }})
          # Only *.json files under versioned scenario folders count as frozen.
          # A new version directory is allowed. Existing version directories
          # reject additions, edits, deletes, renames, and type changes.
          changed=$(git diff --name-only --diff-filter=MDRT "$base_sha...HEAD" \
                    -- 'services/core-control-plane/tests/scenarios/v*/*.json' || true)
          added_to_frozen=""
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            version_dir=${file%/*}
            if git cat-file -e "$base_sha:$version_dir" 2>/dev/null; then
              added_to_frozen+="${file}"$'\n'
            fi
          done < <(git diff --name-only --diff-filter=A "$base_sha...HEAD" \
                    -- 'services/core-control-plane/tests/scenarios/v*/*.json')
          changed=$(printf '%s\n%s' "$changed" "$added_to_frozen" | sed '/^$/d')
          if [[ -n "$changed" ]]; then
            echo "Frozen scenario files modified or deleted:"
            printf '  - %s\n' $changed
            echo ""
            echo "Frozen versions are immutable - create a new version directory instead."
            exit 1
          fi
          echo "No frozen scenario files were modified."

  db-migrations:
    name: Alembic migrations against pgvector
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fdai
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fdai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fdai -d fdai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      FDAI_DATABASE_URL: postgresql+psycopg://fdai:ci@localhost:5432/fdai

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (Python 3.13)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          save-cache: false

      - name: Install dependencies
        run: uv sync --extra dev --extra azure-mcp --frozen

      - name: Run alembic upgrade head
        run: uv run alembic upgrade head

      - name: Prepare service migration database
        run: |
          uv run python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit

          import psycopg

          source_url = os.environ["FDAI_DATABASE_URL"]
          source = urlsplit(source_url)
          service_url = urlunsplit(source._replace(path="/fdai_services"))
          connection_url = source_url.replace("postgresql+psycopg://", "postgresql://", 1)
          with psycopg.connect(connection_url, autocommit=True) as connection:
              connection.execute("CREATE DATABASE fdai_services")
          print(f"::add-mask::{service_url}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"FDAI_SERVICE_DATABASE_URL={service_url}\n")
          PY

      - name: Install OPA (Rego runner)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            --retry-max-time 120 --connect-timeout 10 --max-time 90 -o /tmp/opa \
            "https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static"
          echo "dfd5081fc6f930dfeaf2a225e31e616fc227dc0c7b43019b73d6f8fb8a1de1aa  /tmp/opa" \
            | sha256sum -c -
          chmod +x /tmp/opa
          sudo mv /tmp/opa /usr/local/bin/opa

      - name: Run integration test suite
        env:
          FDAI_PYTEST_MODE: integration
        run: bash scripts/quality/ci/run-python-tests.sh

      - name: Run service-owned migrations
        run: |
          set -euo pipefail
          export FDAI_DATABASE_URL="$FDAI_SERVICE_DATABASE_URL"
          uv run alembic upgrade head
          evidence_dir="${RUNNER_TEMP}/service-migration-adoption"
          mkdir -p "$evidence_dir"
          migration_order="$(
            PYTHONPATH=service-migrations \
              uv run python service-migrations/migrate.py all order
          )"
          mapfile -t migration_services <<< "$migration_order"
          [[ "${#migration_services[@]}" -eq 5 ]] || {
            echo "service migration order must contain all five services" >&2
            exit 1
          }
          for service in "${migration_services[@]}"; do
            PYTHONPATH=service-migrations \
              "service-migrations/bin/${service}" bootstrap \
                --evidence-output "${evidence_dir}/${service}.json" \
                --schema-output "${evidence_dir}/${service}-schema.json" \
                --rollback-reference \
                  "git:${GITHUB_SHA}:service-migrations/branches/${service}/adoption.json#rollback"
          done

      - name: Run service-owned database tests
        env:
          FDAI_SERVICE_MIGRATIONS_READY: "1"
          FDAI_DATABASE_URL: ${{ env.FDAI_SERVICE_DATABASE_URL }}
        run: >-
          uv run pytest -q --no-cov
          services/operator-service/tests/test_read_investigation_completion_store.py::test_postgres_allocates_attempt_turns_and_reuses_duplicate_slot
          services/core-control-plane/tests/persistence/test_postgres_kubernetes_lifecycle.py::test_lease_reacquire_duplicate_and_reorder_are_safe

  terraform-validate:
    name: Terraform fmt + validate + config tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform fmt (recursive check)
        run: terraform fmt -check -recursive

      - name: terraform init (no backend - offline validate)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      # Plan-level configuration contracts. `mock_provider` supplies synthetic
      # provider responses, so these run with no subscription, no credentials,
      # and no network - the same posture a disconnected tenant has.
      - name: terraform test (mocked providers)
        run: terraform test

      - name: terraform test (bootstrap, mocked providers)
        run: |
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap test

  required:
    name: required
    if: always()
    needs:
      - changes
      - lint
      - python-regression
      - python-tests
      - operator-surfaces
      - translations
      - design-contracts
      - repository-contracts
      - governance-runtime-contracts
      - evaluation-packages
      - secret-scan
      - deps-audit
      - freeze-scenarios
      - db-migrations
      - terraform-validate
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job to pass or skip
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: detail["result"]
              for name, detail in results.items()
              if detail["result"] not in {"success", "skipped"}
          }
          if failed:
              for name, result in sorted(failed.items()):
                  print(f"::error::{name} finished with {result}")
              raise SystemExit(1)
          print("All required CI jobs passed or were intentionally skipped.")
          PY
