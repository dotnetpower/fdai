name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact protected origin/main commit for a manual CI run."
        type: string
        required: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  ci-admission:
    name: Verify CI source admission
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: >-
      ${{ vars.FDAI_CI_POOLS_ENABLED == 'true' && fromJSON('["self-hosted","Linux","X64","fdai-ci-control"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout CI source verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .github/actions/verify-ci-runner-source
          path: .fdai-ci-source-verifier
          persist-credentials: false

      - name: Verify CI candidate source
        id: ci-source
        uses: ./.fdai-ci-source-verifier/.github/actions/verify-ci-runner-source
        with:
          target-commit-sha: ${{ github.sha }}
          workflow-path: .github/workflows/ci.yml
          origin-url: ${{ github.server_url }}/${{ github.repository }}.git
          github-token: ${{ github.token }}

  rust-workspace-gates:
    needs: ci-admission
    name: Pure-Rust workspace check, xtask, SQL migrations & tests
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: >-
      ${{ vars.FDAI_CI_POOLS_ENABLED == 'true' && fromJSON('["self-hosted","Linux","X64","fdai-ci-control"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Verify manual CI revision matches this run
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          test "$REQUESTED_SHA" = "$RUN_SHA" || {
            echo "::error::Manual CI must select the exact commit of this workflow run."
            exit 1
          }

      - name: Ensure Rust toolchain is available
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version

      - name: Run Pure-Rust xtask zero-python, hygiene & SQL migration gates
        run: |
          set -euo pipefail
          cargo run --locked -p fdai-xtask -- verify
          cargo run --locked -p fdai-xtask -- check-migrations
          cargo run --locked -p fdai-xtask -- check-hygiene

      - name: Run Pure-Rust workspace check & tests
        run: |
          set -euo pipefail
          cargo check --workspace --locked
          cargo test --workspace --locked
          cargo run --locked -p fdai-console-v4 -- --check
          cargo run --locked -p fdai-deployment-cli -- --check
          cargo run --locked -p fdai-deployment-cli -- verify-assets

  required:
    name: required
    if: always()
    needs:
      - ci-admission
      - rust-workspace-gates
    runs-on: >-
      ${{ vars.FDAI_CI_POOLS_ENABLED == 'true' && fromJSON('["self-hosted","Linux","X64","fdai-ci-control"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 5
    steps:
      - name: Checkout CI source verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .github/actions/verify-ci-runner-source
          path: .fdai-ci-source-verifier
          persist-credentials: false

      - name: Verify CI candidate source
        id: ci-source
        uses: ./.fdai-ci-source-verifier/.github/actions/verify-ci-runner-source
        with:
          target-commit-sha: ${{ github.sha }}
          workflow-path: .github/workflows/ci.yml
          origin-url: ${{ github.server_url }}/${{ github.repository }}.git
          github-token: ${{ github.token }}

      - name: Require every CI job to pass or skip
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if ! jq -e '(.["ci-admission"].result == "success") and (to_entries | all(.value.result == "success" or .value.result == "skipped"))' <<<"$NEEDS_JSON" >/dev/null; then
            jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "::error::\(.key) finished with \(.value.result)"' <<<"$NEEDS_JSON"
            exit 1
          fi
          echo "All required CI jobs passed or were intentionally skipped."
