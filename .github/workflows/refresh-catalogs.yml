name: refresh-catalogs
run-name: refresh-catalogs-${{ inputs.environment }}-${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Existing environment whose PostgreSQL catalogs will be refreshed."
        type: choice
        options: [dev, staging, prod]
        default: dev
      commit_sha:
        description: "Exact CI-verified commit from protected main."
        type: string
        required: true

permissions:
  attestations: read
  checks: read
  contents: read
  packages: read

concurrency:
  group: refresh-catalogs-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && inputs.commit_sha == github.sha
    runs-on: [self-hosted, fdai-deploy]
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      ARM_USE_AZUREAD: "true"
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      DEPLOY_RUNNER_CLIENT_ID: ${{ vars.DEPLOY_RUNNER_CLIENT_ID }}
      DEPLOY_RUNNER_PRINCIPAL_ID: ${{ vars.DEPLOY_RUNNER_PRINCIPAL_ID }}
      EXPECTED_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      CATALOG_ROLLBACK_IMAGE: ${{ vars.CATALOG_ROLLBACK_IMAGE }}
    steps:
      - name: Verify protected workflow source
        working-directory: ${{ runner.temp }}
        env:
          TARGET_COMMIT_SHA: ${{ inputs.commit_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PROTECTED_ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}.git
          PROTECTED_WORKFLOW_PATH: .github/workflows/refresh-catalogs.yml
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          guard_repo="$RUNNER_TEMP/fdai-protected-origin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.git"
          rm -rf -- "$guard_repo"
          git init --bare "$guard_repo" >/dev/null
          trap 'rm -rf -- "$guard_repo"' EXIT
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
            git -C "$guard_repo" fetch --force --no-tags \
              "$PROTECTED_ORIGIN_URL" \
              "+refs/heads/main:refs/remotes/origin/main" "$TARGET_COMMIT_SHA"
          unset auth_header
          git -C "$guard_repo" merge-base --is-ancestor "$TARGET_COMMIT_SHA" \
            refs/remotes/origin/main
          git -C "$guard_repo" diff --quiet \
            "$TARGET_COMMIT_SHA:$PROTECTED_WORKFLOW_PATH" \
            "refs/remotes/origin/main:$PROTECTED_WORKFLOW_PATH"

      - name: Prepare self-hosted runner workspace
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          azure_config_dir="$RUNNER_TEMP/azure-cli"
          mkdir -p "$azure_config_dir"
          echo "AZURE_CONFIG_DIR=$azure_config_dir" >> "$GITHUB_ENV"

      - name: Checkout exact protected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Install pinned GitHub CLI
        run: bash scripts/deployment/azure/install-pinned-github-cli.sh

      - name: Verify required CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          conclusion="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_COMMIT_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "required")] | sort_by(.completed_at) | last | .conclusion // ""'
          )"
          [[ "$conclusion" == "success" ]] || exit 1

      - name: Verify protected environment approval policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/${{ inputs.environment }}" \
            > "$RUNNER_TEMP/environment.json"
          python3 scripts/deployment/azure/verify-github-environment.py \
            "$RUNNER_TEMP/environment.json" --required-approvals 1

      - name: Verify exact Azure context and deploy identity
        run: >-
          bash scripts/deployment/azure/login-deploy-identity.sh
          "$ARM_SUBSCRIPTION_ID" "$EXPECTED_AZURE_TENANT_ID"
          "$DEPLOY_RUNNER_CLIENT_ID" "$DEPLOY_RUNNER_PRINCIPAL_ID"

      - name: Initialize Terraform remote state
        working-directory: infra
        run: |
          set -euo pipefail
          cp backend.azurerm.tf.example backend.tf
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.OPS_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=fdai-${{ inputs.environment }}.tfstate"

      - name: Bind exact Core catalog image
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          PROMOTE_RUNTIME_IMAGE: "true"
          RUNTIME_IMAGE_REVISION: ${{ inputs.commit_sha }}
        run: bash scripts/deployment/azure/bind_core_runtime_image.sh infra

      - name: Refresh and verify authoritative PostgreSQL catalogs
        run: bash scripts/deployment/azure/refresh-authoritative-catalogs.sh infra
