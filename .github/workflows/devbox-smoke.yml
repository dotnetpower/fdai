name: devbox-smoke

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact protected origin/main commit to validate."
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: devbox-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main' && vars.DEVBOX_RUNNER_LABEL != ''
    runs-on:
      - self-hosted
      - ${{ vars.DEVBOX_RUNNER_LABEL }}
    timeout-minutes: 10
    steps:
      - name: Verify protected workflow source
        working-directory: ${{ runner.temp }}
        env:
          TARGET_COMMIT_SHA: ${{ inputs.commit_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PROTECTED_ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}.git
          PROTECTED_WORKFLOW_PATH: .github/workflows/devbox-smoke.yml
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          guard_repo="$RUNNER_TEMP/fdai-devbox-guard-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.git"
          rm -rf -- "$guard_repo"
          git init --bare "$guard_repo" >/dev/null
          trap 'rm -rf -- "$guard_repo"' EXIT
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
            git -C "$guard_repo" fetch --force --no-tags \
              "$PROTECTED_ORIGIN_URL" \
              "+refs/heads/main:refs/remotes/origin/main" "$TARGET_COMMIT_SHA"
          unset auth_header
          git -C "$guard_repo" merge-base --is-ancestor "$TARGET_COMMIT_SHA" \
            refs/remotes/origin/main
          diff --brief \
            <(git -C "$guard_repo" show "$TARGET_COMMIT_SHA:$PROTECTED_WORKFLOW_PATH") \
            <(git -C "$guard_repo" show "refs/remotes/origin/main:$PROTECTED_WORKFLOW_PATH")

      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify devbox runner contract
        env:
          TARGET_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "${{ runner.os }}" == "Linux" ]]
          [[ "${{ runner.arch }}" == "X64" ]]
          [[ -n "${{ runner.name }}" ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_COMMIT_SHA" ]]
          printf 'Devbox runner accepted protected commit `%s`.\n' \
            "$TARGET_COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
