name: devbox-smoke

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact protected origin/main commit to validate."
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: devbox-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main' && vars.DEVBOX_RUNNER_LABEL != ''
    runs-on:
      - self-hosted
      - ${{ vars.DEVBOX_RUNNER_LABEL }}
    timeout-minutes: 10
    steps:
      - name: Checkout protected workflow verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .github/actions/verify-protected-workflow-source
          path: .fdai-protected-workflow-verifier

      - name: Verify protected workflow source
        uses: ./.fdai-protected-workflow-verifier/.github/actions/verify-protected-workflow-source
        with:
          target-commit-sha: ${{ inputs.commit_sha }}
          workflow-path: .github/workflows/devbox-smoke.yml
          origin-url: ${{ github.server_url }}/${{ github.repository }}.git
          github-token: ${{ github.token }}

      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify devbox runner contract
        env:
          TARGET_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "${{ runner.os }}" == "Linux" ]]
          [[ "${{ runner.arch }}" == "X64" ]]
          [[ -n "${{ runner.name }}" ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_COMMIT_SHA" ]]
          printf "Devbox runner accepted protected commit \`%s\`.\n" \
            "$TARGET_COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect supported rename prerequisites
        run: |
          set -euo pipefail
          runner_root="$(dirname "$(dirname "$RUNNER_WORKSPACE")")"
          config_available=false
          root_writable=false
          service_mode=false
          passwordless_service_control=false
          [[ -x "$runner_root/config.sh" ]] && config_available=true
          [[ -w "$runner_root" ]] && root_writable=true
          if [[ -f "$runner_root/.service" ]]; then
            service_mode=true
            if sudo -n true 2>/dev/null; then
              passwordless_service_control=true
            fi
          fi
          {
            printf "Runner configuration available: \`%s\`\n" "$config_available"
            printf "Runner root writable: \`%s\`\n" "$root_writable"
            printf "Service mode: \`%s\`\n" "$service_mode"
            printf "Passwordless service control: \`%s\`\n" \
              "$passwordless_service_control"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$config_available" == true ]]
          [[ "$root_writable" == true ]]
