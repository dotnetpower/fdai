name: Deploy docs site to GitHub Pages

# Pages is configured for GitHub Actions on this repository. Publish any
# documentation-site change merged to main, and keep workflow_dispatch as a
# recovery path for a manual rebuild.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "tools/architecture-diagrams/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact protected origin/main commit to publish."
        type: string
        required: true

# GitHub Pages OIDC deploy needs pages + id-token; contents:read for checkout.
permissions:
  contents: read
  pages: write
  id-token: write

# Never race two deploys on the same environment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    name: Verify protected Pages source
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - name: Verify protected workflow source
        env:
          TARGET_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PROTECTED_ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}.git
          PROTECTED_WORKFLOW_PATH: .github/workflows/pages.yml
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          guard_repo="$RUNNER_TEMP/fdai-protected-origin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.git"
          git init --bare "$guard_repo" >/dev/null
          trap 'rm -rf -- "$guard_repo"' EXIT
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
            git -C "$guard_repo" fetch --force --no-tags \
              "$PROTECTED_ORIGIN_URL" \
              "+refs/heads/main:refs/remotes/origin/main" "$TARGET_COMMIT_SHA"
          unset auth_header
          git -C "$guard_repo" merge-base --is-ancestor "$TARGET_COMMIT_SHA" \
            refs/remotes/origin/main
          git -C "$guard_repo" diff --quiet \
            "$TARGET_COMMIT_SHA:$PROTECTED_WORKFLOW_PATH" \
            "refs/remotes/origin/main:$PROTECTED_WORKFLOW_PATH"

  build:
    name: Build (Astro Starlight)
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            tools/architecture-diagrams/package-lock.json

      - name: Install diagram compiler dependencies
        working-directory: tools/architecture-diagrams
        run: npm ci --no-audit --no-fund

      - name: Verify architecture diagrams
        working-directory: tools/architecture-diagrams
        run: npm test && npm run typecheck && npm run check

      - name: Install dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Configure Pages
        # `enablement: true` would try to turn Pages on via the REST API
        # the first time this runs against a repo that has never had
        # Pages configured. That call needs an integration with admin
        # scope; the default GITHUB_TOKEN gets HTTP 403 "Resource not
        # accessible by integration" instead. `enablement: false` is
        # the correct posture: Pages MUST be enabled once by a
        # maintainer under Settings, then Pages, before this workflow runs.
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Build site
        working-directory: site
        env:
          # Passed through to astro.config.mjs so a fork can override without
          # editing config. Defaults target dotnetpower/fdai.
          SITE_URL: ${{ steps.pages.outputs.origin || 'https://dotnetpower.github.io' }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/fdai' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
