name: prepare-release-version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify protected workflow source
        env:
          TARGET_COMMIT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PROTECTED_ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}.git
          PROTECTED_WORKFLOW_PATH: .github/workflows/automatic-version.yml
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          guard_repo="$RUNNER_TEMP/fdai-protected-origin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.git"
          git init --bare "$guard_repo" >/dev/null
          trap 'rm -rf -- "$guard_repo"' EXIT
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
            git -C "$guard_repo" fetch --force --no-tags \
              "$PROTECTED_ORIGIN_URL" \
              "+refs/heads/main:refs/remotes/origin/main" "$TARGET_COMMIT_SHA"
          unset auth_header
          git -C "$guard_repo" merge-base --is-ancestor "$TARGET_COMMIT_SHA" \
            refs/remotes/origin/main
          git -C "$guard_repo" diff --quiet \
            "$TARGET_COMMIT_SHA:$PROTECTED_WORKFLOW_PATH" \
            "refs/remotes/origin/main:$PROTECTED_WORKFLOW_PATH"

      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.22"
          enable-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Create the next patch version
        env:
          MAX_PUSH_ATTEMPTS: "5"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in $(seq 1 "$MAX_PUSH_ATTEMPTS"); do
            git fetch --force origin main --tags
            git checkout -B automatic-version origin/main

            version="$(python3 scripts/automation/next-version.py)"
            tag="v${version}"
            echo "Preparing ${tag} (attempt ${attempt}/${MAX_PUSH_ATTEMPTS})"

            uv version "$version" --no-sync
            npm --prefix console version "$version" --no-git-tag-version --ignore-scripts
            npm --prefix cli version "$version" --no-git-tag-version --ignore-scripts

            git diff --check
            git add \
              pyproject.toml uv.lock \
              console/package.json console/package-lock.json \
              cli/package.json cli/package-lock.json
            git commit -m "chore(release): ${tag}"
            git tag -a "$tag" -m "release ${tag}"

            if git push --atomic origin HEAD:main "$tag"; then
              echo "Published ${tag}"
              exit 0
            fi

            git tag -d "$tag"
            echo "Remote advanced while publishing ${tag}; recalculating."
          done

          echo "Failed to publish a unique version after ${MAX_PUSH_ATTEMPTS} attempts." >&2
          exit 1
