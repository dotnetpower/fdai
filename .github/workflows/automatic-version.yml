name: prepare-release-version

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact protected origin/main commit to prepare for release."
        type: string
        required: true

permissions:
  contents: write

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout protected workflow verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .github/actions/verify-protected-workflow-source
          path: .fdai-protected-workflow-verifier

      - name: Verify protected workflow source
        uses: ./.fdai-protected-workflow-verifier/.github/actions/verify-protected-workflow-source
        with:
          target-commit-sha: ${{ inputs.commit_sha }}
          workflow-path: .github/workflows/automatic-version.yml
          origin-url: ${{ github.server_url }}/${{ github.repository }}.git
          github-token: ${{ github.token }}

      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.22"
          enable-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Create the next patch version
        env:
          MAX_PUSH_ATTEMPTS: "5"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in $(seq 1 "$MAX_PUSH_ATTEMPTS"); do
            git fetch --force origin main --tags
            git checkout -B automatic-version origin/main

            version="$(python3 scripts/automation/next-version.py)"
            tag="v${version}"
            echo "Preparing ${tag} (attempt ${attempt}/${MAX_PUSH_ATTEMPTS})"

            uv version "$version" --no-sync
            npm --prefix console version "$version" --no-git-tag-version --ignore-scripts
            npm --prefix cli version "$version" --no-git-tag-version --ignore-scripts

            git diff --check
            git add \
              pyproject.toml uv.lock \
              console/package.json console/package-lock.json \
              cli/package.json cli/package-lock.json
            git commit -m "chore(release): ${tag}"
            git tag -a "$tag" -m "release ${tag}"

            if git push --atomic origin HEAD:main "$tag"; then
              echo "Published ${tag}"
              exit 0
            fi

            git tag -d "$tag"
            echo "Remote advanced while publishing ${tag}; recalculating."
          done

          echo "Failed to publish a unique version after ${MAX_PUSH_ATTEMPTS} attempts." >&2
          exit 1
