name: cohort-observation-import
run-name: "cohort-import-${{ inputs.arm }}-${{ inputs.commit_sha }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Protected environment that owns the cohort state store."
        type: choice
        options: [dev, staging, prod]
        default: dev
        required: true
      commit_sha:
        description: "Exact protected-main cohort policy and study revision."
        type: string
        required: true
      arm:
        description: "Cohort arm assigned by this trusted importer."
        type: choice
        options: [baseline, treatment]
        required: true
      source_run_id:
        description: "Successful allowlisted exporter workflow run id."
        type: string
        required: true
      source_run_attempt:
        description: "Exact successful exporter workflow run attempt."
        type: string
        required: true
      source_artifact_name:
        description: "Exact cohort-observations-* artifact name."
        type: string
        required: true

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: cohort-observation-import-${{ inputs.environment }}-${{ inputs.arm }}
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, fdai-deploy, fdai-deploy-candidate]
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    env:
      TARGET_COMMIT_SHA: ${{ inputs.commit_sha }}
      COHORT_ARM: ${{ inputs.arm }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      SOURCE_ARTIFACT_NAME: ${{ inputs.source_artifact_name }}
    steps:
      - name: Checkout protected workflow verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .github/actions/verify-protected-workflow-source
          path: .fdai-protected-workflow-verifier

      - name: Verify protected workflow source
        id: protected-source
        uses: ./.fdai-protected-workflow-verifier/.github/actions/verify-protected-workflow-source
        with:
          target-commit-sha: ${{ inputs.commit_sha }}
          workflow-path: .github/workflows/cohort-observation-import.yml
          origin-url: ${{ github.server_url }}/${{ github.repository }}.git
          github-token: ${{ github.token }}

      - name: Checkout exact cohort controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.32"
          enable-cache: false

      - name: Install pinned GitHub CLI
        run: bash scripts/deployment/azure/install-pinned-github-cli.sh

      - name: Verify exact revision and required CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_ARTIFACT_NAME" =~ ^cohort-observations-[a-z0-9][a-z0-9-]{0,99}$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_COMMIT_SHA" origin/main
          git rev-list --first-parent origin/main | grep -Fx "$TARGET_COMMIT_SHA" >/dev/null
          [[ "$(git rev-parse HEAD)" == "$TARGET_COMMIT_SHA" ]]
          checks="$RUNNER_TEMP/required-ci.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_COMMIT_SHA/check-runs?per_page=100" \
            > "$checks"
          jq -e \
            '[.check_runs[] | select(.name == "required" and .conclusion == "success")] |
             length >= 1' "$checks" >/dev/null

      - name: Verify allowlisted source and download exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_run="$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT" \
            > "$source_run"
          source_workflow_path="$(
            jq -er \
              --arg revision "$TARGET_COMMIT_SHA" \
              --argjson attempt "$SOURCE_RUN_ATTEMPT" \
              'select(.conclusion == "success" and .head_sha == $revision and
               .run_attempt == $attempt) | .path' \
              "$source_run"
          )"
          SOURCE_WORKFLOW_PATH="$source_workflow_path" COHORT_ARM="$COHORT_ARM" \
            uv run --frozen --package fdai-core-control-plane python - <<'PY'
          import os
          from pathlib import Path

          from fdai.core.measurement.cohort_claim_policy import load_cohort_claim_policy

          policy = load_cohort_claim_policy(Path("config/sre-cohort-claim-policy.json"))
          arm = os.environ["COHORT_ARM"]
          path = os.environ["SOURCE_WORKFLOW_PATH"]
          allowed = policy.allowed_exporters(arm)
          if not allowed:
              raise SystemExit(f"cohort {arm} exporter allowlist is empty")
          if path not in allowed:
              raise SystemExit(f"cohort {arm} source workflow is not authorized")
          PY
          current_attempt="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.run_attempt'
          )"
          [[ "$current_attempt" == "$SOURCE_RUN_ATTEMPT" ]] || {
            echo "source workflow attempt changed before artifact download" >&2
            exit 1
          }
          source_dir="$RUNNER_TEMP/cohort-source"
          mkdir -p "$source_dir"
          gh run download "$SOURCE_RUN_ID" \
            --name "$SOURCE_ARTIFACT_NAME" \
            --dir "$source_dir"
          [[ "$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.run_attempt'
          )" == "$SOURCE_RUN_ATTEMPT" ]] || {
            echo "source workflow attempt changed during artifact download" >&2
            exit 1
          }
          mapfile -t batches < <(
            find "$source_dir" -type f -name cohort-observation-batch.json -print
          )
          [[ "${#batches[@]}" -eq 1 ]] || {
            echo "source artifact must contain exactly one cohort observation batch" >&2
            exit 1
          }
          echo "SOURCE_WORKFLOW_PATH=$source_workflow_path" >> "$GITHUB_ENV"
          echo "COHORT_BATCH_PATH=${batches[0]}" >> "$GITHUB_ENV"

      - name: Authenticate and bind private platform state
        env:
          ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          DEPLOY_RUNNER_CLIENT_ID: ${{ vars.DEPLOY_RUNNER_CLIENT_ID }}
          DEPLOY_RUNNER_PRINCIPAL_ID: ${{ vars.DEPLOY_RUNNER_PRINCIPAL_ID }}
          OPS_RESOURCE_GROUP_NAME: ${{ vars.OPS_RESOURCE_GROUP_NAME }}
          STATE_STORAGE_ACCOUNT: ${{ vars.STATE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          bash scripts/deployment/azure/login-deploy-identity.sh \
            "$ARM_SUBSCRIPTION_ID" "$AZURE_TENANT_ID" \
            "$DEPLOY_RUNNER_CLIENT_ID" "$DEPLOY_RUNNER_PRINCIPAL_ID"
          az storage container create \
            --account-name "$STATE_STORAGE_ACCOUNT" \
            --name tfstate --auth-mode login --public-access off --only-show-errors \
            --output none
          cp infra/backend.azurerm.tf.example infra/backend.tf
          terraform -chdir=infra init -input=false \
            -backend-config="resource_group_name=$OPS_RESOURCE_GROUP_NAME" \
            -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=fdai-${{ inputs.environment }}.tfstate"

      - name: Import normalized observations and inventory
        run: |
          set -euo pipefail
          vault_uri="$(terraform -chdir=infra output -raw key_vault_uri)"
          [[ "$vault_uri" =~ ^https://([a-z0-9-]{3,24})[.]vault[.]azure[.]net/?$ ]] || {
            echo "Terraform key_vault_uri is not an Azure Key Vault HTTPS URI" >&2
            exit 1
          }
          vault_name="${BASH_REMATCH[1]}"
          migration_secret_name="$(
            jq -er '.services["core-control-plane"].migration_dsn_secret_name' \
              scripts/deployment/service/service-matrix.json
          )"
          migration_dsn="$(timeout 60s az keyvault secret show \
            --vault-name "$vault_name" --name "$migration_secret_name" \
            --query value --only-show-errors --output tsv)"
          [[ -n "$migration_dsn" ]]
          echo "::add-mask::$migration_dsn"
          export FDAI_STATE_STORE_DSN="$migration_dsn"
          imported_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          receipt="$RUNNER_TEMP/cohort-import-receipt.json"
          uv run --frozen --package fdai-core-control-plane \
            python -m fdai.delivery.measurement.cohort_observation_import_cli \
              --batch "$COHORT_BATCH_PATH" \
              --policy config/sre-cohort-claim-policy.json \
              --arm "$COHORT_ARM" \
              --revision "$TARGET_COMMIT_SHA" \
              --source-workflow-path "$SOURCE_WORKFLOW_PATH" \
              --source-run-id "$SOURCE_RUN_ID" \
              --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
              --source-artifact-name "$SOURCE_ARTIFACT_NAME" \
              --imported-at "$imported_at" > "$receipt"
          inventory="$RUNNER_TEMP/cohort-inventory.json"
          TARGET_COMMIT_SHA="$TARGET_COMMIT_SHA" \
            uv run --frozen --package fdai-core-control-plane python - <<'PY' > "$inventory"
          import asyncio
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          from fdai.core.measurement.cohort_claim_policy import load_cohort_claim_policy
          from fdai.delivery.measurement.cohort_inventory import (
              PostgresCohortEvidenceInventorySource,
          )

          async def main() -> None:
              policy = load_cohort_claim_policy(Path("config/sre-cohort-claim-policy.json"))
              inventory = await PostgresCohortEvidenceInventorySource(
                  dsn=os.environ["FDAI_STATE_STORE_DSN"],
                  policy=policy,
                  expected_revision=os.environ["TARGET_COMMIT_SHA"],
              ).inventory(evaluated_at=datetime.now(tz=UTC))
              print(json.dumps(inventory.to_log_record(), separators=(",", ":"), sort_keys=True))

          asyncio.run(main())
          PY
          jq -e '.claim_eligibility_authority == false and .execution_authority == false' \
            "$receipt" >/dev/null
          jq -e 'has("ready") and has("missing")' "$inventory" >/dev/null
          {
            echo "### Cohort observation import"
            echo
            echo "- Arm: \`$COHORT_ARM\`"
            echo "- Source run: \`$SOURCE_RUN_ID\` attempt \`$SOURCE_RUN_ATTEMPT\`"
            echo "- Accepted: \`$(jq -r .accepted_count "$receipt")\`"
            echo "- Duplicates: \`$(jq -r .duplicate_count "$receipt")\`"
            echo "- Cohort ready: \`$(jq -r .ready "$inventory")\`"
            echo "- Execution authority: \`false\`"
            echo "- Claim eligibility authority: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"
          unset FDAI_STATE_STORE_DSN migration_dsn

      - name: Attest aggregate import receipt
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0, Node 24
        with:
          subject-path: ${{ runner.temp }}/cohort-import-receipt.json

      - name: Upload aggregate import evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cohort-import-${{ inputs.arm }}-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: |
            ${{ runner.temp }}/cohort-import-receipt.json
            ${{ runner.temp }}/cohort-inventory.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

      - name: Clean private state material
        if: always() && steps.protected-source.outcome == 'success'
        run: |
          unset FDAI_STATE_STORE_DSN migration_dsn
          rm -f infra/backend.tf
          rm -rf infra/.terraform
