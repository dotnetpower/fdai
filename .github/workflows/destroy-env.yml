name: destroy-env

# Deliberate, guarded teardown of one app environment via the self-hosted VNet
# runner - the same vetted backend + variable wiring as deploy-dev, so destroy
# uses the real remote state (never a stale local dir). Requires typing the
# environment name into `confirm`. Never touches the ops hub or state account.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to DESTROY."
        type: choice
        options: [dev, staging, prod]
        default: dev
      confirm:
        description: "Type the environment name to confirm the destroy."
        type: string
        required: true
      commit_sha:
        description: "Exact protected origin/main commit to destroy from."
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, fdai-deploy, fdai-deploy-candidate]
    defaults:
      run:
        working-directory: infra
    env:
      ARM_USE_AZUREAD: "true"
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      DEPLOY_RUNNER_CLIENT_ID: ${{ vars.DEPLOY_RUNNER_CLIENT_ID }}
      DEPLOY_RUNNER_PRINCIPAL_ID: ${{ vars.DEPLOY_RUNNER_PRINCIPAL_ID }}
      TF_VAR_env: ${{ inputs.environment }}
      TF_VAR_region: ${{ vars.AZURE_REGION }}
      TF_VAR_region_short: ${{ vars.AZURE_REGION_SHORT }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_enable_private_networking: "true"
      TF_VAR_runner_vnet_id: ${{ vars.OPS_VNET_ID }}
      TF_VAR_runner_vnet_name: ${{ vars.OPS_VNET_NAME }}
      TF_VAR_ops_resource_group_name: ${{ vars.OPS_RESOURCE_GROUP_NAME }}
      TF_VAR_postgres_admin_login: ${{ secrets.POSTGRES_ADMIN_LOGIN }}
      TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
    steps:
      - name: Checkout protected workflow verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .github/actions/verify-protected-workflow-source
          path: .fdai-protected-workflow-verifier

      - name: Verify protected workflow source
        uses: ./.fdai-protected-workflow-verifier/.github/actions/verify-protected-workflow-source
        with:
          target-commit-sha: ${{ inputs.commit_sha }}
          workflow-path: .github/workflows/destroy-env.yml
          origin-url: ${{ github.server_url }}/${{ github.repository }}.git
          github-token: ${{ github.token }}

      # User-controlled inputs are read via env, NEVER interpolated
      # directly into bash - direct ${{ inputs.confirm }} in a run: block
      # is a classic GHA script-injection vector, and this runner holds
      # a Terraform destroy identity + POSTGRES_ADMIN_PASSWORD.
      - name: Confirm guard
        env:
          CONFIRM: ${{ inputs.confirm }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          if [ "$CONFIRM" != "$TARGET_ENV" ]; then
            printf 'confirm (%q) != environment (%q); aborting.\n' \
              "$CONFIRM" "$TARGET_ENV" >&2
            exit 1
          fi

      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Authenticate and verify stable deploy identity
        working-directory: ${{ github.workspace }}
        run: >-
          bash scripts/deployment/azure/login-deploy-identity.sh
          "$ARM_SUBSCRIPTION_ID" "$TF_VAR_tenant_id"
          "$DEPLOY_RUNNER_CLIENT_ID" "$DEPLOY_RUNNER_PRINCIPAL_ID"

      - name: Activate remote state backend
        run: cp backend.azurerm.tf.example backend.tf

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.OPS_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=fdai-${{ inputs.environment }}.tfstate"

      - name: Terraform destroy
        run: terraform destroy -input=false -lock-timeout=300s -auto-approve
