name: container-supply-chain

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "rule-catalog/**"
      - "policies/**"
      - ".github/workflows/container-supply-chain.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "rule-catalog/**"
      - "policies/**"
      - ".github/workflows/container-supply-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build-scan-attest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Materialize resolved model manifest
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESOLVED_MODELS_JSON: ${{ vars.RESOLVED_MODELS_JSON }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("RESOLVED_MODELS_JSON", "").strip()
          if not raw:
              if os.environ["EVENT_NAME"] != "pull_request":
                  raise SystemExit("RESOLVED_MODELS_JSON repository variable is required")
              payload = {
                  "schema_version": "1.0.0",
                  "capabilities": [],
                  "mixed_model_mode": "hil-only",
              }
          else:
              payload = json.loads(raw)
              if not isinstance(payload, dict):
                  raise SystemExit("RESOLVED_MODELS_JSON must contain a JSON object")
              capabilities = payload.get("capabilities")
              if not isinstance(capabilities, list):
                  raise SystemExit("RESOLVED_MODELS_JSON.capabilities must be an array")
          Path("resolved-models.json").write_text(
            json.dumps(payload, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
          )
          PY

      - name: Build image for verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.72.0"
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy
          trivy --version

      - name: Scan image for high and critical vulnerabilities
        run: >-
          trivy image --exit-code 1 --severity HIGH,CRITICAL
          --ignorefile .trivyignore.yaml
          "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Generate CycloneDX SBOM
        run: >-
          trivy image --format cyclonedx --output sbom.cdx.json
          "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fdai-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image and capture digest
        if: github.event_name != 'pull_request'
        id: push
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid pushed image digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
