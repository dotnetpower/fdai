name: container-supply-chain

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".trivyignore.yaml"
      - "services/**"
      - "service-contracts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "LICENSE"
      - "README.md"
      - "evaluation-sdk/**"
      - "benchmarks/sregym/pyproject.toml"
      - "benchmarks/cybergym/pyproject.toml"
      - "extensions/code-assurance/pyproject.toml"
      - "src/**"
      - "rule-catalog/**"
      - "policies/**"
      - "config/**"
      - "docs/internals/sregym-absorption-ledger.json"
      - "tests/scenarios/**"
      - "alembic/**"
      - "alembic.ini"
      - ".github/workflows/container-supply-chain.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".dockerignore"
      - ".trivyignore.yaml"
      - "services/**"
      - "service-contracts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "LICENSE"
      - "README.md"
      - "evaluation-sdk/**"
      - "benchmarks/sregym/pyproject.toml"
      - "benchmarks/cybergym/pyproject.toml"
      - "extensions/code-assurance/pyproject.toml"
      - "src/**"
      - "rule-catalog/**"
      - "policies/**"
      - "config/**"
      - "docs/internals/sregym-absorption-ledger.json"
      - "tests/scenarios/**"
      - "alembic/**"
      - "alembic.ini"
      - ".github/workflows/container-supply-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build-scan-attest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core-control-plane
            target: core-control-plane
            image: fdai-core-control-plane
          - service: operator-service
            target: operator-service
            image: fdai-operator-service
          - service: document-ingestion-api
            target: document-ingestion-api
            image: fdai-document-ingestion-api
          - service: document-processing-worker
            target: document-processing-worker
            image: fdai-document-processing-worker
          - service: isolated-executor
            target: isolated-executor
            image: fdai-isolated-executor
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, Node 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0, Node 24

      - name: Materialize resolved model manifest
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESOLVED_MODELS_JSON: ${{ vars.RESOLVED_MODELS_JSON }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("RESOLVED_MODELS_JSON", "").strip()
          if not raw:
              if os.environ["EVENT_NAME"] != "pull_request":
                  raise SystemExit("RESOLVED_MODELS_JSON repository variable is required")
              payload = {
                  "schema_version": "1.0.0",
                  "capabilities": [],
                  "mixed_model_mode": "hil-only",
              }
          else:
              payload = json.loads(raw)
              if not isinstance(payload, dict):
                  raise SystemExit("RESOLVED_MODELS_JSON must contain a JSON object")
              capabilities = payload.get("capabilities")
              if not isinstance(capabilities, list):
                  raise SystemExit("RESOLVED_MODELS_JSON.capabilities must be an array")
          rendered = json.dumps(payload, indent=2, sort_keys=True) + "\n"
          Path("resolved-models.json").write_text(rendered, encoding="utf-8")
          Path("services/assets/resolved-models.json").write_text(rendered, encoding="utf-8")
          PY

      - name: Build image for verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0, Node 24
        with:
          context: .
          file: ./services/Dockerfile
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.72.0"
          TRIVY_ARCHIVE_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
        run: |
          archive="$(mktemp)"
          trap 'rm -f "${archive}"' EXIT
          curl --fail --location --silent --show-error \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "${archive}"
          echo "${TRIVY_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar -xzf "${archive}" -C /usr/local/bin trivy
          trivy --version

      - name: Scan image for high and critical vulnerabilities
        run: >-
          trivy image --exit-code 1 --severity HIGH,CRITICAL
          --ignore-unfixed
          --ignorefile .trivyignore.yaml
          "${REGISTRY}/${IMAGE_NAME}/${{ matrix.image }}:${IMAGE_TAG}"

      - name: Generate CycloneDX SBOM
        run: >-
          trivy image --format cyclonedx --output "sbom-${{ matrix.service }}.cdx.json"
          "${REGISTRY}/${IMAGE_NAME}/${{ matrix.image }}:${IMAGE_TAG}"

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, Node 20
        with:
          name: fdai-sbom-${{ matrix.service }}-${{ github.sha }}
          path: sbom-${{ matrix.service }}.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1, Node 24
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image and capture digest
        if: github.event_name != 'pull_request'
        id: push
        run: |
          image="${REGISTRY}/${IMAGE_NAME}/${{ matrix.image }}:${IMAGE_TAG}"
          docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid pushed image digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0, Node 24
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0, Node 24
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.service }}.cdx.json
          push-to-registry: true
