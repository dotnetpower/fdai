name: container-supply-chain

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".trivyignore.yaml"
      - "services/**"
      - "packages/service-contracts/**"
      - "packages/github-app-auth/**"
      - "service-contracts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "LICENSE"
      - "README.md"
      - "evaluation-sdk/**"
      - "benchmarks/sregym/pyproject.toml"
      - "benchmarks/cybergym/pyproject.toml"
      - "extensions/code-assurance/pyproject.toml"
      - "extensions/cost-governance/**"
      - "src/**"
      - "rule-catalog/**"
      - "policies/**"
      - "config/**"
      - "scripts/deployment/service/select_changed_images.py"
      - "docs/internals/sregym-absorption-ledger.json"
      - "tests/scenarios/**"
      - "alembic/**"
      - "alembic.ini"
      - ".github/workflows/container-supply-chain.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".dockerignore"
      - ".trivyignore.yaml"
      - "services/**"
      - "packages/service-contracts/**"
      - "packages/github-app-auth/**"
      - "service-contracts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "LICENSE"
      - "README.md"
      - "evaluation-sdk/**"
      - "benchmarks/sregym/pyproject.toml"
      - "benchmarks/cybergym/pyproject.toml"
      - "extensions/code-assurance/pyproject.toml"
      - "extensions/cost-governance/**"
      - "src/**"
      - "rule-catalog/**"
      - "policies/**"
      - "config/**"
      - "scripts/deployment/service/select_changed_images.py"
      - "docs/internals/sregym-absorption-ledger.json"
      - "tests/scenarios/**"
      - "alembic/**"
      - "alembic.ini"
      - ".github/workflows/container-supply-chain.yml"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact protected origin/main commit to build and publish."
        type: string
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TARGET_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
  IMAGE_TAG: sha-${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}

jobs:
  select-images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_images: ${{ steps.select.outputs.has_images }}
    steps:
      - name: Validate manual publication source
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$INPUT_COMMIT_SHA" == "$GITHUB_SHA" ]] || {
            echo "historical manual publication is not supported; commit_sha must equal github.sha so attestation source revision stays exact" >&2
            exit 1
          }

      - name: Checkout protected workflow verifier
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .github/actions/verify-protected-workflow-source
          path: .fdai-protected-workflow-verifier

      - name: Verify protected workflow source
        if: github.event_name != 'pull_request'
        uses: ./.fdai-protected-workflow-verifier/.github/actions/verify-protected-workflow-source
        with:
          target-commit-sha: ${{ env.TARGET_COMMIT_SHA }}
          workflow-path: .github/workflows/container-supply-chain.yml
          origin-url: ${{ github.server_url }}/${{ github.repository }}.git
          github-token: ${{ github.token }}

      - name: Checkout image selection inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_COMMIT_SHA }}
          fetch-depth: 0

      - name: Select affected distribution images
        id: select
        env:
          BASE_COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          selector=(python3 scripts/deployment/service/select_changed_images.py)
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] ||
             [[ ! "$BASE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$BASE_COMMIT_SHA" == "0000000000000000000000000000000000000000" ]]; then
            "${selector[@]}" --all >> "$GITHUB_OUTPUT"
          else
            git diff --name-only -z "$BASE_COMMIT_SHA" "$TARGET_COMMIT_SHA" |
              "${selector[@]}" --nul >> "$GITHUB_OUTPUT"
          fi

  build-scan-attest:
    needs: select-images
    if: >-
      needs.select-images.outputs.has_images == 'true' &&
      (github.event_name == 'pull_request' ||
        (github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-images.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_COMMIT_SHA }}

      - name: Apply tracked service image build override
        run: python3 scripts/deployment/service/apply_image_build_override.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0, Node 24

      - name: Materialize resolved model manifest
        id: models
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESOLVED_MODELS_JSON: ${{ vars.RESOLVED_MODELS_JSON }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("RESOLVED_MODELS_JSON", "").strip()
          if not raw:
              if os.environ["EVENT_NAME"] != "pull_request":
                  raise SystemExit("RESOLVED_MODELS_JSON repository variable is required")
              payload = {
                  "schema_version": "1.0.0",
                  "capabilities": [],
                  "mixed_model_mode": "hil-only",
              }
          else:
              payload = json.loads(raw)
              if not isinstance(payload, dict):
                  raise SystemExit("RESOLVED_MODELS_JSON must contain a JSON object")
              capabilities = payload.get("capabilities")
              if not isinstance(capabilities, list):
                  raise SystemExit("RESOLVED_MODELS_JSON.capabilities must be an array")
          canonical = json.dumps(payload, separators=(",", ":"), sort_keys=True).encode()
          digest = hashlib.sha256(canonical).hexdigest()
          rendered = canonical.decode("utf-8")
          Path("resolved-models.json").write_text(rendered, encoding="utf-8")
          Path("services/assets/resolved-models.json").write_text(rendered, encoding="utf-8")
          predicate = {
              "schema_version": "1.0.0",
              "resolved_models": {"canonical_json_sha256": digest},
          }
          Path("resolved-models.provenance.json").write_text(
              json.dumps(predicate, separators=(",", ":"), sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"digest={digest}\n")
          PY

      - name: Build image for verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0, Node 24
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.TARGET_COMMIT_SHA }}

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.72.0"
          TRIVY_ARCHIVE_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
        run: |
          archive="$(mktemp)"
          trap 'rm -f "${archive}"' EXIT
          curl --fail --location --silent --show-error \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "${archive}"
          echo "${TRIVY_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar -xzf "${archive}" -C /usr/local/bin trivy
          trivy --version

      - name: Scan local image before publication
        run: >-
          trivy image --exit-code 1 --severity MEDIUM,HIGH,CRITICAL
          --ignorefile .trivyignore.yaml
          "${REGISTRY}/${IMAGE_NAME}/${{ matrix.image }}:${IMAGE_TAG}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1, Node 24
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image and capture digest
        if: github.event_name != 'pull_request'
        id: push
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}/${{ matrix.image }}:${IMAGE_TAG}"
          push_receipt="$(mktemp)"
          trap 'rm -f "$push_receipt"' EXIT
          docker push "$image" 2>&1 | tee "$push_receipt"
          mapfile -t digests < <(
            sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}) size:.*$/\1/p' "$push_receipt"
          )
          if [[ ${#digests[@]} -ne 1 ]]; then
            echo "docker push must return exactly one immutable image digest" >&2
            exit 1
          fi
          digest="${digests[0]}"
          repository="${image%:*}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "reference=$repository@$digest" >> "$GITHUB_OUTPUT"

      - name: Select exact evidence subject
        id: subject
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_REFERENCE: ${{ steps.push.outputs.reference }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            reference="${REGISTRY}/${IMAGE_NAME}/${{ matrix.image }}:${IMAGE_TAG}"
          else
            reference="$PUSHED_REFERENCE"
            [[ "$reference" =~ @sha256:[0-9a-f]{64}$ ]] || {
              echo "published evidence subject must be digest-pinned" >&2
              exit 1
            }
          fi
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

      - name: Scan exact evidence subject
        run: >-
          trivy image --exit-code 1 --severity MEDIUM,HIGH,CRITICAL
          --ignorefile .trivyignore.yaml
          "${{ steps.subject.outputs.reference }}"

      - name: Generate CycloneDX SBOM
        run: >-
          trivy image --format cyclonedx
          --output "sbom-${{ matrix.target }}-${TARGET_COMMIT_SHA}.cdx.json"
          "${{ steps.subject.outputs.reference }}"

      - name: Generate SPDX SBOM for attestation
        run: >-
          trivy image --format spdx-json
          --output "sbom-${{ matrix.target }}-${TARGET_COMMIT_SHA}.spdx.json"
          "${{ steps.subject.outputs.reference }}"

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fdai-sbom-${{ matrix.target }}-${{ env.TARGET_COMMIT_SHA }}
          path: sbom-${{ matrix.target }}-${{ env.TARGET_COMMIT_SHA }}.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Generate build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0, Node 24
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest Core resolved model material
        if: github.event_name != 'pull_request' && matrix.service == 'core-control-plane'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0, Node 24
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          predicate-type: https://github.com/${{ github.repository }}/attestations/resolved-models/v1
          predicate-path: resolved-models.provenance.json
          push-to-registry: true

      - name: Generate SBOM attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0, Node 24
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.target }}-${{ env.TARGET_COMMIT_SHA }}.spdx.json
          push-to-registry: true
