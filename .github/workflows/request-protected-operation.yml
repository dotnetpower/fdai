name: request-protected-operation
run-name: "request-${{ inputs.operation }}-${{ inputs.environment }}-${{ inputs.commit_sha }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Protected operation to request."
        type: choice
        options:
          - console-publish
          - catalog-refresh
          - operational-history-apply
          - operational-history-certification
          - rca-reader-apply
          - core-service-apply
          - document-service-apply
        required: true
      environment:
        description: "Existing environment targeted by the protected operation."
        type: choice
        options: [dev, staging, prod]
        default: dev
      commit_sha:
        description: "Exact CI-verified commit from protected main."
        type: string
        required: true
      request_id:
        description: "Exact apply request id for a bot-owned protected apply."
        type: string
        required: false
      context_digest:
        description: "Deployment context SHA-256 for a bot-owned protected apply."
        type: string
        required: false
      plan_id:
        description: "Protected plan id for a bot-owned protected apply."
        type: string
        required: false
      plan_digest:
        description: "Protected plan SHA-256 for a bot-owned protected apply."
        type: string
        required: false
      resume_verification:
        description: "Resume verification without repeating an accepted protected apply."
        type: boolean
        default: false
        required: false
      runtime_image_revision:
        description: "Exact attested runtime image revision for an operational-history apply."
        type: string
        required: false
      plan_run_id:
        description: "Protected service plan workflow run id for a bot-owned service apply."
        type: string
        required: false
      plan_run_attempt:
        description: "Protected service plan workflow run attempt for a bot-owned service apply."
        type: string
        required: false
      image_ref:
        description: "Digest-pinned service image for a bot-owned service apply."
        type: string
        required: false
      deployment_receipt_digest:
        description: "OI-15 apply-receipt.json content SHA-256 for certification."
        type: string
        required: false
      deployment_revision:
        description: "Exact OI-15 deployment revision for certification."
        type: string
        required: false
      deployment_apply_run_id:
        description: "OI-15 protected apply workflow run containing the receipt artifact."
        type: string
        required: false
      deployment_plan_id:
        description: "OI-15 protected plan id containing the durable apply receipt."
        type: string
        required: false

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  request:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.operation == 'core-service-apply' ||
       inputs.operation == 'document-service-apply' ||
       inputs.operation == 'rca-reader-apply' ||
       inputs.operation == 'operational-history-certification' ||
       inputs.operation == 'operational-history-apply' ||
       inputs.commit_sha == github.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout protected workflow verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .github/actions/verify-protected-workflow-source
          path: .fdai-protected-workflow-verifier

      - name: Verify protected workflow source
        uses: ./.fdai-protected-workflow-verifier/.github/actions/verify-protected-workflow-source
        with:
          target-commit-sha: ${{ inputs.commit_sha }}
          workflow-path: .github/workflows/request-protected-operation.yml
          origin-url: ${{ github.server_url }}/${{ github.repository }}.git
          github-token: ${{ github.token }}

      - name: Checkout exact protected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: Checkout protected Environment verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts/deployment/azure/validate_protected_service_apply_request.py
            scripts/deployment/azure/verify-github-environment.py
          path: .fdai-protected-environment-verifier

      - name: Verify required CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          conclusion="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_COMMIT_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "required")] | sort_by(.completed_at) | last | .conclusion // ""'
          )"
          [[ "$conclusion" == "success" ]] || {
            echo "the exact commit does not have a successful required CI check." >&2
            exit 1
          }

      - name: Request bot-owned protected operation
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          TARGET_COMMIT_SHA: ${{ inputs.commit_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          APPLY_REQUEST_ID: ${{ inputs.request_id }}
          APPLY_CONTEXT_DIGEST: ${{ inputs.context_digest }}
          APPLY_PLAN_ID: ${{ inputs.plan_id }}
          APPLY_PLAN_DIGEST: ${{ inputs.plan_digest }}
          APPLY_RUNTIME_IMAGE_REVISION: ${{ inputs.runtime_image_revision }}
          APPLY_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          APPLY_PLAN_RUN_ATTEMPT: ${{ inputs.plan_run_attempt }}
          APPLY_IMAGE_REF: ${{ inputs.image_ref }}
          DEPLOYMENT_RECEIPT_DIGEST: ${{ inputs.deployment_receipt_digest }}
          DEPLOYMENT_REVISION: ${{ inputs.deployment_revision }}
          DEPLOYMENT_APPLY_RUN_ID: ${{ inputs.deployment_apply_run_id }}
          DEPLOYMENT_PLAN_ID: ${{ inputs.deployment_plan_id }}
          RESUME_VERIFICATION: ${{ inputs.resume_verification }}
        run: |
          set -euo pipefail
          verify_environment() {
            gh api "repos/$GITHUB_REPOSITORY/environments/$TARGET_ENVIRONMENT" \
              > "$RUNNER_TEMP/environment.json"
            python3 \
              .fdai-protected-environment-verifier/scripts/deployment/azure/verify-github-environment.py \
              "$RUNNER_TEMP/environment.json" --required-approvals 1
          }
          case "$OPERATION" in
            console-publish)
              target_workflow=publish-console.yml
              ;;
            catalog-refresh)
              target_workflow=refresh-catalogs.yml
              ;;
            core-service-apply|document-service-apply)
              [[ "$TARGET_ENVIRONMENT" != "prod" ]] || {
                echo "Bot-owned service apply is unavailable for production." >&2
                exit 1
              }
              if [[ "$OPERATION" == "core-service-apply" ]]; then
                service_name=core-control-plane
              else
                service_name=document-ingestion-api
              fi
              [[ "$APPLY_PLAN_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
                echo "Service apply plan run id is invalid." >&2
                exit 1
              }
              [[ "$APPLY_PLAN_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
                echo "Service apply plan run attempt is invalid." >&2
                exit 1
              }
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$APPLY_PLAN_RUN_ID" \
                > "$RUNNER_TEMP/service-plan-run.json"
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$APPLY_PLAN_RUN_ID/artifacts?per_page=100" \
                > "$RUNNER_TEMP/service-plan-artifacts.json"
              plan_artifact_name="service-plan-${service_name}-${TARGET_ENVIRONMENT}-${APPLY_PLAN_RUN_ID}-${APPLY_PLAN_RUN_ATTEMPT}"
              plan_artifact_id="$(
                jq -er --arg name "$plan_artifact_name" '
                  [.artifacts[] | select(.name == $name and .expired == false)]
                  | if length == 1 then .[0].id else error("expected one unexpired plan artifact") end
                ' "$RUNNER_TEMP/service-plan-artifacts.json"
              )"
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/artifacts/$plan_artifact_id/zip" \
                > "$RUNNER_TEMP/service-plan.zip"
              unzip -p "$RUNNER_TEMP/service-plan.zip" service-plan-metadata.json \
                > "$RUNNER_TEMP/service-plan-metadata.json"
              python3 \
                .fdai-protected-environment-verifier/scripts/deployment/azure/validate_protected_service_apply_request.py \
                --repository "$GITHUB_REPOSITORY" \
                --service "$service_name" \
                --environment "$TARGET_ENVIRONMENT" \
                --commit-sha "$TARGET_COMMIT_SHA" \
                --plan-run-id "$APPLY_PLAN_RUN_ID" \
                --plan-run-attempt "$APPLY_PLAN_RUN_ATTEMPT" \
                --plan-digest "$APPLY_PLAN_DIGEST" \
                --context-digest "$APPLY_CONTEXT_DIGEST" \
                --image-ref "$APPLY_IMAGE_REF" \
                --run-metadata "$RUNNER_TEMP/service-plan-run.json" \
                --artifacts "$RUNNER_TEMP/service-plan-artifacts.json" \
                --plan-metadata "$RUNNER_TEMP/service-plan-metadata.json"
              deployment_mode="$(jq -er '.deployment_mode' "$RUNNER_TEMP/service-plan-metadata.json")"
              dispatch_args=(
                -f ref=main
                -f "inputs[service]=$service_name"
                -f "inputs[environment]=$TARGET_ENVIRONMENT"
                -f "inputs[commit_sha]=$TARGET_COMMIT_SHA"
                -f "inputs[image_ref]=$APPLY_IMAGE_REF"
                -f "inputs[apply]=true"
                -f "inputs[plan_run_id]=$APPLY_PLAN_RUN_ID"
                -f "inputs[plan_run_attempt]=$APPLY_PLAN_RUN_ATTEMPT"
                -f "inputs[plan_digest]=$APPLY_PLAN_DIGEST"
                -f "inputs[context_digest]=$APPLY_CONTEXT_DIGEST"
              )
              case "$service_name:$deployment_mode" in
                core-control-plane:standard)
                  ;;
                core-control-plane:database-host-binding)
                  dispatch_args+=(-f "inputs[database_host_binding]=true")
                  ;;
                core-control-plane:model-binding)
                  dispatch_args+=(-f "inputs[model_binding_transition]=true")
                  ;;
                core-control-plane:database-host-binding+model-binding)
                  dispatch_args+=(
                    -f "inputs[database_host_binding]=true"
                    -f "inputs[model_binding_transition]=true"
                  )
                  ;;
                document-ingestion-api:standard)
                  ;;
                document-ingestion-api:database-host-binding)
                  dispatch_args+=(-f "inputs[database_host_binding]=true")
                  ;;
                document-ingestion-api:sharepoint-connector-enable)
                  dispatch_args+=(-f "inputs[sharepoint_connector_transition]=enable")
                  ;;
                document-ingestion-api:sharepoint-connector-disable)
                  dispatch_args+=(-f "inputs[sharepoint_connector_transition]=disable")
                  ;;
                *)
                  echo "Validated service plan has no supported dispatch mode." >&2
                  exit 1
                  ;;
              esac
              verify_environment
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/workflows/service-deploy.yml/dispatches" \
                "${dispatch_args[@]}"
              exit 0
              ;;
            operational-history-certification)
              [[ "$TARGET_ENVIRONMENT" == "dev" ]] || {
                echo "Operational-history certification is dev-only." >&2
                exit 1
              }
              [[ "$APPLY_REQUEST_ID" =~ ^certify-history-[0-9a-f]{48}$ ]] || {
                echo "Operational-history certification request id is invalid." >&2
                exit 1
              }
              [[ "$APPLY_RUNTIME_IMAGE_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
                echo "Operational-history runtime image revision is invalid." >&2
                exit 1
              }
              [[ "$APPLY_RUNTIME_IMAGE_REVISION" == "$TARGET_COMMIT_SHA" ]] || {
                echo "Operational-history runtime image revision must equal the certified source revision." >&2
                exit 1
              }
              [[ "$DEPLOYMENT_RECEIPT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
                echo "Operational-history deployment receipt digest is invalid." >&2
                exit 1
              }
              [[ "$DEPLOYMENT_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
                echo "Operational-history deployment revision is invalid." >&2
                exit 1
              }
              [[ "$DEPLOYMENT_APPLY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
                echo "Operational-history deployment apply run id is invalid." >&2
                exit 1
              }
              [[ "$DEPLOYMENT_PLAN_ID" =~ ^plan-[1-9][0-9]*-[1-9][0-9]*$ ]] || {
                echo "Operational-history deployment plan id is invalid." >&2
                exit 1
              }
              verify_environment
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/workflows/operational-history-certification.yml/dispatches" \
                -f ref=main \
                -f "inputs[environment]=$TARGET_ENVIRONMENT" \
                -f "inputs[commit_sha]=$TARGET_COMMIT_SHA" \
                -f "inputs[request_id]=$APPLY_REQUEST_ID" \
                -f "inputs[runtime_image_revision]=$APPLY_RUNTIME_IMAGE_REVISION" \
                -f "inputs[deployment_revision]=$DEPLOYMENT_REVISION" \
                -f "inputs[deployment_receipt_digest]=$DEPLOYMENT_RECEIPT_DIGEST" \
                -f "inputs[deployment_apply_run_id]=$DEPLOYMENT_APPLY_RUN_ID" \
                -f "inputs[deployment_plan_id]=$DEPLOYMENT_PLAN_ID"
              exit 0
              ;;
            operational-history-apply|rca-reader-apply)
              [[ "$TARGET_ENVIRONMENT" != "prod" ]] || {
                echo "Bot-owned protected apply is unavailable for production." >&2
                exit 1
              }
              if [[ "$OPERATION" == "operational-history-apply" ]]; then
                request_pattern='^apply-history-[0-9a-f]{48}$'
                [[ "$APPLY_RUNTIME_IMAGE_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
                  echo "Operational-history runtime image revision is invalid." >&2
                  exit 1
                }
              else
                request_pattern='^apply-rca-[0-9a-f]{48}$'
              fi
              [[ "$APPLY_REQUEST_ID" =~ $request_pattern ]] || {
                echo "Protected apply request id is invalid." >&2
                exit 1
              }
              [[ "$APPLY_CONTEXT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || {
                echo "Protected apply context digest is invalid." >&2
                exit 1
              }
              [[ "$APPLY_PLAN_ID" =~ ^plan-[1-9][0-9]*-[1-9][0-9]*$ ]] || {
                echo "Protected apply plan id is invalid." >&2
                exit 1
              }
              [[ "$APPLY_PLAN_DIGEST" =~ ^[0-9a-f]{64}$ ]] || {
                echo "Protected apply plan digest is invalid." >&2
                exit 1
              }
              verify_environment
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-dev.yml/dispatches" \
                -f ref=main \
                -f "inputs[environment]=$TARGET_ENVIRONMENT" \
                -f "inputs[apply]=true" \
                -f "inputs[request_id]=$APPLY_REQUEST_ID" \
                -f "inputs[context_digest]=$APPLY_CONTEXT_DIGEST" \
                -f "inputs[commit_sha]=$TARGET_COMMIT_SHA" \
                -f "inputs[plan_id]=$APPLY_PLAN_ID" \
                -f "inputs[plan_digest]=$APPLY_PLAN_DIGEST" \
                -f "inputs[resume_verification]=$RESUME_VERIFICATION" \
                -f "inputs[runtime_image_revision]=$APPLY_RUNTIME_IMAGE_REVISION" \
                -f "inputs[deploy_console]=false" \
                -f "inputs[deploy_operator_api]=false"
              exit 0
              ;;
            *)
              echo "unsupported protected operation: $OPERATION" >&2
              exit 1
              ;;
          esac
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$target_workflow/dispatches" \
            -f ref=main \
            -f "inputs[environment]=$TARGET_ENVIRONMENT" \
            -f "inputs[commit_sha]=$TARGET_COMMIT_SHA"
