name: cohort-readiness
run-name: "cohort-readiness-${{ inputs.commit_sha }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Protected environment that owns the cohort state store."
        type: choice
        options: [dev, staging, prod]
        default: dev
        required: true
      commit_sha:
        description: "Exact protected-main cohort policy and study revision."
        type: string
        required: true
      require_ready:
        description: "Fail unless every required cohort measure is ready."
        type: boolean
        default: false
        required: true

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: cohort-readiness-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, fdai-deploy, fdai-deploy-candidate]
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    env:
      TARGET_COMMIT_SHA: ${{ inputs.commit_sha }}
      REQUIRE_READY: ${{ inputs.require_ready }}
    steps:
      - name: Checkout protected workflow verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .github/actions/verify-protected-workflow-source
          path: .fdai-protected-workflow-verifier

      - name: Verify protected workflow source
        id: protected-source
        uses: ./.fdai-protected-workflow-verifier/.github/actions/verify-protected-workflow-source
        with:
          target-commit-sha: ${{ inputs.commit_sha }}
          workflow-path: .github/workflows/cohort-readiness.yml
          origin-url: ${{ github.server_url }}/${{ github.repository }}.git
          github-token: ${{ github.token }}

      - name: Checkout exact cohort controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.32"
          enable-cache: false

      - name: Install pinned GitHub CLI
        run: bash scripts/deployment/azure/install-pinned-github-cli.sh

      - name: Verify exact revision and required CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUIRE_READY" == "true" || "$REQUIRE_READY" == "false" ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_COMMIT_SHA" ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_COMMIT_SHA" origin/main
          git rev-list --first-parent origin/main | grep -Fx "$TARGET_COMMIT_SHA" >/dev/null
          checks="$RUNNER_TEMP/required-ci.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_COMMIT_SHA/check-runs?per_page=100" \
            > "$checks"
          jq -e \
            '[.check_runs[] | select(.name == "required" and .conclusion == "success")] |
             length >= 1' "$checks" >/dev/null

      - name: Authenticate and bind private platform state
        env:
          ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          DEPLOY_RUNNER_CLIENT_ID: ${{ vars.DEPLOY_RUNNER_CLIENT_ID }}
          DEPLOY_RUNNER_PRINCIPAL_ID: ${{ vars.DEPLOY_RUNNER_PRINCIPAL_ID }}
          OPS_RESOURCE_GROUP_NAME: ${{ vars.OPS_RESOURCE_GROUP_NAME }}
          STATE_STORAGE_ACCOUNT: ${{ vars.STATE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          bash scripts/deployment/azure/login-deploy-identity.sh \
            "$ARM_SUBSCRIPTION_ID" "$AZURE_TENANT_ID" \
            "$DEPLOY_RUNNER_CLIENT_ID" "$DEPLOY_RUNNER_PRINCIPAL_ID"
          cp infra/backend.azurerm.tf.example infra/backend.tf
          terraform -chdir=infra init -input=false \
            -backend-config="resource_group_name=$OPS_RESOURCE_GROUP_NAME" \
            -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=fdai-${{ inputs.environment }}.tfstate"

      - name: Read aggregate cohort readiness
        id: readiness
        run: |
          set -euo pipefail
          vault_uri="$(terraform -chdir=infra output -raw key_vault_uri)"
          [[ "$vault_uri" =~ ^https://([a-z0-9-]{3,24})[.]vault[.]azure[.]net/?$ ]] || {
            echo "Terraform key_vault_uri is not an Azure Key Vault HTTPS URI" >&2
            exit 1
          }
          migration_secret_name="$(
            jq -er '.services["core-control-plane"].migration_dsn_secret_name' \
              scripts/deployment/service/service-matrix.json
          )"
          migration_dsn="$(timeout 60s az keyvault secret show \
            --vault-name "${BASH_REMATCH[1]}" --name "$migration_secret_name" \
            --query value --only-show-errors --output tsv)"
          [[ -n "$migration_dsn" ]]
          echo "::add-mask::$migration_dsn"
          export FDAI_STATE_STORE_DSN="$migration_dsn"
          receipt="$RUNNER_TEMP/cohort-readiness-receipt.json"
          TARGET_COMMIT_SHA="$TARGET_COMMIT_SHA" \
            uv run --frozen --package fdai-core-control-plane python - <<'PY' > "$receipt"
          import asyncio
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          import psycopg

          from fdai.core.measurement.cohort_claim_policy import load_cohort_claim_policy
          from fdai.delivery.measurement.cohort_inventory import (
              PostgresCohortEvidenceInventorySource,
          )

          async def main() -> None:
              policy = load_cohort_claim_policy(Path("config/sre-cohort-claim-policy.json"))
              evaluated_at = datetime.now(tz=UTC)
              try:
                  inventory = await PostgresCohortEvidenceInventorySource(
                      dsn=os.environ["FDAI_STATE_STORE_DSN"],
                      policy=policy,
                      expected_revision=os.environ["TARGET_COMMIT_SHA"],
                  ).inventory(evaluated_at=evaluated_at)
              except psycopg.OperationalError as error:
                  if error.sqlstate is not None:
                      raise
                  inventory_record = {
                      "window_start": None,
                      "window_end": evaluated_at.isoformat(),
                      "candidate_action_outcomes": None,
                      "candidate_resolved_incidents": None,
                      "candidate_changes": None,
                      "candidate_cost_units": None,
                      "metric_counts": {},
                      "guard_counts": {},
                      "minimum_sample_size": policy.minimum_sample_size,
                      "ready": False,
                      "missing": ["state_store_unavailable"],
                      "availability": "unavailable",
                      "reason_code": "state_store_connection_failed",
                  }
              else:
                  inventory_record = {
                      **inventory.to_log_record(),
                      "availability": "available",
                      "reason_code": None,
                  }
              body = {
                  "schema_version": "fdai.cohort-readiness-receipt.v2",
                  "fdai_revision": os.environ["TARGET_COMMIT_SHA"],
                  **inventory_record,
                  "execution_authority": False,
                  "claim_eligibility_authority": False,
                  "mutation_performed": False,
              }
              encoded = json.dumps(
                  body,
                  allow_nan=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode()
              print(json.dumps(
                  {
                      **body,
                      "receipt_digest": "sha256:" + hashlib.sha256(encoded).hexdigest(),
                  },
                  separators=(",", ":"),
                  sort_keys=True,
              ))

          asyncio.run(main())
          PY
          jq -e '
            .schema_version == "fdai.cohort-readiness-receipt.v2" and
            (.ready | type == "boolean") and
            (.missing | type == "array") and
            (
              (.availability == "available" and .reason_code == null) or
              (
                .availability == "unavailable" and
                .reason_code == "state_store_connection_failed" and
                .ready == false and
                .missing == ["state_store_unavailable"]
              )
            ) and
            .execution_authority == false and
            .claim_eligibility_authority == false and
            .mutation_performed == false and
            (.receipt_digest | test("^sha256:[0-9a-f]{64}$"))
          ' "$receipt" >/dev/null
          {
            echo "### Cohort readiness"
            echo
            echo "- Ready: \`$(jq -r .ready "$receipt")\`"
            echo "- Availability: \`$(jq -r .availability "$receipt")\`"
            echo "- Reason: \`$(jq -r '.reason_code // \"none\"' "$receipt")\`"
            echo "- Missing measure count: \`$(jq -r '.missing | length' "$receipt")\`"
            echo "- Execution authority: \`false\`"
            echo "- Claim eligibility authority: \`false\`"
            echo "- Mutation performed: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REQUIRE_READY" == "true" ]]; then
            jq -e '.ready == true' "$receipt" >/dev/null
          fi
          echo "receipt=$receipt" >> "$GITHUB_OUTPUT"
          unset FDAI_STATE_STORE_DSN migration_dsn

      - name: Attest aggregate readiness receipt
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0, Node 24
        with:
          subject-path: ${{ steps.readiness.outputs.receipt }}

      - name: Upload aggregate readiness evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cohort-readiness-${{ inputs.commit_sha }}
          path: |
            ${{ steps.readiness.outputs.receipt }}
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

      - name: Clean private state material
        if: always() && steps.protected-source.outcome == 'success'
        run: |
          unset FDAI_STATE_STORE_DSN migration_dsn
          rm -f infra/backend.tf
          rm -rf infra/.terraform
