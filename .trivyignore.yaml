vulnerabilities:
  - id: CVE-2026-63209
    paths:
      - usr/local/bin/opa
    statement: klauspost/compress v1.18.5 zstd dictionary-processing finding in the OPA build. FDAI invokes OPA only as a local `opa eval --stdin-input --data <file>` subprocess; it builds, loads, and serves no compressed bundle and parses no untrusted zstd dictionary. The Go 1.27.3 rebuild does not carry the fix; it needs an OPA release or build override with klauspost/compress 1.18.7. Remove this entry then or at expiry (#2383).
    expired_at: 2026-11-12
