[package]
name = "fdai-console-v4"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure-Rust Axum server for FDAI Console v4 (zero Python, zero Node runtime)"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
fdai-adapter-postgres = { path = "../crates/adapters/fdai-adapter-postgres" }
fdai-contracts = { path = "../crates/contracts/fdai-contracts" }
fdai-domain-core = { path = "../crates/core/fdai-domain-core" }
futures-util = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
