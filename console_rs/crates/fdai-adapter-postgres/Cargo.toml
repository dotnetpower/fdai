[package]
name = "fdai-adapter-postgres"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure-Rust PostgreSQL v3 wire protocol + TLS + SCRAM-SHA-256 client for FDAI Console v4"

[lints]
workspace = true

[dependencies]
base64 = "0.22"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
