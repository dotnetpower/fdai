<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decision icon variants - FDAI Console</title>
  <link rel="stylesheet" href="assets/calm-slate.css?v=page-context-v3" />
  <script src="assets/calm-slate.js?v=page-context-v3" defer></script>
  <style>
    .decision-page {
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: 42px 32px 72px;
    }
    .decision-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--cs-hairline);
    }
    .decision-header p {
      max-width: 62ch;
      margin: 5px 0 0;
      color: var(--cs-text-soft);
      font-size: var(--cs-type-compact-size);
    }
    .decision-header-state {
      flex: 0 0 auto;
      color: var(--cs-text-soft);
      font-size: var(--cs-type-caption-size);
      font-weight: 600;
    }
    .decision-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }
    .decision-option {
      position: relative;
      display: grid;
      grid-template-rows: 178px auto auto;
      min-width: 0;
      min-height: 360px;
      overflow: hidden;
      padding: 0;
      border: 1px solid var(--cs-hairline);
      border-radius: var(--cs-radius);
      background: var(--cs-card);
      color: var(--cs-text);
      box-shadow: 0 5px 18px rgba(46, 54, 64, .05);
      cursor: pointer;
      font: inherit;
      text-align: left;
      transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
    }
    .decision-option:hover {
      border-color: color-mix(in srgb, var(--cs-steel) 38%, var(--cs-hairline));
      box-shadow: 0 12px 28px rgba(46, 54, 64, .09);
    }
    .decision-option:focus-visible {
      outline: 2px solid var(--cs-steel);
      outline-offset: 3px;
    }
    .decision-option[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--cs-steel) 58%, var(--cs-hairline));
      background: color-mix(in srgb, var(--cs-steel) 3%, var(--cs-card));
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--cs-steel) 10%, transparent), 0 13px 30px rgba(46, 54, 64, .1);
    }
    .decision-option[aria-pressed="true"]::after {
      position: absolute;
      top: 12px;
      right: 12px;
      display: inline-flex;
      min-height: 22px;
      align-items: center;
      padding: 2px 7px;
      border-radius: var(--cs-radius-pill);
      background: var(--cs-steel);
      color: #fff;
      content: "Selected";
      font-size: 9px;
      font-weight: 700;
    }
    .decision-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--cs-hairline);
      background: color-mix(in srgb, var(--cs-terracotta) 5%, var(--cs-card));
    }
    .decision-icon {
      width: 92px;
      height: 92px;
      overflow: visible;
      fill: none;
      stroke: var(--cs-terracotta);
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .decision-icon .approve { stroke: var(--cs-sage); }
    .decision-icon .deny { stroke: var(--cs-dusty-red); }
    .decision-icon .route { stroke: var(--cs-terracotta); }
    .decision-copy { padding: 18px 16px 10px; }
    .decision-index {
      display: block;
      margin-bottom: 7px;
      color: var(--cs-text-soft);
      font-family: var(--cs-font-mono);
      font-size: 10px;
      font-weight: 600;
    }
    .decision-copy strong {
      display: block;
      font-size: var(--cs-type-panel-title-size);
      line-height: 1.35;
    }
    .decision-copy span:last-child {
      display: block;
      margin-top: 7px;
      color: var(--cs-text-soft);
      font-size: var(--cs-type-caption-size);
      line-height: 1.45;
    }
    .decision-actual {
      display: flex;
      align-items: center;
      gap: 10px;
      align-self: end;
      margin: 0 16px 16px;
      padding-top: 12px;
      border-top: 1px solid var(--cs-hairline);
      color: var(--cs-text-soft);
      font-size: 10px;
      font-weight: 600;
    }
    .decision-actual-box {
      display: inline-flex;
      width: 56px;
      height: 56px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      border: 1px solid color-mix(in srgb, var(--cs-terracotta) 16%, var(--cs-hairline));
      border-radius: 14px;
      background: color-mix(in srgb, var(--cs-terracotta) 9%, var(--cs-card));
    }
    .decision-actual .decision-icon { width: 42px; height: 42px; }
    .decision-selection {
      display: flex;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      border-top: 1px solid var(--cs-hairline);
      border-bottom: 1px solid var(--cs-hairline);
      color: var(--cs-text-soft);
      font-size: var(--cs-type-label-size);
    }
    .decision-selection strong { color: var(--cs-text); font-weight: 650; }
    @media (max-width: 1050px) {
      .decision-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .decision-page { padding: 32px 18px 56px; }
      .decision-header { align-items: flex-start; flex-direction: column; }
      .decision-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .decision-option { min-height: 338px; }
    }
    @media (max-width: 460px) {
      .decision-grid { grid-template-columns: 1fr; }
      .decision-option {
        grid-template-columns: 138px minmax(0, 1fr);
        grid-template-rows: auto auto;
        min-height: 190px;
      }
      .decision-visual { grid-row: 1 / 3; border-right: 1px solid var(--cs-hairline); border-bottom: 0; }
      .decision-icon { width: 76px; height: 76px; }
      .decision-copy { padding: 20px 14px 8px; }
      .decision-actual { margin: 0 14px 14px; }
      .decision-option[aria-pressed="true"]::after { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .decision-option { transition: none; }
    }
  </style>
</head>
<body>
  <main class="decision-page">
    <header class="decision-header">
      <div>
        <h1>Decision icon variants</h1>
        <p>FDAI 운영 포커스 카드에 사용할 판단 아이콘 후보입니다. 각 안은 확대 보기와 실제 적용 크기를 함께 표시합니다.</p>
      </div>
      <span class="decision-header-state">Temporary comparison · 5 options</span>
    </header>

    <section class="decision-grid" aria-label="판단 아이콘 후보">
      <button class="decision-option" type="button" aria-pressed="false" data-option="01 Verdict pair">
        <span class="decision-visual">
          <svg class="decision-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="approve"><circle cx="7" cy="12" r="5"></circle><path d="m4.6 12 1.7 1.7 3.4-3.6"></path></g><g class="deny"><circle cx="17" cy="12" r="5"></circle><path d="m14.8 9.8 4.4 4.4m0-4.4-4.4 4.4"></path></g></svg>
        </span>
        <span class="decision-copy"><span class="decision-index">01</span><strong>Verdict pair</strong><span>승인과 거절을 가장 직접적인 결과 쌍으로 표현.</span></span>
        <span class="decision-actual"><span class="decision-actual-box" aria-hidden="true"></span>42px icon</span>
      </button>

      <button class="decision-option" type="button" aria-pressed="false" data-option="02 Split route">
        <span class="decision-visual">
          <svg class="decision-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="route"><path d="M12 21v-7M12 14 6 8M12 14l6-6"></path></g><path class="approve" d="m3.8 7.8 1.5 1.5L8.8 5.5"></path><path class="deny" d="m15.7 5.7 4.6 4.6m0-4.6-4.6 4.6"></path></svg>
        </span>
        <span class="decision-copy"><span class="decision-index">02</span><strong>Split route</strong><span>하나의 입력이 두 결과로 갈라지는 가장 단순한 경로.</span></span>
        <span class="decision-actual"><span class="decision-actual-box" aria-hidden="true"></span>42px icon</span>
      </button>

      <button class="decision-option" type="button" aria-pressed="false" data-option="03 Decision diamond">
        <span class="decision-visual">
          <svg class="decision-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="route"><path d="m12 7 5 5-5 5-5-5 5-5Z"></path><path d="M12 21v-4M7 12H4M17 12h3"></path></g><path class="approve" d="m1.8 11.8 1.3 1.3 2.5-2.7"></path><path class="deny" d="m18.3 10.3 3.4 3.4m0-3.4-3.4 3.4"></path></svg>
        </span>
        <span class="decision-copy"><span class="decision-index">03</span><strong>Decision diamond</strong><span>중앙 판단점과 좌우 결과를 전통적인 프로세스로 표현.</span></span>
        <span class="decision-actual"><span class="decision-actual-box" aria-hidden="true"></span>42px icon</span>
      </button>

      <button class="decision-option" type="button" aria-pressed="false" data-option="04 Gate pair">
        <span class="decision-visual">
          <svg class="decision-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="approve"><rect x="2.5" y="3.5" width="8" height="8" rx="2"></rect><path d="m4.5 7.5 1.3 1.3 2.6-2.8"></path></g><g class="deny"><rect x="13.5" y="3.5" width="8" height="8" rx="2"></rect><path d="m15.8 5.8 3.4 3.4m0-3.4-3.4 3.4"></path></g><g class="route"><path d="M6.5 11.5v3h11v-3M12 14.5V21"></path></g></svg>
        </span>
        <span class="decision-copy"><span class="decision-index">04</span><strong>Gate pair</strong><span>독립된 승인·거절 게이트와 하나의 입력 경로.</span></span>
        <span class="decision-actual"><span class="decision-actual-box" aria-hidden="true"></span>42px icon</span>
      </button>

      <button class="decision-option" type="button" aria-pressed="true" data-option="05 Judgment balance">
        <span class="decision-visual">
          <svg class="decision-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="route"><path d="M12 4v16M5 8h14M8 8v3M16 8v3M9 20h6"></path></g><g class="approve"><circle cx="8" cy="14" r="3"></circle><path d="m6.6 14 1 1 1.8-2"></path></g><g class="deny"><circle cx="16" cy="14" r="3"></circle><path d="m14.7 12.7 2.6 2.6m0-2.6-2.6 2.6"></path></g></svg>
        </span>
        <span class="decision-copy"><span class="decision-index">05</span><strong>Judgment balance</strong><span>비교와 판단의 의미를 저울 형태로 직접 전달.</span></span>
        <span class="decision-actual"><span class="decision-actual-box" aria-hidden="true"></span>42px icon</span>
      </button>
    </section>

    <div class="decision-selection" role="status" aria-live="polite">Selected <strong id="selected-option">05 Judgment balance</strong></div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var options = Array.from(document.querySelectorAll(".decision-option"));
      var selected = document.getElementById("selected-option");
      options.forEach(function (option) {
        var preview = option.querySelector(".decision-actual-box");
        var icon = option.querySelector(".decision-visual .decision-icon").cloneNode(true);
        preview.appendChild(icon);
        option.addEventListener("click", function () {
          options.forEach(function (candidate) {
            candidate.setAttribute("aria-pressed", String(candidate === option));
          });
          selected.textContent = option.dataset.option;
        });
      });
    });
  </script>
</body>
</html>
