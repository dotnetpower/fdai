<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decision icon variants - FDAI Console</title>
  <link rel="stylesheet" href="assets/calm-slate.css?v=page-context-v3" />
  <script src="assets/calm-slate.js?v=page-context-v3" defer></script>
  <style>
    .decision-page {
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: 42px 32px 72px;
    }
    .decision-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--cs-hairline);
    }
    .decision-header p {
      max-width: 62ch;
      margin: 5px 0 0;
      color: var(--cs-text-soft);
      font-size: var(--cs-type-compact-size);
    }
    .decision-header-state {
      flex: 0 0 auto;
      color: var(--cs-text-soft);
      font-size: var(--cs-type-caption-size);
      font-weight: 600;
    }
    .decision-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }
    .decision-option {
      position: relative;
      display: grid;
      grid-template-rows: 178px auto auto;
      min-width: 0;
      min-height: 360px;
      overflow: hidden;
      padding: 0;
      border: 1px solid var(--cs-hairline);
      border-radius: var(--cs-radius);
      background: var(--cs-card);
      color: var(--cs-text);
      box-shadow: 0 5px 18px rgba(46, 54, 64, .05);
      cursor: pointer;
      font: inherit;
      text-align: left;
      transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
    }
    .decision-option:hover {
      border-color: color-mix(in srgb, var(--cs-steel) 38%, var(--cs-hairline));
      box-shadow: 0 12px 28px rgba(46, 54, 64, .09);
    }
    .decision-option:focus-visible {
      outline: 2px solid var(--cs-steel);
      outline-offset: 3px;
    }
    .decision-option[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--cs-steel) 58%, var(--cs-hairline));
      background: color-mix(in srgb, var(--cs-steel) 3%, var(--cs-card));
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--cs-steel) 10%, transparent), 0 13px 30px rgba(46, 54, 64, .1);
    }
    .decision-option[aria-pressed="true"]::after {
      position: absolute;
      top: 12px;
      right: 12px;
      display: inline-flex;
      min-height: 22px;
      align-items: center;
      padding: 2px 7px;
      border-radius: var(--cs-radius-pill);
      background: var(--cs-steel);
      color: #fff;
      content: "Selected";
      font-size: 9px;
      font-weight: 700;
    }
    .decision-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--cs-hairline);
      background: color-mix(in srgb, var(--cs-terracotta) 5%, var(--cs-card));
    }
    .decision-icon {
      width: 92px;
      height: 92px;
      overflow: visible;
      fill: none;
      stroke: var(--cs-terracotta);
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .decision-icon .symbol { stroke: var(--cs-steel); }
    .decision-copy { padding: 18px 16px 10px; }
    .decision-index {
      display: block;
      margin-bottom: 7px;
      color: var(--cs-text-soft);
      font-family: var(--cs-font-mono);
      font-size: 10px;
      font-weight: 600;
    }
    .decision-copy strong {
      display: block;
      font-size: var(--cs-type-panel-title-size);
      line-height: 1.35;
    }
    .decision-copy span:last-child {
      display: block;
      margin-top: 7px;
      color: var(--cs-text-soft);
      font-size: var(--cs-type-caption-size);
      line-height: 1.45;
    }
    .decision-actual {
      display: flex;
      align-items: center;
      gap: 10px;
      align-self: end;
      margin: 0 16px 16px;
      padding-top: 12px;
      border-top: 1px solid var(--cs-hairline);
      color: var(--cs-text-soft);
      font-size: 10px;
      font-weight: 600;
    }
    .decision-actual-box {
      display: inline-flex;
      width: 56px;
      height: 56px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      border: 1px solid color-mix(in srgb, var(--cs-terracotta) 16%, var(--cs-hairline));
      border-radius: 14px;
      background: color-mix(in srgb, var(--cs-terracotta) 9%, var(--cs-card));
    }
    .decision-actual .decision-icon { width: 42px; height: 42px; }
    .decision-selection {
      display: flex;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      border-top: 1px solid var(--cs-hairline);
      border-bottom: 1px solid var(--cs-hairline);
      color: var(--cs-text-soft);
      font-size: var(--cs-type-label-size);
    }
    .decision-selection strong { color: var(--cs-text); font-weight: 650; }
    @media (max-width: 1050px) {
      .decision-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .decision-page { padding: 32px 18px 56px; }
      .decision-header { align-items: flex-start; flex-direction: column; }
      .decision-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .decision-option { min-height: 338px; }
    }
    @media (max-width: 460px) {
      .decision-grid { grid-template-columns: 1fr; }
      .decision-option {
        grid-template-columns: 138px minmax(0, 1fr);
        grid-template-rows: auto auto;
        min-height: 190px;
      }
      .decision-visual { grid-row: 1 / 3; border-right: 1px solid var(--cs-hairline); border-bottom: 0; }
      .decision-icon { width: 76px; height: 76px; }
      .decision-copy { padding: 20px 14px 8px; }
      .decision-actual { margin: 0 14px 14px; }
      .decision-option[aria-pressed="true"]::after { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .decision-option { transition: none; }
    }
  </style>
</head>
<body>
  <main class="decision-page">
    <header class="decision-header">
      <div>
        <h1>Decision icon variants</h1>
        <p>FDAI 운영 포커스 카드에 사용할 판단 아이콘 후보입니다. 각 안은 확대 보기와 실제 적용 크기를 함께 표시합니다.</p>
      </div>
      <span class="decision-header-state">Temporary comparison · 5 options</span>
    </header>

    <section class="decision-grid" aria-label="판단 아이콘 후보">
      <button class="decision-option" type="button" aria-pressed="false" data-option="01 Decision diamond">
        <span class="decision-visual">
          <svg class="decision-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="symbol"><path d="m12 7 5 5-5 5-5-5 5-5Z"></path><path d="M12 3v4M7 12H3M17 12h4M12 17v4"></path><path d="m3 12 2-2m-2 2 2 2m16-2-2-2m2 2-2 2"></path></g></svg>
        </span>
        <span class="decision-copy"><span class="decision-index">01</span><strong>Decision diamond</strong><span>플로차트에서 가장 일반적으로 쓰는 의사결정 기호.</span></span>
        <span class="decision-actual"><span class="decision-actual-box" aria-hidden="true"></span>42px icon</span>
      </button>

      <button class="decision-option" type="button" aria-pressed="false" data-option="02 Signpost">
        <span class="decision-visual">
          <svg class="decision-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="symbol"><path d="M12 21V4"></path><path d="M12 6H5l-2 3 2 3h7"></path><path d="M12 11h7l2 3-2 3h-7"></path></g></svg>
        </span>
        <span class="decision-copy"><span class="decision-index">02</span><strong>Signpost</strong><span>여러 선택지 가운데 방향을 고르는 익숙한 표지판.</span></span>
        <span class="decision-actual"><span class="decision-actual-box" aria-hidden="true"></span>42px icon</span>
      </button>

      <button class="decision-option" type="button" aria-pressed="true" data-option="03 Checklist">
        <span class="decision-visual">
          <svg class="decision-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="symbol"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 3.5V2h6v1.5"></path><path d="m8 9 1.5 1.5L12 8M14 9h2M8 15l1.5 1.5L12 14M14 15h2"></path></g></svg>
        </span>
        <span class="decision-copy"><span class="decision-index">03</span><strong>Checklist</strong><span>판단 조건을 순서대로 검토하고 확인하는 형태.</span></span>
        <span class="decision-actual"><span class="decision-actual-box" aria-hidden="true"></span>42px icon</span>
      </button>

      <button class="decision-option" type="button" aria-pressed="false" data-option="04 Balance scale">
        <span class="decision-visual">
          <svg class="decision-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="symbol"><path d="M12 3v18M5 7h14M8 7l-4 8m12-8 4 8M8 21h8"></path><path d="M2 15h4a2 2 0 0 1-4 0Zm16 0h4a2 2 0 0 1-4 0Z"></path></g></svg>
        </span>
        <span class="decision-copy"><span class="decision-index">04</span><strong>Balance scale</strong><span>두 조건을 비교해 판단한다는 의미가 가장 직접적인 저울.</span></span>
        <span class="decision-actual"><span class="decision-actual-box" aria-hidden="true"></span>42px icon</span>
      </button>

      <button class="decision-option" type="button" aria-pressed="false" data-option="05 Gavel">
        <span class="decision-visual">
          <svg class="decision-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="symbol"><path d="m14 5 5 5M12 7l5 5M4 21l8.5-8.5M10 5l4-4 6 6-4 4-6-6ZM3 18l3 3"></path><path d="M12 21h9"></path></g></svg>
        </span>
        <span class="decision-copy"><span class="decision-index">05</span><strong>Gavel</strong><span>검토를 끝내고 최종 판단을 내린다는 범용 상징.</span></span>
        <span class="decision-actual"><span class="decision-actual-box" aria-hidden="true"></span>42px icon</span>
      </button>
    </section>

    <div class="decision-selection" role="status" aria-live="polite">Selected <strong id="selected-option">03 Checklist</strong></div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var options = Array.from(document.querySelectorAll(".decision-option"));
      var selected = document.getElementById("selected-option");
      options.forEach(function (option) {
        var preview = option.querySelector(".decision-actual-box");
        var icon = option.querySelector(".decision-visual .decision-icon").cloneNode(true);
        preview.appendChild(icon);
        option.addEventListener("click", function () {
          options.forEach(function (candidate) {
            candidate.setAttribute("aria-pressed", String(candidate === option));
          });
          selected.textContent = option.dataset.option;
        });
      });
    });
  </script>
</body>
</html>
