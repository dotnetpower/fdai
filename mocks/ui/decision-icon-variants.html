<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decision icon variants - FDAI Console</title>
  <link rel="stylesheet" href="assets/calm-slate.css?v=page-context-v3" />
  <script src="assets/calm-slate.js?v=page-context-v3" defer></script>
  <style>
    .decision-page {
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: 42px 32px 72px;
    }
    .decision-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--cs-hairline);
    }
    .decision-header p {
      max-width: 62ch;
      margin: 5px 0 0;
      color: var(--cs-text-soft);
      font-size: var(--cs-type-compact-size);
    }
    .decision-header-state {
      flex: 0 0 auto;
      color: var(--cs-text-soft);
      font-size: var(--cs-type-caption-size);
      font-weight: 600;
    }
    .decision-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }
    .decision-option {
      position: relative;
      display: grid;
      grid-template-rows: 178px auto auto;
      min-width: 0;
      min-height: 360px;
      overflow: hidden;
      padding: 0;
      border: 1px solid var(--cs-hairline);
      border-radius: var(--cs-radius);
      background: var(--cs-card);
      color: var(--cs-text);
      box-shadow: 0 5px 18px rgba(46, 54, 64, .05);
      cursor: pointer;
      font: inherit;
      text-align: left;
      transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
    }
    .decision-option:hover {
      border-color: color-mix(in srgb, var(--cs-steel) 38%, var(--cs-hairline));
      box-shadow: 0 12px 28px rgba(46, 54, 64, .09);
    }
    .decision-option:focus-visible {
      outline: 2px solid var(--cs-steel);
      outline-offset: 3px;
    }
    .decision-option[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--cs-steel) 58%, var(--cs-hairline));
      background: color-mix(in srgb, var(--cs-steel) 3%, var(--cs-card));
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--cs-steel) 10%, transparent), 0 13px 30px rgba(46, 54, 64, .1);
    }
    .decision-option[aria-pressed="true"]::after {
      position: absolute;
      top: 12px;
      right: 12px;
      display: inline-flex;
      min-height: 22px;
      align-items: center;
      padding: 2px 7px;
      border-radius: var(--cs-radius-pill);
      background: var(--cs-steel);
      color: #fff;
      content: "Selected";
      font-size: 9px;
      font-weight: 700;
    }
    .decision-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--cs-hairline);
      background: color-mix(in srgb, var(--cs-terracotta) 5%, var(--cs-card));
    }
    .decision-icon {
      width: 92px;
      height: 92px;
      overflow: visible;
      fill: none;
      stroke: var(--cs-terracotta);
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .decision-icon .evidence { stroke: var(--cs-steel); }
    .decision-icon .decision { stroke: var(--cs-terracotta); }
    .decision-icon .outcome { stroke: var(--cs-sage); }
    .decision-copy { padding: 18px 16px 10px; }
    .decision-index {
      display: block;
      margin-bottom: 7px;
      color: var(--cs-text-soft);
      font-family: var(--cs-font-mono);
      font-size: 10px;
      font-weight: 600;
    }
    .decision-copy strong {
      display: block;
      font-size: var(--cs-type-panel-title-size);
      line-height: 1.35;
    }
    .decision-copy span:last-child {
      display: block;
      margin-top: 7px;
      color: var(--cs-text-soft);
      font-size: var(--cs-type-caption-size);
      line-height: 1.45;
    }
    .decision-actual {
      display: flex;
      align-items: center;
      gap: 10px;
      align-self: end;
      margin: 0 16px 16px;
      padding-top: 12px;
      border-top: 1px solid var(--cs-hairline);
      color: var(--cs-text-soft);
      font-size: 10px;
      font-weight: 600;
    }
    .decision-actual-box {
      display: inline-flex;
      width: 56px;
      height: 56px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      border: 1px solid color-mix(in srgb, var(--cs-terracotta) 16%, var(--cs-hairline));
      border-radius: 14px;
      background: color-mix(in srgb, var(--cs-terracotta) 9%, var(--cs-card));
    }
    .decision-actual .decision-icon { width: 42px; height: 42px; }
    .decision-selection {
      display: flex;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      border-top: 1px solid var(--cs-hairline);
      border-bottom: 1px solid var(--cs-hairline);
      color: var(--cs-text-soft);
      font-size: var(--cs-type-label-size);
    }
    .decision-selection strong { color: var(--cs-text); font-weight: 650; }
    @media (max-width: 1050px) {
      .decision-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .decision-page { padding: 32px 18px 56px; }
      .decision-header { align-items: flex-start; flex-direction: column; }
      .decision-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .decision-option { min-height: 338px; }
    }
    @media (max-width: 460px) {
      .decision-grid { grid-template-columns: 1fr; }
      .decision-option {
        grid-template-columns: 138px minmax(0, 1fr);
        grid-template-rows: auto auto;
        min-height: 190px;
      }
      .decision-visual { grid-row: 1 / 3; border-right: 1px solid var(--cs-hairline); border-bottom: 0; }
      .decision-icon { width: 76px; height: 76px; }
      .decision-copy { padding: 20px 14px 8px; }
      .decision-actual { margin: 0 14px 14px; }
      .decision-option[aria-pressed="true"]::after { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .decision-option { transition: none; }
    }
  </style>
</head>
<body>
  <main class="decision-page">
    <header class="decision-header">
      <div>
        <h1>Decision icon variants</h1>
        <p>FDAI 운영 포커스 카드에 사용할 판단 아이콘 후보입니다. 각 안은 확대 보기와 실제 적용 크기를 함께 표시합니다.</p>
      </div>
      <span class="decision-header-state">Temporary comparison · 5 options</span>
    </header>

    <section class="decision-grid" aria-label="판단 아이콘 후보">
      <button class="decision-option" type="button" aria-pressed="true" data-option="01 Evidence convergence">
        <span class="decision-visual">
          <svg class="decision-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="evidence"><path d="M4 5h4M4 12h4M4 19h4"></path><path d="M8 5c4 0 4 4 6 5M8 12h5M8 19c4 0 4-4 6-5"></path></g><g class="decision"><path d="m16 9 3 3-3 3-3-3 3-3Z"></path></g><g class="outcome"><path d="M19 12h2"></path></g></svg>
        </span>
        <span class="decision-copy"><span class="decision-index">01</span><strong>Evidence convergence</strong><span>서로 다른 근거가 하나의 판단점으로 수렴하는 흐름.</span></span>
        <span class="decision-actual"><span class="decision-actual-box" aria-hidden="true"></span>42px icon</span>
      </button>

      <button class="decision-option" type="button" aria-pressed="false" data-option="02 Decision lens">
        <span class="decision-visual">
          <svg class="decision-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="evidence"><circle cx="12" cy="12" r="8"></circle><path d="M4 12h16M12 4c-2.5 2.2-3.5 4.9-3.5 8s1 5.8 3.5 8M12 4c2.5 2.2 3.5 4.9 3.5 8s-1 5.8-3.5 8"></path></g><g class="decision"><path d="m12 8.5 3.5 3.5-3.5 3.5L8.5 12 12 8.5Z"></path></g></svg>
        </span>
        <span class="decision-copy"><span class="decision-index">02</span><strong>Decision lens</strong><span>전체 맥락을 통과해 중심 판단점을 찾는 관찰 렌즈.</span></span>
        <span class="decision-actual"><span class="decision-actual-box" aria-hidden="true"></span>42px icon</span>
      </button>

      <button class="decision-option" type="button" aria-pressed="false" data-option="03 Threshold gate">
        <span class="decision-visual">
          <svg class="decision-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="evidence"><path d="M5 19V8M10 19V5M15 19v-7M20 19V9"></path></g><g class="decision"><path d="M3 11h18"></path><path d="m12 8 3 3-3 3-3-3 3-3Z"></path></g><g class="outcome"><path d="M5 21h15"></path></g></svg>
        </span>
        <span class="decision-copy"><span class="decision-index">03</span><strong>Threshold gate</strong><span>근거 신호가 공통 임계선을 통과해 판단되는 순간.</span></span>
        <span class="decision-actual"><span class="decision-actual-box" aria-hidden="true"></span>42px icon</span>
      </button>

      <button class="decision-option" type="button" aria-pressed="false" data-option="04 Verifier seal">
        <span class="decision-visual">
          <svg class="decision-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="evidence"><path d="m12 3 7 4v5c0 4.4-2.5 7.3-7 9-4.5-1.7-7-4.6-7-9V7l7-4Z"></path><path d="M8 9h8M8 12h5"></path></g><g class="decision"><circle cx="14.5" cy="14.5" r="2.5"></circle><path d="M14.5 12v5M12 14.5h5"></path></g></svg>
        </span>
        <span class="decision-copy"><span class="decision-index">04</span><strong>Verifier seal</strong><span>기록된 근거가 검증 경계를 거쳐 결정으로 봉인되는 형태.</span></span>
        <span class="decision-actual"><span class="decision-actual-box" aria-hidden="true"></span>42px icon</span>
      </button>

      <button class="decision-option" type="button" aria-pressed="false" data-option="05 Consensus core">
        <span class="decision-visual">
          <svg class="decision-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="evidence"><circle cx="8" cy="9" r="4.5"></circle><circle cx="16" cy="9" r="4.5"></circle><circle cx="12" cy="16" r="4.5"></circle></g><g class="decision"><path d="m12 8.5 3.5 3.5-3.5 3.5L8.5 12 12 8.5Z"></path></g><g class="outcome"><circle cx="12" cy="12" r="1"></circle></g></svg>
        </span>
        <span class="decision-copy"><span class="decision-index">05</span><strong>Consensus core</strong><span>겹치는 관점의 공통 영역에서 결정 핵심이 형성되는 형태.</span></span>
        <span class="decision-actual"><span class="decision-actual-box" aria-hidden="true"></span>42px icon</span>
      </button>
    </section>

    <div class="decision-selection" role="status" aria-live="polite">Selected <strong id="selected-option">01 Evidence convergence</strong></div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var options = Array.from(document.querySelectorAll(".decision-option"));
      var selected = document.getElementById("selected-option");
      options.forEach(function (option) {
        var preview = option.querySelector(".decision-actual-box");
        var icon = option.querySelector(".decision-visual .decision-icon").cloneNode(true);
        preview.appendChild(icon);
        option.addEventListener("click", function () {
          options.forEach(function (candidate) {
            candidate.setAttribute("aria-pressed", String(candidate === option));
          });
          selected.textContent = option.dataset.option;
        });
      });
    });
  </script>
</body>
</html>
