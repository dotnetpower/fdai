<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Command deck sources moved - FDAI Console</title>
  <script>
    // Retired study URL. The Command deck shows every response form on one page, so this address
    // opens it on the answer form and keeps any scenario, state, width, or trace parameter.
    (function () {
      var query = new URLSearchParams(window.location.search);
      query.delete("preview");
      query.delete("shell");
      query.set("form", "answer");
      var target = "deck.html?" + query.toString();
      window.location.replace(window.self === window.top ? "/#mocks/ui/" + target : target);
    })();
  </script>
</head>
<body>
  <main>
    <p>Command deck sources is now the Answer form of the <a href="deck.html?form=answer">Command deck</a>.</p>
  </main>
</body>
</html>
