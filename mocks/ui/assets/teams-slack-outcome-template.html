        const body = `<div class="io-preview"><div class="io-preview-head"><span>${providerName} · ${text(copy("대화 예상 화면", "Conversation expected surface"))}</span><span>${text(copy("비작동 Mock", "Non-functional mock"))}</span></div><div class="io-preview-body"><div class="io-thread">${turn(true, `${text(copy("운영자", "Operator"))} · 09:42`, question)}${turn(false, "Bragi · 09:42", answer, evidence)}</div></div></div>`;
        const facts = `<div class="io-summary"><div class="io-summary-row"><span>Identity</span><strong>${identity}</strong></div><div class="io-summary-row"><span>Delivery</span><strong>${safety}</strong></div><div class="io-summary-row"><span>Locale</span><strong>ko-KR · English fallback</strong></div></div>`;
        return section(text(copy("Provider thread", "Provider thread")), text(copy("같은 conversation session", "Shared conversation session")), body) + section(text(copy("Channel envelope", "Channel envelope")), text(copy("읽기 전용", "Read-only")), facts);
      }

      function parityView() {
        const table = `<table class="io-parity"><thead><tr><th>${text(copy("표면", "Surface"))}</th><th>Identity</th><th>Evidence</th><th>Progress</th><th>Ack</th></tr></thead><tbody><tr><td>Web Command Deck</td><td>Entra direct</td><td>${status("ok", "3/3")}</td><td>${status("ok", text(copy("실시간", "Live")))}</td><td>${status("ok", text(copy("기록됨", "Recorded")))}</td></tr><tr><td>Microsoft Teams</td><td>sender pairing</td><td>${status("ok", "3/3")}</td><td>${status("ok", "edit")}</td><td>${status("ok", text(copy("기록됨", "Recorded")))}</td></tr><tr><td>Slack</td><td>explicit mapping</td><td>${status("ok", "3/3")}</td><td>${status("ok", "update")}</td><td>${status("ok", text(copy("기록됨", "Recorded")))}</td></tr></tbody></table>`;
        return providerViews() + section(text(copy("동일 turn 비교", "Same-turn comparison")), text(copy("의미 parity", "Semantic parity")), `<div class="io-table-scroll">${table}</div>`);
      }

      function readinessView() {
        const metrics = `<div class="io-metrics"><div class="io-metric"><span>Delivery p95</span><strong>1.4s</strong><small>${text(copy("목표 2.0s 이하", "target under 2.0s"))}</small></div><div class="io-metric"><span>${text(copy("중복 위험", "Duplicate risk"))}</span><strong>0</strong><small>10,000 turns</small></div><div class="io-metric"><span>${text(copy("재처리 거절", "Replay rejected"))}</span><strong>17</strong><small>${text(copy("모두 감사됨", "all audited"))}</small></div><div class="io-metric"><span>${text(copy("중단됨", "Abandoned"))}</span><strong>0.03%</strong><small>${text(copy("24시간", "24 hours"))}</small></div></div>`;
        const table = `<table class="io-parity"><thead><tr><th>${text(copy("검사", "Check"))}</th><th>Web</th><th>Teams</th><th>Slack</th><th>${text(copy("운영 상태", "Operational state"))}</th></tr></thead><tbody><tr><td>EN / KO result</td><td>${status("ok", "pass")}</td><td>${status("ok", "pass")}</td><td>${status("ok", "pass")}</td><td>English fallback</td></tr><tr><td>${text(copy("모호한 identity", "Ambiguous identity"))}</td><td>n/a</td><td>${status("wait", text(copy("거절", "reject")))}</td><td>${status("wait", text(copy("거절", "reject")))}</td><td>${text(copy("Pairing 안내", "Pairing guidance"))}</td></tr><tr><td>Breaker</td><td>${status("ok", "closed")}</td><td>${status("ok", "closed")}</td><td>${status("wait", "half-open")}</td><td>${text(copy("자동 probe", "Automatic probe"))}</td></tr><tr><td>Kill switch</td><td>read-only</td><td>${status("ok", "armed")}</td><td>${status("ok", "armed")}</td><td>${text(copy("Provider별 독립", "Independent per provider"))}</td></tr><tr><td>Restart recovery</td><td>${status("ok", "pass")}</td><td>${status("ok", "pass")}</td><td>${status("ok", "pass")}</td><td>${text(copy("미전송 turn 재개", "Undelivered turns resumed"))}</td></tr></tbody></table>`;
        return section(text(copy("Delivery reliability", "Delivery reliability")), text(copy("합성 24시간 window", "Synthetic 24-hour window")), metrics) + section(text(copy("운영 준비도", "Operational readiness")), text(copy("Read-only verification", "Read-only verification")), `<div class="io-table-scroll">${table}</div>`);
      }

      function renderContent(view) {
        switch (view) {
          case "lifecycle": return integrationsLifecycleView();
          case "providers": return operationalIntegrationView();
          case "connections": return connectionsView();
          case "notifications": return notificationsView();
          case "approvals": return approvalsView();
          case "parity": return parityView();
          case "teams-conversation": return conversationView("Microsoft Teams", "teams");
          case "slack-conversation": return conversationView("Slack", "slack");
          case "readiness": return readinessView();
          default: return "";
        }
      }

      function localizeStatic() {
        document.documentElement.lang = locale;
        document.querySelectorAll("[data-ko][data-en]").forEach((node) => { node.textContent = node.dataset[locale]; });
        document.querySelectorAll("[data-locale]").forEach((button) => {
          const active = button.dataset.locale === locale;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", String(active));
        });
      }

      function render() {
        const state = states[currentState];
        localizeStatic();
        const nativeProvider = currentState === "issue-4" ? "teams" : currentState === "issue-5" ? "slack" : currentState === "issue-7" ? "directline" : null;
        const channelApp = document.getElementById("channel-app");
        const consolePage = document.querySelector("body > main");
        channelApp.hidden = !nativeProvider;
        consolePage.hidden = Boolean(nativeProvider);
        if (nativeProvider) {
          channelApp.innerHTML = nativeConversationApp(nativeProvider);
          channelApp.querySelectorAll("[data-native-locale]").forEach((button) => button.addEventListener("click", () => {
            locale = button.dataset.nativeLocale;
            render();
          }));
          document.title = `${text(state.title)} - ${nativeProvider === "teams" ? "Microsoft Teams" : nativeProvider === "slack" ? "Slack" : "Direct Line custom channel"} mock`;
          return;
        }
        document.getElementById("page-eyebrow").textContent = text(surfaces[currentState]);
        document.getElementById("page-title").textContent = text(state.title);
        document.getElementById("page-description").textContent = text(state.description);
        document.getElementById("outcome-kicker").textContent = text(state.kicker);
        document.getElementById("outcome-status").textContent = text(copy("합성 운영 상태", "Synthetic operational state"));
        document.getElementById("outcome-content").innerHTML = renderContent(state.view);
        const aside = document.querySelector(".io-aside");
        aside.hidden = state.view === "lifecycle";
        document.querySelector(".io-layout").style.gridTemplateColumns = state.view === "lifecycle" ? "1fr" : "";
        document.getElementById("outcome-checks").innerHTML = state.checks.map((item) => `<li>${text(item)}</li>`).join("");
        document.getElementById("outcome-boundaries").innerHTML = state.boundaries.map(([label, value]) => `<div class="io-summary-row"><span>${text(label)}</span><strong>${text(value)}</strong></div>`).join("");
        document.querySelectorAll("[data-tab]").forEach((button) => button.addEventListener("click", () => { activeTab = button.dataset.tab; selectedConnection = null; render(); }));
        document.querySelectorAll("[data-open-add]").forEach((button) => button.addEventListener("click", () => { activeTab = "add"; render(); }));
        document.querySelectorAll("[data-add]").forEach((button) => button.addEventListener("click", () => { wizard = { provider: button.dataset.add, step: 0, scenario: null }; render(); }));
        document.querySelectorAll("[data-manage]").forEach((button) => button.addEventListener("click", () => { selectedConnection = Number(button.dataset.manage); activeTab = "details"; render(); }));
        document.querySelectorAll("[data-back-to-connections]").forEach((button) => button.addEventListener("click", () => { selectedConnection = null; activeTab = "connections"; render(); }));
        document.querySelectorAll("[data-wizard]").forEach((button) => button.addEventListener("click", () => {
          const action = button.dataset.wizard;
          if (action === "cancel") wizard = null;
          else if (action === "back") wizard.step -= 1;
          else if (action === "next") wizard.step += 1;
          else if (action === "save") {
            const definition = providers[wizard.provider];
            connections.push({ id: nextConnectionId++, provider: wizard.provider, name: copy(`${definition.name} 운영 연결`, `${definition.name} operations connection`), health: "healthy", scope: wizard.provider === "teams" ? copy("조직 승인 · Operations 팀", "Organization authorized · Operations team") : copy("Workspace 승인 · #change-safety", "Workspace authorized · #change-safety"), owner: "Platform operations", modifiedBy: "operator@example.com", authorization: copy("Provider 승인 확인됨", "Provider authorization confirmed"), verifiedAt: copy("방금", "Just now"), destinations: [wizard.provider === "teams" ? "Operations / change-safety" : "#change-safety"], capabilities: { notifications: { state: "ready", detail: copy("A2 alert · A4 digest", "A2 alerts · A4 digests") }, approvals: { state: "ready", detail: copy("A1 재인증 필요", "A1 reauthentication required") }, conversation: { state: "ready", detail: copy("A3 thread ingress", "A3 thread ingress") } } });
            activity.unshift({ time: "09:46", actor: "agent:Heimdall", requester: "operator@example.com", event: copy("연결 검증 및 저장 완료", "Connection verified and saved"), target: definition.name, capability: "Notifications / Approvals / Conversation", transition: "verifying -> healthy", evidence: `evidence-demo-${105 + connections.length}` });
            wizard = null; activeTab = "connections";
          }
          render();
        }));
        document.querySelectorAll("[data-scenario]").forEach((button) => button.addEventListener("click", () => { wizard.scenario = button.dataset.scenario; render(); }));
        document.querySelectorAll("[data-recover]").forEach((button) => button.addEventListener("click", () => { wizard.scenario = null; wizard.step = Math.max(1, wizard.step); render(); }));
        document.querySelectorAll("[data-detail-action]").forEach((button) => button.addEventListener("click", () => {
          const action = button.dataset.detailAction;
          const connection = connections.find((item) => item.id === selectedConnection);
          const target = text(connection.name);
          if (action === "reconnect") wizard = { provider: connection.provider, step: 1, scenario: null };
          if (action === "test") activity.unshift({ time: "09:47", actor: "agent:Heimdall", requester: "operator@example.com", event: copy("수동 연결 테스트 완료", "Manual connection test completed"), target, capability: "All capabilities", transition: "healthy -> healthy", evidence: "evidence-demo-108" });
          if (action === "disable") activity.unshift({ time: "09:47", actor: "operator@example.com", requester: "operator@example.com", event: copy("연결 비활성화 요청", "Connection disable requested"), target, capability: "All capabilities", transition: "healthy -> disable requested", evidence: "evidence-demo-109" });
          if (action === "remove" && window.confirm(text(copy("이 합성 연결을 제거할까요?", "Remove this synthetic connection?")))) { const index = connections.findIndex((item) => item.id === selectedConnection); connections.splice(index, 1); selectedConnection = null; activeTab = "connections"; }
          render();
        }));
        document.title = `${text(state.title)} - FDAI Console mock`;
      }

      document.querySelectorAll("[data-locale]").forEach((button) => button.addEventListener("click", () => { locale = button.dataset.locale; render(); }));
      render();
    })();
  </script>
</body>
</html>
