[project]
name = "fdai-deployment-cli"
version = "0.1.0"
description = "Installable FDAI deployment and subscription genesis CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cryptography>=45,<51"]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.7,<1",
]
release = ["pip==26.2.1"]

[project.scripts]
fdaictl = "fdai_deployment_cli.cli:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdai_deployment_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/fdai_deployment_cli", "pyproject.toml", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/fdai_deployment_cli"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
