# Local development Postgres+pgvector, Redpanda, and ClamAV stack.
#
# Ports are bound to 127.0.0.1 only so a laptop on a hostile network does
# NOT expose the dev cluster. If you need to reach the cluster from a
# container network in another compose file, join the `fdai-local`
# external network there.

name: fdai-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fdai-postgres
    environment:
      POSTGRES_USER: fdai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly}
      POSTGRES_DB: fdai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdai -d fdai"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  postgres-validation:
    image: pgvector/pgvector:pg16
    container_name: fdai-postgres-validation
    environment:
      POSTGRES_USER: fdai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly}
      POSTGRES_DB: fdai_validation
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - validation_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdai -d fdai_validation"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: fdai-redpanda
    # Single-node dev mode. Dual Kafka listener:
    #   internal (29092): reachable from the compose network at redpanda:29092
    #   external (19092): reachable from the host at localhost:19092
    # See https://docs.redpanda.com/current/deploy/deployment-option/self-hosted/docker/
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:29092,external://127.0.0.1:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    container_name: fdai-clamav
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
    name: fdai-pgdata
  validation_pgdata:
    name: fdai-validation-pgdata
  redpandadata:
    name: fdai-redpandadata
  clamavdata:
    name: fdai-clamavdata

networks:
  default:
    name: fdai-local
