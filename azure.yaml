# azd (Azure Developer CLI) configuration for FDAI.
#
# Provides a direct public-network development `azd up` path over the Terraform under
# `infra/` (docs/roadmap/deployment/deploy-and-onboard.md). azd drives Terraform as its
# infrastructure provider; the CSP-neutral seams stay defined in HCL.
#
# Scope: `azd provision` and `azd up` provision the integrated Terraform root.
# Runtime images deploy through the service-owned protected workflows because
# the integrated root no longer owns one `azd-service-name` Container App.
# Private subscription genesis uses `fdaictl` plus the protected runner.
#
# Environment values (subscription id, tenant id, resource group, region) are
# supplied at run time by the azd environment / env vars, never committed -
# the repo stays customer-agnostic
# (.github/instructions/generic-scope.instructions.md).

name: fdai
metadata:
  template: fdai@0.1.0

infra:
  provider: terraform
  path: infra
