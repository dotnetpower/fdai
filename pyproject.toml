# FDAI workspace orchestration and development tooling.
# Runtime packages are owned by services/* and packages/* workspace members.

[project]
name = "fdai"
version = "0.1.259"
description = "Autonomous cloud operations control plane"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "FDAI maintainers" }]
keywords = ["aiops", "control-plane", "gitops", "opa", "shadow-mode"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
# Development tooling. Concrete runtime deps still arrive with their own P0 tasks.
dev = [
    # Root integration tests exercise the independently packaged drivers through
    # the public SDK/host boundary. Dev-only workspace bindings keep them out of
    # the FDAI runtime wheel while making the repository suite self-contained.
    "fdai-benchmark-cybergym>=0.1,<0.2",
    "fdai-benchmark-sregym>=0.1,<0.2",
    "fdai-evaluation-sdk>=0.1,<0.2",
    "fdai-service-contracts==0.1.0",
    # Root integration tests span the five independently owned distributions.
    # Runtime images resolve dependencies from each service pyproject instead.
    "aiohttp>=3.14.2,<4",
    "aiokafka>=0.12,<0.13",
    "alembic>=1.13,<2",
    "azure-storage-file-datalake>=12.25,<13",
    "croniter>=6,<7",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "markdown-it-py>=4,<5",
    "opentelemetry-api>=1.29,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29,<2",
    "opentelemetry-sdk>=1.29,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pyjwt[crypto]>=2.10,<3",
    "pypdf>=6.15,<7",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0,<3",
    "starlette>=1.3.1,<2",
    # pytest floor is 9.0.3: pytest <= 9.0.2 uses a predictable
    # /tmp/pytest-of-{user} temp dir (CVE-2025-71176, local DoS/priv-esc).
    "pytest>=9.0.3,<10",
    "pytest-cov>=5.0,<7",
    "pytest-asyncio>=1.0,<2",
    "pytest-xdist>=3.8,<4",
    "mypy>=1.13,<2",
    "ruff>=0.7,<1",
    # jsonschema ships no inline type hints; the stub package covers mypy --strict.
    "types-jsonschema>=4.23,<5",
    # PyYAML ships no inline type hints; the stub package keeps the loader
    # in `rule_catalog/schema/action_type.py` under mypy --strict.
    "types-PyYAML>=6.0,<7",
    # Runs the .pre-commit-config.yaml gates locally so a contributor
    # catches the same failures CI would surface. See
    # .github/instructions/generic-scope.instructions.md § Enforcement.
    "pre-commit>=4.0,<5",
    # Local dev-only ASGI server so the console SPA can hit the Operator API
    # (`fdai.delivery.operator_api.dev.local:app`) at development time. Not
    # required in production - a fork picks its own ASGI server per
    # container-runtime policy.
    "uvicorn>=0.32,<1",
]

# Production ASGI server for the read-only console API
# (`fdai.delivery.operator_api.prod:app`). Kept as an opt-in extra so the
# headless core image stays minimal; the console-serving image installs
# it with `uv sync --extra serve`. A fork MAY swap this for another ASGI
# server per its container-runtime policy.
serve = [
    "uvicorn>=0.32,<1",
]
pdf-report = [
    "weasyprint>=66,<70",
]
# Isolated browser-evidence workers install this extra explicitly. The core and
# Operator API images omit it so browser code and binaries never inherit executor identity.
browser-evidence = [
    "playwright>=1.51,<2",
]
azure-mcp = [
    "mcp>=2.0,<3",
    "msmcp-azure>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/dotnetpower/fdai"
Documentation = "https://github.com/dotnetpower/fdai/blob/main/docs/roadmap/README.md"

[tool.uv]
package = false

[tool.uv.sources]
fdai-evaluation-sdk = { workspace = true }
fdai-benchmark-cybergym = { workspace = true }
fdai-benchmark-sregym = { workspace = true }
fdai-service-contracts = { workspace = true }
fdai-core-control-plane = { workspace = true }
fdai-operator-service = { workspace = true }
fdai-document-ingestion-api = { workspace = true }
fdai-document-processing-worker = { workspace = true }
fdai-isolated-executor-service = { workspace = true }

[tool.uv.workspace]
members = [
    "evaluation-sdk",
    "benchmarks/sregym",
    "benchmarks/cybergym",
    "extensions/code-assurance",
    "packages/service-contracts",
    "services/core-control-plane",
    "services/operator-service",
    "services/document-ingestion-api",
    "services/document-processing-worker",
    "services/isolated-executor",
]

# ---------------------------------------------------------------------------
# Dev-tool config lives here so it is picked up as soon as the tools are added
# in W1.7; the actual dependencies are still deferred.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services", "packages", "tests", "extensions/code-assurance/src"]
# Mock/design assets and design experiments are not part of the shipped
# monorepo; they live outside the lint gate on purpose.
extend-exclude = ["mocks", "examples"]

[tool.ruff.lint]
# Full rule selection is finalized in W1.7. This is a conservative starter set.
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests intentionally include hardcoded strings like "token" that trip the
# bandit-style S1xx rules; asserts (S101) are the whole point of the suite.
"tests/**" = ["S101", "S105", "S106"]
"services/**/tests/**" = ["S101", "S105", "S106"]
"packages/**/tests/**" = ["S101", "S105", "S106"]
"extensions/**/tests/**" = ["S101", "S105", "S106"]
"benchmarks/**/tests/**" = ["S101", "S104"]
# Developer helper scripts shell out to `git` / `python3` with hardcoded
# argument lists - the S6xx subprocess warnings assume attacker-controlled
# input, which does not apply here.
"scripts/**" = ["N999", "S603", "S607"]
"tools/**" = ["S603", "S607"]
# Alembic migrations construct DELETE-IN-list queries from hardcoded module
# constants (`_LINK_TYPES`, `_OBJECT_TYPES`); no user input flows into the
# string, so S608 is a false positive in this scope.
"alembic/**" = ["S608"]
# Chat backend embeds a long-form system prompt as a triple-quoted string
# literal. Breaking the prompt across lines would corrupt the payload the
# LLM sees; the E501 rule does not apply to prose inside a prompt.
# Codegen CLI + object-type loader header comments run slightly over the
# 100-column budget for readability of a single-line docstring / import.
# These are already committed; opening the doorway to reformat every
# docstring would exceed the intent of this cleanup.
"services/core-control-plane/src/fdai/rule_catalog/codegen/**" = ["E501"]
"services/core-control-plane/src/fdai/rule_catalog/schema/object_type.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "services/core-control-plane/src",
    "services/operator-service/src",
    "services/document-ingestion-api/src",
    "services/document-processing-worker/src",
    "services/isolated-executor/src",
    "packages/service-contracts/src",
    "extensions/code-assurance/src/fdai_code_assurance",
]
mypy_path = [
    "packages/service-contracts/src",
    "services/core-control-plane/src",
    "services/operator-service/src",
    "services/document-ingestion-api/src",
    "services/document-processing-worker/src",
    "services/isolated-executor/src",
]

# aiokafka ships no py.typed marker and no stub package. It is only imported
# by `delivery/azure/event_bus.py`; the adapter boundary in composition
# wraps every call, so the untyped surface is narrow.
[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.abc"]
ignore_missing_imports = true

# WeasyPrint is isolated to the optional delivery/reporting adapter and ships
# no py.typed marker. The adapter validates its byte-return boundary.
[[tool.mypy.overrides]]
module = ["weasyprint"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "services", "packages", "extensions/code-assurance/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
pythonpath = [
    ".",
    "extensions/code-assurance/src",
    "packages/service-contracts/src",
    "services/core-control-plane",
    "services/core-control-plane/src",
    "services/operator-service/src",
    "services/document-ingestion-api/src",
    "services/document-processing-worker/src",
    "services/isolated-executor/src",
]
markers = [
    "integration: requires a live Postgres (pgvector). Skipped unless FDAI_DATABASE_URL is set.",
]
# Provider Protocols are async by default (I/O-bound: Kafka, Postgres, KV, LLM);
# `asyncio_mode = "auto"` lets `async def test_...` functions run without a
# per-test marker. Sync tests (CPU boundary validation) still run as-is.
asyncio_mode = "auto"
# Silence third-party deprecation notices we've reviewed but can't reasonably
# act on in this branch. Each filter names the exact source class + module so
# a real regression (a warning from OUR code) still surfaces.
filterwarnings = [
    # starlette 1.3.1 asks TestClient users to switch to httpx2. httpx is used
    # extensively across services/core-control-plane/src/fdai/delivery/**; migrating to httpx2 is a
    # separate work item and does not affect correctness.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

# This is the single safety-core coverage target list used by pytest-cov.
# CI, scripts/verify.sh, and make test all delegate to
# scripts/quality/ci/run-python-tests.sh instead of repeating these paths.
[tool.coverage.run]
source = [
    "services/core-control-plane/src/fdai/core/event_ingest",
    "services/core-control-plane/src/fdai/core/trust_router",
    "services/core-control-plane/src/fdai/core/tiers/t0_deterministic",
    "services/core-control-plane/src/fdai/core/tiers/t1_lightweight",
    "services/core-control-plane/src/fdai/core/tiers/t2_reasoning",
    "services/core-control-plane/src/fdai/core/quality_gate",
    "services/core-control-plane/src/fdai/core/risk_gate",
    "services/core-control-plane/src/fdai/core/hil_resume",
    "services/core-control-plane/src/fdai/core/executor",
    "services/core-control-plane/src/fdai/core/audit",
    "services/core-control-plane/src/fdai/core/control_loop",
]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "azure-identity>=1.23,<2",
    "types-croniter>=6.2.4.20260711",
]
