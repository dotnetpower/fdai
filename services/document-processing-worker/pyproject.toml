[project]
name = "fdai-document-processing-worker"
version = "0.1.0"
description = "FDAI Document Processing Worker service"
requires-python = ">=3.12"
dependencies = ["fdai==0.1.180", "fdai-service-contracts==0.1.0"]

[project.scripts]
fdai-document-processing-worker = "fdai_document_worker_service.main:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.uv.sources]
fdai = { workspace = true }
fdai-service-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fdai_document_worker_service"]
