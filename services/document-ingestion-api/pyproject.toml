[project]
name = "fdai-document-ingestion-api"
version = "0.1.0"
description = "FDAI Document Ingestion API service"
requires-python = ">=3.12"
dependencies = ["fdai[serve]==0.1.180", "fdai-service-contracts==0.1.0"]

[project.scripts]
fdai-document-ingestion-api = "fdai_ingestion_api_service.main:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.uv.sources]
fdai = { workspace = true }
fdai-service-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fdai_ingestion_api_service"]
