[project]
name = "fdai-document-ingestion-api"
version = "0.1.2"
description = "FDAI Document Ingestion API service"
requires-python = ">=3.12"
dependencies = [
	"aiokafka>=0.12,<1",
	"azure-core>=1.35,<2",
	"azure-identity>=1.23,<2",
	"azure-storage-file-datalake>=12.21,<13",
	"fdai-service-contracts==0.1.0",
	"httpx>=0.28,<1",
	"psycopg[binary]>=3.2,<4",
	"pyjwt[crypto]>=2.10,<3",
	"pydantic>=2.9,<3",
	"starlette>=1.3.1,<2",
	"uvicorn>=0.35,<1",
]

[project.scripts]
fdai-document-ingestion-api = "fdai_ingestion_api_service.main:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.uv.sources]
fdai-service-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fdai_ingestion_api_service"]
