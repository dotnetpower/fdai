[project]
name = "fdai-operator-service"
version = "0.1.3"
description = "FDAI Operator Service"
requires-python = ">=3.12"
dependencies = [
	"fdai-service-contracts==0.1.0",
	"pyjwt[crypto]>=2.10,<3",
	"psycopg[binary]>=3.2,<4",
	"starlette>=1.3.1,<2",
	"uvicorn>=0.32,<1",
]

[project.scripts]
fdai-operator-service = "fdai_operator_service.main:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.uv.sources]
fdai-service-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fdai_operator_service"]
