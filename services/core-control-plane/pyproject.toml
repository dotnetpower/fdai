[project]
name = "fdai-core-control-plane"
version = "0.1.3"
description = "FDAI Core Control Plane service"
requires-python = ">=3.12"
dependencies = [
	"aiokafka>=0.12,<0.13",
	"alembic>=1.13,<2",
	"croniter>=6,<7",
	"fdai-service-contracts==0.1.0",
	"httpx>=0.27,<1",
	"jsonschema>=4.23,<5",
	"markdown-it-py>=4,<5",
	"opentelemetry-api>=1.29,<2",
	"opentelemetry-exporter-otlp-proto-grpc>=1.29,<2",
	"opentelemetry-sdk>=1.29,<2",
	"psycopg[binary]>=3.2,<4",
	"pydantic>=2.9,<3",
	"pypdf>=6,<7",
	"pyyaml>=6.0,<7",
	"sqlalchemy>=2.0,<3",
]

[project.scripts]
fdai-core-control-plane = "fdai_core_service.main:main"
fdai-browser-evidence-cleanup = "fdai.delivery.browser_evidence_cleanup_cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.uv.sources]
fdai-service-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fdai", "src/fdai_core_service"]
