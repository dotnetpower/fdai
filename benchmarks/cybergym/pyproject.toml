[project]
name = "fdai-benchmark-cybergym"
version = "0.1.0"
description = "CyberGym-E2E driver for the FDAI evaluation SDK"
requires-python = ">=3.12"
dependencies = [
    "fdai-evaluation-sdk>=0.1,<0.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=5.0,<7",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdai_bench_cybergym"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
pythonpath = ["src", "../../evaluation-sdk/src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/fdai_bench_cybergym"]
