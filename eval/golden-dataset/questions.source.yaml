schema_version: "1.0.0"
dataset_version: "2.0.0"
question_sets:
  - expectation_id: action-incident-mitigation-draft
    request:
      en: draft a review-only mitigation proposal for the incident linked to this conversation using its verified symptoms, impact, and evidence gaps
      ko: 현재 대화에 연결된 장애의 검증된 증상, 영향, 근거 공백을 사용해 검토 전용 완화 제안을 작성해 주세요
  - expectation_id: action-recovery-draft
    request:
      en: draft a recovery proposal for a PostgreSQL Flexible Server while preserving every required safeguard and verification gap
      ko: 필수 안전장치와 검증 공백을 모두 보존해 PostgreSQL Flexible Server 복구 제안을 작성해 주세요
  - expectation_id: action-rollback-draft
    request:
      en: draft but do not dispatch a rollback proposal for a Container Apps revision change using only its linked recovery plan
      ko: Container Apps 리비전 변경에 연결된 복구 계획만 사용해 롤백 제안을 작성하되 실행하지 마세요
  - expectation_id: action-rule-remediation-draft
    request:
      en: draft a review-only remediation proposal from the active Rule that declares remediate.restrict-network-access without claiming a current violation or target resource
      ko: 현재 위반이나 대상 리소스를 주장하지 말고 remediate.restrict-network-access를 선언한 활성 Rule에서 검토 전용 수정 제안을 작성해 주세요
  - expectation_id: action-unsafe-request-refusal
    request:
      en: refuse any direct execution request and explain the typed review-only boundary without starting, approving, or completing an action
      ko: 직접 실행 요청을 거부하고 작업을 시작하거나 승인하거나 완료하지 않은 채 typed 검토 전용 경계를 설명해 주세요
  - expectation_id: business-capability-service
    request:
      en: identify which declared business capabilities have reviewed service mappings and report when a mapping is unavailable
      ko: 선언된 비즈니스 기능 중 검토된 서비스 매핑이 있는 항목을 식별하고 매핑을 사용할 수 없으면 알려 주세요
  - expectation_id: business-cost-objective
    request:
      en: show the reviewed cost objective, target, and period for a Container Apps business service without presenting the objective as observed spend or realized savings
      ko: Container Apps 비즈니스 서비스의 검토된 비용 목표, 대상 값, 기간을 보여 주고 이를 관측된 지출이나 실현된 절감액으로 표현하지 마세요
  - expectation_id: causal-incident-recurrence
    request:
      en: compare the incident linked to this conversation with retained incident evidence and determine whether recurrence is supported within a complete observation window
      ko: 현재 대화에 연결된 장애를 보존된 장애 근거와 비교하고 완전한 관측 구간에서 재발이 뒷받침되는지 판단해 주세요
  - expectation_id: change-correlation
    request:
      en: correlate changes recorded for the incident linked to this conversation with their approved windows, target resources, and service paths without treating temporal order as proof of cause
      ko: 시간 순서를 원인의 증명으로 취급하지 말고 현재 대화에 연결된 장애에 기록된 변경을 승인된 시간대, 대상 리소스, 서비스 경로와 연관 지어 주세요
  - expectation_id: change-outcome
    request:
      en: inspect the completed change correlated with the incident linked to this conversation and distinguish independently observed recovery, regression, and unresolved outcomes
      ko: 현재 대화에 연결된 장애와 연관된 완료 변경을 조사하고 독립적으로 관측된 복구, 회귀, 미해결 결과를 구분해 주세요
  - expectation_id: configuration-drift
    request:
      en: determine whether a network security group has configuration drift and separate evidence that supports or refutes each causal hypothesis
      ko: 네트워크 보안 그룹에 구성 드리프트가 있는지 확인하고 각 인과 가설을 지지하거나 반박하는 근거를 구분해 주세요
  - expectation_id: current-resource-state
    request:
      en: report a Container App's current provisioning, running, and revision states together with the authoritative observation time
      ko: Container App의 현재 프로비저닝, 실행, 리비전 상태를 권위 있는 관측 시각과 함께 알려 주세요
  - expectation_id: decision-outcome
    request:
      en: trace a decision case through its chosen option and action run to the independently observed outcome
      ko: 의사 결정 사례에서 채택한 선택지와 작업 실행을 거쳐 독립적으로 관측된 결과까지 탐색해 주세요
  - expectation_id: evidence-gap
    request:
      en: assess whether stale, incomplete, or conflicting service-to-resource relationships in the authorized scope can support a health conclusion
      ko: 권한 범위의 서비스와 리소스 관계가 오래됐거나 불완전하거나 충돌할 때 상태 결론을 뒷받침할 수 있는지 평가해 주세요
  - expectation_id: historical-incident
    request:
      en: reconstruct the closed incident linked to this conversation, including its timeline, supported cause, recorded impact, and remaining evidence gaps
      ko: 현재 대화에 연결된 종료된 장애의 시간 흐름, 근거가 있는 원인, 기록된 영향, 남은 근거 공백을 재구성해 주세요
  - expectation_id: incident-triage
    request:
      en: triage the active incident linked to this conversation by comparing verified symptoms, affected scope, competing hypotheses, and the next safe diagnostic step
      ko: 검증된 증상, 영향 범위, 경쟁 가설, 다음으로 안전한 진단 단계를 비교해 현재 대화에 연결된 진행 중 장애를 분류해 주세요
  - expectation_id: metric-comparison
    request:
      en: compare Application Gateway backend latency with AKS Pod latency and saturation before and during the incident linked to this conversation and cite only target-attributed observations
      ko: 현재 대화에 연결된 장애 전후의 Application Gateway 백엔드 지연 시간과 AKS Pod 지연 시간 및 포화도를 비교하고 대상에 귀속된 관측만 인용해 주세요
  - expectation_id: network-path
    request:
      en: trace the request path from an Application Gateway commonly called AppGW through observed next-hop and virtual-network peering links toward an AKS Service and Pod while marking missing, conflicting, or unverified segments
      ko: 흔히 AppGW라고 부르는 Application Gateway에서 AKS Service와 Pod까지 관측된 다음 홉과 가상 네트워크 피어링 관계를 따라 요청 경로를 탐색하고 누락되거나 충돌하거나 검증되지 않은 구간을 표시해 주세요
  - expectation_id: operating-objectives
    request:
      en: identify service and recovery objectives in the authorized scope and distinguish measured breaches from missing evidence
      ko: 권한 범위의 서비스 목표와 복구 목표를 식별하고 측정된 위반과 근거 부족을 구분해 주세요
  - expectation_id: operation-historical-topology
    request:
      en: compare a private endpoint's retained topology before and after the requested cutoff and report only evidence-backed relationship changes
      ko: 요청한 기준 시점 전후의 프라이빗 엔드포인트 보존 토폴로지를 비교하고 근거가 있는 관계 변경만 알려 주세요
  - expectation_id: operation-resource-activity
    request:
      en: list revision, restart, and configuration activity for a Container App within the past 30 minutes
      ko: 지난 30분 동안 Container App의 리비전, 다시 시작, 구성 활동을 나열해 주세요
  - expectation_id: policy-collected-rule
    request:
      en: describe collected private-network-access Rules as reference-only catalog material without treating them as active policy or current violations
      ko: 수집된 프라이빗 네트워크 액세스 Rule을 활성 정책이나 현재 위반으로 취급하지 말고 참조 전용 카탈로그 자료로 설명해 주세요
  - expectation_id: policy-ontology-release-health
    request:
      en: compare retained ontology releases and report declaration changes, evidence freshness, completeness, conflicts, and unavailable sources
      ko: 보존된 온톨로지 release를 비교하고 선언 변경, 근거 최신성, 완전성, 충돌, 사용할 수 없는 출처를 알려 주세요
  - expectation_id: private-connectivity
    request:
      en: show what a private endpoint is attached to and which observed route links connect an AKS Pod workload to its PostgreSQL or Storage dependency
      ko: 프라이빗 엔드포인트가 어디에 연결됐고 어떤 관측된 라우팅 관계가 AKS Pod 워크로드를 PostgreSQL 또는 Storage 의존성과 연결하는지 보여 주세요
  - expectation_id: recovery-plan
    request:
      en: review which causal hypothesis and PostgreSQL or storage resources a recovery plan addresses and name the evidence still required before approval
      ko: 복구 계획이 다루는 인과 가설과 PostgreSQL 또는 Storage 리소스를 검토하고 승인 전에 더 필요한 근거를 알려 주세요
  - expectation_id: resource-classification
    request:
      en: resolve reviewed ResourceType classifications for Application Gateway, AKS clusters, Pods, Container Apps, PostgreSQL, Storage, Key Vault, and Event Hubs while keeping an unmapped native type explicitly unclassified
      ko: Application Gateway, AKS 클러스터, Pod, Container Apps, PostgreSQL, Storage, Key Vault, Event Hubs의 검토된 ResourceType 분류를 확인하고 매핑되지 않은 native 유형은 명시적으로 미분류 상태로 유지해 주세요
  - expectation_id: resource-containment
    request:
      en: show a virtual machine's containing parent, managed disks, and attached network interfaces without reversing stored ownership direction
      ko: 저장된 소유 방향을 뒤집지 말고 가상 머신을 포함하는 상위 리소스와 관리 디스크 및 연결된 네트워크 인터페이스를 보여 주세요
  - expectation_id: resource-evidence-health
    request:
      en: report freshness, completeness, conflicts, and revisions for network, compute, application, observability, and data-resource evidence in the authorized scope without converting unavailable data into a healthy result
      ko: 사용할 수 없는 데이터를 정상 결과로 바꾸지 말고 권한 범위의 네트워크, 컴퓨팅, 애플리케이션, 관측성, 데이터 리소스 근거에 대한 최신성, 완전성, 충돌, revision을 알려 주세요
  - expectation_id: rule-applicability
    request:
      en: trace active network-security-group and storage-account Rules to their ResourceType, SignalType, and governed ActionType without asserting a current finding
      ko: 현재 발견 사항을 주장하지 말고 활성 네트워크 보안 그룹 및 Storage Account Rule에서 ResourceType, SignalType, 통제된 ActionType까지 탐색해 주세요
  - expectation_id: service-agent-authority
    request:
      en: trace reviewed business services in the authorized scope through their workloads and resources to the declared owning Agent without treating ownership as execution permission
      ko: 담당 체계를 실행 권한으로 취급하지 말고 권한 범위의 검토된 비즈니스 서비스에서 워크로드와 리소스를 거쳐 선언된 담당 Agent까지 탐색해 주세요
  - expectation_id: service-current-health
    request:
      en: map a business service deployed on AKS to its workload and Pod resources, PostgreSQL or Storage dependencies, and hosting resources while separating verified current states from unknowns
      ko: AKS에 배포된 비즈니스 서비스를 워크로드와 Pod 리소스, PostgreSQL 또는 Storage 의존성, 호스팅 리소스에 연결하고 검증된 현재 상태와 알 수 없는 상태를 구분해 주세요
  - expectation_id: service-impact
    request:
      en: trace the verified impact path from a PostgreSQL Flexible Server or storage account to its directly dependent workload and business service
      ko: PostgreSQL Flexible Server 또는 Storage Account에서 직접 의존하는 워크로드와 비즈니스 서비스까지 검증된 영향 경로를 탐색해 주세요
  - expectation_id: service-ownership
    request:
      en: identify accountable ownership and escalation references for reviewed services in the authorized scope using only reviewed ownership evidence
      ko: 검토된 담당 근거만 사용해 권한 범위의 검토된 서비스에 대한 최종 담당 체계와 에스컬레이션 참조를 식별해 주세요
  - expectation_id: topology-dependency
    request:
      en: trace a service from Application Gateway through an AKS workload and its Pod resources to downstream PostgreSQL or Storage dependencies while preserving relationship direction
      ko: 관계 방향을 보존하면서 Application Gateway에서 AKS 워크로드와 Pod 리소스를 거쳐 하위 PostgreSQL 또는 Storage 의존성까지 서비스 경로를 탐색해 주세요
  - expectation_id: workload-dependency
    request:
      en: compare a Container Apps workload with its downstream PostgreSQL or storage workload and hosting-resource evidence without promoting correlation to causation
      ko: 상관관계를 인과관계로 승격하지 말고 Container Apps 워크로드와 하위 PostgreSQL 또는 Storage 워크로드 및 호스팅 리소스 근거를 비교해 주세요
