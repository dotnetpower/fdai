    category: current_health
    domain: state_incident_detection
    intent: current_health.latency_objective_breach
    target_kinds: [BusinessService, ServiceObjective]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Are any authorized services currently exceeding their reviewed response-time service objective?
      ko: 현재 검토된 응답 시간 서비스 목표를 초과한 권한 범위의 서비스가 있나요?
  - id: current-health.error-rate-threshold-breach
    category: current_health
    domain: state_incident_detection
    intent: current_health.error_rate_threshold_breach
    target_kinds: [BusinessService, ServiceObjective]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Are any authorized services currently exceeding their reviewed error-rate threshold?
      ko: 현재 검토된 오류율 임계치를 초과한 권한 범위의 서비스가 있나요?
  - id: current-health.recent-degradation-10min
    category: current_health
    domain: state_incident_detection
    intent: current_health.recent_degradation_10min
    target_kinds: [AzureResource]
    temporal_scope: historical
    result_shape: list
    required_context: server_scope
    wording:
      en: Find authorized resources whose health has degraded over the last 10 minutes, as of the authoritative observation time.
      ko: 권위 있는 관측 시각 기준으로 최근 10분 동안 상태가 나빠진 권한 범위의 리소스를 찾아 주세요.
  - id: current-health.cpu-above-90
    category: current_health
    domain: state_incident_detection
    intent: current_health.cpu_above_90
    target_kinds: [AzureResource]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Are any authorized resources currently at or above 90% CPU utilization?
      ko: 현재 CPU 사용률이 90% 이상인 권한 범위의 리소스가 있나요?
  - id: current-health.high-memory-resources
    category: current_health
    domain: state_incident_detection
    intent: current_health.high_memory_resources
    target_kinds: [AzureResource]
    temporal_scope: current
    result_shape: ranked_list
    required_context: server_scope
    wording:
      en: Find authorized resources with currently high memory utilization.
      ko: 현재 메모리 사용률이 높은 권한 범위의 리소스를 찾아 주세요.
  - id: current-health.risky-disk-usage
    category: current_health
    domain: state_incident_detection
    intent: current_health.risky_disk_usage
    target_kinds: [AzureResource]
