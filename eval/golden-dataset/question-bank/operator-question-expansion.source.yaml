      ko: 현재 디스크 사용량이 위험 수준인 권한 범위의 서버가 있나요?
  - id: current-health.abnormal-network-traffic
    category: current_health
    domain: state_incident_detection
    intent: current_health.abnormal_network_traffic
    target_kinds: [AzureResource, NetworkResource]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Are any authorized resources currently showing abnormally high network traffic?
      ko: 현재 네트워크 트래픽이 비정상적으로 높은 권한 범위의 리소스가 있나요?
  - id: current-health.connection-count-spike
    category: current_health
    domain: state_incident_detection
    intent: current_health.connection_count_spike
    target_kinds: [BusinessService]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Are any authorized services currently seeing a spike in connection count?
      ko: 현재 연결 수가 급증한 권한 범위의 서비스가 있나요?
  - id: current-health.unknown-health-resources
    category: current_health
    domain: state_incident_detection
    intent: current_health.unknown_health_resources
    target_kinds: [AzureResource]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Are any authorized Azure resources currently reporting an unknown health state due to missing evidence?
      ko: 현재 권한 범위의 Azure 리소스 중 근거 부족으로 상태를 알 수 없음(Unknown)으로 보고되는 것이 있나요?
  - id: current-health.highest-failure-likelihood
    category: current_health
    domain: state_incident_detection
    intent: current_health.highest_failure_likelihood
    target_kinds: [AzureResource]
    temporal_scope: current
    result_shape: ranked_list
    required_context: server_scope
    wording:
      en: Based on current reviewed evidence, which authorized resource carries the highest failure likelihood?
      ko: 현재 검토된 근거를 기준으로 장애 가능성이 가장 높은 권한 범위의 리소스는 무엇인가요?
  - id: current-health.top-priority-issue
    category: current_health
    domain: state_incident_detection
    intent: current_health.top_priority_issue
    target_kinds: [Finding, Issue]
    temporal_scope: current
    result_shape: ranked_list
    required_context: server_scope
    wording:
      en: Given the current reviewed evidence, which issue should be reviewed first?
      ko: 현재 검토된 근거를 기준으로 가장 먼저 확인해야 할 문제는 무엇인가요?
  - id: current-health.overall-stability-assessment
    category: current_health
    domain: state_incident_detection
    intent: current_health.overall_stability_assessment
    target_kinds: [BusinessService, Environment]
    temporal_scope: current
    result_shape: assessment
    required_context: server_scope
    wording:
      en: Assess the overall stability of the authorized production environment as of the authoritative observation time.
      ko: 권위 있는 관측 시각 기준으로 권한 범위의 운영 환경의 전체적인 안정성을 평가해 주세요.
  - id: incident.today-all-incidents
