    domain: state_incident_detection
    intent: incident.today_all_incidents
    target_kinds: [Incident]
    temporal_scope: historical
    result_shape: list
    required_context: server_scope
    wording:
      en: Show every incident recorded today for authorized services.
      ko: 오늘 권한 범위의 서비스에서 기록된 모든 장애를 보여 주세요.
  - id: incident.currently-open
    category: incident
