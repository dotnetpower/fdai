    target_kinds: [Incident]
    temporal_scope: historical
    result_shape: ranked_list
    required_context: server_scope
    wording:
      en: Which recorded incident had the longest duration?
      ko: 기록된 장애 중 지속 시간이 가장 길었던 장애는 무엇인가요?
  - id: incident.unresolved-root-cause
    category: incident
    domain: state_incident_detection
    intent: incident.unresolved_root_cause
    target_kinds: [Incident, CausalHypothesis]
    temporal_scope: historical
    result_shape: list
    required_context: server_scope
    wording:
      en: Which recent incidents still have no confirmed root cause due to insufficient evidence?
      ko: 최근 장애 중 근거 부족으로 아직 원인이 확인되지 않은 것은 무엇인가요?
