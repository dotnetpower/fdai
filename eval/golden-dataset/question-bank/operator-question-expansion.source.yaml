    target_kinds: [Incident, Pattern]
    temporal_scope: historical
    result_shape: assessment
    required_context: server_scope
    wording:
      en: Is the same reviewed incident type recurring across authorized services?
      ko: 검토된 동일 유형의 장애가 권한 범위의 서비스에서 반복되고 있나요?
