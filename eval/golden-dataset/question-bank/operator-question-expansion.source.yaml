    intent: incident.today_highest_severity
    target_kinds: [Incident]
    temporal_scope: historical
    result_shape: ranked_list
    required_context: server_scope
    wording:
      en: Which incident recorded today had the highest reviewed severity?
      ko: 오늘 기록된 장애 중 검토된 심각도가 가장 높았던 장애는 무엇인가요?
  - id: incident.sev1-last-24h
