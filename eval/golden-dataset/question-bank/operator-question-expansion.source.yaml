schema_version: "1.0.0"
source_id: operator-question-expansion-2026-09

questions:
  - id: current-health.azure-resources-in-failure
    category: current_health
    domain: state_incident_detection
    intent: current_health.azure_resources_in_failure
    target_kinds: [AzureResource]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Within the authorized Azure scope, are any resources currently in a failure state?
      ko: Azure 권한 범위 내에서 현재 장애 상태인 리소스가 있나요?
  - id: current-health.abnormal-resources-list
    category: current_health
    domain: state_incident_detection
    intent: current_health.abnormal_resources_list
    target_kinds: [AzureResource]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: List every authorized resource that is currently in an abnormal state.
      ko: 현재 비정상 상태인 권한 범위의 리소스를 모두 나열해 주세요.
  - id: current-health.most-at-risk-service
    category: current_health
    domain: state_incident_detection
    intent: current_health.most_at_risk_service
    target_kinds: [BusinessService]
    temporal_scope: current
    result_shape: ranked_list
    required_context: server_scope
    wording:
      en: Which authorized service is currently in the most at-risk state?
      ko: 현재 권한 범위의 서비스 중 가장 위험한 상태인 서비스는 무엇인가요?
  - id: current-health.user-impacting-incident
    category: current_health
    domain: state_incident_detection
    intent: current_health.user_impacting_incident
    target_kinds: [Incident, BusinessService]
    temporal_scope: current
    result_shape: assessment
    required_context: server_scope
    wording:
      en: Is there an ongoing incident currently affecting users of an authorized service?
      ko: 현재 권한 범위의 서비스 사용자에게 영향을 주고 있는 진행 중인 장애가 있나요?
  - id: current-health.overall-azure-summary
    category: current_health
    domain: state_incident_detection
    intent: current_health.overall_azure_summary
    target_kinds: [BusinessService, AzureResource]
    temporal_scope: current
    result_shape: assessment
    required_context: server_scope
    wording:
      en: Summarize the current health of all authorized Azure services in scope.
      ko: 범위 내 권한 범위의 모든 Azure 서비스의 현재 상태를 요약해 주세요.
  - id: current-health.aks-cluster-status
    category: current_health
    domain: state_incident_detection
    intent: current_health.aks_cluster_status
    target_kinds: [KubernetesCluster]
    temporal_scope: current
    result_shape: assessment
    required_context: explicit_target
    wording:
      en: Is the authorized AKS cluster currently in a healthy state?
      ko: 권한 범위의 AKS 클러스터가 현재 정상 상태인가요?
  - id: current-health.all-nodes-normal
    category: current_health
    domain: state_incident_detection
    intent: current_health.all_nodes_normal
    target_kinds: [KubernetesNode]
    temporal_scope: current
    result_shape: assessment
    required_context: explicit_target
    wording:
      en: Are all authorized nodes in the cluster currently operating normally?
      ko: 클러스터 내 권한 범위의 모든 노드가 현재 정상적으로 동작하고 있나요?
  - id: current-health.crashloopbackoff-pods
    category: current_health
    domain: state_incident_detection
    intent: current_health.crashloopbackoff_pods
    target_kinds: [KubernetesPod]
    temporal_scope: current
    result_shape: list
