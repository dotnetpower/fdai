    intent: incident.last_week_count
    target_kinds: [Incident]
    temporal_scope: historical
    result_shape: assessment
    required_context: server_scope
    wording:
      en: How many incidents were recorded for authorized services last week?
      ko: 지난주 권한 범위의 서비스에서 기록된 장애 발생 횟수는 몇 건인가요?
