    intent: incident.currently_open
    target_kinds: [Incident]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Is there an incident currently open for an authorized service?
      ko: 현재 권한 범위의 서비스에서 진행 중인 Incident가 있나요?
  - id: incident.today-highest-severity
    category: incident
