    intent: incident.impacted_services
    target_kinds: [Incident, BusinessService]
    temporal_scope: historical
    result_shape: list
    required_context: incident_binding
    wording:
      en: For the specified incident, which services fell within its bounded impact scope?
      ko: 지정된 장애에 대해, 그 영향 범위에 포함된 서비스는 무엇인가요?
  - id: incident.start-time
    category: incident
    domain: state_incident_detection
    intent: incident.start_time
    target_kinds: [Incident]
    temporal_scope: historical
    result_shape: timeline
    required_context: incident_binding
    wording:
      en: For the specified incident, when did it start according to the authoritative observation time?
      ko: 지정된 장애에 대해, 권위 있는 관측 시각 기준으로 언제 시작되었나요?
