    category: incident
    domain: state_incident_detection
    intent: incident.month_over_month_comparison
    target_kinds: [Incident]
    temporal_scope: comparison
    result_shape: comparison
    required_context: server_scope
    wording:
      en: Have recorded incidents for authorized services increased this month compared with last month?
      ko: 이번 달 권한 범위의 서비스의 기록된 장애가 지난달보다 증가했나요?
