    intent: incident.average_recovery_time
    target_kinds: [Incident]
    temporal_scope: historical
    result_shape: assessment
    required_context: server_scope
    wording:
      en: What is the average recovery time across recent recorded incidents?
      ko: 최근 기록된 장애의 평균 복구 시간은 얼마인가요?
