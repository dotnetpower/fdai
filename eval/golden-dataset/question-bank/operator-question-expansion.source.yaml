    category: incident
    domain: state_incident_detection
    intent: incident.resolved_time
    target_kinds: [Incident]
    temporal_scope: historical
    result_shape: timeline
    required_context: incident_binding
    wording:
      en: For the specified incident, when was it marked resolved according to authoritative evidence?
      ko: 지정된 장애에 대해, 권위 있는 근거 기준으로 언제 해결로 기록되었나요?
