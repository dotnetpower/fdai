    domain: state_incident_detection
    intent: incident.sev1_last_24h
    target_kinds: [Incident]
    temporal_scope: historical
    result_shape: assessment
    required_context: server_scope
    wording:
      en: Was there a Sev1 incident recorded for authorized services in the last 24 hours?
      ko: 지난 24시간 동안 권한 범위의 서비스에서 기록된 Sev1 장애가 있었나요?
  - id: incident.last-week-count
    category: incident
