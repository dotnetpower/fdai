  domain: dependency_impact
  intent: devops_sre.aks_ingress_tls_secret_and_route_collision
  target_kinds:
  - KubernetesCluster
  - KubernetesIngress
  - KubernetesService
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Do any Kubernetes Ingress resources reference missing TLS Secrets, non-existent backend service
