  domain: capacity_performance_forecast
  intent: devops_sre.predict_disk_and_inode_exhaustion_horizon
  target_kinds:
  - ManagedDisk
  - VirtualMachine
  - KubernetesNode
  temporal_scope: forecast
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: Based on recent growth rates, which volumes in the authorized scope are forecast to exhaust either
      disk byte capacity or inode capacity within 72 hours?
    ko: 최근 증가 추세를 기준으로 향후 72시간 이내에 디스크 바이트 용량이나 inode 용량이 고갈될 것으로 예측되는 볼륨은 무엇인가요?
- id: devops-sre.predict-slo-error-budget-exhaustion-time
