    ko: 목표 RTO와 RPO를 충족하기 위한 영역 중복 고가용성(Zone-Redundant HA)이나 지역 중복 백업이 설정되지 않은 PostgreSQL 또는 SQL 데이터베이스는
      무엇인가요?
- id: devops-sre.database-connection-pool-and-lock-contention
