    ko: 구독 범위에서 Owner, Contributor 또는 와일드카드 액션 역할 할당을 보유하여 최소 권한 원칙을 위반하는 관리 ID(Managed Identity)는 무엇인가요?
- id: devops-sre.storage-account-public-access-and-encryption
