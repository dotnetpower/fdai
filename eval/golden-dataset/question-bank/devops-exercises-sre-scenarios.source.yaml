    ko: AKS의 검증(validating) 및 변형(mutating) 어드미션 웹훅을 p99 평가 지연 시간과 타임아웃 거부 비율 순으로 보여 주세요.
- id: devops-sre.synthetic-probe-vs-ingress-availability-divergence
