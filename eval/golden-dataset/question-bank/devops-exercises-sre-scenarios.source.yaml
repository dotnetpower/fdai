  domain: capacity_performance_forecast
  intent: devops_sre.predict_slo_error_budget_exhaustion_time
  target_kinds:
  - ServiceObjective
  - BusinessService
  temporal_scope: forecast
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: At current multi-window error burn rates, which service objectives are forecast to exhaust their
      remaining error budget within the next 24 hours?
    ko: 현재의 다중 구간 에러 소진율(burn rate)이 유지될 때 향후 24시간 이내에 잔여 에러 버짓이 모두 소진될 것으로 예측되는 서비스 목표(SLO)는 무엇인가요?
- id: devops-sre.predict-database-connection-and-storage-saturation
  category: prediction
  domain: capacity_performance_forecast
  intent: devops_sre.predict_database_connection_and_storage_saturation
  target_kinds:
  - PostgreSQLFlexibleServer
  - SqlDatabase
  temporal_scope: forecast
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: Which database instances are projected to reach connection pool or storage capacity limits during
      the upcoming peak traffic window?
    ko: 다가오는 피크 트래픽 구간 동안 연결 풀 한도나 스토리지 용량 한계에 도달할 것으로 예측되는 데이터베이스 인스턴스는 무엇인가요?
- id: devops-sre.predict-memory-leak-oom-time-to-breach
  category: prediction
  domain: capacity_performance_forecast
  intent: devops_sre.predict_memory_leak_oom_time_to_breach
  target_kinds:
  - KubernetesPod
  - VirtualMachine
  temporal_scope: forecast
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: Which long-running Pods or virtual machines show a monotonic memory growth slope that predicts
      an OOM termination within the next 12 hours?
    ko: 단조 증가하는 메모리 사용 추세(기울기)를 보여 향후 12시간 이내에 OOM 종료가 발생할 것으로 예측되는 장기 실행 Pod나 가상 머신은 무엇인가요?
- id: devops-sre.spof-single-point-of-failure-topology-audit
  category: dependency_impact
  domain: dependency_impact
  intent: devops_sre.spof_single_point_of_failure_topology_audit
  target_kinds:
  - BusinessService
  - Workload
  - AzureResource
  temporal_scope: current
  result_shape: graph
  required_context: server_scope
  wording:
    en: Identify all single points of failure (SPOFs) in the authorized topology where a single-instance
      compute, database, or gateway resource backs a critical service.
    ko: 단일 인스턴스 컴퓨팅, 데이터베이스 또는 게이트웨이 리소스가 핵심 서비스를 뒷받침하고 있어 단일 장애점(SPOF)이 되는 토폴로지 지점을 모두 식별해 주세요.
- id: devops-sre.synchronous-coupling-cascade-blast-radius
  category: dependency_impact
  domain: dependency_impact
  intent: devops_sre.synchronous_coupling_cascade_blast_radius
  target_kinds:
  - BusinessService
  - Workload
  temporal_scope: current
  result_shape: graph
  required_context: server_scope
  wording:
    en: Which upstream services have tight synchronous request chains without circuit breakers or queue
      buffering that would cascade a downstream latency spike?
    ko: 서킷 브레이커나 메시지 큐 버퍼링 없이 강한 동기식 호출 체인으로 묶여 있어 하위 지연 시간 급증이 연쇄 장애로 전파될 수 있는 상위 서비스는 무엇인가요?
- id: devops-sre.shared-efs-file-storage-container-blast-radius
