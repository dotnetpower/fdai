  domain: reliability_policy_automation
  intent: devops_sre.scaling_stateless_session_readiness_for_autoscale
  target_kinds:
  - Workload
  - VirtualMachineScaleSet
  - KubernetesPod
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Do any horizontally autoscaled workloads still store local session or ephemeral disk state that
      would be lost on scale-in termination?
    ko: 수평 오토스케일링이 적용된 워크로드 중 스케일 인 종료 시 유실될 수 있는 로컬 세션이나 임시 디스크 상태를 여전히 보관하는 워크로드가 있나요?
- id: devops-sre.predict-disk-and-inode-exhaustion-horizon
