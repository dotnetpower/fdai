    ko: 현재 대화에 연결된 장애에서 상태 저장 방화벽 패킷 드롭이 발생하는 원인이 사용자 정의 경로(UDR)로 인한 피어링 서브넷 간 비대칭 왕복 라우팅 때문인가요?
- id: devops-sre.network-mtu-mss-blackhole-large-payload-hang-rca
