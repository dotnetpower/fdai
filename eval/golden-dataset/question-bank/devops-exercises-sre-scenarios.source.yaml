  intent: devops_sre.shared_efs_file_storage_container_blast_radius
  target_kinds:
  - StorageAccount
  - KubernetesPod
  - ContainerApp
  temporal_scope: current
  result_shape: graph
  required_context: server_scope
  wording:
    en: Which AKS Pods and Container Apps mount the same shared file storage volume and would be simultaneously
      impacted by storage throttling or mount loss?
    ko: 동일한 공유 파일 스토리지 볼륨을 마운트하고 있어 스토리지 스로틀링이나 마운트 단절 시 동시에 영향을 받는 AKS Pod와 Container App은 무엇인가요?
- id: devops-sre.etcd-and-control-plane-quorum-dependency
  category: dependency_impact
