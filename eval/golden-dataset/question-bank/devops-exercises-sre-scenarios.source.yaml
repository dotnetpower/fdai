  intent: devops_sre.scaling_dynamic_vs_predictive_policy_posture
  target_kinds:
  - VirtualMachineScaleSet
  - KubernetesCluster
  - Workload
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Which elastic workloads rely solely on reactive CPU threshold scaling instead of request-rate,
      queue-depth, or predictive scaling policies?
    ko: 요청률, 큐 깊이 또는 예측 기반 스케일링 정책 대신 사후 반응형 CPU 임계치 스케일링에만 의존하고 있는 탄력적 워크로드는 무엇인가요?
- id: devops-sre.scaling-boot-warmup-and-lifecycle-hook-delay
