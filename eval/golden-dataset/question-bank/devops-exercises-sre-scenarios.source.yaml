    ko: 권한 범위의 HorizontalPodAutoscaler(HPA) 중 metrics-server 장애나 Pod 리소스 request 누락으로 인해 ScalingActive=False
      또는 FailedGetResourceMetric을 보고하는 항목이 있나요?
