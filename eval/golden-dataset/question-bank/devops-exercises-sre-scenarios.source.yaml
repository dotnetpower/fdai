  - KubernetesCluster
  - KubernetesService
  - LoadBalancer
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: 'Which LoadBalancer Services use externalTrafficPolicy: Local on nodes that currently host zero
      local Pod endpoints, causing health-probe drops?'
    ko: 'externalTrafficPolicy: Local이 설정된 LoadBalancer Service 중 로컬 Pod 엔드포인트가 없는 노드로 인해 헬스 프로브 드롭이나
