  domain: state_incident_detection
  intent: devops_sre.aks_cronjob_missed_schedule_and_failed_history
  target_kinds:
  - KubernetesCluster
  - KubernetesPod
  - Workload
  temporal_scope: historical
  result_shape: list
  required_context: server_scope
  wording:
    en: Which Kubernetes CronJobs missed scheduled runs, exceeded startingDeadlineSeconds, or accumulated
