    ko: 비용 귀속(chargeback)에 필요한 필수 cost-center, environment 또는 owner 태그가 누락된 리소스 그룹과 고비용 리소스는 무엇인가요?
- id: devops-sre.finops-high-cardinality-observability-ingestion-cost
  category: cost_finops
  domain: cost_finops
  intent: devops_sre.finops_high_cardinality_observability_ingestion_cost
