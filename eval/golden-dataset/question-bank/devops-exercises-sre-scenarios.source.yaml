- id: devops-sre.scaling-vertical-vs-horizontal-stateful-limits
  category: capacity_scaling
  domain: capacity_performance_forecast
  intent: devops_sre.scaling_vertical_vs_horizontal_stateful_limits
  target_kinds:
  - PostgreSQLFlexibleServer
  - SqlDatabase
  - VirtualMachine
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Which stateful single-instance resources are approaching vertical SKU ceiling limits and require
      read replicas or horizontal partitioning?
    ko: 단일 인스턴스 상태 저장(stateful) 리소스 중 수직 SKU 상한선에 근접하여 읽기 복제본이나 수평 파티셔닝 도입이 필요한 대상은 무엇인가요?
- id: devops-sre.scaling-termination-policy-and-az-rebalance
  category: capacity_scaling
  domain: reliability_policy_automation
  intent: devops_sre.scaling_termination_policy_and_az_rebalance
  target_kinds:
  - VirtualMachineScaleSet
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: What scale-in termination policy and availability-zone rebalancing settings are configured on
      each Virtual Machine Scale Set in the authorized scope?
    ko: 권한 범위의 각 가상 머신 확장 집합(VMSS)에 어떤 스케일 인 종료 정책과 가용 영역 재균형(rebalancing) 설정이 구성되어 있나요?
- id: devops-sre.scaling-max-pods-per-node-cni-ip-exhaustion
