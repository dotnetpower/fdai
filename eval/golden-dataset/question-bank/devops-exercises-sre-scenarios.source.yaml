    ko: 이번 주 관측성 데이터 수집 비용 증가에서 가장 큰 비중을 차지하는 상세 로그 테이블이나 고카디널리티 메트릭 네임스페이스는 무엇인가요?
- id: devops-sre.scaling-dynamic-vs-predictive-policy-posture
