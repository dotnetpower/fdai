    ko: 지난 1시간 동안 발생(firing)과 해소(resolved) 상태 전이를 6회 이상 반복하여 알림 플래핑이나 임계치 노이즈를 보이는 메트릭 경보는 무엇인가요?
- id: devops-sre.distributed-trace-context-propagation-gaps
