  intent: devops_sre.etcd_and_control_plane_quorum_dependency
  target_kinds:
  - KubernetesCluster
  - Workload
  temporal_scope: current
  result_shape: assessment
  required_context: server_scope
  wording:
    en: Assess the control-plane and etcd quorum health of AKS clusters in the authorized scope and identify
      workloads whose autoscaling or rollouts depend on it.
    ko: 권한 범위 내 AKS 클러스터의 컨트롤 플레인 및 etcd 정족수(quorum) 상태를 평가하고, 오토스케일링이나 롤아웃이 이에 의존하는 워크로드를 식별해 주세요.
- id: devops-sre.kms-keyvault-revocation-downstream-impact
  category: dependency_impact
  domain: dependency_impact
  intent: devops_sre.kms_keyvault_revocation_downstream_impact
  target_kinds:
  - KeyVault
  - StorageAccount
  - ManagedDisk
  - PostgreSQLFlexibleServer
  temporal_scope: current
  result_shape: graph
  required_context: server_scope
  wording:
    en: Which Storage Accounts, Managed Disks, and Databases depend on customer-managed keys in Key Vault
      and would lose access if key permissions were revoked?
    ko: Key Vault의 고객 관리형 키(CMK)에 의존하고 있어 키 권한이 회수될 경우 접근이 차단되는 Storage Account, Managed Disk, 데이터베이스는
      무엇인가요?
- id: devops-sre.service-mesh-sidecar-proxy-dependency-path
