  domain: dependency_impact
  intent: devops_sre.service_mesh_sidecar_proxy_dependency_path
  target_kinds:
  - KubernetesCluster
  - KubernetesPod
  - KubernetesService
  temporal_scope: current
  result_shape: graph
  required_context: server_scope
  wording:
    en: Map the mTLS and sidecar proxy service-mesh dependencies between workloads in the authorized scope
      and highlight any strict-mode handshake failures.
    ko: 권한 범위 내 워크로드 간 mTLS 및 사이드카 프록시 서비스 메시 의존 경로를 매핑하고, strict 모드 핸드셰이크 실패가 발생하는 지점을 표시해 주세요.
- id: devops-sre.argo-canary-analysis-template-rollback-check
  category: change_deployment_release
  domain: change_deployment_impact
  intent: devops_sre.argo_canary_analysis_template_rollback_check
  target_kinds:
  - KubernetesCluster
  - Workload
  - Deployment
  temporal_scope: historical
  result_shape: timeline
  required_context: server_scope
  wording:
    en: Which recent Canary or Blue/Green rollouts paused or aborted promotion because automated AnalysisTemplate
      smoke or error-rate checks failed?
    ko: 자동화된 AnalysisTemplate 스모크 테스트나 오류율 검증 실패로 인해 승격이 일시 중지되거나 중단된 최근 카나리(Canary) 또는 블루/그린(Blue/Green)
      롤아웃은 무엇인가요?
- id: devops-sre.manual-kubectl-edit-gitops-outofsync-drift
  category: change_deployment_release
  domain: change_deployment_impact
  intent: devops_sre.manual_kubectl_edit_gitops_outofsync_drift
  target_kinds:
  - KubernetesCluster
  - Workload
  - ConfigurationDriftFinding
  temporal_scope: historical
  result_shape: list
  required_context: server_scope
  wording:
    en: Did any manual kubectl or portal mutations cause live Kubernetes resources to drift OutOfSync
      from their declared GitOps repository manifests?
    ko: 수동 kubectl 명령이나 포털 변경으로 인해 라이브 Kubernetes 리소스가 선언된 GitOps 저장소 매니페스트와 불일치(OutOfSync)하게 된 드리프트 내역이
      있나요?
- id: devops-sre.terraform-remote-state-lock-contention
  category: change_deployment_release
  domain: change_deployment_impact
  intent: devops_sre.terraform_remote_state_lock_contention
  target_kinds:
  - StorageAccount
  - ConfigurationBaseline
  - Deployment
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Are any Terraform remote state backends currently holding stale state locks or showing concurrent
      state modification conflicts?
    ko: 현재 오래된 상태 잠금(state lock)을 유지하고 있거나 동시 상태 수정 충돌을 보이는 Terraform 원격 상태 백엔드가 있나요?
- id: devops-sre.terraform-rename-resource-without-downtime
  category: change_deployment_release
  domain: change_deployment_impact
  intent: devops_sre.terraform_rename_resource_without_downtime
  target_kinds:
  - ConfigurationBaseline
  - AzureResource
  temporal_scope: current
  result_shape: assessment
  required_context: server_scope
  safety:
    action_posture: advise_only
    execution_authority: false
  wording:
    en: Do any pending Terraform plans propose destructive resource replacement on a rename or refactor
      instead of preserving state with moved blocks or create_before_destroy?
    ko: 진행 대기 중인 Terraform 플랜 중 리소스 이름 변경이나 리팩터링 시 moved 블록이나 create_before_destroy로 상태를 보존하지 않고 파괴적 교체(destroy/create)를
      제안하는 항목이 있나요?
- id: devops-sre.terraform-state-plaintext-secret-exposure
  category: change_deployment_release
  domain: reliability_policy_automation
  intent: devops_sre.terraform_state_plaintext_secret_exposure
  target_kinds:
  - ConfigurationBaseline
  - StorageAccount
  - KeyVault
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Are any infrastructure state backends lacking encryption, RBAC access controls, or secret-reference
      isolation needed to prevent plaintext credential exposure?
    ko: 평문 자격 증명 노출을 방지하기 위한 암호화, RBAC 접근 제어 또는 시크릿 참조 격리가 누락된 인프라 상태(state) 백엔드가 있나요?
- id: devops-sre.deployment-dependency-ordering-cluster-before-app
  category: change_deployment_release
  domain: change_deployment_impact
  intent: devops_sre.deployment_dependency_ordering_cluster_before_app
  target_kinds:
  - Deployment
  - KubernetesCluster
  - Workload
  temporal_scope: historical
  result_shape: timeline
  required_context: server_scope
  wording:
    en: Did any recent infrastructure deployments fail because application resources were applied before
      their target cluster or database dependency finished provisioning?
    ko: 최근 인프라 배포 중 대상 클러스터나 데이터베이스 의존성 프로비저닝이 완료되기 전에 애플리케이션 리소스가 먼저 적용되어 실패한 사례가 있나요?
- id: devops-sre.zero-downtime-migration-branch-by-abstraction
  category: change_deployment_release
  domain: change_deployment_impact
  intent: devops_sre.zero_downtime_migration_branch_by_abstraction
  target_kinds:
  - BusinessService
  - Workload
  - Deployment
  temporal_scope: current
  result_shape: assessment
  required_context: server_scope
  safety:
    action_posture: advise_only
    execution_authority: false
  wording:
    en: For active service migrations in the authorized scope, verify whether dual-run health probes,
      rollback readiness, and drain safeguards are satisfied before cutover.
    ko: 권한 범위에서 진행 중인 서비스 마이그레이션에 대해 컷오버 이전 이중 실행 상태 프로브, 롤백 준비 상태, 드레인 안전장치가 모두 충족되었는지 확인해 주세요.
- id: devops-sre.container-image-mutable-latest-tag-deployments
  category: change_deployment_release
  domain: change_deployment_impact
  intent: devops_sre.container_image_mutable_latest_tag_deployments
  target_kinds:
  - KubernetesCluster
  - KubernetesPod
  - ContainerRegistry
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Which production deployments use mutable image tags such as latest instead of immutable digest-pinned
      or semantic-versioned container images?
    ko: 불변 다이제스트 고정 이미지나 시맨틱 버전 태그 대신 latest와 같은 가변 이미지 태그를 사용하고 있는 운영 배포 워크로드는 무엇인가요?
