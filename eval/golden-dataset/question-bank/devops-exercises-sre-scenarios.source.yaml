  category: aks_kubernetes
  domain: state_incident_detection
  intent: devops_sre.aks_priorityclass_preemption_eviction_events
  target_kinds:
  - KubernetesCluster
  - KubernetesPod
  temporal_scope: historical
  result_shape: timeline
  required_context: server_scope
  wording:
    en: Which lower-priority AKS Pods were preempted or evicted during the past 60 minutes to make room
      for higher PriorityClass workloads?
    ko: 지난 60분 동안 더 높은 PriorityClass 워크로드의 리소스 확보를 위해 선점(preemption)되거나 축출된 하위 우선순위 AKS Pod는 무엇인가요?
- id: devops-sre.aks-hpa-failed-metric-computation-status
  category: aks_kubernetes
  domain: state_incident_detection
  intent: devops_sre.aks_hpa_failed_metric_computation_status
  target_kinds:
  - KubernetesCluster
  - Workload
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Are any HorizontalPodAutoscalers in the authorized scope reporting ScalingActive=False or FailedGetResourceMetric
