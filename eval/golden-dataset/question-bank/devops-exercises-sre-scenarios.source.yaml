    ko: 권한 범위의 Storage Account 중 퍼블릭 Blob 접근을 허용하거나, HTTP 또는 TLS 1.2 미만을 허용하거나, 고객 관리형 키(CMK/KMS) 암호화가
      누락된 계정은 무엇인가요?
- id: devops-sre.blob-versioning-and-soft-delete-protection
  category: database_storage
  domain: reliability_policy_automation
  intent: devops_sre.blob_versioning_and_soft_delete_protection
