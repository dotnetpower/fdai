    ko: 실수로 인한 객체 덮어쓰기나 삭제 시 복구에 필요한 Blob 버전 관리(versioning) 또는 소프트 삭제 보존 설정이 누락된 스토리지 계정은 무엇인가요?
- id: devops-sre.postgres-zone-redundant-ha-and-backup-rpo
  category: database_storage
  domain: reliability_policy_automation
  intent: devops_sre.postgres_zone_redundant_ha_and_backup_rpo
  target_kinds:
  - PostgreSQLFlexibleServer
  - SqlDatabase
  temporal_scope: current
  result_shape: assessment
  required_context: server_scope
  wording:
