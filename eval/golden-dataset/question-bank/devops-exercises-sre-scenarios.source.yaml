    ko: 연결된 장애의 루트리스(non-root) 컨테이너가 마운트된 볼륨에 대한 Pod securityContext의 fsGroup 소유권 설정 누락으로 인해 Permission
      Denied 오류로 기동에 실패했나요?
- id: devops-sre.kubernetes-missing-startup-probe-premature-kill-rca
