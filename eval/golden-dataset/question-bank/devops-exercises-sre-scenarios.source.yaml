    ko: 지난 24시간 동안 예약 실행을 놓쳤거나, startingDeadlineSeconds를 초과했거나, 실패한 Job Pod가 누적된 Kubernetes CronJob은 무엇인가요?
- id: devops-sre.aks-ingress-tls-secret-and-route-collision
