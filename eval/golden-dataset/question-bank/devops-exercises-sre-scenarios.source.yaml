    ko: 권한 범위에서 연결된 Managed Disk 중 저장 데이터 암호화나 예약된 스냅샷 백업 정책이 누락된 디스크는 무엇인가요?
- id: devops-sre.cache-eviction-and-miss-ratio-spike
