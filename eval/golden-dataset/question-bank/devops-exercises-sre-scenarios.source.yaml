  domain: state_incident_detection
  intent: devops_sre.synthetic_probe_vs_ingress_availability_divergence
  target_kinds:
  - ApplicationGateway
  - ApplicationInsightsComponent
  - BusinessService
  temporal_scope: comparison
  result_shape: comparison
  required_context: server_scope
  wording:
    en: Are any services showing 100% synthetic health-probe success while live ingress traffic reports
      elevated 5xx or client timeout rates?
    ko: 합성 헬스 프로브는 100% 정상으로 나타나지만 실제 인그레스 트래픽에서는 5xx 오류나 클라이언트 타임아웃 비율이 높게 나타나는 서비스가 있나요?
- id: devops-sre.aks-init-container-failure-blocking-startup
  category: aks_kubernetes
  domain: root_cause_analysis
  intent: devops_sre.aks_init_container_failure_blocking_startup
  target_kinds:
  - KubernetesCluster
  - KubernetesPod
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Which AKS Pods are currently blocked in Init:Error or Init:CrashLoopBackOff before their application
