    ko: 애플리케이션 컨테이너가 시작되기 전 Init:Error 또는 Init:CrashLoopBackOff 상태에 막혀 있는 AKS Pod는 무엇인가요?
- id: devops-sre.aks-topology-spread-and-pod-antiaffinity-skew
