  domain: capacity_performance_forecast
  intent: devops_sre.scaling_max_pods_per_node_cni_ip_exhaustion
  target_kinds:
  - KubernetesCluster
  - KubernetesNode
  - Subnet
  temporal_scope: current
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: Which AKS subnets or nodes are approaching Azure CNI IP address exhaustion or maxPods-per-node
      limits that would block horizontal scale-out?
    ko: 수평 스케일 아웃을 차단할 수 있는 Azure CNI 서브넷 IP 주소 고갈이나 노드당 최대 Pod(maxPods) 한도에 근접한 AKS 서브넷 또는 노드는 어디인가요?
- id: devops-sre.scaling-stateless-session-readiness-for-autoscale
