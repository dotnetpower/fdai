schema_version: 1.0.0
source_id: devops-exercises-sre-scenarios-2026-11
questions:
- id: devops-sre.kubelet-stopped-worker-pod-state
  category: current_health
  domain: state_incident_detection
  intent: devops_sre.kubelet_stopped_worker_pod_state
  target_kinds:
  - KubernetesCluster
  - KubernetesNode
  - KubernetesPod
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Are any AKS worker nodes currently reporting a stopped or stale kubelet heartbeat, and which running
      Pods on those nodes are approaching eviction?
    ko: 현재 AKS 워커 노드 중 kubelet 하트비트가 중지되었거나 지연된 노드가 있나요? 해당 노드에서 실행 중인 Pod 중 축출 시점에 근접한 대상도 알려 주세요.
- id: devops-sre.argocd-app-health-vs-sync-state
  category: current_health
  domain: state_incident_detection
  intent: devops_sre.argocd_app_health_vs_sync_state
  target_kinds:
  - KubernetesCluster
  - Workload
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Which GitOps-managed workloads in the authorized scope are currently Synced in manifest state
      but Degraded or Progressing in runtime application health?
    ko: 권한 범위의 GitOps 관리 워크로드 중 매니페스트 상태는 동기화되어 있으나 런타임 애플리케이션 상태가 저하(Degraded)되었거나 진행 중(Progressing)인
      항목은 무엇인가요?
- id: devops-sre.linux-memavailable-vs-memfree-pressure
  category: current_health
  domain: state_incident_detection
  intent: devops_sre.linux_memavailable_vs_memfree_pressure
  target_kinds:
  - VirtualMachine
  - KubernetesNode
  temporal_scope: current
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: Which Linux hosts or AKS nodes currently have critically low MemAvailable relative to total memory,
      distinguishing true reclaimable cache from low MemFree?
    ko: 현재 Linux 호스트나 AKS 노드 중 단순 MemFree 부족이 아니라 회수 가능한 캐시를 고려한 MemAvailable 비율이 위험 수준으로 낮은 노드는 어디인가요?
- id: devops-sre.filesystem-inode-exhaustion-check
  category: current_health
  domain: state_incident_detection
  intent: devops_sre.filesystem_inode_exhaustion_check
  target_kinds:
  - VirtualMachine
  - ManagedDisk
  - KubernetesNode
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Are any mounted volumes in the authorized scope running out of free inodes despite having available
      disk byte capacity?
    ko: 권한 범위에 마운트된 볼륨 중 디스크 바이트 여유 공간은 남아 있지만 사용 가능한 inode가 고갈되고 있는 볼륨이 있나요?
- id: devops-sre.load-balancer-unhealthy-target-groups
  category: current_health
  domain: state_incident_detection
  intent: devops_sre.load_balancer_unhealthy_target_groups
  target_kinds:
  - ApplicationGateway
  - LoadBalancer
  - BackendAddressPool
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Which Application Gateway or Load Balancer backend pools currently have failing health probes,
      and what protocol and port does each failing probe check?
    ko: 현재 상태 프로브가 실패하고 있는 Application Gateway 또는 Load Balancer 백엔드 풀은 어디이며, 각 실패 프로브가 점검하는 프로토콜과 포트는
      무엇인가요?
- id: devops-sre.zombie-defunct-process-accumulation
  category: current_health
  domain: state_incident_detection
  intent: devops_sre.zombie_defunct_process_accumulation
  target_kinds:
  - VirtualMachine
  - KubernetesNode
  temporal_scope: current
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: Are any compute hosts in the authorized scope accumulating defunct zombie processes that risk
      exhausting process table slots?
    ko: 권한 범위의 컴퓨팅 호스트 중 프로세스 테이블 슬롯 고갈 위험이 있을 정도로 좀비(defunct) 프로세스가 누적되고 있는 호스트가 있나요?
- id: devops-sre.certificate-tls-expiry-window-status
  category: current_health
  domain: reliability_policy_automation
  intent: devops_sre.certificate_tls_expiry_window_status
  target_kinds:
  - KeyVault
  - ApplicationGateway
  - KubernetesIngress
  temporal_scope: current
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: Which TLS certificates bound to Application Gateways, Ingresses, or Key Vaults in the authorized
      scope expire within the next 30 days?
    ko: 권한 범위에서 Application Gateway, Ingress 또는 Key Vault에 연결된 TLS 인증서 중 향후 30일 이내에 만료되는 인증서는 무엇인가요?
- id: devops-sre.prometheus-scrape-target-freshness
  category: current_health
  domain: state_incident_detection
  intent: devops_sre.prometheus_scrape_target_freshness
  target_kinds:
  - AzureMonitorWorkspace
  - KubernetesCluster
  - Workload
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Which monitored scrape targets or exporters in the authorized scope have stale heartbeats or failed
      metric collection during the current window?
    ko: 권한 범위의 모니터링 스크레이프 대상이나 익스포터 중 현재 구간에서 하트비트가 오래되었거나 메트릭 수집에 실패한 대상은 무엇인가요?
- id: devops-sre.container-immediate-exit-incident
  category: incident
  domain: state_incident_detection
  intent: devops_sre.container_immediate_exit_incident
  target_kinds:
  - KubernetesPod
  - ContainerApp
  temporal_scope: current
  result_shape: list
  required_context: incident_binding
  wording:
    en: For the incident linked to this conversation, did any containers exit immediately after startup
      due to an invalid entrypoint, command, or missing dependency?
    ko: 현재 대화에 연결된 장애에서 잘못된 엔트리포인트, 명령어 또는 누락된 의존성 때문에 시작 직후 즉시 종료된 컨테이너가 있나요?
- id: devops-sre.oom-killer-invocation-incident
  category: incident
  domain: state_incident_detection
  intent: devops_sre.oom_killer_invocation_incident
  target_kinds:
  - KubernetesPod
  - KubernetesNode
  - VirtualMachine
  temporal_scope: historical
  result_shape: timeline
  required_context: incident_binding
  wording:
    en: In the incident linked to this conversation, when did kernel OOM killer events or container OOMKilled
      terminations occur across affected nodes and Pods?
    ko: 현재 대화에 연결된 장애에서 영향받은 노드와 Pod에 걸쳐 커널 OOM killer 이벤트나 컨테이너 OOMKilled 종료가 언제 발생했나요?
- id: devops-sre.http-502-504-gateway-error-burst
  category: incident
  domain: state_incident_detection
  intent: devops_sre.http_502_504_gateway_error_burst
  target_kinds:
  - ApplicationGateway
  - BusinessService
  - Workload
  temporal_scope: comparison
  result_shape: comparison
  required_context: incident_binding
  wording:
    en: For the incident linked to this conversation, compare HTTP 502 Bad Gateway vs 504 Gateway Timeout
      error rates against the pre-incident baseline.
    ko: 현재 대화에 연결된 장애에 대해 장애 이전 기준선과 비교하여 HTTP 502 Bad Gateway 및 504 Gateway Timeout 오류율 변화를 비교해 주세요.
- id: devops-sre.synchronous-spike-queue-deadletter-surge
  category: incident
  domain: state_incident_detection
  intent: devops_sre.synchronous_spike_queue_deadletter_surge
  target_kinds:
  - EventHubNamespace
  - ServiceBusNamespace
  - Workload
  temporal_scope: historical
  result_shape: timeline
  required_context: incident_binding
  wording:
    en: During the incident linked to this conversation, did a traffic spike cause synchronous upstream
      timeouts or a surge in dead-letter queue messages?
    ko: 현재 대화에 연결된 장애 동안 트래픽 급증으로 인해 동기식 업스트림 타임아웃이나 데드레터 큐(DLQ) 메시지 급증이 발생했나요?
- id: devops-sre.spot-eviction-cascade-incident
  category: incident
  domain: state_incident_detection
  intent: devops_sre.spot_eviction_cascade_incident
  target_kinds:
  - VirtualMachineScaleSet
  - KubernetesNode
  - KubernetesPod
  temporal_scope: historical
  result_shape: timeline
  required_context: incident_binding
  wording:
    en: For the incident linked to this conversation, were Spot instance evictions or preemptions observed
      prior to the service availability drop?
    ko: 현재 대화에 연결된 장애에서 서비스 가용성 저하 이전에 Spot 인스턴스 축출(eviction)이나 선점 이벤트가 관측되었나요?
- id: devops-sre.dns-nxdomain-servfail-incident-surge
  category: incident
  domain: state_incident_detection
  intent: devops_sre.dns_nxdomain_servfail_incident_surge
  target_kinds:
  - PrivateDnsZone
  - KubernetesCluster
  - VirtualNetwork
  temporal_scope: comparison
  result_shape: comparison
  required_context: incident_binding
  wording:
    en: In the incident linked to this conversation, did DNS NXDOMAIN or SERVFAIL lookup failures surge
      compared with the preceding 15-minute window?
    ko: 현재 대화에 연결된 장애에서 직전 15분 구간과 비교해 DNS NXDOMAIN 또는 SERVFAIL 조회 실패가 급증했나요?
- id: devops-sre.connection-draining-reset-during-scalein
  category: incident
  domain: state_incident_detection
  intent: devops_sre.connection_draining_reset_during_scalein
  target_kinds:
  - ApplicationGateway
  - VirtualMachineScaleSet
  - KubernetesPod
  temporal_scope: historical
  result_shape: timeline
  required_context: incident_binding
  wording:
    en: During the incident linked to this conversation, were active client connections terminated before
      connection draining completed during scale-in?
    ko: 현재 대화에 연결된 장애 동안 스케일 인 과정에서 연결 드레이닝(connection draining)이 완료되기 전에 활성 클라이언트 연결이 끊겼나요?
- id: devops-sre.slo-error-budget-fast-burn-incident
  category: incident
  domain: reliability_policy_automation
  intent: devops_sre.slo_error_budget_fast_burn_incident
  target_kinds:
  - ServiceObjective
  - BusinessService
  temporal_scope: current
  result_shape: assessment
  required_context: incident_binding
  wording:
    en: For the incident linked to this conversation, how much of the service's monthly SLO error budget
      has been consumed, and is a release freeze triggered?
    ko: 현재 대화에 연결된 장애로 인해 서비스의 월간 SLO 에러 버짓이 얼마나 소진되었으며, 배포 동결 기준에 도달했나요?
- id: devops-sre.connection-timeout-vs-connection-refused-rca
  category: root_cause
  domain: root_cause_analysis
  intent: devops_sre.connection_timeout_vs_connection_refused_rca
  target_kinds:
  - VirtualMachine
  - NetworkSecurityGroup
  - ApplicationGateway
  temporal_scope: current
  result_shape: assessment
  required_context: incident_binding
  wording:
    en: For the unreachable application in this incident, does evidence show a connection timeout from
      silent NSG or firewall packet drops, or a connection refused from an inactive listener port?
    ko: 이번 장애에서 접속 불가 상태인 애플리케이션의 근거를 볼 때, NSG와 방화벽 패킷 드롭으로 인한 연결 타임아웃인가요, 아니면 리스닝 포트 미기동으로 인한 연결 거부(connection
      refused)인가요?
- id: devops-sre.lb-missing-sticky-session-login-loss-rca
  category: root_cause
  domain: root_cause_analysis
  intent: devops_sre.lb_missing_sticky_session_login_loss_rca
  target_kinds:
  - ApplicationGateway
  - LoadBalancer
  - Workload
  temporal_scope: current
  result_shape: assessment
  required_context: incident_binding
  wording:
    en: In the incident linked to this conversation, are users losing authenticated sessions across page
      loads because load balancer cookie affinity is disabled without a shared session store?
    ko: 현재 대화에 연결된 장애에서 공유 세션 저장소 없이 로드밸런서 쿠키 세션 친화성(sticky session)이 비활성화되어 페이지 이동 시 사용자 인증 세션이 풀리고 있나요?
- id: devops-sre.container-localhost-loopback-db-failure-rca
  category: root_cause
  domain: root_cause_analysis
  intent: devops_sre.container_localhost_loopback_db_failure_rca
  target_kinds:
  - KubernetesPod
  - ContainerApp
  - PostgreSQLFlexibleServer
  temporal_scope: current
  result_shape: assessment
  required_context: incident_binding
  wording:
    en: Did the workload in the linked incident fail to reach its database because its configuration targets
      localhost loopback instead of the database service DNS name?
    ko: 연결된 장애의 워크로드가 데이터베이스 서비스 DNS 이름 대신 localhost 루프백을 가리키도록 잘못 구성되어 데이터베이스 연결에 실패했나요?
- id: devops-sre.read-replica-staleness-consistency-rca
  category: root_cause
  domain: root_cause_analysis
  intent: devops_sre.read_replica_staleness_consistency_rca
  target_kinds:
  - PostgreSQLFlexibleServer
  - SqlDatabase
  - Workload
  temporal_scope: current
  result_shape: assessment
  required_context: incident_binding
  wording:
    en: In the incident linked to this conversation, are stale user reads caused by asynchronous read-replica
      replication lag after recent writes?
    ko: 현재 대화에 연결된 장애에서 최근 쓰기 직후 오래된 데이터가 조회되는 원인이 비동기 읽기 복제본(Read Replica)의 복제 지연 때문인가요?
- id: devops-sre.cross-zone-instance-imbalance-hotspot-rca
  category: root_cause
  domain: root_cause_analysis
  intent: devops_sre.cross_zone_instance_imbalance_hotspot_rca
  target_kinds:
  - LoadBalancer
  - ApplicationGateway
  - VirtualMachineScaleSet
  temporal_scope: current
  result_shape: comparison
  required_context: incident_binding
  wording:
    en: For the incident linked to this conversation, is compute saturation in one availability zone caused
      by uneven zone instance counts combined with zone-scoped load balancing?
    ko: 현재 대화에 연결된 장애에서 특정 가용 영역(AZ)의 컴퓨팅 포화가 영역별 인스턴스 수 불균형과 영역 단위 로드밸런싱 설정이 결합되어 발생했나요?
- id: devops-sre.disk-cross-zone-attach-failure-rca
  category: root_cause
  domain: root_cause_analysis
  intent: devops_sre.disk_cross_zone_attach_failure_rca
  target_kinds:
  - VirtualMachine
  - ManagedDisk
  temporal_scope: current
  result_shape: assessment
  required_context: incident_binding
  wording:
    en: Did the volume attachment failure in the linked incident occur because the Managed Disk and target
      Virtual Machine reside in different availability zones?
    ko: 연결된 장애에서 볼륨 연결 실패가 발생한 원인이 Managed Disk와 대상 가상 머신이 서로 다른 가용 영역(AZ)에 배치되어 있기 때문인가요?
- id: devops-sre.network-file-mount-hang-nsg-dns-rca
  category: root_cause
  domain: root_cause_analysis
  intent: devops_sre.network_file_mount_hang_nsg_dns_rca
  target_kinds:
  - StorageAccount
  - VirtualNetwork
  - NetworkSecurityGroup
  temporal_scope: current
  result_shape: assessment
  required_context: incident_binding
  wording:
    en: 'Why is the shared file storage mount hanging in the linked incident: blocked NFS/SMB security
      rules, missing Private Endpoint DNS resolution, or subnet routing?'
    ko: 연결된 장애에서 공유 파일 스토리지 마운트가 멈추는(hang) 원인이 NFS/SMB 보안 규칙 차단인가요, 아니면 프라이빗 엔드포인트 DNS 해석 누락이나 서브넷 라우팅
      문제인가요?
- id: devops-sre.deleted-open-file-disk-full-rca
  category: root_cause
  domain: root_cause_analysis
  intent: devops_sre.deleted_open_file_disk_full_rca
  target_kinds:
  - VirtualMachine
  - KubernetesNode
  - ManagedDisk
  temporal_scope: current
  result_shape: assessment
  required_context: incident_binding
  wording:
    en: In the incident linked to this conversation, is disk space still exhausted after log deletion
      because a running process holds open file descriptors to unlinked files?
    ko: 현재 대화에 연결된 장애에서 로그 파일을 삭제한 뒤에도 디스크 공간이 계속 가득 찬 원인이 실행 중인 프로세스가 삭제된 파일의 열린 파일 디스크립터를 유지하고 있기 때문인가요?
- id: devops-sre.autoscaling-thrashing-cooldown-rca
  category: root_cause
  domain: root_cause_analysis
  intent: devops_sre.autoscaling_thrashing_cooldown_rca
  target_kinds:
  - VirtualMachineScaleSet
  - KubernetesCluster
  - Workload
  temporal_scope: historical
  result_shape: timeline
  required_context: incident_binding
  wording:
    en: 'Why is the workload in the linked incident repeatedly scaling out and scaling in: an overly short
      cooldown period, aggressive metric thresholds, or slow instance warmup?'
    ko: 연결된 장애의 워크로드가 반복적으로 스케일 아웃과 스케일 인을 되풀이하는 원인이 너무 짧은 쿨다운 시간인가요, 공격적인 메트릭 임계치인가요, 아니면 느린 인스턴스 예열
      시간인가요?
- id: devops-sre.nlb-target-unreachable-security-rule-rca
  category: root_cause
  domain: root_cause_analysis
  intent: devops_sre.nlb_target_unreachable_security_rule_rca
  target_kinds:
  - LoadBalancer
  - NetworkSecurityGroup
  - VirtualMachine
  temporal_scope: current
  result_shape: assessment
  required_context: incident_binding
  wording:
    en: For the network load balancer failure in this incident, are backend instances unreachable because
      backend NSG rules block client source IPs or health probe ranges?
    ko: 이번 장애의 네트워크 로드밸런서 연결 실패에서 백엔드 NSG 규칙이 클라이언트 원본 IP 대역이나 상태 프로브 IP 범위를 차단하여 백엔드 인스턴스에 도달하지 못하고 있나요?
- id: devops-sre.dns-ttl-caching-stale-endpoint-rca
  category: root_cause
  domain: root_cause_analysis
  intent: devops_sre.dns_ttl_caching_stale_endpoint_rca
  target_kinds:
  - PrivateDnsZone
  - PublicIPAddress
  - Workload
  temporal_scope: historical
  result_shape: timeline
  required_context: incident_binding
  wording:
    en: After the endpoint failover in the linked incident, are clients still sending traffic to the old
      IP address because of a high DNS record TTL and resolver caching?
    ko: 연결된 장애에서 엔드포인트 페일오버 이후에도 높은 DNS 레코드 TTL과 리졸버 캐싱 때문에 클라이언트가 여전히 이전 IP 주소로 트래픽을 보내고 있나요?
- id: devops-sre.systemd-service-crash-loop-dependency-rca
  category: root_cause
  domain: root_cause_analysis
  intent: devops_sre.systemd_service_crash_loop_dependency_rca
  target_kinds:
  - VirtualMachine
  - KubernetesNode
  temporal_scope: current
  result_shape: assessment
  required_context: incident_binding
  wording:
    en: On the affected host in the linked incident, which systemd unit or daemon is failing to start,
      and what exit code or missing unit dependency is recorded?
    ko: 연결된 장애의 영향받은 호스트에서 시작에 실패하고 있는 systemd 유닛이나 데몬은 무엇이며, 어떤 종료 코드나 유닛 의존성 누락이 기록되어 있나요?
- id: devops-sre.prometheus-cpu-counter-to-percentage-rate
  category: metrics_observability
  domain: capacity_performance_forecast
  intent: devops_sre.prometheus_cpu_counter_to_percentage_rate
  target_kinds:
  - KubernetesCluster
  - KubernetesPod
  - VirtualMachine
  temporal_scope: current
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: Rank workloads in the authorized scope by normalized CPU utilization percentage derived from cumulative
      CPU seconds counters over the current 5-minute window.
    ko: 권한 범위의 워크로드를 현재 5분 구간의 누적 CPU 초(counter) 증가율로부터 계산된 정규화 CPU 사용률(%) 순으로 보여 주세요.
- id: devops-sre.metric-cardinality-explosion-top-labels
  category: metrics_observability
  domain: capacity_performance_forecast
  intent: devops_sre.metric_cardinality_explosion_top_labels
  target_kinds:
  - AzureMonitorWorkspace
  - ManagedGrafana
  - KubernetesCluster
  temporal_scope: comparison
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: Which metric families and high-cardinality label dimensions drove the largest increase in active
      time series compared with the daily baseline?
    ko: 일간 기준선과 비교해 활성 시계열(time series) 수의 가장 큰 증가를 유발한 메트릭 패밀리와 고카디널리티 레이블 차원은 무엇인가요?
- id: devops-sre.apm-golden-signals-latency-traffic-errors
  category: metrics_observability
  domain: capacity_performance_forecast
  intent: devops_sre.apm_golden_signals_latency_traffic_errors
  target_kinds:
  - ApplicationInsightsComponent
  - BusinessService
  - Workload
  temporal_scope: comparison
  result_shape: comparison
  required_context: server_scope
  wording:
    en: Compare p95 latency, request rate, error ratio, and saturation across all APM-monitored backend
      services against their previous 1-hour baseline.
    ko: APM으로 모니터링되는 모든 백엔드 서비스에 대해 p95 지연 시간, 요청률, 오류 비율, 포화도를 이전 1시간 기준선과 비교해 주세요.
- id: devops-sre.linux-load-average-vs-cpu-core-count
  category: metrics_observability
  domain: capacity_performance_forecast
  intent: devops_sre.linux_load_average_vs_cpu_core_count
  target_kinds:
  - VirtualMachine
  - KubernetesNode
  temporal_scope: current
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: Which nodes or virtual machines have a 1-minute or 5-minute load average exceeding their allocated
      vCPU core count, and is the bottleneck CPU run-queue or disk I/O wait?
    ko: 할당된 vCPU 코어 수를 초과하는 1분 또는 5분 평균 부하(load average)를 보이는 노드나 가상 머신은 어디이며, 병목 원인이 CPU 실행 대기열인가요 아니면
      디스크 I/O 대기인가요?
- id: devops-sre.swap-in-out-paging-thrash-detection
  category: metrics_observability
  domain: capacity_performance_forecast
  intent: devops_sre.swap_in_out_paging_thrash_detection
  target_kinds:
  - VirtualMachine
  - KubernetesNode
  temporal_scope: current
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: Are any hosts in the authorized scope experiencing active swap-in and swap-out paging thrashing
      rather than benign page-cache reclamation?
    ko: 권한 범위의 호스트 중 정상적인 페이지 캐시 회수가 아니라 활발한 스왑 인/아웃 페이징 스래싱을 겪고 있는 호스트가 있나요?
- id: devops-sre.log-ingestion-pipeline-drop-or-lag
  category: metrics_observability
  domain: state_incident_detection
  intent: devops_sre.log_ingestion_pipeline_drop_or_lag
  target_kinds:
  - LogAnalyticsWorkspace
  - EventHubNamespace
  - KubernetesCluster
  temporal_scope: comparison
  result_shape: comparison
  required_context: server_scope
  wording:
    en: Did any log shipping agents or Log Analytics workspaces experience a sudden drop in ingested log
      volume or elevated ingestion latency over the past 30 minutes?
    ko: 지난 30분 동안 로그 수집 에이전트나 Log Analytics 워크스페이스에서 수집 로그 볼륨 급감이나 수집 지연 시간 증가가 발생했나요?
- id: devops-sre.tcp-retransmission-and-syn-drop-metrics
  category: metrics_observability
  domain: capacity_performance_forecast
  intent: devops_sre.tcp_retransmission_and_syn_drop_metrics
  target_kinds:
  - VirtualMachine
  - KubernetesNode
  - NetworkInterface
  temporal_scope: current
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: Which network interfaces or nodes currently exhibit elevated TCP retransmission rates or SYN backlog
      drops in the authorized scope?
    ko: 권한 범위에서 현재 TCP 재전송률이 높거나 SYN 백로그 드롭이 발생하는 네트워크 인터페이스 또는 노드는 어디인가요?
- id: devops-sre.kafka-eventhub-consumer-lag-by-partition
  category: metrics_observability
  domain: capacity_performance_forecast
  intent: devops_sre.kafka_eventhub_consumer_lag_by_partition
  target_kinds:
  - EventHubNamespace
  - ServiceBusNamespace
  - Workload
  temporal_scope: current
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: Which streaming consumer groups have growing partition offset lag or skewed partition processing
      latency in the authorized scope?
    ko: 권한 범위에서 파티션 오프셋 지연(consumer lag)이 증가하거나 특정 파티션 처리 지연이 편중된 스트리밍 컨슈머 그룹은 무엇인가요?
- id: devops-sre.aks-pod-pending-scheduling-reasons
  category: aks_kubernetes
  domain: root_cause_analysis
  intent: devops_sre.aks_pod_pending_scheduling_reasons
  target_kinds:
  - KubernetesCluster
  - KubernetesPod
  - KubernetesNode
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: 'For all AKS Pods currently stuck in Pending phase, classify the exact scheduling blocker: insufficient
      CPU or memory, untolerated node taints, nodeAffinity mismatch, or unbound PVC.'
    ko: 현재 Pending 상태에 머물러 있는 모든 AKS Pod에 대해 CPU와 메모리 부족, 허용되지 않은 노드 테인트(taint), nodeAffinity 불일치, 미바인딩
      PVC 중 정확한 스케줄링 차단 원인을 분류해 주세요.
- id: devops-sre.aks-crashloopbackoff-exit-code-diagnosis
  category: aks_kubernetes
  domain: root_cause_analysis
  intent: devops_sre.aks_crashloopbackoff_exit_code_diagnosis
  target_kinds:
  - KubernetesCluster
  - KubernetesPod
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Which AKS Pods are currently in CrashLoopBackOff, and what last termination exit code, signal,
      and container log error were recorded for each?
    ko: 현재 CrashLoopBackOff 상태인 AKS Pod는 무엇이며, 각 컨테이너의 마지막 종료 코드, 시그널, 컨테이너 로그 오류는 무엇인가요?
- id: devops-sre.aks-imagepullbackoff-registry-auth-or-tag
  category: aks_kubernetes
  domain: root_cause_analysis
  intent: devops_sre.aks_imagepullbackoff_registry_auth_or_tag
  target_kinds:
  - KubernetesCluster
  - KubernetesPod
  - ContainerRegistry
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Which AKS Pods are failing with ImagePullBackOff or ErrImagePull, and is the failure caused by
      a missing image tag, registry RBAC denial, or private network path?
    ko: 현재 ImagePullBackOff 또는 ErrImagePull로 실패하는 AKS Pod는 무엇이며, 원인이 존재하지 않는 이미지 태그, 레지스트리 RBAC 권한 거부,
      프라이빗 네트워크 경로 문제 중 무엇인가요?
- id: devops-sre.aks-liveness-vs-readiness-probe-failures
  category: aks_kubernetes
  domain: state_incident_detection
  intent: devops_sre.aks_liveness_vs_readiness_probe_failures
  target_kinds:
  - KubernetesCluster
  - KubernetesPod
  - KubernetesService
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Separate AKS Pods experiencing livenessProbe failures causing container restarts from Pods experiencing
      readinessProbe failures removing them from Service endpoints.
    ko: livenessProbe 실패로 컨테이너가 재시작되는 AKS Pod와 readinessProbe 실패로 Service 엔드포인트에서 제외된 Pod를 구분해 보여 주세요.
- id: devops-sre.aks-networkpolicy-egress-ingress-conflict
  category: aks_kubernetes
  domain: dependency_impact
  intent: devops_sre.aks_networkpolicy_egress_ingress_conflict
  target_kinds:
  - KubernetesCluster
  - KubernetesPod
  - KubernetesNetworkPolicy
  temporal_scope: current
  result_shape: graph
  required_context: server_scope
  wording:
    en: Are any Pod-to-Pod communication paths blocked because a source Pod egress NetworkPolicy denies
      traffic even though the destination Pod ingress policy allows it?
    ko: 대상 Pod의 Ingress NetworkPolicy는 트래픽을 허용하지만 소스 Pod의 Egress 정책이 차단하여 막혀 있는 Pod 간 통신 경로가 있나요?
- id: devops-sre.aks-service-selector-label-mismatch
  category: aks_kubernetes
  domain: dependency_impact
  intent: devops_sre.aks_service_selector_label_mismatch
  target_kinds:
  - KubernetesCluster
  - KubernetesService
  - KubernetesPod
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Which Kubernetes Services in the authorized scope have zero ready endpoints because their label
      selectors do not match any running Pod labels?
    ko: 권한 범위의 Kubernetes Service 중 레이블 셀렉터가 실행 중인 어떤 Pod의 레이블과도 일치하지 않아 준비된 엔드포인트가 0개인 서비스는 무엇인가요?
- id: devops-sre.aks-resourcequota-and-limitrange-saturation
  category: aks_kubernetes
  domain: capacity_performance_forecast
  intent: devops_sre.aks_resourcequota_and_limitrange_saturation
  target_kinds:
  - KubernetesCluster
  - KubernetesNamespace
  temporal_scope: current
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: Which AKS namespaces are above 85% of their ResourceQuota for CPU requests, memory limits, or
      object counts such as Pods, Services, and ReplicaSets?
    ko: CPU 요청량, 메모리 상한, 또는 Pod와 Service 및 ReplicaSet 객체 수 기준 ResourceQuota의 85%를 초과한 AKS 네임스페이스는 어디인가요?
- id: devops-sre.aks-taints-tolerations-and-node-affinity
  category: aks_kubernetes
  domain: reliability_policy_automation
  intent: devops_sre.aks_taints_tolerations_and_node_affinity
  target_kinds:
  - KubernetesCluster
  - KubernetesNode
  - KubernetesPod
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Which AKS node pools carry NoSchedule or NoExecute taints, and do any critical workloads lack
      matching tolerations or required nodeAffinity rules?
    ko: NoSchedule 또는 NoExecute 테인트가 설정된 AKS 노드 풀은 어디이며, 이에 대응하는 톨러레이션(toleration)이나 필수 nodeAffinity 규칙이
      누락된 핵심 워크로드가 있나요?
- id: devops-sre.aks-pod-disruption-budget-blocking-drain
  category: aks_kubernetes
  domain: change_deployment_impact
  intent: devops_sre.aks_pod_disruption_budget_blocking_drain
  target_kinds:
  - KubernetesCluster
  - KubernetesNode
  - KubernetesPod
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Are any AKS node drains or cluster upgrades currently blocked by PodDisruptionBudgets with zero
      disruptionsAllowed?
    ko: 현재 disruptionsAllowed가 0인 PodDisruptionBudget 때문에 차단된 AKS 노드 드레인이나 클러스터 업그레이드가 있나요?
- id: devops-sre.aks-gatekeeper-admission-policy-violations
  category: aks_kubernetes
  domain: reliability_policy_automation
  intent: devops_sre.aks_gatekeeper_admission_policy_violations
  target_kinds:
  - KubernetesCluster
  - KubernetesPod
  - PolicyAssignment
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Which AKS workloads currently violate Gatekeeper or Azure Policy admission constraints such as
      privileged containers, hostNetwork usage, or missing resource limits?
    ko: 특권 컨테이너(privileged), hostNetwork 사용, 리소스 제한 누락 등 Gatekeeper나 Azure Policy 어드미션 제약 조건을 위반하고 있는
      AKS 워크로드는 무엇인가요?
- id: devops-sre.aks-statefulset-pvc-orphan-or-detach-stall
  category: aks_kubernetes
  domain: state_incident_detection
  intent: devops_sre.aks_statefulset_pvc_orphan_or_detach_stall
  target_kinds:
  - KubernetesCluster
  - KubernetesPod
  - ManagedDisk
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Are any StatefulSet Pods in the authorized scope stuck in ContainerCreating due to multi-attach
      volume conflicts or failed PersistentVolumeClaim mounts?
    ko: 권한 범위의 StatefulSet Pod 중 볼륨 다중 연결(multi-attach) 충돌이나 PersistentVolumeClaim 마운트 실패로 인해 ContainerCreating
      상태에 멈춰 있는 Pod가 있나요?
- id: devops-sre.aks-multicontainer-pod-shared-memory-limit
  category: aks_kubernetes
  domain: capacity_performance_forecast
  intent: devops_sre.aks_multicontainer_pod_shared_memory_limit
  target_kinds:
  - KubernetesCluster
  - KubernetesPod
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: In multi-container AKS Pods with sidecar proxies, which individual container is approaching its
      container-level memory limit or causing Pod-level eviction?
    ko: 사이드카 프록시가 포함된 다중 컨테이너 AKS Pod에서 어떤 개별 컨테이너가 컨테이너 수준 메모리 상한에 근접했거나 Pod 수준 축출을 유발하고 있나요?
- id: devops-sre.aks-daemonset-unscheduled-nodes
  category: aks_kubernetes
  domain: state_incident_detection
  intent: devops_sre.aks_daemonset_unscheduled_nodes
  target_kinds:
  - KubernetesCluster
  - KubernetesNode
  - KubernetesPod
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Are any logging, monitoring, or security DaemonSets missing desired Pods on specific AKS worker
      nodes due to taints or resource pressure?
    ko: 테인트나 리소스 압박으로 인해 특정 AKS 워커 노드에 원하는 Pod가 스케줄링되지 못한 로깅과 모니터링 및 보안 DaemonSet이 있나요?
- id: devops-sre.aks-rbac-excessive-clusteradmin-bindings
  category: aks_kubernetes
  domain: reliability_policy_automation
  intent: devops_sre.aks_rbac_excessive_clusteradmin_bindings
  target_kinds:
  - KubernetesCluster
  - ManagedIdentity
  - RoleAssignment
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Which principals or workload identities in AKS hold cluster-wide ClusterRoleBindings instead of
      namespace-scoped RoleBindings required for team isolation?
    ko: 팀별 리소스 격리에 필요한 네임스페이스 범위 RoleBinding 대신 클러스터 전체 권한인 ClusterRoleBinding을 보유한 AKS 주체나 워크로드 ID는 무엇인가요?
- id: devops-sre.vnet-peering-disconnected-or-gateway-transit
  category: azure_infrastructure_network
  domain: dependency_impact
  intent: devops_sre.vnet_peering_disconnected_or_gateway_transit
  target_kinds:
  - VirtualNetwork
  - VirtualNetworkPeering
  temporal_scope: current
  result_shape: graph
  required_context: server_scope
  wording:
    en: Are any VNet peerings in the authorized scope in a Disconnected state, or missing reciprocal gateway
      transit and forwarded traffic settings?
    ko: 권한 범위의 VNet 피어링 중 연결 끊김(Disconnected) 상태이거나 양방향 게이트웨이 전달 및 트래픽 전달 설정이 누락된 항목이 있나요?
- id: devops-sre.nsg-inbound-ssh-rdp-public-exposure
  category: azure_infrastructure_network
  domain: reliability_policy_automation
  intent: devops_sre.nsg_inbound_ssh_rdp_public_exposure
  target_kinds:
  - NetworkSecurityGroup
  - NetworkInterface
  - VirtualMachine
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Which Network Security Groups currently allow inbound SSH (port 22) or RDP (port 3389) from any
      internet source instead of Bastion or management prefixes?
    ko: Bastion이나 관리용 주소 대역이 아닌 전체 인터넷 원본으로부터 인바운드 SSH(22번 포트) 또는 RDP(3389번 포트)를 허용하는 네트워크 보안 그룹(NSG)은
      무엇인가요?
- id: devops-sre.appgw-multi-hostname-listener-tls-routing
  category: azure_infrastructure_network
  domain: dependency_impact
  intent: devops_sre.appgw_multi_hostname_listener_tls_routing
  target_kinds:
  - ApplicationGateway
  - BackendAddressPool
  temporal_scope: current
  result_shape: graph
  required_context: server_scope
  wording:
    en: How do multi-site HTTPS listeners and SNI certificates on Application Gateways route distinct
      hostnames to their target backend pools?
    ko: Application Gateway의 다중 사이트 HTTPS 리스너와 SNI 인증서가 서로 다른 호스트 이름을 각 대상 백엔드 풀로 어떻게 라우팅하고 있나요?
- id: devops-sre.private-dns-zone-missing-vnet-link
  category: azure_infrastructure_network
  domain: dependency_impact
  intent: devops_sre.private_dns_zone_missing_vnet_link
  target_kinds:
  - PrivateDnsZone
  - VirtualNetwork
  - VirtualNetworkLink
  temporal_scope: current
  result_shape: list
  required_context: server_scope
  wording:
    en: Which Private Endpoints in the authorized scope cannot be resolved by client workloads because
      their client VNet is missing a VirtualNetworkLink to the Private DNS Zone?
    ko: 클라이언트 VNet에 Private DNS Zone으로의 VirtualNetworkLink가 누락되어 클라이언트 워크로드에서 이름을 해석할 수 없는 프라이빗 엔드포인트는
      무엇인가요?
- id: devops-sre.vmss-availability-zone-balance-posture
  category: azure_infrastructure_network
  domain: reliability_policy_automation
  intent: devops_sre.vmss_availability_zone_balance_posture
  target_kinds:
  - VirtualMachineScaleSet
  - VirtualMachine
  temporal_scope: current
  result_shape: comparison
  required_context: server_scope
  wording:
    en: Which Virtual Machine Scale Sets span multiple availability zones, and are their active instances
      evenly balanced across those zones?
    ko: 여러 가용 영역(AZ)에 걸쳐 구성된 가상 머신 확장 집합(VMSS)은 무엇이며, 활성 인스턴스가 해당 영역들에 균등하게 분산되어 있나요?
- id: devops-sre.nat-gateway-snat-port-exhaustion-risk
  category: azure_infrastructure_network
  domain: capacity_performance_forecast
  intent: devops_sre.nat_gateway_snat_port_exhaustion_risk
  target_kinds:
  - VirtualNetwork
  - PublicIPAddress
  - LoadBalancer
  temporal_scope: current
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: Are any outbound load balancers or NAT paths in the authorized scope approaching SNAT port exhaustion
      or dropping outbound connection attempts?
    ko: 권한 범위의 아웃바운드 로드밸런서나 NAT 경로 중 SNAT 포트 고갈에 근접했거나 아웃바운드 연결 시도를 드롭하고 있는 경로가 있나요?
- id: devops-sre.control-plane-vs-data-plane-dependency-map
  category: azure_infrastructure_network
  domain: dependency_impact
  intent: devops_sre.control_plane_vs_data_plane_dependency_map
  target_kinds:
  - AzureResource
  - BusinessService
  temporal_scope: current
  result_shape: graph
  required_context: server_scope
  wording:
    en: Separate control-plane management dependencies from data-plane request dependencies for critical
      services in the authorized scope.
    ko: 권한 범위 내 핵심 서비스들에 대해 컨트롤 플레인 관리 의존성과 데이터 플레인 요청 처리 의존성을 구분해 보여 주세요.
- id: devops-sre.dns-health-check-failover-routing-status
  category: azure_infrastructure_network
  domain: reliability_policy_automation
  intent: devops_sre.dns_health_check_failover_routing_status
  target_kinds:
  - ApplicationGateway
  - PublicIPAddress
  - BusinessService
  temporal_scope: current
  result_shape: assessment
  required_context: server_scope
  wording:
    en: Are global DNS or traffic-routing failover endpoints healthy across primary and secondary regions,
      and have any automatic failover transitions occurred?
    ko: 주 리전과 보조 리전에 걸친 글로벌 DNS 및 트래픽 라우팅 페일오버 엔드포인트가 정상 상태이며, 자동 페일오버 전환이 발생한 이력이 있나요?
- id: devops-sre.microsegmentation-east-west-subnet-isolation
