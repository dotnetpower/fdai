    ko: 권한 범위에서 현재 디스크 I/O 대기 지연(await)이 높거나 IOPS 및 대역폭 버스트 크레딧이 소진된 Managed Disk는 무엇인가요?
- id: devops-sre.coredns-latency-servfail-and-cache-hit-ratio
