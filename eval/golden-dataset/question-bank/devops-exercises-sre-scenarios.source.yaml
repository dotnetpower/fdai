    ko: 선언된 서비스 포트로만 동서(east-west) 측면 이동 트래픽을 제한하는 마이크로세그멘테이션 규칙이 누락된 애플리케이션 및 데이터베이스 서브넷은 어디인가요?
- id: devops-sre.managed-identity-least-privilege-wildcard-check
