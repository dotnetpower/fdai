  domain: reliability_policy_automation
  intent: devops_sre.aks_topology_spread_and_pod_antiaffinity_skew
  target_kinds:
  - KubernetesCluster
  - KubernetesPod
  - KubernetesNode
  temporal_scope: current
  result_shape: comparison
  required_context: server_scope
  wording:
    en: Which multi-replica AKS Deployments lack topologySpreadConstraints or podAntiAffinity rules and
      have all replicas concentrated in a single availability zone or node?
    ko: 다중 레플리카 AKS Deployment 중 topologySpreadConstraints나 podAntiAffinity 규칙이 없어 모든 레플리카가 단일 가용 영역이나
      단일 노드에 몰려 있는 워크로드는 무엇인가요?
