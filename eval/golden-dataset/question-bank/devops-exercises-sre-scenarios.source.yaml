    ko: 연결된 장애에서 작은 헬스체크 패킷은 성공하지만 큰 API 페이로드 전송이 멈추는 원인이 오버레이 네트워크나 터널 구간의 MTU·MSS 단편화 블랙홀 때문인가요?
- id: devops-sre.kubernetes-volume-fsgroup-permission-denied-rca
