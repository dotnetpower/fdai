    ko: 현재 대화에 연결된 장애에서 초기화가 느린 애플리케이션이 재시작 루프에 빠진 원인이 startupProbe 없이 livenessProbe가 초기화 완료 전에 먼저 실행되기
      때문인가요?
- id: devops-sre.cache-stampede-ttl-expiry-db-overload-rca
