    ko: 권한 범위의 Key Vault 중 영구 삭제 방지(purge protection), 소프트 삭제, RBAC 권한 부여, 또는 프라이빗 네트워크 격리가 누락된 볼트는 무엇인가요?
- id: devops-sre.database-read-replica-lag-across-regions
  category: database_storage
  domain: state_incident_detection
  intent: devops_sre.database_read_replica_lag_across_regions
  target_kinds:
  - PostgreSQLFlexibleServer
  - SqlDatabase
  temporal_scope: current
  result_shape: ranked_list
  required_context: server_scope
  wording:
    en: What is the current replication lag in seconds for each database read replica in the authorized
      scope, and which replicas exceed their threshold?
    ko: 권한 범위에 있는 각 데이터베이스 읽기 복제본의 현재 복제 지연 시간(초)은 얼마이며, 임계치를 초과한 복제본은 무엇인가요?
- id: devops-sre.finops-budget-threshold-and-burn-rate
