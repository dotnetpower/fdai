schema_version: 1.0.0
dataset_version: 2.1.0
evidence_kind: expected_contract_cases
operational_validation: false
active_prompt: active.semantic-judgment@2
shadow_prompt: shadow.semantic-judgment-v17@2
capabilities:
  - {kind: function_type, name: query.resource_error_activity_correlation}
  - {kind: function_type, name: query.resource_current_state}
  - {kind: function_type, name: query.resource_change_activity}
  - {kind: function_type, name: query.resource_event_history, measure_concepts: [resource_event.resource_health]}
  - {kind: function_type, name: query.resource_health_inventory}
  - {kind: function_type, name: query.subscription_service_health, measure_concepts: [service_health.active_event]}
  - {kind: function_type, name: query.incident_evidence}
  - {kind: function_type, name: query.contextual_resources}
  - {kind: function_type, name: query.resource_state_inventory}
  - {kind: intent, name: action_request}
  - {kind: intent, name: action_requirements}
  - {kind: intent, name: explanation}
  - {kind: object_type, name: Incident}
  - {kind: object_type, name: Resource}
  - {kind: resource_type, name: compute.vm}
  - {kind: resource_type, name: storage.account}
  - {kind: resource_type, name: container-app}
  - {kind: resource_type, name: resource-group}
  - {kind: action_type, name: ops.restart-service}
cases:
  - id: forbidden-restart-investigation
    utterance: "prod-api가 느려. 재시작하지 말고 지난 30분 오류와 변경 이력만 조사해줘"
    expected:
      primary_intent: query.resource_error_activity_correlation
      requested_facets: [cause, errors, change_history, time_range]
      targets:
        - {kind: resource, value: prod-api, source_start: 0, source_end: 8}
        - {kind: time_range, value: "지난 30분", source_start: 23, source_end: 29}
      forbidden_actions:
        - {kind: action_type, value: "재시작", canonical_value: ops.restart-service, source_start: 14, source_end: 17}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: exact-vm-current-state
    utterance: "vm01은 지금 실행 중이야?"
    expected:
      primary_intent: query.resource_current_state
      requested_facets: [current_state, running_state]
      targets:
        - {kind: resource, value: vm01, source_start: 0, source_end: 4}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: exact-vm-change-attribution
    utterance: "vm01을 누가 언제 중지했어?"
    expected:
      primary_intent: query.resource_change_activity
      requested_facets: [actor, operation_time, stopped_state]
      targets:
        - {kind: resource, value: vm01, source_start: 0, source_end: 4}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: resource-health-history
    utterance: "지난 24시간 Resource Health 이벤트를 시간순으로 보여줘"
    expected:
      primary_intent: query.resource_event_history
      requested_facets: [resource_health_events, chronological_order, time_range]
      targets:
        - {kind: time_range, value: "지난 24시간", source_start: 0, source_end: 7}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: resource-health-history-en
    utterance: "What Resource Health events occurred during the last day?"
    expected:
      primary_intent: query.resource_event_history
      requested_facets: [resource_health_events, chronological_order, time_range]
      targets:
        - {kind: time_range, value: "last day", source_start: 48, source_end: 56}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: subscription-platform-outage
    utterance: "현재 구독에 Azure 플랫폼 장애가 있어?"
    expected:
      primary_intent: query.subscription_service_health
      requested_facets: [current_state, subscription, service_issue]
      targets: []
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: incident-impact-evidence
    utterance: "INC-1042의 영향 범위와 근거를 정리해줘"
    expected:
      primary_intent: query.incident_evidence
      requested_facets: [impact_scope, evidence]
      targets:
        - {kind: incident_id, value: INC-1042, source_start: 0, source_end: 8}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: incident-mitigation-draft-no-execution
    utterance: "INC-1042 완화안만 초안으로 만들어줘. 실행하지 마"
    expected:
      primary_intent: action_request
      requested_facets: [incident_mitigation, draft]
      targets:
        - {kind: incident_id, value: INC-1042, source_start: 0, source_end: 8}
      forbidden_actions:
        - {kind: action, value: "실행", source_start: 25, source_end: 27}
      discourse_mode: direct
      action_posture: draft_only
      action_subject: Incident
  - id: targetless-incident-requirements-en
    utterance: "What information is required for a review-only incident mitigation draft?"
    expected:
      primary_intent: action_requirements
      requested_facets: [incident_mitigation, requirements]
      targets:
        - {kind: object_type, value: incident, canonical_value: Incident, source_start: 47, source_end: 55}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: targetless-incident-details-en
    utterance: "Which details must a review-only incident mitigation proposal contain?"
    expected:
      primary_intent: action_requirements
      requested_facets: [incident_mitigation, requirements, details]
      targets:
        - {kind: object_type, value: incident, canonical_value: Incident, source_start: 33, source_end: 41}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: targetless-incident-evidence-en
    utterance: "Explain the evidence and safeguards needed before writing an incident mitigation draft."
    expected:
      primary_intent: action_requirements
      requested_facets: [incident_mitigation, requirements, evidence, safeguards]
      targets:
        - {kind: object_type, value: incident, canonical_value: Incident, source_start: 61, source_end: 69}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: targetless-incident-inputs-en
    utterance: "List the inputs needed to prepare an incident mitigation draft for human review."
    expected:
      primary_intent: action_requirements
      requested_facets: [incident_mitigation, requirements, inputs]
      targets:
        - {kind: object_type, value: incident, canonical_value: Incident, source_start: 37, source_end: 45}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: targetless-incident-requirements-ko
    utterance: "검토 전용 장애 완화 초안에는 어떤 정보가 필요한가요?"
    expected:
      primary_intent: action_requirements
      requested_facets: [incident_mitigation, requirements]
      targets:
        - {kind: object_type, value: 장애, canonical_value: Incident, source_start: 6, source_end: 8}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: targetless-incident-details-ko
    utterance: "사람이 검토할 장애 완화 제안에 어떤 세부 정보가 들어가야 하나요?"
    expected:
      primary_intent: action_requirements
      requested_facets: [incident_mitigation, requirements, details]
      targets:
        - {kind: object_type, value: 장애, canonical_value: Incident, source_start: 8, source_end: 10}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: targetless-incident-evidence-ko
    utterance: "장애 완화 초안을 작성하기 전에 필요한 근거와 안전장치를 설명해 주세요."
    expected:
      primary_intent: action_requirements
      requested_facets: [incident_mitigation, requirements, evidence, safeguards]
      targets:
        - {kind: object_type, value: 장애, canonical_value: Incident, source_start: 0, source_end: 2}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: targetless-incident-inputs-ko
    utterance: "사람 검토용 장애 완화 초안을 준비하는 데 필요한 입력을 알려 주세요."
    expected:
      primary_intent: action_requirements
      requested_facets: [incident_mitigation, requirements, inputs]
      targets:
        - {kind: object_type, value: 장애, canonical_value: Incident, source_start: 7, source_end: 9}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: incident-create-confirmation
    utterance: "SEV2 인시던트를 prod-api 대상으로 생성해줘"
    expected:
      primary_intent: action_request
      requested_facets: [incident_create, severity]
      targets:
        - {kind: severity, value: SEV2, source_start: 0, source_end: 4}
        - {kind: resource, value: prod-api, source_start: 11, source_end: 19}
      discourse_mode: direct
      action_posture: draft_only
      action_subject: Incident
  - id: delete-procedure-advice
    utterance: "스토리지 계정을 삭제하는 방법만 설명해줘"
    expected:
      primary_intent: action_requirements
      requested_facets: [delete, procedure]
      targets:
        - {kind: resource_type, value: "스토리지 계정", canonical_value: storage.account, source_start: 0, source_end: 7}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: hypothetical-restart-advice
    utterance: "VM을 재시작하면 해결될까?"
    expected:
      primary_intent: action_requirements
      requested_facets: [restart, expected_effect]
      targets:
        - {kind: resource_type, value: VM, canonical_value: compute.vm, source_start: 0, source_end: 2}
      discourse_mode: hypothetical
      action_posture: advise_only
      action_subject: none
  - id: quoted-delete-report
    utterance: "운영자가 'VM을 삭제해'라고 말했다"
    expected:
      primary_intent: explanation
      requested_facets: [reported_statement]
      targets: []
      discourse_mode: quoted
      action_posture: advise_only
      action_subject: none
  - id: resource-group-container-app-state
    utterance: "rg-prod 안의 Container App 목록과 각각의 상태를 보여줘"
    expected:
      primary_intent: query.contextual_resources
      requested_facets: [details, current_state, name_filter]
      targets:
        - {kind: resource_group, value: rg-prod, source_start: 0, source_end: 7}
        - {kind: resource_type, value: Container App, canonical_value: container-app, source_start: 11, source_end: 24}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: independent-service-health-and-vm-list
    utterance: "현재 구독의 Azure 플랫폼 장애와 실행 중인 VM 목록을 각각 보여줘"
    expected:
      primary_intent: query.subscription_service_health
      secondary_intents: [query.resource_state_inventory]
      requested_facets: [service_issue, running_state, resource_list]
      targets:
        - {kind: resource_type, value: VM, canonical_value: compute.vm, source_start: 27, source_end: 29}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: independent-state-and-delete-advice
    utterance: "vm01 상태를 보여주고 삭제 방법도 설명해줘"
    expected:
      primary_intent: query.resource_current_state
      secondary_intents: [action_requirements]
      requested_facets: [current_state, delete, procedure]
      targets:
        - {kind: resource, value: vm01, source_start: 0, source_end: 4}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
  - id: ambiguous-vm-state
    utterance: "VM 상태를 보여줘"
    expected:
      primary_intent: query.resource_current_state
      requested_facets: [current_state]
      targets:
        - {kind: resource_type, value: VM, canonical_value: compute.vm, source_start: 0, source_end: 2}
      discourse_mode: direct
      action_posture: advise_only
      action_subject: none
      ambiguous: true
      alternatives: []
      unresolved_terms: [resource_identity]
      clarification: "어떤 VM의 상태를 조회할까요?"
  - id: ambiguous-vm-restart
    utterance: "VM을 재시작해줘"
    expected:
      primary_intent: action_request
      requested_facets: [restart]
      targets:
        - {kind: resource_type, value: VM, canonical_value: compute.vm, source_start: 0, source_end: 2}
      discourse_mode: direct
      action_posture: draft_only
      action_subject: ActionType
      ambiguous: true
      alternatives: []
      unresolved_terms: [resource_identity]
      clarification: "어떤 VM을 재시작할지 이름이나 ID를 알려줄까요?"
