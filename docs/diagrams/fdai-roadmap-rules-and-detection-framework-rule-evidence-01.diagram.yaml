  width: 900
  height: 540
  direction: RIGHT
groups: []
nodes:
  - id: mimir
    kind: process
    shape: card
    label:
      en: "Mimir: activation generation"
      ko: "Mimir: 활성화 세대"
  - id: forseti
    kind: process
    shape: card
    label:
