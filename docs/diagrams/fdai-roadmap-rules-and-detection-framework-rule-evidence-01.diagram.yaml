    description: 설계 요약에 대한 FDAI 흐름입니다.
    alt: "설계 요약. 주요 단계는 Mimir: 활성화 세대, Forseti: 범위별 규칙 커버리지, Huginn: 완전한 인벤토리 세대, 추가 전용 감사 저장소, t0-rule-evaluator 영수증, 프레임워크
      평가 런타임 (shadow)입니다."
