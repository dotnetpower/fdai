  - id: huginn
    kind: process
    shape: card
    label:
      en: "Huginn: complete inventory generation"
      ko: "Huginn: 완전한 인벤토리 세대"
  - id: audit
    kind: process
    shape: card
    label:
      en: Append-only audit store
      ko: 추가 전용 감사 저장소
  - id: producer
    kind: process
    shape: card
    label:
