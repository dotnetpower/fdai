id: fdai-roadmap-architecture-project-structure-01
version: 1
kind: flowchart
updated: 2026-08-20
formats:
  - svg
locales:
  en:
    title: Control-Loop Wiring
    description: FDAI flow for Control-Loop Wiring.
    alt: "Control-Loop Wiring. The main stages are events, event-ingest / normalize + dedup, trust-router, t0-deterministic,
      t1-lightweight, t2-reasoning, quality-gate, risk-gate, executor, HIL approval / via chatops, no-op, delivery:
      gitops-pr / chatops."
  ko:
    title: 컨트롤 루프 배선
    description: 컨트롤 루프 배선에 대한 FDAI 흐름입니다.
    alt: "컨트롤 루프 배선. 주요 단계는 events, event-ingest / normalize + dedup, trust-router, t0-deterministic, t1-lightweight,
      t2-reasoning, quality-gate, risk-gate, executor, HIL approval / via chatops, no-op, delivery: gitops-pr /
      chatops입니다."
canvas:
  width: 1600
  height: 1200
  direction: RIGHT
groups: []
nodes:
  - id: ev
    kind: process
    shape: card
    label:
      en: events
      ko: events
  - id: norm
    kind: process
    shape: card
    label:
      en: event-ingest / normalize + dedup
      ko: event-ingest / normalize + dedup
  - id: router
    kind: process
    shape: card
    label:
      en: trust-router
      ko: trust-router
  - id: t0
    kind: process
    shape: card
    label:
      en: t0-deterministic
      ko: t0-deterministic
    description:
      en: "When: rule match"
      ko: "조건: rule match"
  - id: t1
    kind: process
    shape: card
    label:
      en: t1-lightweight
      ko: t1-lightweight
    description:
      en: "When: similar"
      ko: "조건: similar"
  - id: t2
    kind: process
    shape: card
    label:
      en: t2-reasoning
      ko: t2-reasoning
    description:
      en: "When: novel"
      ko: "조건: novel"
  - id: qg
    kind: process
    shape: card
    label:
      en: quality-gate
      ko: quality-gate
  - id: rg
    kind: process
    shape: card
    label:
      en: risk-gate
      ko: risk-gate
  - id: ex
    kind: process
    shape: card
    label:
      en: executor
      ko: executor
    description:
      en: "When: low risk / When: approve"
      ko: "조건: low risk / 조건: approve"
  - id: hil
    kind: process
    shape: card
    label:
      en: HIL approval / via chatops
      ko: HIL approval / via chatops
    description:
      en: "When: high risk"
      ko: "조건: high risk"
  - id: noop
    kind: process
    shape: card
    label:
      en: no-op
      ko: no-op
    description:
      en: "When: abstain / deny / When: reject / timeout"
      ko: "조건: abstain / deny / 조건: reject / timeout"
  - id: del
    kind: process
    shape: card
    label:
      en: "delivery: gitops-pr / chatops"
      ko: "delivery: gitops-pr / chatops"
  - id: aud
    kind: process
    shape: card
    label:
      en: audit
      ko: audit
  - id: lib
    kind: store
    shape: database
    label:
      en: pattern library
      ko: pattern library
