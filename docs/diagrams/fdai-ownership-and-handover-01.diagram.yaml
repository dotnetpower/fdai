id: fdai-ownership-and-handover-01
version: 1
kind: flowchart
updated: 2026-08-20
formats:
  - svg
locales:
  en:
    title: How a handover document becomes a change
    description: FDAI flow for How a handover document becomes a change.
    alt: How a handover document becomes a change. The main stages are Handover document, Upload through ingestion, Extract
      claims with citations, Resolve names to directory identities, Draft ownership map, Draft pull request, A person
      reviews and merges, Ownership map updated.
  ko:
    title: 인수인계 문서가 변경이 되기까지
    description: 인수인계 문서가 변경이 되기까지에 대한 FDAI 흐름입니다.
    alt: 인수인계 문서가 변경이 되기까지. 주요 단계는 인수인계 문서, 수집 경로로 업로드, 출처와 함께 주장 추출, 이름을 디렉터리 신원으로 연결, 담당 체계 맵 초안, 초안 pull request, 사람이
      검토하고 병합, 담당 체계 맵 갱신입니다.
