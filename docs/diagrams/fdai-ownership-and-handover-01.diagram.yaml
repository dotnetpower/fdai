id: fdai-ownership-and-handover-01
version: 1
kind: flowchart
updated: 2026-08-20
formats:
  - svg
locales:
  en:
    title: Governed ownership handover
    description: A handover document can produce reviewable evidence and a draft pull request, but it never changes ownership or access authority by itself.
    alt: A handover document enters the inspected ingestion boundary. FDAI extracts cited deterministic claims and can consult an optional grounded interpreter whose upstream default abstains. Candidates below the confidence floor are set aside, names are resolved without guessing, and unresolved people or unmapped agents remain visible warnings. Draft validation checks the fixed 15-agent pantheon, forbids access-role fields, and checks accountable primary and backup coverage. An empty or abstained draft produces no pull request. A valid draft is published as one content-addressed, review-only pull request; retrying does not create a duplicate. A different person reviews and may merge it. After merge, the loader validates the complete map before activation. Rejection or invalid configuration leaves the active map unchanged, and every outcome is audited. Ownership never grants RBAC or executor authority.
  ko:
    title: 통제된 담당 체계 인수인계
    description: 인수인계 문서는 검토 가능한 근거와 초안 pull request를 만들 수 있지만 담당 체계나 접근 권한을 스스로 변경하지 않습니다.
    alt: 인수인계 문서는 안전 검사를 거치는 수집 경계로 들어갑니다. FDAI는 출처를 인용하는 결정적 주장을 추출하며, 상위 저장소에서 기본적으로 판단을 보류하는 선택적 근거 기반 해석기를 호출할 수 있습니다. 신뢰도 기준보다 낮은 후보는 별도 검토 대상으로 남기고 이름은 추측 없이 확인하며, 미해결 사람과 담당자가 없는 에이전트는 경고로 계속 표시합니다. 초안 검증은 고정된 15개 에이전트 전체, 접근 역할 필드 금지 및 최종 책임자의 1차 담당과 백업 범위를 검사합니다. 비어 있거나 판단을 보류한 초안은 pull request를 만들지 않습니다. 유효한 초안은 내용 기반 식별자를 사용하는 하나의 검토 전용 pull request로 게시되며 재시도해도 중복 요청을 만들지 않습니다. 다른 사람이 검토하고 병합할 수 있습니다. 병합 후 로더가 전체 담당 체계를 검증한 뒤 활성화합니다. 거부되거나 구성이 잘못되면 활성 담당 체계는 바뀌지 않으며 모든 결과를 감사합니다. 담당 체계는 RBAC 또는 실행기 권한을 부여하지 않습니다.
canvas:
  width: 1320
  height: 1800
  direction: DOWN
  rootLayout: column
  padding: 44
groups:
  - id: ingest
    kind: layer
    presentation: band
    label: { en: 1 | Inspect the source, ko: 1 | 원본 검사 }
    description: { en: Treat the handover document as untrusted evidence, ko: 인수인계 문서를 신뢰되지 않은 근거로 처리합니다. }
    layout: row
    gap: 70
    justify: center
    width: 1200
  - id: interpret
    kind: layer
    presentation: lane
    label: { en: 2 | Extract and hold uncertainty, ko: 2 | 추출하고 불확실성 보류 }
    description: { en: Every accepted claim stays grounded in source citations, ko: 수락한 모든 주장은 원본 인용에 근거합니다. }
    layout: row
    gap: 58
    justify: center
    width: 1200
  - id: resolve
    kind: layer
    presentation: panel
    label: { en: 3 | Resolve people and coverage, ko: 3 | 사람 및 담당 범위 확인 }
    description: { en: Never guess an identity or hide an unmapped agent, ko: 신원을 추측하거나 담당자가 없는 에이전트를 숨기지 않습니다. }
    layout: row
    gap: 68
    justify: center
    width: 1200
  - id: validate
    kind: layer
    presentation: panel
    label: { en: 4 | Validate the draft contract, ko: 4 | 초안 계약 검증 }
    description: { en: Ownership and access authority remain separate axes, ko: 담당 체계와 접근 권한은 서로 다른 축으로 유지합니다. }
    layout: row
    gap: 72
    justify: center
    width: 1200
  - id: govern
    kind: layer
    presentation: feedback
    label: { en: "5 | Propose, review, and merge", ko: "5 | 제안, 검토 및 병합" }
    description: { en: The draft remains inert until a human-reviewed merge, ko: 초안은 사람이 검토해 병합할 때까지 비활성 상태입니다. }
    layout: row
    gap: 58
    justify: center
    width: 1200
  - id: activate
    kind: layer
    presentation: datastore
    label: { en: 6 | Validate activation and audit, ko: 6 | 활성화 검증 및 감사 }
    description: { en: Invalid or rejected changes leave the active map unchanged, ko: 잘못되거나 거부된 변경은 활성 담당 체계를 바꾸지 않습니다. }
    layout: row
    gap: 80
    justify: center
    width: 1200
nodes:
  - id: handover-document
    parent: ingest
    kind: external
    shape: document
    icon: lucide-file-check
    tone: input
    badge: 1
    width: 320
    label: { en: Handover document, ko: 인수인계 문서 }
    content:
      - { en: "Roster, RACI, runbook, org chart, or memo", ko: "당직표, RACI, 런북, 조직도 또는 메모" }
  - id: ingestion
    parent: ingest
    kind: process
    shape: card
    icon: lucide-shield-check
    tone: policy
    badge: 2
    width: 330
    label: { en: Inspected ingestion, ko: 안전 검사를 거친 수집 }
    content:
      - { en: "Scan, type, version, and retain provenance", ko: "검사, 유형, 버전 및 출처 보존" }
  - id: deterministic-extract
    parent: interpret
    kind: process
    shape: card
    icon: lucide-search-check
    tone: interpretation
    badge: 3
    width: 330
    label: { en: Deterministic extraction, ko: 결정적 추출 }
    content:
      - { en: "Agent, person, responsibility, and line citations", ko: "에이전트, 사람, 책임 및 줄 인용" }
  - id: grounded-interpreter
    parent: interpret
    kind: process
    shape: card
    icon: lucide-search-check
    tone: model
    width: 330
    label: { en: Optional grounded interpreter, ko: 선택적 근거 기반 해석기 }
    content:
      - { en: Upstream default abstains; ungrounded proposals drop, ko: 상위 저장소 기본값은 판단을 보류하고 근거 없는 제안은 제외 }
  - id: confidence-hold
    parent: interpret
    kind: process
    shape: card
    icon: lucide-file-check
    tone: neutral
    width: 300
    label: { en: Below-floor hold, ko: 기준 미달 보류 }
    content:
      - { en: Keep for human review; never auto-map, ko: 사람 검토 대상으로 남기고 자동 연결하지 않음 }
  - id: directory-resolution
    parent: resolve
    kind: process
    shape: card
    icon: lucide-search-check
    tone: interpretation
    badge: 4
    width: 340
    label: { en: Directory resolution, ko: 디렉터리 신원 확인 }
    content:
      - { en: Exact person or group identity; no guessing, ko: 정확한 개인 또는 그룹 신원만 사용하고 추측하지 않음 }
  - id: coverage-warnings
    parent: resolve
    kind: process
    shape: card
    icon: lucide-file-check
    tone: decision
    width: 340
    label: { en: Visible coverage warnings, ko: 표시되는 담당 범위 경고 }
    content:
      - { en: "Unresolved people, abstained mappings, and unmapped agents", ko: "미해결 사람, 보류된 연결 및 담당자 없는 에이전트" }
  - id: draft-validation
    parent: validate
    kind: process
    shape: card
    icon: lucide-shield-check
    tone: policy
    badge: 5
    width: 360
    label: { en: Stewardship contract validation, ko: 담당 체계 계약 검증 }
    content:
      - { en: Fixed 15-agent pantheon and no access-role fields, ko: 고정된 15개 에이전트와 접근 역할 필드 금지 }
      - { en: Accountable primary plus backup or escalation, ko: 최종 책임자의 1차 담당과 백업 또는 에스컬레이션 }
  - id: inert-draft
    parent: validate
    kind: store
    shape: database
    icon: lucide-file-check
    tone: store
    width: 340
    label: { en: Inert ownership draft, ko: 비활성 담당 체계 초안 }
    content:
      - { en: Carries warnings and citations; grants no RBAC, ko: 경고와 인용을 포함하며 RBAC를 부여하지 않음 }
  - id: draft-pr
    parent: govern
    kind: process
    shape: card
    icon: lucide-route
    tone: feedback
    badge: 6
    width: 330
    label: { en: Idempotent draft pull request, ko: 멱등한 초안 pull request }
    content:
      - { en: "Content-addressed, review-only, and shadow", ko: "내용 기반 식별, 검토 전용 및 shadow" }
  - id: human-review
    parent: govern
    kind: person
    shape: card
    icon: lucide-shield-check
    tone: policy
    badge: 7
    width: 320
    label: { en: Independent human review, ko: 독립된 사람 검토 }
    content:
      - { en: "Merge, reject, or request corrections", ko: "병합, 거부 또는 수정 요청" }
  - id: unchanged
    parent: govern
    kind: process
    shape: card
    icon: lucide-file-check
    tone: neutral
    width: 300
    label: { en: Active map unchanged, ko: 활성 담당 체계 변경 없음 }
    content:
      - { en: "Abstained draft, no mapping, rejection, or invalid config", ko: "보류된 초안, 연결 없음, 거부 또는 잘못된 구성" }
  - id: loader-validation
    parent: activate
    kind: process
    shape: card
    icon: lucide-shield-check
    tone: policy
    badge: 8
    width: 340
    label: { en: Loader validation, ko: 로더 검증 }
    content:
      - { en: "Complete map, maintainers, duties, and deployment bindings", ko: "전체 맵, 유지관리자, 역할 및 배포 바인딩" }
  - id: active-map
    parent: activate
    kind: store
    shape: database
    icon: lucide-file-check
    tone: store
    width: 300
    label: { en: Active ownership map, ko: 활성 담당 체계 }
    content:
      - { en: Escalation routing only; no execution authority, ko: 에스컬레이션 라우팅만 제공하며 실행 권한 없음 }
  - id: audit
    parent: activate
    kind: store
    shape: database
    icon: lucide-file-check
    tone: feedback
    width: 300
    label: { en: Audit and rollback history, ko: 감사 및 롤백 이력 }
    content:
      - { en: "Proposal, review, activation, rejection, and revert evidence", ko: "제안, 검토, 활성화, 거부 및 되돌리기 근거" }
edges:
  - id: flow-01
    from: handover-document
    to: ingestion
    kind: request
    route: orthogonal
  - id: flow-02
    from: ingestion
    to: deterministic-extract
    kind: request
    route: orthogonal-shortest
  - id: flow-03
    from: deterministic-extract
    to: grounded-interpreter
    kind: request
    route: orthogonal-horizontal
  - id: flow-04
    from: deterministic-extract
    to: directory-resolution
    kind: request
    route: orthogonal-shortest
  - id: flow-05
    from: grounded-interpreter
    to: directory-resolution
    kind: request
    route: orthogonal-shortest
  - id: flow-06
    from: grounded-interpreter
    to: confidence-hold
    kind: feedback
    route: orthogonal-horizontal
  - id: flow-07
    from: directory-resolution
    to: coverage-warnings
    kind: feedback
    route: orthogonal-horizontal
  - id: flow-08
    from: directory-resolution
    to: draft-validation
    kind: request
    route: orthogonal-shortest
  - id: flow-09
    from: coverage-warnings
    to: inert-draft
    kind: request
    route: orthogonal-shortest
  - id: flow-10
    from: draft-validation
    to: inert-draft
    kind: write
    route: orthogonal-horizontal
  - id: flow-11
    from: draft-validation
    to: unchanged
    kind: request
    route: orthogonal-outer
  - id: flow-12
    from: inert-draft
    to: draft-pr
    kind: feedback
    route: orthogonal-shortest
  - id: flow-13
    from: draft-pr
    to: human-review
    kind: approval
    route: orthogonal-horizontal
  - id: flow-14
    from: human-review
    to: loader-validation
    kind: approval
    route: orthogonal-shortest
  - id: flow-15
    from: human-review
    to: unchanged
    kind: request
    route: orthogonal-horizontal
  - id: flow-16
    from: loader-validation
    to: active-map
    kind: write
    route: orthogonal-horizontal
  - id: flow-17
    from: loader-validation
    to: unchanged
    kind: request
    route: orthogonal-outer
  - id: flow-18
    from: active-map
    to: audit
    kind: audit
    route: orthogonal-horizontal
  - id: flow-19
    from: unchanged
    to: audit
    kind: audit
    route: orthogonal-shortest
legend:
  - kind: feedback
    label: { en: Review-only proposal, ko: 검토 전용 제안 }
  - kind: approval
    label: { en: Human governance, ko: 사람 거버넌스 }
  - kind: write
    label: { en: Validated state change, ko: 검증된 상태 변경 }
  - kind: audit
    label: { en: Evidence history, ko: 근거 이력 }
