locales:
  en:
    title: 9. Rollback rehearsal
    description: Ordered FDAI interactions for 9. Rollback rehearsal.
    alt: 9. Rollback rehearsal. The main stages are proposed_action {rehearse_rollback, action_type_id}, verdict = hil (all
      rehearsals HIL), approval, verdict {execute}, apply mutation in shadow env, invoke rollback per rollback_contract,
      observe post-rollback state, state matches pre-mutation baseline?, audit {rehearsal_result, deviation}.
  ko:
    title: 9. Rollback 예행 연습
    description: 9. Rollback 예행 연습에 대한 순서가 있는 FDAI 상호 작용입니다.
