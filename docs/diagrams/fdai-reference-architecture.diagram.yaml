  - id: web-console
    parent: operator-surfaces
    kind: azure-service
    icon: static-web-app
    presentation: icon
    label: { en: FDAI Web Console, ko: FDAI Web Console }
    description: { en: Read projections and submit bounded requests, ko: Projection 조회 및 범위가 제한된 request 제출 }
  - id: operator-cli
    parent: operator-surfaces
    kind: process
