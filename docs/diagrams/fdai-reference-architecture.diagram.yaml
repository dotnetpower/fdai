nodes:
  - id: azure-estate
    parent: connected-environment
    kind: azure-service
    icon: resource-graph
    presentation: icon
    label: { en: Azure resources, ko: Azure resource }
    description: { en: Subscription and resource inventory, ko: Subscription 및 resource inventory }
  - id: operational-telemetry
    parent: connected-environment
    kind: azure-service
    icon: monitor
    presentation: icon
    label: { en: Operational telemetry, ko: 운영 telemetry }
    description: { en: "Metrics, logs, traces, alerts, and changes", ko: "Metric, log, trace, alert 및 change" }
  - id: delivery-repositories
    parent: connected-environment
    kind: external
    icon: github
    presentation: icon
    label: { en: Source repositories, ko: Source repository }
    description: { en: "Infrastructure, application, policy, and catalog changes", ko: "Infrastructure, application, policy 및 catalog change" }
  - id: enterprise-connectors
    parent: connected-environment
    kind: external
    label: { en: Documents and connectors, ko: Document 및 connector }
