    kind: azure-service
    icon: postgresql
    presentation: icon
    label: { en: PostgreSQL and pgvector, ko: PostgreSQL 및 pgvector }
    description: { en: "State, append-only audit, evidence, and context", ko: "State, append-only audit, evidence 및 context" }
    width: 240
  - id: container-apps
    parent: azure-foundation
    kind: azure-service
    icon: container-apps
    presentation: icon
