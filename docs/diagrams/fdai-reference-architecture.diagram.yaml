    direction: RIGHT
    layout: row
    gap: 96
    justify: center
    width: 1040
  - id: governed-control
    parent: fdai-platform
    kind: layer
    presentation: band
    label: { en: Governed control flow, ko: 통제된 control flow }
    direction: RIGHT
    layout: row
    gap: 24
    justify: center
    width: 1040
  - id: models-and-tools
    parent: fdai-platform
    kind: layer
    presentation: band
    label: { en: Models and tools, ko: Model 및 tool }
    direction: RIGHT
    layout: row
    gap: 64
    justify: center
    width: 1040
  - id: knowledge-and-evidence
    parent: fdai-platform
    kind: layer
    presentation: band
    label: { en: Governed knowledge and evidence, ko: 통제된 knowledge 및 evidence }
    direction: RIGHT
    layout: row
    gap: 48
    justify: center
    width: 1040
