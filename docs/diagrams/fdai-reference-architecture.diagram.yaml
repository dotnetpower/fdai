id: fdai-reference-architecture
version: 13
kind: context
formats: [svg]
updated: 2026-10-28
locales:
  en:
    title: FDAI reference architecture
    description: Agent-owned control stages, separated authority gates, governed dependencies, and outcomes for FDAI autonomous cloud operations.
    alt: Connected Azure resources, telemetry, repositories, and connectors send typed signals to the headless FDAI control plane, and operators use the Web Console, CLI, and ChatOps. Fifteen agents coordinate through a schema-validated event bus. Events pass ingest and trust routing to T0 rules, T1 verified reuse, or T2 grounded reasoning; only T2 passes a quality gate, then every tier reaches the risk and authority gate. High-impact work needs independent human authority. Approved work reaches the privileged executor and produces governed changes; other work is held, denied, or closed as a no-op. Governed capabilities and the Azure foundation sit outside the control plane, and every outcome is audited and replayable.
  ko:
    title: FDAI 참조 아키텍처
    description: FDAI 자율 클라우드 운영을 위한 에이전트 소유 제어 단계, 분리된 권한 게이트, 통제된 의존 서비스 및 결과입니다.
    alt: 연결된 Azure 리소스, 텔레메트리, 저장소, 커넥터가 타입이 지정된 신호를 헤드리스 FDAI 컨트롤 플레인에 보내고 운영자는 Web Console, CLI, ChatOps를 사용합니다. 15개 에이전트는 스키마 검증 이벤트 버스로 협업합니다. 이벤트는 수집과 신뢰 라우팅을 거쳐 T0 규칙, T1 검증된 재사용 또는 T2 근거 기반 추론으로 처리됩니다. T2만 품질 게이트를 통과하며 모든 티어는 위험 및 권한 게이트에 도달합니다. 영향이 큰 작업은 독립적인 사람 권한이 필요합니다. 승인된 작업은 권한 있는 실행기가 처리해 통제된 변경을 만들고 나머지는 보류, 거부 또는 변경 없음으로 종료합니다. 통제된 기능과 Azure 기반은 컨트롤 플레인 밖에 있으며 모든 결과는 감사하고 재생할 수 있습니다.
canvas:
  width: 2090
  height: 900
  direction: RIGHT
  rootLayout: row
  padding: 24
  profile: azure-reference
groups:
  - id: connected-environment
    kind: layer
    presentation: panel
    label: { en: Connected environment, ko: 연결된 운영 환경 }
    description: { en: Signals and governed source material, ko: Signal 및 통제된 source material }
    direction: DOWN
    layout: column
    gap: 32
    width: 210
  - id: fdai-platform
    kind: system
    presentation: panel
    label: { en: FDAI system and governed dependencies, ko: FDAI 시스템 및 통제된 의존 서비스 }
    description: { en: Evidence-governed autonomous cloud operations, ko: 근거로 통제되는 자율 cloud operation }
    direction: DOWN
    layout: column
    gap: 28
    width: 1200
  - id: operator-surfaces
    parent: fdai-platform
    kind: layer
    presentation: band
    label: { en: Operator interfaces, ko: 운영자 인터페이스 }
    direction: RIGHT
    layout: row
    gap: 64
    justify: center
    width: 1160
  - id: headless-control-plane
    parent: fdai-platform
    kind: system
    presentation: panel
    label: { en: Headless FDAI control plane, ko: 헤드리스 FDAI 컨트롤 플레인 }
    description: { en: Every state transition has one accountable agent owner, ko: 모든 state transition에는 한 명의 accountable agent owner가 있습니다. }
    direction: DOWN
    layout: column
    gap: 28
    width: 1160
  - id: event-choreography
    parent: headless-control-plane
    kind: layer
    presentation: panel
    label: { en: Typed event choreography and ownership, ko: 타입이 지정된 이벤트 협업 및 역할 소유권 }
    direction: RIGHT
    layout: row
    gap: 72
    justify: center
    width: 1120
  - id: governed-control
    parent: headless-control-plane
    kind: layer
    presentation: band
    label: { en: Agent-owned governed control flow, ko: 에이전트가 소유하는 통제된 제어 흐름 }
    direction: RIGHT
    layout: flow
    gap: 64
    width: 1120
  - id: governed-capabilities
    parent: fdai-platform
    kind: layer
    presentation: band
    label: { en: "Governed provider, policy, knowledge, and evidence capabilities", ko: "통제된 공급자, 정책, 지식 및 근거 기능" }
    direction: RIGHT
    layout: row
    gap: 16
    justify: center
    width: 1160
  - id: azure-foundation
    parent: fdai-platform
    kind: layer
    presentation: panel
    label: { en: Azure deployment foundation, ko: Azure 배포 기반 }
    direction: RIGHT
    layout: row
    gap: 32
    justify: center
    width: 1160
  - id: governed-outcomes
    kind: layer
    presentation: panel
    label: { en: Governed outcomes, ko: 통제된 결과 }
    description: { en: "Delivery, safe closure, and replay", ko: "Delivery, 안전한 종료 및 replay" }
    direction: DOWN
    layout: column
    gap: 32
    width: 230
  - id: human-authority
    kind: layer
    presentation: panel
    label: { en: Human authority, ko: 사람 권한 }
    description: { en: Independent approval or valid standing authorization, ko: 독립적인 승인 또는 유효한 standing authorization }
    direction: DOWN
    layout: column
    gap: 32
    width: 200
