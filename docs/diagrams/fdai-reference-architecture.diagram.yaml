edges:
  - id: environment-to-runtime
    from: connected-environment
    to: event-choreography
    kind: event
    route: orthogonal-horizontal
  - id: operators-to-runtime
    from: operator-surfaces
    to: event-choreography
    kind: request
    route: orthogonal
  - id: bus-to-ingest
    from: typed-event-bus
    to: event-ingest
    kind: event
    route: orthogonal-trunk
  - id: ingest-to-router
    from: event-ingest
    to: trust-router
    kind: event
  - id: router-to-decision
    from: trust-router
    to: decision-tiers
    kind: request
  - id: decision-to-quality
    from: decision-tiers
    to: t2-quality-gate
    kind: request
  - id: decision-to-risk
    from: decision-tiers
    to: risk-authority-gate
    kind: request
    label: { en: T0 / T1, ko: T0 / T1 }
  - id: quality-to-risk
    from: t2-quality-gate
    to: risk-authority-gate
    kind: request
  - id: risk-to-executor
    from: risk-authority-gate
    to: privileged-executor
    kind: mutation
  - id: capabilities-to-control
    from: governed-capabilities
    to: governed-control
    kind: read
    route: orthogonal
  - id: risk-to-approval
    from: risk-authority-gate
    to: human-approval
    kind: approval
    route: orthogonal-above
  - id: approval-to-runtime
    from: human-approval
    to: event-choreography
    kind: approval
    route: orthogonal-above
    lane: 1
  - id: executor-to-outcomes
    from: privileged-executor
    to: governed-changes
    kind: mutation
    route: orthogonal-shortest
  - id: risk-to-held
    from: governed-control
    to: held-outcome
    kind: request
    route: orthogonal-shortest
  - id: control-to-evidence
    from: governed-control
    to: evidence-store
    kind: audit
    route: orthogonal-right
  - id: evidence-to-replay
    from: evidence-store
    to: audit-replay
    kind: read
    route: orthogonal-shortest
