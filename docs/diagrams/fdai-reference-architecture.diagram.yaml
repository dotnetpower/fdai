  - id: typed-event-bus
    parent: agent-runtime
    kind: azure-service
    icon: event-hubs
    presentation: icon
    label: { en: Schema-validated event bus, ko: Schema-validated event bus }
    description: { en: "Pub/sub, retry, isolation, dead-letter, and replay", ko: "Pub/sub, retry, isolation, dead-letter 및 replay" }
    width: 260
  - id: agent-pantheon
    parent: agent-runtime
    kind: process
    icon: agent-pantheon
