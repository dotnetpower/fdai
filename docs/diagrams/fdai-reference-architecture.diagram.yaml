    direction: DOWN
    layout: column
    gap: 48
    width: 240
  - id: fdai-platform
    kind: system
    presentation: boundary
    label: { en: FDAI control plane, ko: FDAI control plane }
    description: { en: Evidence-governed autonomous cloud operations, ko: 근거로 통제되는 자율 cloud operation }
    direction: DOWN
    layout: column
    gap: 64
    width: 1120
  - id: operator-surfaces
    parent: fdai-platform
    kind: layer
    presentation: band
    label: { en: Operator surfaces, ko: 운영자 surface }
    direction: RIGHT
    layout: row
    gap: 64
    justify: center
    width: 1040
  - id: agent-runtime
    parent: fdai-platform
