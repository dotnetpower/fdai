edges:
  - id: environment-to-runtime
    from: connected-environment
    to: typed-event-bus
    kind: event
    route: orthogonal-shortest
  - id: operators-to-runtime
    from: operator-surfaces
    to: agent-runtime
    kind: request
    route: orthogonal
  - id: bus-to-agents
    from: typed-event-bus
    to: agent-pantheon
    kind: event
  - id: bus-to-ingest
    from: typed-event-bus
    to: event-ingest
    kind: event
    route: orthogonal-trunk
  - id: ingest-to-router
    from: event-ingest
    to: trust-router
    kind: event
  - id: router-to-decision
    from: trust-router
    to: decision-tiers
    kind: request
  - id: decision-to-safety
    from: decision-tiers
    to: safety-check
    kind: request
  - id: safety-to-executor
    from: safety-check
    to: privileged-executor
    kind: mutation
  - id: models-to-control
    from: models-and-tools
    to: governed-control
    kind: read
    route: orthogonal
  - id: knowledge-to-control
    from: knowledge-and-evidence
    to: governed-control
    kind: read
    route: orthogonal-right
  - id: safety-to-approval
    from: governed-control
    to: human-approval:decision-in
    kind: approval
    route: orthogonal-shortest
  - id: approval-to-executor
    from: human-approval:approval-out
    to: privileged-executor:approval-in
    kind: approval
    route: orthogonal-shortest
  - id: executor-to-pr
    from: privileged-executor
    to: remediation-pr
    kind: mutation
    route: orthogonal-shortest
  - id: executor-to-actions
    from: privileged-executor
    to: governed-actions
    kind: mutation
    route: orthogonal-shortest
  - id: control-to-evidence
    from: governed-control
    to: knowledge-and-evidence
    kind: audit
    route: orthogonal-trunk
  - id: evidence-to-replay
    from: evidence-store
    to: audit-replay
    kind: read
    route: orthogonal-shortest
legend:
  - kind: event
    label: { en: Typed asynchronous event, ko: Typed 비동기 event }
  - kind: request
    label: { en: Governed request, ko: 통제된 request }
  - kind: read
    label: { en: Evidence or capability read, ko: Evidence 또는 capability read }
  - kind: approval
    label: { en: Human approval, ko: 사람 승인 }
  - kind: mutation
    label: { en: Governed change, ko: 통제된 변경 }
  - kind: audit
    label: { en: Append-only audit, ko: Append-only audit }
