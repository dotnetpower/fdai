id: fdai-reference-architecture
version: 1
kind: context
formats: [svg]
updated: 2026-08-03
locales:
  en:
    title: FDAI reference architecture
    description: Logical product layers, governed control boundaries, Azure platform services, and connected operational systems for FDAI.
    alt: Connected Azure resources, telemetry, repositories, and enterprise connectors send signals into FDAI. Operators use the Web Console, CLI, and ChatOps surfaces. The fixed pantheon of 15 independently runnable agents coordinates only through a schema-validated event bus. Events pass through ingest, trust routing, deterministic or grounded decision tiers, verification and safety checks, and the privileged executor. Microsoft Foundry, Azure OpenAI, provider tools, the operating ontology, governed catalogs, and PostgreSQL provide model, tool, knowledge, and evidence capabilities. Azure Container Apps, Microsoft Entra ID, managed identities, Key Vault, and Azure Monitor form the platform foundation. Governed outcomes include human approval, remediation pull requests, bounded direct actions, and audit replay.
  ko:
    title: FDAI 참조 아키텍처
    description: FDAI의 논리적 제품 계층, 통제 경계, Azure platform service 및 연결된 운영 시스템입니다.
    alt: 연결된 Azure resource, telemetry, repository 및 enterprise connector가 FDAI로 signal을 보냅니다. 운영자는 Web Console, CLI 및 ChatOps surface를 사용합니다. 고정된 15개 독립 실행 agent는 schema-validated event bus로만 협업합니다. Event는 ingest, trust routing, deterministic 또는 grounded decision tier, verification 및 safety check, privileged executor를 통과합니다. Microsoft Foundry, Azure OpenAI, provider tool, operating ontology, governed catalog 및 PostgreSQL이 model, tool, knowledge 및 evidence capability를 제공합니다. Azure Container Apps, Microsoft Entra ID, managed identity, Key Vault 및 Azure Monitor가 platform foundation을 구성합니다. 통제된 결과에는 사람 승인, remediation pull request, 범위가 제한된 direct action 및 audit replay가 포함됩니다.
canvas:
