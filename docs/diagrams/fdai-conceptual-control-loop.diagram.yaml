id: fdai-conceptual-control-loop
version: 1
kind: conceptual-flow
updated: 2026-08-08
locales:
  en:
    title: FDAI governed automation architecture
    description: Natural-language intent becomes a policy-governed action through shared context, typed semantics, and a measured feedback loop.
    alt: Six stages run from an operator question through language understanding, dynamic ontology, policy evaluation, action selection, and execution. Shared context supports an ontology, policy engine, action catalog, and execution targets. Results flow through a feedback loop into four governed data stores.
  ko:
    title: FDAI 통제형 자동화 아키텍처
    description: 자연어 의도를 공유 컨텍스트와 타입 의미 체계로 해석하고 정책을 거쳐 실행한 뒤 측정 가능한 피드백으로 개선합니다.
    alt: 운영자 질문이 언어 이해, 동적 온톨로지, 정책 평가, 작업 선택, 실행의 여섯 단계를 통과합니다. 공유 컨텍스트가 온톨로지, 정책 엔진, 작업 카탈로그, 실행 대상을 지원하며 실행 결과는 피드백 루프를 거쳐 네 개의 통제된 데이터 저장소에 기록됩니다.
canvas:
  width: 2200
  height: 1250
  direction: RIGHT
  rootLayout: column
  padding: 30
  profile: conceptual
groups:
  - id: governed-flow
    kind: layer
    presentation: lane
    label: { en: Governed automation path, ko: 통제형 자동화 경로 }
    layout: row
    gap: 24
    justify: center
  - id: architecture-detail
    kind: system
    presentation: panel
    label: { en: Shared semantic and execution architecture, ko: 공유 의미 및 실행 아키텍처 }
    layout: row
    gap: 24
    justify: center
  - id: context-sharing
    parent: architecture-detail
    kind: layer
    presentation: sidebar
    label: { en: Context sharing, ko: 컨텍스트 공유 }
    layout: column
  - id: ontology-surface
    parent: architecture-detail
    kind: layer
    presentation: panel
    label: { en: Dynamic ontology, ko: 동적 온톨로지 }
    layout: column
  - id: policy-surface
    parent: architecture-detail
    kind: layer
    presentation: panel
    label: { en: Policy evaluation, ko: 정책 평가 }
    layout: column
  - id: action-surface
    parent: architecture-detail
    kind: layer
    presentation: panel
    label: { en: Action ontology, ko: 작업 온톨로지 }
    layout: column
  - id: execution-surface
    parent: architecture-detail
    kind: layer
    presentation: panel
    label: { en: Execution, ko: 실행 }
    layout: column
  - id: feedback-loop
    kind: layer
    presentation: feedback
    label: { en: Feedback loop, ko: 피드백 루프 }
    layout: row
    gap: 34
    justify: center
  - id: data-store
    kind: layer
    presentation: datastore
    label: { en: Governed data stores, ko: 통제된 데이터 저장소 }
    layout: row
    gap: 54
    justify: center
nodes:
  - id: operator-question
    parent: governed-flow
    kind: person
    icon: lucide-inbox
    tone: input
    badge: 1
    width: 238
    label: { en: Natural-language question, ko: 자연어 질문 }
    content:
      - { en: Why is the GPU slow?, ko: GPU가 느린 이유는? }
  - id: language-understanding
    parent: governed-flow
    kind: process
    icon: lucide-search-check
    tone: interpretation
    badge: 2
    width: 238
    label: { en: Language understanding, ko: 의미 해석 }
    content:
      - { en: Extract intent, ko: 의도 추출 }
      - { en: Extract entities, ko: 엔터티 추출 }
      - { en: Capture context, ko: 컨텍스트 파악 }
  - id: semantic-model
    parent: governed-flow
    kind: process
    icon: lucide-git-branch
    tone: model
    badge: 3
    width: 238
    label: { en: Dynamic ontology, ko: 동적 온톨로지 }
    content:
      - { en: Objects and relations, ko: 객체와 관계 }
      - { en: State and time, ko: 상태와 시간 }
      - { en: Shared context, ko: 공유 컨텍스트 }
  - id: policy-decision
    parent: governed-flow
    kind: decision
    icon: lucide-shield-check
    tone: policy
    badge: 4
    width: 238
    label: { en: Policy evaluation, ko: 정책 평가 }
    content:
      - { en: Match deterministic rules, ko: 결정적 규칙 매칭 }
      - { en: "Allow, deny, or hold", ko: "허용, 거부 또는 보류" }
  - id: action-selection
    parent: governed-flow
    kind: decision
    icon: lucide-wrench
    tone: decision
    badge: 5
    width: 238
    label: { en: Action selection, ko: 작업 선택 }
    content:
      - { en: Choose registered action, ko: 등록된 작업 선택 }
      - { en: Set priority and evidence, ko: 우선순위와 근거 설정 }
  - id: governed-execution
    parent: governed-flow
    kind: process
    icon: lucide-play
    tone: execution
    badge: 6
    width: 238
    label: { en: Governed execution, ko: 통제된 실행 }
    content:
      - { en: Automatic when eligible, ko: 조건 충족 시 자동 실행 }
      - { en: Human approval when required, ko: 필요 시 사람 승인 }
      - { en: Read-only otherwise, ko: 그 외에는 읽기 전용 }
  - id: shared-context
    parent: context-sharing
    kind: store
    icon: lucide-book-open
    tone: feedback
    width: 250
    label: { en: Shared operational context, ko: 공유 운영 컨텍스트 }
    content:
      - { en: Logs and events, ko: 로그와 이벤트 }
      - { en: Alerts and monitoring, ko: 알림과 모니터링 }
      - { en: Runbooks and documents, ko: 런북과 문서 }
      - { en: Changes and deployments, ko: 변경과 배포 }
      - { en: "Users, teams, and authority", ko: "사용자, 팀 및 권한" }
  - id: ontology-model
    parent: ontology-surface
    kind: process
    icon: lucide-git-branch
    tone: model
    width: 270
    label: { en: Operating model, ko: 운영 모델 }
    content:
      - { en: Object and relationship types, ko: 객체 및 관계 유형 }
      - { en: Current and historical state, ko: 현재 및 이력 상태 }
      - { en: Event time and context, ko: 이벤트 시간 및 컨텍스트 }
  - id: rego-policy
    parent: policy-surface
    kind: decision
    icon: lucide-shield-check
    tone: policy
    width: 270
    label: { en: OPA and Rego policy, ko: OPA 및 Rego 정책 }
    content:
      - { en: Evaluate typed input, ko: 타입 입력 평가 }
      - { en: Apply risk and authority, ko: 위험 및 권한 적용 }
      - { en: "Return allow, deny, or review", ko: "허용, 거부 또는 검토 반환" }
  - id: action-catalog
    parent: action-surface
    kind: service
    icon: lucide-wrench
    tone: decision
    width: 270
    label: { en: Registered actions, ko: 등록된 작업 }
    content:
      - { en: Restart or scale, ko: 재시작 또는 확장 }
      - { en: Roll back safely, ko: 안전한 롤백 }
      - { en: Open incident or notify, ko: 인시던트 생성 또는 알림 }
  - id: execution-targets
    parent: execution-surface
    kind: service
    icon: lucide-terminal
    tone: execution
    width: 270
    label: { en: Execution targets, ko: 실행 대상 }
    content:
      - { en: Kubernetes and Azure services, ko: Kubernetes 및 Azure 서비스 }
      - { en: Queues and automation, ko: 큐 및 자동화 }
      - { en: External systems and APIs, ko: 외부 시스템 및 API }
  - id: collect-result
    parent: feedback-loop
    kind: process
    icon: lucide-inbox
    tone: feedback
    width: 260
    label: { en: Collect outcomes, ko: 실행 결과 수집 }
  - id: update-state
    parent: feedback-loop
    kind: process
    icon: lucide-refresh-ccw
    tone: feedback
    width: 260
    label: { en: Update observed state, ko: 관찰 상태 업데이트 }
  - id: record-history
    parent: feedback-loop
    kind: process
    icon: lucide-file-check
    tone: feedback
    width: 260
    label: { en: Record evidence history, ko: 근거 이력 기록 }
  - id: improve-knowledge
    parent: feedback-loop
    kind: process
    icon: lucide-route
    tone: feedback
    width: 260
    label: { en: Propose governed improvements, ko: 통제된 개선 제안 }
  - id: ontology-store
    parent: data-store
    kind: store
    shape: database
    tone: store
    width: 300
    label: { en: Ontology store, ko: 온톨로지 저장소 }
    content:
      - { en: PostgreSQL and pgvector, ko: PostgreSQL 및 pgvector }
  - id: policy-store
    parent: data-store
    kind: store
    shape: document
    tone: store
    width: 300
    label: { en: Policy store, ko: 정책 저장소 }
    content:
      - { en: Versioned policy source, ko: 버전 관리 정책 원본 }
  - id: event-store
    parent: data-store
    kind: store
    shape: database
    tone: store
    width: 300
    label: { en: Event and audit store, ko: 이벤트 및 감사 저장소 }
    content:
      - { en: Append-only operational history, ko: 추가 전용 운영 이력 }
  - id: evidence-store
    parent: data-store
    kind: store
    shape: database
    tone: store
    width: 300
    label: { en: Evidence vector store, ko: 근거 벡터 저장소 }
    content:
      - { en: Searchable grounded evidence, ko: 검색 가능한 근거 자료 }
edges:
  - id: question-to-language
    from: operator-question
    to: language-understanding
    kind: sequence
  - id: language-to-model
    from: language-understanding
    to: semantic-model
    kind: sequence
  - id: model-to-policy
    from: semantic-model
    to: policy-decision
    kind: sequence
  - id: policy-to-action
    from: policy-decision
    to: action-selection
    kind: sequence
  - id: action-to-execution
    from: action-selection
    to: governed-execution
    kind: sequence
  - id: context-to-ontology
    from: shared-context
    to: ontology-model
    kind: read
  - id: ontology-to-policy
    from: ontology-model
    to: rego-policy
    kind: request
  - id: policy-to-catalog
    from: rego-policy
    to: action-catalog
    kind: approval
  - id: catalog-to-targets
    from: action-catalog
    to: execution-targets
    kind: mutation
  - id: execution-to-feedback
    from: execution-targets
    to: collect-result
    kind: feedback
    route: orthogonal-outer
  - id: collect-to-state
    from: collect-result
    to: update-state
    kind: feedback
  - id: state-to-history
    from: update-state
    to: record-history
    kind: feedback
  - id: history-to-improvement
    from: record-history
    to: improve-knowledge
    kind: feedback
  - id: improvement-to-ontology
    from: improve-knowledge
    to: ontology-model
    kind: feedback
    route: orthogonal-outer
  - id: history-to-event-store
    from: record-history
    to: event-store
    kind: write
    route: orthogonal-shortest
  - id: ontology-to-store
    from: ontology-model
    to: ontology-store
    kind: write
    route: orthogonal-outer
  - id: policy-to-store
    from: rego-policy
    to: policy-store
    kind: write
    route: orthogonal-shortest
  - id: improvement-to-evidence
    from: improve-knowledge
    to: evidence-store
    kind: write
    route: orthogonal-shortest
legend:
  - tone: input
    label: { en: Input, ko: 입력 }
  - tone: model
    label: { en: Semantic model, ko: 의미 모델 }
  - tone: policy
    label: { en: Policy judgment, ko: 정책 판단 }
  - tone: decision
    label: { en: Action decision, ko: 작업 결정 }
  - tone: execution
    label: { en: Execution, ko: 실행 }
  - kind: feedback
    label: { en: Feedback and learning, ko: 피드백 및 학습 }
