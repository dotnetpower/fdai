nodes:
  - id: operator
    parent: operator-access
    kind: person
    label: { en: Operator, ko: 운영자 }
    description: { en: "Reader, contributor, approver, owner, or break-glass role", ko: "Reader, contributor, approver, owner 또는 break-glass 역할" }
  - id: entra-id
    parent: operator-access
    kind: external
    label: { en: Microsoft Entra ID, ko: Microsoft Entra ID }
    description: { en: Browser authentication and App Roles, ko: Browser 인증 및 App Role }
  - id: operator-console
    parent: operator-access
    kind: azure-service
    icon: static-web-app
    presentation: icon
    label: { en: FDAI Console, ko: FDAI Console }
    description: { en: Read-only projections and bounded governed requests, ko: 읽기 전용 projection 및 범위가 제한된 통제 요청 }
  - id: operator-api
    parent: container-apps-subnet
    kind: process
    icon: container-apps
    label: { en: Operator API Container App, ko: Operator API Container App }
