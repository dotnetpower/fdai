    parent: private-endpoint-subnet
    kind: service
    icon: private-endpoint
    presentation: icon
    label: { en: Event Hubs private endpoint, ko: Event Hubs private endpoint }
  - id: registry-pe
    parent: private-endpoint-subnet
    kind: service
    icon: private-endpoint
    presentation: icon
    label: { en: Registry private endpoint, ko: Registry private endpoint }
  - id: key-vault-pe
    parent: private-endpoint-subnet
    kind: service
    icon: private-endpoint
    presentation: icon
    label: { en: Key Vault private endpoint, ko: Key Vault private endpoint }
  - id: openai-pe
    parent: private-endpoint-subnet
    kind: service
    icon: private-endpoint
    presentation: icon
    label: { en: Azure OpenAI private endpoint, ko: Azure OpenAI private endpoint }
  - id: postgres
    parent: postgres-subnet
    kind: azure-service
    icon: postgresql
    presentation: icon
    label: { en: Azure Database for PostgreSQL, ko: Azure Database for PostgreSQL }
