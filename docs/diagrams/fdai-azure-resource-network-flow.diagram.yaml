id: fdai-azure-resource-network-flow
version: 1
kind: deployment
updated: 2026-08-02
locales:
  en:
    title: FDAI Azure resource network flow
    description: Azure resources, private-endpoint flows, and the optional document storage path for FDAI private networking.
    alt: An operator signs in through Entra ID and uses the FDAI Web Console on Azure Static Web Apps. The console calls the separately identified Operator API in the Container Apps infrastructure subnet. Azure Event Hubs, Container Registry, Key Vault, Azure OpenAI, and Azure Database for PostgreSQL connect through dedicated private endpoints in the private endpoint subnet. When document ingestion is enabled, an Ingestion Gateway Container App reaches ADLS Gen2 document storage through Blob and DFS private endpoints. The FDAI core and Container Apps Jobs run in the Container Apps subnet. Managed identities authorize workload access. Azure Resource Graph supplies inventory, Application Insights and Log Analytics receive telemetry, Teams carries human approval, and Git receives governed remediation pull requests.
  ko:
    title: FDAI Azure resource network flow
    description: FDAI private networking의 Azure resource, private endpoint 및 optional document storage flow입니다.
    alt: 운영자는 Entra ID로 로그인하고 Azure Static Web Apps의 FDAI Web Console을 사용합니다. Console은 Container Apps infrastructure subnet에서 별도 identity로 실행되는 Operator API를 호출합니다. Azure Event Hubs, Container Registry, Key Vault, Azure OpenAI 및 Azure Database for PostgreSQL은 private endpoint subnet의 전용 private endpoint를 통해 연결됩니다. Document ingestion을 활성화하면 Ingestion Gateway Container App이 Blob 및 DFS private endpoint를 통해 ADLS Gen2 document storage에 연결됩니다. FDAI core와 Container Apps Jobs는 Container Apps subnet에서 실행됩니다. Managed identity가 workload 접근 권한을 부여합니다. Azure Resource Graph는 inventory를 제공하고 Application Insights와 Log Analytics는 telemetry를 수집하며 Teams는 사람 승인을 전달하고 Git은 통제된 수정 pull request를 받습니다.
