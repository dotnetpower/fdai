id: fdai-azure-resource-network-flow
version: 1
kind: deployment
updated: 2026-08-02
locales:
  en:
    title: FDAI Azure resource network flow
    description: Azure resources, private network boundaries, identities, and governed operator flows for the FDAI deployment.
    alt: An operator signs in through Microsoft Entra ID and opens the FDAI Console on Azure Static Web Apps. The console calls the separately identified Operator API in the Container Apps infrastructure subnet. Azure Event Hubs, Container Registry, Key Vault, and Azure OpenAI connect through dedicated private endpoints in the private endpoint subnet. The FDAI core and Container Apps Jobs run in the Container Apps subnet, while Azure Database for PostgreSQL runs in its delegated subnet. Managed identities authorize workload access. Azure Resource Graph supplies inventory, Application Insights and Log Analytics receive telemetry, Teams carries human approval, and Git receives governed remediation pull requests.
  ko:
    title: FDAI Azure resource network flow
    description: FDAI Azure 배포의 resource, private network, identity 및 통제된 flow입니다.
    alt: 운영자는 Microsoft Entra ID로 로그인하고 Azure Static Web Apps의 FDAI Console을 엽니다. Console은 Container Apps infrastructure subnet에서 별도 identity로 실행되는 Operator API를 호출합니다. Azure Event Hubs, Container Registry, Key Vault 및 Azure OpenAI는 private endpoint subnet의 전용 private endpoint를 통해 연결됩니다. FDAI core와 Container Apps Jobs는 Container Apps subnet에서 실행되고 Azure Database for PostgreSQL은 delegated subnet에서 실행됩니다. Managed identity가 workload 접근 권한을 부여합니다. Azure Resource Graph는 inventory를 제공하고 Application Insights와 Log Analytics는 telemetry를 수집하며 Teams는 사람 승인을 전달하고 Git은 통제된 수정 pull request를 받습니다.
canvas:
  width: 1600
  height: 1120
  direction: RIGHT
  padding: 24
  profile: azure-reference
