    from: operator
    to: entra-id
    kind: request
    step: 1
    label: { en: Sign in, ko: 로그인 }
  - id: entra-to-console
    from: entra-id
    to: operator-console
    kind: approval
    label: { en: App Role token, ko: App Role token }
  - id: console-to-api
    from: operator-console
    to: operator-api
    kind: request
    step: 2
    label: { en: HTTPS request, ko: HTTPS 요청 }
  - id: event-hubs-to-pe
    from: event-hubs
    to: event-hubs-pe
    kind: event
    step: 3
    label: { en: Kafka private link, ko: Kafka private link }
  - id: event-pe-to-core
    from: event-hubs-pe
    to: core-runtime
    kind: event
    route: orthogonal
    label: { en: Kafka OAUTHBEARER :9093, ko: Kafka OAUTHBEARER :9093 }
  - id: api-to-event-pe
    from: operator-api
    to: event-hubs-pe
    kind: event
    route: orthogonal
    label: { en: Typed proposal, ko: Typed proposal }
  - id: registry-to-pe
    from: container-registry
    to: registry-pe
    kind: read
    label: { en: Signed image, ko: 서명 image }
  - id: registry-pe-to-core
    from: registry-pe
    to: core-runtime
    kind: read
    route: orthogonal
  - id: core-to-key-vault-pe
    from: core-runtime
    to: key-vault-pe
    kind: read
    route: orthogonal
    step: 4
    label: { en: Native secret resolution, ko: Native secret resolution }
  - id: key-vault-pe-to-service
    from: key-vault-pe
    to: key-vault
    kind: read
  - id: core-to-openai-pe
    from: core-runtime
    to: openai-pe
    kind: request
    route: orthogonal
    step: 4
    label: { en: Verified T2 request, ko: 검증된 T2 요청 }
  - id: openai-pe-to-service
    from: openai-pe
    to: azure-openai
    kind: request
  - id: core-to-postgres
    from: core-runtime
    to: postgres
