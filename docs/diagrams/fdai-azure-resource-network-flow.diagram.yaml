id: fdai-azure-resource-network-flow
version: 1
kind: deployment
formats: [svg]
updated: 2026-08-20
locales:
  en:
    title: FDAI Azure resource network flow
    description: Azure resources, private-endpoint flows, five independent FDAI services, and governed delivery channels for FDAI private networking.
    alt: An operator signs in through Microsoft Entra ID and uses the FDAI Web Console on Azure Static Web Apps. A planned private Application Gateway protected by a WAF policy routes requests to the Operator Service and Document Ingestion API. A VNet-integrated Container Apps environment runs the Core Control Plane, Operator Service, Document Ingestion API, Document Processing Worker, Isolated Executor, and scheduled jobs. The Core has no effect identity, and the Isolated Executor alone may hold explicitly approved effect roles. Azure Event Hubs, Container Registry, Key Vault, Azure OpenAI, Microsoft Foundry, Azure Database for PostgreSQL, and optional ADLS Gen2 storage connect through dedicated private endpoints. Azure Resource Graph supplies inventory, Application Insights and Log Analytics receive telemetry, and Azure Managed Grafana reads monitoring data. Email, Teams, and Slack carry human approvals. GitHub, GitLab, and Azure DevOps receive governed remediation pull requests.
  ko:
    title: FDAI Azure resource network flow
    description: FDAI private networking의 Azure resource, private endpoint, 5개 독립 FDAI service 및 통제된 전달 채널입니다.
    alt: 운영자는 Microsoft Entra ID로 로그인하고 Azure Static Web Apps의 FDAI Web Console을 사용합니다. 계획된 private Application Gateway는 WAF policy로 보호되며 Operator Service와 Document Ingestion API로 요청을 전달합니다. VNet에 통합된 Container Apps 환경에서는 Core Control Plane, Operator Service, Document Ingestion API, Document Processing Worker, Isolated Executor 및 예약 job이 실행됩니다. Core에는 effect identity가 없고 Isolated Executor만 명시적으로 승인된 effect role을 보유할 수 있습니다. Azure Event Hubs, Container Registry, Key Vault, Azure OpenAI, Microsoft Foundry, Azure Database for PostgreSQL 및 optional ADLS Gen2 storage는 전용 private endpoint를 통해 연결됩니다. Azure Resource Graph는 inventory를 제공하고 Application Insights와 Log Analytics는 telemetry를 수집하며 Azure Managed Grafana는 monitoring data를 읽습니다. Email, Teams 및 Slack은 사람 승인을 전달합니다. GitHub, GitLab 및 Azure DevOps는 통제된 수정 pull request를 받습니다.
