    presentation: panel
    label: { en: Operator access, ko: 운영자 접근 }
    direction: RIGHT
  - id: azure-region
    kind: cloud
    presentation: panel
    label: { en: Azure deployment region, ko: Azure 배포 region }
    direction: DOWN
  - id: fdai-vnet
    parent: azure-region
    kind: network
    presentation: boundary
    label: { en: FDAI virtual network, ko: FDAI virtual network }
    direction: DOWN
  - id: container-apps-subnet
    parent: fdai-vnet
    kind: subnet
    presentation: band
    label: { en: Container Apps infrastructure subnet, ko: Container Apps infrastructure subnet }
    direction: RIGHT
  - id: private-endpoint-subnet
    parent: fdai-vnet
    kind: subnet
    presentation: band
    label: { en: Private endpoint subnet, ko: Private endpoint subnet }
    direction: RIGHT
  - id: postgres-subnet
    parent: fdai-vnet
    kind: subnet
    presentation: band
    label: { en: PostgreSQL delegated subnet, ko: PostgreSQL delegated subnet }
    direction: RIGHT
  - id: private-service-backends
    parent: azure-region
    kind: layer
    presentation: panel
    label: { en: Private services, ko: Private service }
    direction: RIGHT
  - id: platform-services
    parent: azure-region
    kind: layer
    presentation: panel
    label: { en: Azure platform services, ko: Azure platform service }
    direction: RIGHT
  - id: governed-delivery
    kind: layer
    presentation: panel
