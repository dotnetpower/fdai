id: azure-hub-spoke-network-reference
version: 1
kind: network
posture: expected
formats: [svg, png]
updated: 2026-08-22
locales:
  en:
    title: Hub-spoke network reference
    description: Internet, private, and hybrid access through a secured Azure hub and workload spoke.
    alt: A DMZ virtual network connects through a secured virtual hub to a workload spoke. The hub contains Azure Firewall, Virtual WAN Hub, and a Virtual Network Gateway connected to an ExpressRoute circuit. The workload spoke contains external and internal Application Gateway subnets, workload and data subnets, and a private endpoint subnet. Routing intent states that Internet traffic is inspected and private traffic passes through the hub firewall.
  ko:
    title: 허브-스포크 네트워크 참조
    description: 보안이 적용된 Azure 허브와 워크로드 스포크를 통과하는 Internet, 비공개 및 하이브리드 접근입니다.
    alt: DMZ Virtual Network가 보안이 적용된 virtual hub를 통해 워크로드 스포크에 연결됩니다. 허브에는 Azure Firewall, Virtual WAN Hub 및 ExpressRoute circuit에 연결된 Virtual Network Gateway가 있습니다. 워크로드 스포크에는 외부 및 내부 Application Gateway 서브넷, 워크로드와 데이터 서브넷 및 Private Endpoint 서브넷이 있습니다. 라우팅 의도는 Internet 트래픽을 검사하고 비공개 트래픽이 hub firewall을 통과한다고 설명합니다.
canvas:
  width: 1600
  height: 900
  direction: RIGHT
  rootLayout: row
  padding: 24
  profile: network-azure-reference
  networkPreset: hub-spoke
groups:
  - id: external-access
    kind: layer
    networkRole: external
    presentation: panel
    label: { en: External access, ko: 외부 접근 }
    direction: DOWN
    layout: column
    width: 190
  - id: dmz-vnet
    kind: network
    networkRole: dmz
    presentation: boundary
    label: { en: DMZ virtual network, ko: DMZ Virtual Network }
    direction: DOWN
    layout: column
    width: 252
  - id: bastion-subnet
    parent: dmz-vnet
    kind: subnet
    networkRole: subnet
    presentation: band
    label: { en: Bastion subnet, ko: Bastion 서브넷 }
    direction: DOWN
    layout: column
    width: 190
  - id: secured-hub
    kind: network
    networkRole: hub
    presentation: boundary
    label: { en: Secured virtual hub, ko: 보안이 적용된 virtual hub }
    direction: DOWN
    layout: column
    gap: 8
    width: 270
  - id: workload-spoke
    kind: network
    networkRole: spoke
    presentation: boundary
    label: { en: Workload spoke virtual network, ko: 워크로드 스포크 Virtual Network }
    direction: DOWN
    layout: column
    gap: 12
    width: 760
  - id: ingress-row
    parent: workload-spoke
    kind: layer
    presentation: panel
    label: { en: Ingress, ko: 유입 }
    direction: RIGHT
    layout: row
    gap: 24
    width: 700
  - id: external-ingress-subnet
    parent: ingress-row
    kind: subnet
    networkRole: subnet
    presentation: band
    label: { en: External Application Gateway subnet, ko: 외부 Application Gateway 서브넷 }
    direction: DOWN
    layout: column
    width: 300
  - id: internal-ingress-subnet
    parent: ingress-row
    kind: subnet
    networkRole: subnet
    presentation: band
    label: { en: Internal Application Gateway subnet, ko: 내부 Application Gateway 서브넷 }
    direction: DOWN
    layout: column
    width: 300
  - id: service-row
    parent: workload-spoke
    kind: layer
    presentation: panel
    label: { en: Workloads and data, ko: 워크로드 및 데이터 }
    direction: RIGHT
    layout: row
    gap: 20
    width: 700
  - id: workload-subnet
    parent: service-row
    kind: subnet
    networkRole: subnet
    presentation: band
    label: { en: Workload subnet, ko: 워크로드 서브넷 }
    direction: DOWN
    layout: column
    width: 205
  - id: data-subnet
    parent: service-row
    kind: subnet
    networkRole: subnet
    presentation: band
    label: { en: Data subnet, ko: 데이터 서브넷 }
    direction: DOWN
    layout: column
    width: 205
  - id: private-endpoint-subnet
    parent: service-row
    kind: subnet
    networkRole: subnet
    presentation: band
    label: { en: Private endpoint subnet, ko: Private Endpoint 서브넷 }
    direction: DOWN
    layout: column
    width: 205
  - id: private-estate
    kind: network
    networkRole: on-premises
    presentation: panel
    placement: below
    placementGap: 24
    alignWith: secured-hub
    label: { en: Private estate, ko: 비공개 환경 }
    direction: DOWN
    layout: column
    width: 230
nodes:
  - id: bastion
    parent: bastion-subnet
    kind: azure-service
    resourceType: Microsoft.Network/bastionHosts
    presentation: icon
    label: { en: Azure Bastion, ko: Azure Bastion }
  - id: firewall
    parent: secured-hub
    kind: azure-service
    resourceType: Microsoft.Network/azureFirewalls
    presentation: icon
    label: { en: Azure Firewall, ko: Azure Firewall }
    securityFacts:
      - { en: IDPS enabled, ko: IDPS 활성화 }
      - { en: Explicit bypass list, ko: 명시적 우회 목록 }
    ports:
      - { id: dmz, side: WEST }
      - { id: spoke, side: EAST }
  - id: virtual-hub
    parent: secured-hub
    kind: azure-service
    resourceType: Microsoft.Network/virtualHubs
    presentation: icon
    label: { en: Virtual WAN Hub, ko: Virtual WAN Hub }
  - id: hybrid-gateway
    parent: secured-hub
    kind: azure-service
    resourceType: Microsoft.Network/virtualNetworkGateways
    presentation: icon
    label: { en: ExpressRoute gateway, ko: ExpressRoute gateway }
    ports:
      - { id: circuit, side: SOUTH }
  - id: internet
    parent: external-access
    kind: external
    networkRole: external
    icon: users
    presentation: icon
    label: { en: Internet clients, ko: Internet 클라이언트 }
  - id: external-gateway
    parent: external-ingress-subnet
    kind: azure-service
    resourceType: Microsoft.Network/applicationGateways
    presentation: icon
    label: { en: External Application Gateway and WAF, ko: 외부 Application Gateway 및 WAF }
  - id: internal-gateway
    parent: internal-ingress-subnet
    kind: azure-service
    resourceType: Microsoft.Network/applicationGateways
    presentation: icon
    label: { en: Internal Application Gateway and WAF, ko: 내부 Application Gateway 및 WAF }
  - id: workload-vm
    parent: workload-subnet
    kind: azure-service
    resourceType: Microsoft.Compute/virtualMachines
    presentation: icon
    label: { en: Workload virtual machines, ko: 워크로드 Virtual Machines }
  - id: data-vm
    parent: data-subnet
    kind: azure-service
    resourceType: Microsoft.Compute/virtualMachines
    presentation: icon
    label: { en: Data virtual machines, ko: 데이터 Virtual Machines }
  - id: private-endpoint
    parent: private-endpoint-subnet
    kind: azure-service
    resourceType: Microsoft.Network/privateEndpoints
    networkRole: private-endpoint
    presentation: icon
    label: { en: Private Endpoint, ko: Private Endpoint }
  - id: expressroute-circuit
    parent: private-estate
    kind: azure-service
    resourceType: Microsoft.Network/expressRouteCircuits
    presentation: icon
    label: { en: ExpressRoute circuit, ko: ExpressRoute circuit }
    ports:
      - { id: gateway, side: NORTH }
edges:
  - id: dmz-to-hub
    from: dmz-vnet
    to: firewall:dmz
    kind: dependency
    route: orthogonal
    connectionKind: vnet-connection
    direction: bidirectional
    trafficClass: management
    policy: inspect
    sourceEvidence: expected
  - id: hub-to-spoke
    from: firewall:spoke
    to: workload-spoke
    kind: dependency
    route: orthogonal
    connectionKind: vnet-peering
    direction: bidirectional
    trafficClass: private
    policy: inspect
    sourceEvidence: expected
  - id: firewall-to-virtual-hub
    from: firewall
    to: virtual-hub
    kind: dependency
    route: orthogonal
    connectionKind: routing
    direction: bidirectional
    trafficClass: private
    policy: inspect
    sourceEvidence: expected
  - id: virtual-hub-to-hybrid-gateway
    from: virtual-hub
    to: hybrid-gateway
    kind: dependency
    route: orthogonal
    connectionKind: expressroute
    direction: bidirectional
    trafficClass: hybrid
    policy: allow
    sourceEvidence: expected
  - id: internet-to-external-gateway
    from: internet
    to: external-gateway
    kind: request
    route: orthogonal-above
    lane: 1
    connectionKind: traffic
    direction: forward
    trafficClass: internet
    policy: inspect
    protocol: HTTPS
    port: "443"
    sourceEvidence: expected
  - id: external-gateway-to-workload
    from: external-gateway
    to: workload-vm
    kind: request
    connectionKind: traffic
    direction: forward
    trafficClass: internet
    policy: allow
    protocol: HTTPS
    port: "443"
    sourceEvidence: expected
  - id: internal-gateway-to-workload
    from: internal-gateway
    to: workload-vm
    kind: request
    route: orthogonal-gap
    connectionKind: traffic
    direction: forward
    trafficClass: private
    policy: allow
    protocol: HTTPS
    port: "443"
    sourceEvidence: expected
  - id: workload-to-data
    from: workload-vm
    to: data-vm
    kind: request
    connectionKind: traffic
    direction: forward
    trafficClass: private
    policy: allow
    sourceEvidence: expected
  - id: workload-to-private-endpoint
    from: workload-vm
    to: private-endpoint
    kind: request
    connectionKind: private-link
    direction: forward
    trafficClass: private
    policy: allow
    sourceEvidence: expected
    label: { en: Private Link, ko: Private Link }
  - id: expressroute-to-gateway
    from: expressroute-circuit:gateway
    to: hybrid-gateway:circuit
    kind: dependency
    route: orthogonal
    connectionKind: expressroute
    direction: bidirectional
    trafficClass: hybrid
    policy: allow
    sourceEvidence: expected
    label: { en: ExpressRoute, ko: ExpressRoute }
annotations:
  - id: routing-intent
    title: { en: Routing intent and policies, ko: 라우팅 의도 및 정책 }
    body:
      - { en: "Internet traffic: inspect through the hub firewall", ko: "Internet 트래픽: hub firewall을 통해 검사" }
      - { en: "Private traffic: inspect unless explicitly bypassed", ko: "비공개 트래픽: 명시적으로 우회하지 않으면 검사" }
      - { en: "Reachability: expected design, not an observed route", ko: "도달 가능성: 관측된 경로가 아닌 예상 설계" }
    tone: policy
    placement: top-left
    anchor: firewall
legend:
  - kind: request
    label: { en: Traffic flow, ko: 트래픽 흐름 }
  - kind: dependency
    label: { en: Network connection, ko: 네트워크 연결 }
