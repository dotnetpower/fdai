    description: 장애는 어떻게 자가 치유되는가에 대한 FDAI 흐름입니다.
    alt: 장애는 어떻게 자가 치유되는가. 주요 단계는 Huginn / 변경 discovery, Heimdall / coverage 확인, Forseti / 판정, Njord, Freyr, Thor / 실행, Var
      / 여러분의 승인, Vidar / 롤백 / failover, Saga / 감사, Norns / 학습입니다.
