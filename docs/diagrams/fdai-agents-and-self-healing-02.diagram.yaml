locales:
  en:
    title: How a failure self-heals
    description: FDAI flow for How a failure self-heals.
    alt: How a failure self-heals. The main stages are Huginn / discovers changes, Heimdall / checks coverage, Forseti /
      judges verdict, Njord, Freyr, Thor / executes, Var / your approval, Vidar / rollback / failover, Saga / audits,
      Norns / learns.
  ko:
