locales:
  en:
    title: 3. DR drill orchestration
    description: Ordered FDAI interactions for 3. DR drill orchestration.
    alt: 3. DR drill orchestration. The main stages are proposed_action {dr_drill, scope, blast_radius}, verdict = hil
      (drills are always HIL), approval, verdict {execute_drill}, execute rollback / failover in shadow env,
      observe_request, observations, object.rollback {result, observations, recovery_time}, audit signal, compare to
      baseline, emit drift signal if MTTR degraded.
  ko:
    title: 3. DR 훈련 orchestration
    description: 3. DR 훈련 orchestration에 대한 순서가 있는 FDAI 상호 작용입니다.
    alt: 3. DR 훈련 orchestration. 주요 단계는 proposed_action {dr_drill, scope, blast_radius}, verdict = hil (drills are always
      HIL), approval, verdict {execute_drill}, execute rollback / failover in shadow env, observe_request, observations,
      object.rollback {result, observations, recovery_time}, audit signal, compare to baseline, emit drift signal if
      MTTR degraded입니다.
