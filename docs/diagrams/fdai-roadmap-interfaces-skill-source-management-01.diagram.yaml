      ko: Trusted artifact disabled
  - id: revoke
    kind: process
    shape: card
    label:
      en: Owner revocation
      ko: Owner revocation
  - id: disable
    kind: process
    shape: card
    label:
      en: Disable source and artifact
      ko: Source와 artifact disable
  - id: keep
