id: fdai-roadmap-interfaces-skill-source-management-01
version: 1
kind: flowchart
updated: 2026-08-20
formats:
  - svg
locales:
  en:
    title: Design at a glance
    description: FDAI flow for Design at a glance.
    alt: Design at a glance. The main stages are Approved source, Resolve commit with ETag, Quarantine exact files,
      Deterministic scan, Publisher verification, Disabled candidate, Approver command, Trusted artifact disabled, Owner
      revocation, Disable source and artifact, Retain quarantine and provenance.
  ko:
    title: 설계 요약
    description: 설계 요약에 대한 FDAI 흐름입니다.
    alt: 설계 요약. 주요 단계는 승인된 source, ETag로 commit resolve, Exact file quarantine, Deterministic scan, Publisher verification,
      Disabled candidate, Approver command, Trusted artifact disabled, Owner revocation, Source와 artifact disable,
      Quarantine과 provenance 유지입니다.
