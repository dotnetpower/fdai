  - id: src
    kind: process
    shape: card
    label:
      en: Approved source
      ko: 승인된 source
  - id: fetch
    kind: process
    shape: card
    label:
      en: Resolve commit with ETag
      ko: ETag로 commit resolve
  - id: quar
    kind: process
    shape: card
    label:
      en: Quarantine exact files
      ko: Exact file quarantine
  - id: scan
    kind: process
    shape: card
    label:
      en: Deterministic scan
      ko: Deterministic scan
  - id: verify
    kind: process
    shape: card
    label:
      en: Publisher verification
      ko: Publisher verification
  - id: cand
    kind: process
    shape: card
    label:
      en: Disabled candidate
      ko: Disabled candidate
  - id: approve
    kind: process
    shape: card
    label:
      en: Approver command
      ko: Approver command
  - id: inst
    kind: process
    shape: card
    label:
