      scope, rule set (+ profile mode), run assurance-twin + deploy-preflight over scope, compose ReadinessReport
      (clear|needs_review|blocked), audit {verdict, blocks_handoff}, request approval + shadow remediation-PR proposals,
      approved fixes, object.action-run {result}입니다.
