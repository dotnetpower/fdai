    title: 11. Operational readiness handoff
    description: Ordered FDAI interactions for 11. Operational readiness handoff.
    alt: 11. Operational readiness handoff. The main stages are object.ownership-transfer {scope, submitter, environment},
      applicable rules for scope, rule set (+ profile mode), run assurance-twin + deploy-preflight over scope, compose
      ReadinessReport (clear|needs_review|blocked), audit {verdict, blocks_handoff}, request approval + shadow
      remediation-PR proposals, approved fixes, object.action-run {result}.
