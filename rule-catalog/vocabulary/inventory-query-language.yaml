schema_version: "1.1.0"
version: "1.1.26"
default_scope: subscription
default_activity_lookback_seconds: 604800
current_requires_fresh: true
suffixes: [은, 는, 이, 가, 의, 에, 에서, 엔, 을, 를, 도, 만, 와, 과, 인, 로, 으로, 야, 된, 되고, 거나, 하거나, 들, 별로]
signals:
  resource_subject:
    terms: [resource, resources, asset, assets, inventory, azure resource, azure resources, 리소스, 인벤토리, Azure 리소스]
  read:
    terms: [how many, count, list, show, which, what, where, find, status, summary, exist, are any, 몇 개, 개수, 목록, 보여줘, 보여, 어떤, 어디, 찾아, 찾아줘, 상태, 있어, 알려줘]
  mutation:
    terms: [create, delete, drop, restart, scale, restore, update, start, stop, 생성해줘, 삭제해줘, 재시작해줘, 스케일해줘, 복구해줘, 수정해줘, 시작해줘, 중지해줘]
  diagnosis:
    terms: [why, cause, latency, slow, cpu, memory, throughput, usage, utilization, affected, impact, blast radius, 왜, 원인, 지연, 느려, 메트릭, 사용률, 이용률, 처리량, 영향, 영향 범위]
  temporal:
    terms: [recent, recently, last, past, history, when, since when, became, 최근, 지난, 이력, 언제, 누가]
  activity:
    terms: [changed resources, created resources, deleted resources, updated resources, resource changes, 변경된 리소스, 생성된 리소스, 삭제된 리소스, 수정된 리소스]
  workload:
    terms: [deployment, deployments, deploying, pod, pods, node, nodes, node pool, node pools, workload, workloads, running apps, 배포, 파드, 노드, 노드 풀, 워크로드, 실행 중인 앱]
  platform_health:
    terms: [azure outage, azure incident, platform outage, platform incident, platform issue, platform issues, platform problem, platform problems, platform-initiated impact, platform initiated impact, azure platform impact, changes initiated by the customer, customer-initiated changes, service outage, service incident, affected by an azure outage, affected by a platform outage, Azure 플랫폼 장애, Azure 서비스 장애, Azure 플랫폼 영향, Azure 플랫폼 영향인지, 고객 시작 변경, 고객 시작 변경인지, 플랫폼 장애, 플랫폼 문제, 서비스 장애]
  health_history:
    terms: [resource health events, resource status events, health events during the previous day, managed resources health events, managed resources' health events, health event history, resource health history, Resource Health 이벤트, 리소스 상태 이벤트, 리소스 헬스 이벤트, 리소스 상태 변경 이력, 상태 이벤트 이력, 리소스 상태 이력]
  continuation:
    terms: [also, as well, together, too, did you check, did you skip, fail to read, 도 함께, 함께, 도 알려줘]
  active_view_resource_group:
    terms: [selected resource group, resource group selected, selected group, 선택한 리소스 그룹, 선택된 리소스 그룹, 보고 있는 그룹]
  unfiltered:
    terms: [what resources exist, what azure assets exist, resource inventory, inventory list, azure resources, azure inventory, managed resources, resources in managed scope, current managed resources, Azure 리소스 뭐 있어, Azure 인벤토리 목록, 관리 범위 리소스, 관리 범위의 리소스, 관리 범위에서, 현재 관리 범위 리소스, 현재 관리 범위에서]
query_kinds:
  scope_counts:
    terms: [resources and resource groups, resource and resource group counts, resource count and resource group count, total resource and resource-group counts, 리소스와 리소스 그룹 수, 리소스와 리소스 그룹 개수]
  count:
    terms: [how many, count, 몇 개, 개수]
  inventory_coverage:
    terms: [inventory types did you check, inventory types checked, skipped inventory types, failed inventory types, checked skipped or failed, checked skipped and failed-to-read groups, resource types were inspected omitted or unavailable, 확인한 인벤토리 유형, 건너뛴 인벤토리 유형, 읽기 실패한 인벤토리 유형]
  state_coverage:
    terms: [resource types with unavailable state, resource types whose state cannot be determined, types with unknown state, 상태를 확인할 수 없는 리소스 유형, 상태 확인 불가 리소스 유형, 상태 미확인 유형]
  types:
    terms: [resource type, resource types, types exist, inventory summary, which services, what services, by type, by types, by resource type, by resource types, 리소스 종류, 리소스 유형, 어떤 서비스, 종류별, 유형별, 유형 기준, 형식별, 인벤토리 요약]
  relationships:
    terms: [depend, dependency, attached, connected, relationship, 의존, 연결, 붙어, 관계]
groupings:
  resource_type:
    terms: [by type, by types, by resource type, by resource types, 종류별, 유형별, 형식별]
  status:
    terms: [separately, by status, 상태별, 상태 구분, 별도로, 구분해서]
  location:
    terms: [by location, by region, 위치별, 지역별]
projections:
  names:
    terms: [list names, show names, names only, name list, 이름만, 이름 목록, 이름을 보여줘, 이름으로 보여줘, 이름만 알려줘]
scopes:
  subscription:
    terms: [subscription, subscription wide, subscription scope, in subscription, in the subscription, from subscription, from the subscription, across subscription, across the subscription, entire subscription, whole subscription, 구독, 우리 구독, 우리구독, 구독 범위, 구독 전체, 전체 구독, 전체 구독 범위]
  active_view:
    terms: [this view, current view, this screen, current screen, this group, current group, this resource group, 현재 보기, 현재 화면, 지금 화면, 이 화면, 이 그룹, 이 리소스 그룹, 지금 보고 있는]
states:
  stopped:
    terms: [stopped, powered off, 중지, 중지된, 중지됨, 정지, 정지된]
    values: [stopped, deallocated]
    description: A current operational state in which a resource is powered off or stopped.
    examples: [powered-off virtual machines, 전원이 꺼진 가상 머신]
  deallocated:
    terms: [deallocated, allocation released, 할당 해제, 할당 해제된]
    values: [deallocated]
    description: A current state in which compute allocation has been released.
    examples: [virtual machines with released compute allocation, 컴퓨팅 할당이 해제된 가상 머신]
  inactive:
    terms: [not running, inactive, 멈춘, 멈춰 있는, 비활성, 실행 중이 아닌, 실행 중이 아니]
    values: [stopped, deallocated]
    description: A grouped current state for resources that are not running.
    examples: [resources that are not currently operating, 현재 동작하고 있지 않은 리소스]
    suppresses: [running]
    category_values:
      database: [stopped, deallocated, paused]
    preserve_categories: [database]
    labels: {en: Not running, ko: 실행 중 아님}
  not_ready:
    terms: [not ready, unready, 준비되지 않은, 준비 안 된]
    values: [failed, degraded, unavailable]
    description: A health state in which a resource is failed, degraded, or unavailable.
    examples: [services that are not ready to serve, 요청을 처리할 준비가 되지 않은 서비스]
    evidence_authority: subscription_health
    labels: {en: Not ready, ko: 준비되지 않음}
  paused:
    terms: [paused, suspended, 일시 정지, 일시정지]
    values: [paused]
    description: A current state in which processing is intentionally suspended.
    examples: [databases with processing temporarily suspended, 처리가 잠시 중단된 데이터베이스]
  running:
    terms: [running, active, 실행 중, 실행중, 가동 중, 켜짐, 켜진, 켜져, 켜져서, 켜져 있는, 켜져있는, 돌아가고 있는, 돌아가는, 살아있는, 살아 있는]
    values: [running]
    description: A current operational state in which a resource is powered on and processing work.
    examples: [virtual machines currently serving workloads, 지금 켜져서 작업 중인 가상 머신]
  failed:
    terms: [failed, failure, failures, 실패, 실패한]
    values: [failed]
    description: A state in which the resource or operation has failed.
    examples: [resources in a failed state, 실패 상태인 리소스]
    labels: {en: Failed, ko: 실패}
  degraded:
    terms: [degraded, 성능 저하, 저하된]
    values: [degraded]
    description: A health state in which service remains available with reduced capability.
    examples: [services operating with reduced capability, 성능이 저하된 상태로 동작하는 서비스]
    evidence_authority: subscription_health
    labels: {en: Degraded, ko: 성능 저하}
  unavailable:
    terms: [unavailable, cache is down, 사용할 수 없는, 사용 불가, 사용 불가능]
    values: [unavailable]
    description: A health state in which the resource cannot provide its service.
    examples: [resources that cannot currently serve requests, 현재 요청을 처리할 수 없는 리소스]
    evidence_authority: subscription_health
    labels: {en: Unavailable, ko: 사용 불가}
  unhealthy:
    terms: [unhealthy, abnormal, 비정상, 비정상 상태]
    values: [stopped, failed, degraded, unavailable, unknown]
    description: A broad grouped state for resources that are not demonstrably healthy.
    examples: [resources showing an abnormal condition, 비정상 징후를 보이는 리소스]
    labels: {en: Unhealthy, ko: 비정상}
operations:
  start:
    terms: [started, 시작된]
    values: [start]
    description: A historical transition or operation that starts a resource.
    examples: [virtual machines started during the last day, 지난 하루 동안 시작된 가상 머신]
  stop:
    terms: [stopped, powered off, deallocated, 중지된, 정지된]
    values: [stop, deallocate, power off]
    description: A historical transition or operation that stops or deallocates a resource.
    examples: [resources stopped during the selected period, 선택한 기간에 중지된 리소스]
  delete:
    terms: [deleted, removed, 삭제된, 제거된]
    values: [delete]
    description: A historical operation that removes a resource.
    examples: [resources deleted during the last week, 지난 일주일 동안 삭제된 리소스]
  write:
    terms: [changed, created, updated, modified, 변경된, 생성된, 수정된, 갱신된]
    values: [write]
    description: A historical operation that creates or modifies a resource.
    examples: [resources changed during the selected period, 선택한 기간에 변경된 리소스]
time_units:
  hour:
    terms: [hour, hours, 시간]
    multiplier_seconds: 3600
  day:
    terms: [day, days, 일]
    multiplier_seconds: 86400
  week:
    terms: [week, weeks, 주]
    multiplier_seconds: 604800
