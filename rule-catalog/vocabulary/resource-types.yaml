# Canonical CSP-neutral `resource_type` vocabulary.
#
# Every entry is a stable, CSP-neutral identifier used across the ontology
# (`Resource.type`, `Rule.resource_type`, `applies_to` links, and provider
# adapter dispatch). The list is deliberately conservative for P1 - it
# covers the resource types the initial rule set for the three verticals
# (Resilience, Change Safety, Cost Governance) references. New types are
# added via a governance PR (see `docs/roadmap/rules-and-detection/rule-catalog-collection.md`).
#
# Fields
#   id             kebab-case identifier (this string is what rules quote)
#   category       high-level grouping used only for docs / dashboards
#   description    one-line human summary
#   azure_arm_type Azure Resource Manager type path the provider adapter
#                  maps to. `null` when the type has no direct Azure
#                  counterpart at this level of abstraction (a fork adapter
#                  will render the mapping - the vocabulary stays neutral).
#   typical_parents typical `contains` parents in the resource graph
#                   ([llm-strategy.md § Ontology Foundation]). Informational
#                   for authors; the runtime graph is populated by the
#                   inventory adapter, not by this list.
#
# All values are English, secret-free, and customer-agnostic.
schema_version: "1.0.0"
version: "0.2.0"
types:
  # ── compute ───────────────────────────────────────────────────────────
  - id: compute.vm
    category: compute
    description: Long-running virtual machine.
    azure_arm_type: Microsoft.Compute/virtualMachines
    typical_parents: [resource-group]
  - id: compute.vm-scale-set
    category: compute
    description: Managed group of identical VMs; the unit `scale` operates on.
    azure_arm_type: Microsoft.Compute/virtualMachineScaleSets
    typical_parents: [resource-group]
  - id: compute.container-app
    category: compute
    description: Serverless container running an OCI image + Knative-compatible manifest subset.
    azure_arm_type: Microsoft.App/containerApps
    typical_parents: [resource-group]
  - id: compute.container-app-job
    category: compute
    description: Bounded serverless container job triggered on demand or by schedule.
    azure_arm_type: Microsoft.App/jobs
    typical_parents: [compute.container-app-environment]
  - id: compute.container-app-environment
    category: compute
    description: Shared runtime and network boundary for serverless container apps and jobs.
    azure_arm_type: Microsoft.App/managedEnvironments
    typical_parents: [resource-group]
  - id: compute.function
    category: compute
    description: Function-as-a-service unit; single event trigger.
    azure_arm_type: Microsoft.Web/sites
    typical_parents: [resource-group]
  - id: app-service-plan
    category: compute
    description: Shared compute plan that hosts web and function applications.
    azure_arm_type: Microsoft.Web/serverFarms
    typical_parents: [resource-group]
  - id: static-web-app
    category: compute
    description: Managed static web application and edge delivery surface.
    azure_arm_type: Microsoft.Web/staticSites
    typical_parents: [resource-group]
  - id: kubernetes-cluster
    category: compute
    description: Managed Kubernetes control plane.
    azure_arm_type: Microsoft.ContainerService/managedClusters
    typical_parents: [resource-group]
  - id: kubernetes-node-pool
    category: compute
    description: A pool of worker nodes attached to a kubernetes-cluster.
    azure_arm_type: Microsoft.ContainerService/managedClusters/agentPools
    typical_parents: [kubernetes-cluster]

  # ── networking ────────────────────────────────────────────────────────
  - id: network.vnet
    category: network
    description: Virtual network address space.
    azure_arm_type: Microsoft.Network/virtualNetworks
    typical_parents: [resource-group]
  - id: network.subnet
    category: network
    description: Address range inside a vnet.
    azure_arm_type: Microsoft.Network/virtualNetworks/subnets
    typical_parents: [network.vnet]
  - id: network.nsg
    category: network
    description: Network security group (stateful L4 firewall rules).
    azure_arm_type: Microsoft.Network/networkSecurityGroups
    typical_parents: [resource-group]
  - id: network.interface
    category: network
    description: Virtual network interface attached to compute or private-link resources.
    azure_arm_type: Microsoft.Network/networkInterfaces
    typical_parents: [resource-group]
  - id: network.private-endpoint
    category: network
    description: Private link into a target resource (attaches via `attached_to`).
    azure_arm_type: Microsoft.Network/privateEndpoints
    typical_parents: [resource-group]
  - id: network.load-balancer
    category: network
    description: L4 load balancer (public or internal).
    azure_arm_type: Microsoft.Network/loadBalancers
    typical_parents: [resource-group]
  - id: network.application-gateway
    category: network
    description: Layer-7 application gateway with backend pools and health probes.
    azure_arm_type: Microsoft.Network/applicationGateways
    typical_parents: [resource-group]
  - id: api-gateway
    category: network
    description: Managed API gateway and policy enforcement surface.
    azure_arm_type: Microsoft.ApiManagement/service
    typical_parents: [resource-group]
  - id: network.dns-zone
    category: network
    description: DNS zone (public or private).
    azure_arm_type: Microsoft.Network/dnsZones
    typical_parents: [resource-group]
  - id: network.public-ip
    category: network
    description: Public IP address; typically attached to a load-balancer, NIC, or NAT gateway.
    azure_arm_type: Microsoft.Network/publicIPAddresses
    typical_parents: [resource-group]
  - id: network.nat-gateway
    category: network
    description: Managed outbound network address translation gateway.
    azure_arm_type: Microsoft.Network/natGateways
    typical_parents: [resource-group]
  - id: network.private-dns-zone
    category: network
    description: Private DNS namespace visible through linked virtual networks.
    azure_arm_type: Microsoft.Network/privateDnsZones
    typical_parents: [resource-group]
  - id: network.private-dns-zone-link
    category: network
    description: Binding between a private DNS zone and a virtual network.
    azure_arm_type: Microsoft.Network/privateDnsZones/virtualNetworkLinks
    typical_parents: [network.private-dns-zone]
  - id: network.dns-resolver
    category: network
    description: Managed recursive DNS resolver attached to a virtual network.
    azure_arm_type: Microsoft.Network/dnsResolvers
    typical_parents: [resource-group]
  - id: network.dns-resolver-inbound-endpoint
    category: network
    description: Inbound endpoint that exposes a managed DNS resolver to a virtual network.
    azure_arm_type: Microsoft.Network/dnsResolvers/inboundEndpoints
    typical_parents: [network.dns-resolver]
  - id: network.virtual-network-gateway
    category: network
    description: VPN or ExpressRoute gateway attached to a virtual network.
    azure_arm_type: Microsoft.Network/virtualNetworkGateways
    typical_parents: [resource-group]
  - id: diagnostic-settings
    category: observability
    description: Binding routing platform logs / metrics of a target to a log-workspace.
    azure_arm_type: Microsoft.Insights/diagnosticSettings
    typical_parents: [resource-group]

  # ── storage ──────────────────────────────────────────────────────────
  - id: object-storage
    category: storage
    description: Object / blob storage account.
    azure_arm_type: Microsoft.Storage/storageAccounts
    typical_parents: [resource-group]
  - id: container-registry
    category: storage
    description: Registry for OCI container images and related artifacts.
    azure_arm_type: Microsoft.ContainerRegistry/registries
    typical_parents: [resource-group]
  - id: file-share
    category: storage
    description: Network file share.
    azure_arm_type: Microsoft.Storage/storageAccounts/fileServices/shares
    typical_parents: [object-storage]
  - id: disk
    category: storage
    description: Block-storage disk attached to a compute resource.
    azure_arm_type: Microsoft.Compute/disks
    typical_parents: [resource-group]

  # ── databases ────────────────────────────────────────────────────────
  - id: sql-database
    category: database
    description: SQL-family database engine (T-SQL family). Azure=Azure SQL / MI.
    azure_arm_type: Microsoft.Sql/servers/databases
    typical_parents: [resource-group]
  - id: postgresql-server
    category: database
    description: PostgreSQL engine (Flexible / Single).
    azure_arm_type: Microsoft.DBforPostgreSQL/flexibleServers
    typical_parents: [resource-group]
  - id: mysql-server
    category: database
    description: MySQL-family managed database engine.
    azure_arm_type: Microsoft.DBforMySQL/flexibleServers
    typical_parents: [resource-group]
  - id: nosql-database
    category: database
    description: Document / KV NoSQL engine (Cosmos DB SQL API, DynamoDB, Firestore).
    azure_arm_type: Microsoft.DocumentDB/databaseAccounts
    typical_parents: [resource-group]
  - id: cache
    category: database
    description: In-memory cache (Redis, Memcached).
    azure_arm_type: Microsoft.Cache/redis
    typical_parents: [resource-group]
  - id: redis-enterprise
    category: database
    description: Enterprise managed Redis-compatible cache and data service.
    azure_arm_type: Microsoft.Cache/redisEnterprise
    typical_parents: [resource-group]

  # ── security / identity ──────────────────────────────────────────────
  - id: secret-store
    category: security
    description: Managed secret / key store (Key Vault, Secrets Manager, Secret Manager).
    azure_arm_type: Microsoft.KeyVault/vaults
    typical_parents: [resource-group]
  - id: managed-identity
    category: security
    description: User-assigned or system-assigned workload identity.
    azure_arm_type: Microsoft.ManagedIdentity/userAssignedIdentities
    typical_parents: [resource-group]
  - id: certificate
    category: security
    description: TLS or code-signing certificate managed by a secret-store.
    azure_arm_type: Microsoft.KeyVault/vaults/certificates
    typical_parents: [secret-store]

  # ── observability ────────────────────────────────────────────────────
  - id: log-workspace
    category: observability
    description: Centralized log analytics workspace (Log Analytics, CloudWatch, Cloud Logging).
    azure_arm_type: Microsoft.OperationalInsights/workspaces
    typical_parents: [resource-group]
  - id: metrics-workspace
    category: observability
    description: Prometheus-style metrics workspace bound to a log-workspace.
    azure_arm_type: Microsoft.Monitor/accounts
    typical_parents: [resource-group]
  - id: application-insights
    category: observability
    description: Application performance and distributed telemetry resource.
    azure_arm_type: Microsoft.Insights/components
    typical_parents: [resource-group]
  - id: llm-endpoint
    category: compute
    description: Managed language-model inference endpoint with quota and rate limits.
    azure_arm_type: Microsoft.CognitiveServices/accounts
    typical_parents: [resource-group]
  - id: event-hub
    category: compute
    description: Managed event-streaming namespace used for durable message ingress and delivery.
    azure_arm_type: Microsoft.EventHub/namespaces
    typical_parents: [resource-group]
  - id: event-grid-topic
    category: compute
    description: Managed topic that forwards provider resource-change events.
    azure_arm_type: Microsoft.EventGrid/systemTopics
    typical_parents: [resource-group]
  - id: communication-service
    category: compute
    description: Managed communication API resource for operator notifications.
    azure_arm_type: Microsoft.Communication/CommunicationServices
    typical_parents: [resource-group]
  - id: email-service
    category: compute
    description: Managed email delivery resource for operator notifications.
    azure_arm_type: Microsoft.Communication/EmailServices
    typical_parents: [resource-group]
  - id: email-domain
    category: compute
    description: Sender domain attached to a managed email service.
    azure_arm_type: Microsoft.Communication/EmailServices/Domains
    typical_parents: [email-service]

  # ── governance / scope ───────────────────────────────────────────────
  - id: resource-group
    category: governance
    description: Logical grouping of resources under one lifecycle. Root of the `contains` chain from `subscription`.
    azure_arm_type: Microsoft.Resources/resourceGroups
    typical_parents: [subscription]
  - id: subscription
    category: governance
    description: Billing / RBAC boundary containing many resource-groups.
    azure_arm_type: Microsoft.Resources/subscriptions
    typical_parents: []
