schema_version: 1.0.0
name: ChangeSummary
version: 1.0.0
key: id
description: A document projecting resource change events observed within a bounded
  time window over a resource scope.
properties:
  id:
    type: string
    required: true
    description: Idempotent report id derived from (scope_ref, window_start, window_end);
      retries MUST reuse it.
  scope_ref:
    type: string
    required: true
    description: CSP-neutral identifier of the resource whose subtree the summary
      covers (typically a resource-group ref).
  window_start:
    type: datetime
    required: true
    description: RFC 3339 UTC timestamp; the earliest change event included in the
      summary.
  window_end:
    type: datetime
    required: true
    description: RFC 3339 UTC timestamp; the latest change event included in the summary
      (exclusive).
  generated_at:
    type: datetime
    required: true
    description: RFC 3339 UTC timestamp when the executor produced the report.
  resource_count:
    type: integer
    required: true
    description: Number of distinct Resource instances that changed within the window.
  change_count:
    type: integer
    required: true
    description: Total number of change events aggregated into the summary.
  format:
    type: string
    required: true
    description: Rendered output format; the reference template ships "markdown".
  delivery_ref:
    type: string
    required: false
    description: External reference (PR url, page id, ticket id) once the delivery
      adapter publishes the report.
