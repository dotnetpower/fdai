schema_version: 1.0.0
name: ImpactEnvelope
version: 1.0.0
key: id
description: Approved upper bound for the targets, duration, objectives, and telemetry
  of one intervention.
properties:
  id:
    type: string
    required: true
  decision_case_id:
    type: string
    required: true
  graph_revision:
    type: string
    required: true
  target_set_digest:
    type: string
    required: true
  affected_set_digest:
    type: string
    required: true
  max_affected_resources:
    type: integer
    required: true
  max_dependency_depth:
    type: integer
    required: true
  max_duration_seconds:
    type: integer
    required: true
  objective_bounds:
    type: object
    required: true
  required_signals:
    type: array
    required: true
  forbidden_signals:
    type: array
    required: true
  telemetry_requirements:
    type: object
    required: true
  uncertainty:
    type: number
    required: true
  expires_at:
    type: datetime
    required: true
lifecycle:
