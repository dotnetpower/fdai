schema_version: 1.0.0
name: AdvisorScopeConfig
version: 1.0.0
key: id
description: Scope inclusion/exclusion and deterministic rule threshold configuration (including VM/VMSS right-sizing CPU thresholds and RI/Savings Plan parameters).
properties:
  id:
    type: string
    required: true
  excluded_resource_groups:
    type: array
    required: true
  excluded_subscriptions:
    type: array
    required: true
  low_cpu_threshold_p95:
    type: integer
    required: true
    description: Low CPU utilization P95 percentage threshold for VM/VMSS right-sizing (5, 10, 15, or 20).
  lookback_days:
    type: integer
    required: true
    description: Telemetry lookback window in days (7, 14, 30, or 60).
  ri_term:
    type: string
    required: true
    description: Default Reserved Instance / Savings Plan commitment term (P1Y or P3Y).
  min_monthly_savings_usd:
    type: number
    required: true
    description: Minimum monthly savings cutoff to suppress low-value noise.
  environment_profile:
    type: string
    required: true
    description: Evaluation strictness profile (balanced, prod_strict, dev_cost_first).
  updated_at:
    type: datetime
    required: true
