schema_version: 1.0.0
name: AdvisorScoreSnapshot
version: 1.0.0
key: id
description: Point-in-time Well-Architected Advisor posture score across overall and five pillars with explicit not-measured fidelity.
properties:
  id:
    type: string
    required: true
  scope_key:
    type: string
    required: true
    description: Evaluated scope identifier (all, subscription, resource_group, workload).
  formula_version:
    type: string
    required: true
    description: Deterministic scoring formula version identifier.
  overall_score_pct:
    type: number
    required: false
    description: Weighted overall Advisor score (0-100); omitted when no pillars are measured.
  pillar_scores:
    type: object
    required: true
    description: Map of cost, security, reliability, operational_excellence, performance score objects and measurement state.
  evaluated_resources:
    type: integer
    required: true
  active_recommendations:
    type: integer
    required: true
  recorded_at:
    type: datetime
    required: true
