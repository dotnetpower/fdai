schema_version: 1.0.0
name: Resource
version: 1.1.0
key: id
description: A target under governance; typically a CSP resource populated by the
  inventory adapter.
query_terms:
- resource
- resources
- 리소스
properties:
  id:
    type: string
    required: true
    description: Stable, opaque identifier assigned by the inventory adapter (CSP-neutral).
  type:
    type: string
    required: true
    description: Resource subtype id from rule-catalog/vocabulary/resource-types.yaml
      (e.g. object-storage, kubernetes-cluster).
  name:
    type: string
    required: false
    description: Human-readable name emitted by the source system; never a customer-identifying
      value in tests or fixtures.
  parent_id:
    type: string
    required: false
    description: Optional parent Resource id used by the `contains` link (subscription
      -> resource-group -> resource).
  location:
    type: string
    required: false
    description: Provider-reported region code of the resource, such as koreacentral,
      or global for a resource without a region; lifted from the adapter property
      bag so it can be read and filtered against the reviewed region vocabulary.
  properties:
    type: object
    required: false
    description: Open-shape bag of adapter-projected resource properties consumed
      by policy-as-code (Rego) and the assurance twin.
