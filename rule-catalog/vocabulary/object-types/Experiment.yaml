schema_version: 1.0.0
name: Experiment
version: 1.0.0
key: id
description: Bounded chaos or validation intervention proposed for governed execution.
properties:
  id:
    type: string
    required: true
  scenario_id:
    type: string
    required: true
  scenario_version:
    type: string
    required: true
  fault_type:
    type: string
    required: true
  target_set_digest:
    type: string
    required: true
  expected_signal:
    type: string
    required: true
  duration_seconds:
    type: integer
    required: true
  status:
    type: string
    required: true
  proposed_at:
    type: datetime
    required: true
lifecycle:
  owner: Loki
  creation:
  - code: bounded_experiment_proposal
    when: A catalog scenario resolves explicit targets and expected evidence.
    result: Create an inert experiment proposal.
    source_refs:
