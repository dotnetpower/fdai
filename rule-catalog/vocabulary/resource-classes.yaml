    description: Resource that collects, evaluates, or routes operational evidence.
    members:
      - action-group
      - activity-log-alert
      - alert-rule
      - anomaly-alert-rule
      - application-insights
      - data-collection-endpoint
      - data-collection-rule
      - diagnostic-settings
      - log-workspace
      - managed-sre-agent
      - metric-alert-rule
      - metrics-workspace
      - observability.dashboard
      - observability.dashboard-service
      - observability.network-monitor
      - observability.network-flow-log
      - observability.query-pack
      - observability.solution
      - observability.traffic-collector
      - observability.workbook
      - prometheus-rule-group
      - service-bus-namespace
    specializes: [class.resource]
  - id: class.security-resource
    description: Resource that provides identity, authorization, certificate, or secret controls.
    members:
      - authorization.role-assignment
      - certificate
      - directory.managed-domain
      - managed-certificate
      - managed-identity
      - secret-store
      - ssh-public-key
    specializes: [class.resource]
  - id: class.storage-resource
    description: Resource that retains images, objects, files, disks, or snapshots.
    members:
      - container-registry
      - application-configuration
      - backup-vault
      - compute.gallery-image
      - compute.gallery-image-version
      - compute.image
      - compute.image-gallery
      - disk
      - disk-snapshot
      - file-share
      - file-volume
      - ml-model-registry
      - object-storage
      - storage.file-account
      - storage.file-capacity-pool
      - kubernetes.persistent-volume
      - kubernetes.persistent-volume-claim
      - kubernetes.storage-class
    specializes: [class.resource]
  - id: class.workload
    description: Resource that runs application work.
    specializes: [class.resource]
  - id: class.compute-workload
    description: Compute-hosted application workload.
    members:
      - compute.vm
      - compute.app-slot
      - compute.vm-scale-set
      - compute.container-app
      - compute.function
      - compute.web-app
      - kubernetes-cluster
      - stream-analytics-job
    specializes: [class.compute-resource, class.workload]
  - id: class.network-endpoint
    description: Network endpoint with an independently observed resource identity.
    members:
      - network.interface
      - network.private-endpoint
      - network.public-ip
    specializes: [class.network-resource]
