      - network.private-access-scope
      - network.private-circuit
      - network.private-circuit-gateway
      - network.private-dns-zone
      - network.private-dns-zone-group
      - network.private-dns-zone-link
      - network.private-peering-port
      - network.route-table
      - network.registered-domain
      - network.subnet
      - network.dns-routing-profile
      - network.site-vpn-gateway
      - network.user-vpn-gateway
      - network.virtual-hub
      - network.virtual-network-gateway
      - network.virtual-router
      - network.vnet
      - network.vpn-site
