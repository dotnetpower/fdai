      - ml-workspace
      - realtime-messaging-service
      - static-web-app
      - web-search-service
      - workflow.api-connection
      - workflow.logic-app
    specializes: [class.resource]
  - id: class.database-resource
    description: Resource that stores or serves structured operational data.
    members:
      - cache
      - database.dedicated-infrastructure
      - database.vm-cluster
      - mysql-server
      - nosql-database
      - postgresql-server
      - redis-enterprise
      - search-service
      - sql-database
      - sql-managed-instance
      - sql-server
    specializes: [class.resource]
  - id: class.governance-resource
    description: Resource that defines provider scope or preserves an unsupported provider identity.
    members:
      - devops-account
      - resource-group
      - subscription
      - unclassified-resource
    specializes: [class.resource]
  - id: class.network-resource
    description: Resource that provides network topology, policy, routing, or connectivity.
    members:
      - api-gateway
      - network.application-gateway
      - network.bastion-host
      - network.cdn-origin-group
      - network.cdn-profile
      - network.connection
      - network.ddos-protection-plan
      - network.dns-resolver
      - network.dns-resolver-inbound-endpoint
      - network.dns-zone
      - network.firewall
      - network.firewall-policy
      - network.load-balancer
      - network.nat-gateway
