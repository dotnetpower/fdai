    description: Resource that supplies compute, hosting, integration, or runtime capacity.
    members:
      - ai-project
      - analytics.workspace
      - app-service-plan
      - automation-account
      - bot-service
      - communication-service
      - compute.container-app-environment
      - compute.container-app-job
      - compute.batch-account
      - compute.desktop-host-pool
      - compute.desktop-scaling-plan
      - compute.image-template
      - compute.private-virtualization-cloud
      - compute.vm-extension
      - compute.vm-run-command
      - compute.vm-shutdown-schedule
      - email-domain
      - email-service
      - event-grid-topic
      - event-hub
      - event-topic
      - iot-hub
      - kubernetes-node-pool
      - kubernetes.cron-job
      - kubernetes.daemon-set
      - kubernetes.deployment
      - kubernetes.endpoints
      - kubernetes.job
      - kubernetes.horizontal-pod-autoscaler
      - kubernetes.limit-range
      - kubernetes.namespace
      - kubernetes.node
      - kubernetes.pod
      - kubernetes.pod-disruption-budget
      - kubernetes.replica-set
      - kubernetes.resource-quota
      - kubernetes.service
      - kubernetes.stateful-set
      - llm-endpoint
