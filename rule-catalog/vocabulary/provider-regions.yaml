# Reviewed provider-region value domain for `Resource.location`.
#
# `Resource.location` stores the provider's region code as the inventory adapter
# reports it, such as koreacentral, or `global` for a resource without a region.
# A question that states a region is grounded by closed choice against this
# complete list, so a planner never invents a region operand. Display names are
# context for the choosing model, never a lookup table.
#
# Source: the public Azure physical region list (`az account list-locations`,
# regionType Physical) on 2026-09-30, plus `global`. Region codes are public
# provider metadata, not tenant data. Add a region through a governance PR.
schema_version: "1.0.0"
version: "1.0.0"
provider: azure
