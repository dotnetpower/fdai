schema_version: "1.0.0"
definitions:
  - concept_id: database.mysql.active_connections
    provider_metric: active_connections
    canonical_unit: count
    aggregation: maximum
    description: Maximum active MySQL client connections observed in the bounded window.
    monotonic: false
  - concept_id: database.mysql.cpu.utilization_pct
    provider_metric: cpu_percent
    canonical_unit: percent
    aggregation: average
    description: MySQL Flexible Server host CPU utilization percentage in the bounded window.
    monotonic: false
  - concept_id: database.mysql.query.count
    provider_metric: Queries
    canonical_unit: count
    aggregation: sum
    description: MySQL statements executed in the bounded window.
    monotonic: true
  - concept_id: database.mysql.slow_query.count
    provider_metric: Slow_queries
    canonical_unit: count
    aggregation: sum
    description: MySQL statements exceeding the configured long query threshold in the bounded window.
    monotonic: true
  - concept_id: dependency.latency
    provider_metric: dependency_duration_ms
    canonical_unit: ms
    aggregation: average
    description: Duration of dependency spans attributed to the bounded workload target.
    monotonic: false
  - concept_id: deployment.change
    provider_metric: fdai.change.event
    canonical_unit: count
    aggregation: count
    description: Observed deployment or configuration change events in the bounded window.
    monotonic: false
  - concept_id: network.change
    provider_metric: fdai.network.change.event
    canonical_unit: count
    aggregation: count
    description: Observed network-topology change events in the bounded window.
    monotonic: false
  - concept_id: pod.restart.history
    provider_metric: k8s.pod.restarts
    canonical_unit: count
    aggregation: sum
    description: Restart-count increase observed for one immutable Kubernetes Pod UID in the bounded window.
    monotonic: true
    scope_label_selectors:
      resource_id: [properties, properties, cluster_ref]
      pod_uid: [properties, properties, uid]
  - concept_id: request.errors
    provider_metric: http.server.request.error.count
    canonical_unit: count
    aggregation: sum
    description: Completed server requests classified as errors in the bounded window.
    monotonic: true
  - concept_id: request.timeout
    provider_metric: container_app_resiliency_request_timeouts
    canonical_unit: count
    aggregation: sum
    description: Requests that timed out while waiting for a response in the bounded window.
    monotonic: true
  - concept_id: request.volume
    provider_metric: http.server.request.count
    canonical_unit: count
    aggregation: sum
    description: Completed server requests in the bounded window.
    monotonic: true
  - concept_id: resource.cpu.utilization_pct
    provider_metric: host.cpu.percent
    canonical_unit: percent
    aggregation: average
    description: Guest operating-system CPU utilization percentage for one bounded compute resource.
    monotonic: false
  - concept_id: resource.saturation
    provider_metric: container_app_cpu_nanocores
    canonical_unit: nanocores
    aggregation: average
    description: CPU consumption of the bounded runtime resource.
    monotonic: false
  - concept_id: resource.activation.failure
    provider_metric: container_app_activation_failure_count
    canonical_unit: count
    aggregation: sum
    description: Container activation failures observed for the bounded runtime resource.
    monotonic: true
  - concept_id: resource.memory.available_pct
    provider_metric: host.memory.available_pct
    canonical_unit: percent
    aggregation: average
    description: Available host memory percentage for the bounded runtime resource.
    monotonic: false
  - concept_id: resource.memory.usage_pct
    provider_metric: container_app_memory_percentage
    canonical_unit: percent
    aggregation: average
    description: Percentage of the memory limit used by the bounded runtime resource.
    monotonic: false
  - concept_id: service.latency
    provider_metric: service_request_duration_ms
    canonical_unit: ms
    aggregation: average
    description: Duration of service request spans attributed to the bounded service target.
    monotonic: false
  - concept_id: storage.write.success
    provider_metric: storage.write.success.count
    canonical_unit: count
    aggregation: sum
    description: Successful storage write operations in the bounded window.
    monotonic: true
