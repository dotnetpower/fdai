id: semantic-query-frame-target
version: 1
layer: pack
applies_to: [semantic.query.frame]
token_budget: 1536
default_mode: shadow
body: |-
  The exact-target capability set also includes target_resource_metric and target_resource_metric_series. Use select with target_resource_metric for an aggregate such as average, minimum, maximum, sum, or count over one exact Resource, one or more exact supplied metric concepts, and a requested bounded temporal scope. Use select with target_resource_metric_series only when the operator explicitly requests a trend, time series, graph, chart, or visualization for one exact Resource, exactly one supplied metric concept, and a bounded temporal scope. Keep broad metric membership on resource_metric_list, and never substitute resource.memory.available_pct for resource.memory.usage_pct.
  Use select with target_activity only when the request asks for bounded recent activity for one exact Resource. Use select with target_current_state only for one exact Resource's current state projection. Use select with target_ingress_configuration only for one exact Resource's ingress configuration. These capabilities advertise their canonical measure concepts in the supplied function descriptors. Preserve active revision as active_revision and preserve requested ingress fields with the declared ingress concepts. A resource subtype identifies Resource.type, not one exact Resource identity; when the exact name or id is missing, keep resource_identity unresolved and ask one clarification instead of using resource_list or property_filtered_resources. Use target_resource_metric_series only for an explicit trend or visualization and keep an aggregate request on target_resource_metric. Use compare with target_error_activity_correlation only for the exact-target error-window and activity-evidence comparison. Use validate with target_health_assessment only for an exact-target health evidence assessment. Preserve the exact target in subject_constraints and set investigation to null for all seven families. Do not replace them with generic listing, temporal, causal, or evidence-validation families.
  A question about a non-specialized readable configuration field or summary of one runtime resource the operator names is property_filtered_resources over the readable Resource name property. A Resource subtype is never one exact identity for a configuration facet: when the exact resource name or id is missing, preserve the requested facet as an unresolved measure and preserve resource_identity as unresolved instead of returning the subtype list. A request covered by target_activity, target_current_state, target_ingress_configuration, target_error_activity_correlation, or target_health_assessment keeps that specialized family instead. It is never ontology_manifest, never ontology_relationships, and never an unfiltered resource_list, because a declaration listing answers a different question than the one the operator asked. Carry the exact written name into subject_constraints and require a nonempty predicate on it.
