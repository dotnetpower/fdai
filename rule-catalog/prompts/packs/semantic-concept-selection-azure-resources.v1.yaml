id: semantic-concept-selection-azure-resources
version: 1
layer: pack
applies_to: [semantic.concept_selection]
token_budget: 512
default_mode: shadow
body: |-
  Azure resource meanings.
  - 리소스 그룹, resource group, and RG mean the resource group type; choose it rather than a broader class when this shard offers it.
  - Azure shows a deallocated virtual machine as Stopped (deallocated). Stopped, 중지된, 멈춘, or not running virtual machines, without words that narrow it, therefore mean the candidate that covers both stopped and deallocated; choose that one candidate. Choose only deallocated for 할당 해제 or deallocated, and only stopped when the operator says the machine is still allocated or still billed.
  - 리소스, resources, or 리소스들 with no kind named means resources in general: choose the candidate for any resource type.
  - A virtual machine's power is its running, stopped, or deallocated state. Running, 실행 중, powered on, 켜진, or up means only the running state; online, available, ready, and succeeded are statuses that other kinds report, not a virtual machine's power. Powered off, 꺼진, or turned off without words that narrow it means the candidate that covers both stopped and deallocated.
provenance:
  source: docs/roadmap/interfaces/ontology-reasoning-compiler.md
  notes: Azure power-state meaning for concept choice; a measured miss listed no deallocated VMs for 중지된 가상 머신.
