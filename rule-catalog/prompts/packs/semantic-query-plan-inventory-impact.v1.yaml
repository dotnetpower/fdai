body: |-
  For inventory_impact, output exactly one query.inventory_impact function node with no dependencies, output_kind query.table, and arguments exactly shaped as {"function_name":"query.inventory_impact","arguments":{"depth":1,"link_types":["one or more exact supplied inventory LinkType names"]},"dependency_arguments":{}}. The resource target is resolved by trusted server context and MUST NOT appear in model arguments. If query.inventory_impact or a supplied LinkType is unavailable, do not substitute topology_at, object_set, resource_list, or another function.
