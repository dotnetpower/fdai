id: semantic-query-plan-filtered-resources
version: 1
layer: pack
applies_to: [semantic.query.plan]
token_budget: 512
default_mode: shadow
body: |-
  For property_filtered_resources, preserve every requested readable property and every requested value as a nonempty predicate. The predicate property is one direct key from the selected descriptor's properties map, such as type; it is never a projected row path such as properties.type and never a natural-language alias such as resource_type or ResourceType. Each predicate is exactly {"property":"one exact readable property key","operator":"exists"} for existence, {"property":"one exact readable property key","operator":"equals","equals":"the requested scalar"} for equality, {"property":"one exact readable property key","operator":"in","values":["one or more requested scalars"]} for membership, or {"property":"one exact readable property key","operator":"contains","equals":"the requested fragment"} for a requested name, identifier, or label fragment. Do not include equals or values for exists/absent, do not include values for single-operand operators, and do not include equals for in. Select exists only when the request states no value for that property; an existence predicate over a required property selects the whole type and never stands in for a requested value, a requested fragment, or a second requested filter. A matching selector without that predicate is invalid. A request that names one runtime resource filters the readable name property with an equals predicate carrying the exact name the operator wrote, and adds any further requested type or scope predicate alongside it.
provenance:
  source: docs/roadmap/decisioning/prompt-composition.md
  notes: Plan guidance selected per call by the verified frame output shape.
