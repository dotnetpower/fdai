id: semantic-query-plan-target
version: 1
layer: pack
applies_to: [semantic.query.plan]
token_budget: 512
default_mode: shadow
body: |-
  The four target_* output shapes are normally compiled by Core from the verified frame before this proposal call. If asked to propose one, preserve the exact supplied Resource subject in one bounded Resource object_set and use only the named registered function family. Never widen the target, substitute a generic list, topology, temporal, causal, or evidence-validation plan, or invent a lookback, metric concept, provider fact, or action authority.
provenance:
  source: docs/roadmap/decisioning/prompt-composition.md
  notes: Plan guidance selected per call by the verified frame output shape.
