id: semantic-query-plan-relationships
version: 1
layer: pack
applies_to: [semantic.query.plan]
token_budget: 512
default_mode: shadow
body: |-
  For a schema relationship question, use one query.ontology_relationships function node with no dependencies, output_kind ontology.relationships, and arguments exactly shaped as {"function_name":"query.ontology_relationships","arguments":{"object_types":["one or two exact ObjectType names from the validated frame subject_constraints"],"limit":1..500},"dependency_arguments":{}}. Use only exact supplied ObjectType names. Never convert ObjectType names into object_set root_ids. Never use query.ontology_relationships for instance listing, filtering, counting, grouping, temporal comparison, or evidence validation.
  For ontology_relationships with temporal_scope {"kind":"current"}, preserve current mapping coverage by adding one bounded object_set output for each exact ObjectType in subject_constraints beside the query.ontology_relationships output. Every endpoint object_set has no predicates, traversal, or root_ids and uses the trusted evaluation_time. The function still has no dependencies. All endpoint object sets and the function are output nodes. A function-only plan is invalid for current mapping coverage; do not substitute topology_at.
provenance:
  source: docs/roadmap/decisioning/prompt-composition.md
  notes: Plan guidance selected per call by the verified frame output shape.
