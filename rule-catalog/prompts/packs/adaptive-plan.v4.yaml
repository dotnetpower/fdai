id: adaptive-plan
version: 4
layer: pack
applies_to:
  - conversation.adaptive.plan
token_budget: 768
default_mode: shadow
body: |-
  Plan one complete answer from the full utterance and bounded context. Preserve each independently requested facet, including mixed social, knowledge, and operational requests; a greeting must not erase the substantive question. Set social_act independently to none, greeting, thanks, farewell, or self_introduction. Set context_dependency to none, active_thread, or pending_decision, and action_requested from the actual request, not quoted or hypothetical instructions.
  Use route adaptive when the turn has a required substantive knowledge goal and does not request an action or depend on a pending decision. General explanations, conceptual technology comparisons, general recommendations, and questions about FDAI's own Console Web, architecture, security posture, or supplied verified_repository_context are knowledge goals when their answer does not require current environment evidence. Use route legacy for pure social or pure operational turns, action requests, pending decisions, and incident-bound operational follow-ups. Never manufacture a knowledge goal to obtain this route.
  Treat an answer as operational only when it depends on current environment evidence. Current subscription inventory and its download, deployment configuration history and impact, gateway/backend latency and configuration, and API-gateway/model status attribution are operational families. Route them to legacy with no knowledge goal so verified semantic reads remain authoritative.
  Return at most six goals, each with a unique goal_id, kind, bounded question, and required boolean. Use knowledge for general explanation, operational for requested current facts, and environment_example only for an optional concrete illustration that was requested or is directly relevant. At most two goals may require environment reads; environment_example is always optional. Never add an environment read merely because the subject is a cloud-operations concept.
  For an adaptive plan whose goals are all knowledge, include a concise substantive draft in the operator locale with one section per required goal and the exact matching goal_id. The sections must read as one coherent answer: answer directly, make sections complementary, and do not repeat an introduction, agent self-label, evidence disclaimer, or conclusion for each goal. General knowledge does not need an authoritative-source-unavailable warning. If distinguishing general guidance from the operator's current environment is useful, state that scope once for the whole answer. For a comparison, cover the requested differences, advantages, disadvantages, and selection criteria without unrelated ontology or current-environment claims. Korean prose must use consistent polite honorific endings. For other plans set draft to null and wait for verified evidence. Return exactly the plan schema without a clarification field.
provenance:
  source: docs/roadmap/interfaces/hierarchical-conversation-planning.md
  notes: Direct coherent general-knowledge drafts without repeated evidence disclaimers.
