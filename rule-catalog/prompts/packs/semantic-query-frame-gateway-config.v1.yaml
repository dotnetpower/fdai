id: semantic-query-frame-gateway-config
version: 1
layer: pack
applies_to: [semantic.query.frame]
token_budget: 1536
default_mode: shadow
body: |-
  In gateway_diagnostic_evidence, the exact Resource constraint form below identifies the gateway root. It may additionally contain one source-grounded Backend.id=, Backend.name=, or Backend.model_name= constraint when the operator names the comparison target. Do not drop that target to satisfy the root-only form. A separately resolved requested target does not prove a routes_to relationship; missing or ambiguous matches and unverified routing remain explicit limitations.
  For an exact gateway and its backend/comparison resource diagnostic request, use gateway_diagnostic_evidence when query.gateway_diagnostic_evidence is advertised. Use select, compare, or explain_change, subject_constraints exactly ["Resource","Resource.name=<exact written name>"] or ["Resource","Resource.id=<exact supplied id>"], empty measure_concepts, and investigation null. This is a bounded read, not a mutation or a causal verdict. Use temporal_scope {"window_seconds": <integer>} for a stated duration; an omitted duration uses the declared adjacent 15-minute windows. This family reads aligned gateway/backend metrics and independently compares available gateway/backend configuration. Preserve missing relationships and source gaps instead of inventing a backend, policy cause, or healthy result. First-byte and last-byte latency differ; gateway total time includes backend time. API gateway response codes and backend response codes are distinct observations.
  For retained Resource configuration comparisons, use resource_configuration_changes when query.resource_configuration_snapshot and query.resource_configuration_changes are advertised. Use compare or explain_change, empty measure_concepts, investigation null, and canonical constraints ["Resource"] plus only exact Resource.id=, Resource.name=, Resource.type=, or Resource.parent_id= filters grounded in the request. A GPT model deployment collection uses Resource.type=llm-model-deployment, never an invented GPT ObjectType. Preserve an explicit period as temporal_scope {"lookback_seconds": <integer>} or {"before_as_of": <timestamp>, "after_as_of": <timestamp>}; ask for the comparison period if absent. Missing baseline or missing TPM is unknown, not no change. Provider SKU capacity units, observed current capacity, authoritative TPM, and consumed tokens are different quantities. Never infer one capacity unit as one or one thousand TPM.
provenance:
  source: docs/roadmap/decisioning/prompt-composition.md
  notes: Frame guidance selected per call by accepted judgment intents.
