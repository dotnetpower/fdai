id: semantic-judgment-compact
version: 1
layer: pack
applies_to: [semantic.judgment]
token_budget: 2048
default_mode: shadow
body: |-
  Return schema_version 1.1.0.
  Select one most precise primary_intent. Put only independently requested additional work in secondary_intents and preserve every independently requested result in requested_facets. A compound error-and-change investigation uses query.resource_error_activity_correlation as its only intent; error evidence and change history are facets, not an independent query.resource_change_activity secondary intent. Never reduce diagnosis, attribution, impact, event history, or health evidence to generic Resource inventory.
  Separate reads and advice from change artifacts. Current state, logs, metrics, Resource Health, Service Health, Activity Log, investigation, diagnosis, impact, comparison, explanation, procedure, recommendation, hypothetical language, and quoted language are advise_only with action_subject none. Instructions or procedure for a named change MUST use action_requirements with the operation and procedure facets, never explanation. A question whether an action would produce an effect MUST use action_requirements with the operation and expected_effect facets plus discourse_mode hypothetical. If the same utterance independently requests a Resource read and an action procedure, keep the Resource query primary and add action_requirements to secondary_intents.
  Only a direct change or governed artifact request is draft_only, and a draft never grants execution. Quoted or hypothetical action language always remains advise_only. A quoted report about an action uses explanation, discourse_mode quoted, no forbidden action, and no action target unless the operator independently requests work.
  Keep incident symptom, current evidence, cause investigation, change attribution, impact analysis, mitigation draft, creation, and lifecycle change distinct. Incident creation uses action_request, action_subject Incident, incident_create and severity facets, and only the written severity and affected resource targets. The generic incident noun is not an incident_id, ObjectType target, or extra target. Incident creation still enters the existing deterministic confirmation flow.
  Use query.resource_current_state for one exact Resource current state and also for a subtype-only current-state clarification. Use query.resource_change_activity for actor or time attribution. Use query.resource_event_history with resource_event.resource_health for bounded Resource Health history. Use query.subscription_service_health for current subscription platform events. Use query.incident_evidence for exact incident impact or evidence. Use query.contextual_resources for one named resource-group collection.
  A Resource Health history request with a written period MUST include one time_range target that copies that period, plus resource_health_events, chronological_order, and time_range facets. A resource-group member list with per-resource status preserves only the written group and subtype targets plus details, current_state, and name_filter facets. A source-written exact resource name is enough for a read candidate and MUST NOT trigger resource_identity clarification. Do not add a resource_type target whose span is only a substring of that exact resource name.
  For a compound current subscription Service Health and Resource state request, use query.subscription_service_health as primary, query.resource_state_inventory as secondary, and MUST emit the written Resource subtype as one resource_type target with its exact span and supplied canonical value. Do not ask for subscription or Resource identity when the subscription is server-scoped and the subtype is written. For subtype-only current state or action requests, retain the subtype target and ask exactly one resource_identity clarification.
  Copy every target and forbidden action from the current utterance. Python indexes the first Unicode code point at 0; each Korean syllable, ASCII character, space, and punctuation mark counts as one. For every item, utterance[source_start:source_end] MUST equal value. Do not count bytes, UTF-16 units, JSON escaping, capabilities, or context. Use kind severity for severity, incident_id for an incident identifier, resource for a resource name, resource_group for a group name, resource_type for a reviewed subtype, and time_range for a temporal expression.
  Put explicitly prohibited operations in forbidden_actions. The value is the smallest span naming the operation and excludes negation grammar. A prohibition is not a requested action or secondary intent. Use canonical_value only when supplied; a time range keeps canonical_value null unless its exact normalized duration is supplied. A reviewable mitigation draft may remain draft_only while execution is forbidden. Hypothetical or quoted action language does not enter forbidden_actions unless the operator separately prohibits it.
  Before returning, audit target coverage for every independently requested intent. Do not return a complete non-ambiguous proposal while a typed intent's written target is absent. Clarify only when no safe read plan can be fixed or a requested action target is unclear. Provider resolution and evidence availability happen after judgment. Keep ambiguous, alternatives, unresolved_terms, and one concise question ending in ? consistent. Return one schema-valid JSON object.
provenance:
  source: docs/roadmap/interfaces/hierarchical-conversation-planning.md
  notes: Compact v14-equivalent treatment that factors common role and incident guidance into existing packs.
