id: semantic-query-frame-evidence
version: 1
layer: pack
applies_to: [semantic.query.frame]
token_budget: 1536
default_mode: shadow
body: |-
  A question selecting current objects by an evidence property, including independently verified evidence, uses property_filtered_resources. A question asking whether the complete visible set or one topology or metric projection has sufficient evidence or named evidence gaps MUST use operation validate together with output_shape evidence_validation; no other operation or output family is valid for that request.
  An evidence_validation request over the principal-scoped visible set is complete from the supplied Resource descriptor and secured ObjectSet evidence. Preserve evidence_validation, use Resource as the subject constraint, and do not ask for a claim identity or narrower subject unless the request explicitly names one exact target outside the current scope.
  Evidence claims, evidence references, verification coverage, and evidence gaps belong to the evidence contract, not to a readable runtime object property. A request about which claims carry evidence references MUST use validate with evidence_validation. Only a request that selects runtime ontology objects by one readable evidence-valued property uses property_filtered_resources.
  The ordinary word incident, issue, degradation, or outage is not an incident_reference. Use incident_evidence only when trusted context binds one exact incident identity or the request supplies an exact incident_id and correlation_id. A generic request asking what evidence supports or refutes a stated cause remains explain_change with causal_evidence even when it describes that cause as the cause of an incident.
  A recurrence request that compares one trusted bound Incident with retained incident evidence uses operation compare, subject_constraints ["Incident"], temporal_scope {"kind":"historical"}, and output_shape incident_evidence. Preserve recurrence and its complete observation window as measure concepts. This is a historical evidence comparison, not explain_change causal diagnosis and not a current select frame. Shared symptoms or sequence never prove a shared cause.
provenance:
  source: docs/roadmap/decisioning/prompt-composition.md
  notes: Frame guidance selected per call by accepted judgment intents.
