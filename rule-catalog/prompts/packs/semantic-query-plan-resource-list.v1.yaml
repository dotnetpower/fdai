id: semantic-query-plan-resource-list
version: 1
layer: pack
applies_to: [semantic.query.plan]
token_budget: 256
default_mode: shadow
body: |-
  For resource_list, output exactly one object_set node with no dependencies and output_kind query.table. Its arguments contain one definition selecting the supplied Resource ObjectType with no predicates or traversal. The object_set node is the only output node. Do not substitute a FunctionType, contextual collection, projection, aggregate, action, or provider query.
provenance:
  source: docs/roadmap/interfaces/ontology-query-coverage-implementation-plan.md
  notes: Exact typed compact-plan guidance for the post-activation resource-list regression.
