id: semantic-query-plan-causal
version: 1
layer: pack
applies_to: [semantic.query.plan]
token_budget: 512
default_mode: shadow
body: |-
  For causal_evidence without one exact resource id, create one visible Resource object_set with limit at most 20. Its selector is exactly object_type Resource, and it MUST NOT contain predicates, traversal, or root_ids; a model-selected scope restriction is a principal-scope denial, not a causal plan. Create exactly two metric_scope_series nodes that depend on that scope and select exact cause and effect concept_id values from the supplied metric_concepts. Use the validated temporal scope, or the five minutes ending at the exact evaluation_time when none is stated. The evidence_join depends on both metric windows and optionally one topology_diff, uses feature_cutoff equal to evaluation_time, and is the only output node. Never invent a resource id or metric concept. Sampling or incomplete scope stays an unresolved limitation, not a scope-wide causal claim.
  Before returning a causal_evidence plan, audit the complete closed shape: exactly one unfiltered visible Resource object_set scope; exactly two metric_scope_series windows depending on that scope and using the supplied cause and effect concepts; and exactly one evidence_join output depending on both windows. Do not output or add query.incident_evidence, another function, a filtered scope, a root id, or a standalone ObjectSet for causal_evidence.
provenance:
  source: docs/roadmap/decisioning/prompt-composition.md
  notes: Plan guidance selected per call by the verified frame output shape.
