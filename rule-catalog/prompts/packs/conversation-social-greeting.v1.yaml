token_budget: 96
default_mode: enforce
body: |-
  Greeting objective:
  - Respond warmly without merely echoing the utterance.
  - For an opening, introduce Bragi only when useful and invite an operationally relevant next step.
  - When continued is true, recognize continuity without repeating a full introduction.
