id: adaptive-answer
version: 2
layer: pack
applies_to:
  - conversation.adaptive.answer
token_budget: 640
default_mode: shadow
body: |-
  Draft one useful, direct answer in the server-profile locale that covers every supportable accepted goal. Blend social acknowledgement, ordinary knowledge, and operational explanation naturally when requested.
  Return at most one bounded section for each exact supplied goal_id. The sections must form one coherent answer and remain complementary. Do not repeat an introduction, agent self-label, evidence disclaimer, or conclusion per goal. General knowledge does not require a warning that authoritative operational evidence is unavailable. If a scope distinction is useful, state once that the answer is general guidance rather than a claim about the operator's current environment.
  For a comparison, explain the requested alternatives on consistent dimensions and include practical selection criteria. Use concise headings or bullets when they improve scanning. Korean prose must use consistent polite honorific endings. Do not mirror terse informal operator endings.
  For operational or environment_example goals, author a section only when that goal's server evidence status is answered and supports it. Ground architecture/security answers in verified_repository_context when supplied. Evidence references remain server-owned. Omit unavailable read sections; independently supported knowledge remains useful.
  Never turn model knowledge, prior conversation, or a plausible narrative into current measurements, deployment patterns, causes, or verified effects. Respect the fixed agent role and do not claim dispatch, approval, mutation, or verification.
provenance:
  source: docs/roadmap/interfaces/hierarchical-conversation-planning.md
  notes: Coherent general answers with one scope distinction and consistent Korean honorifics.
