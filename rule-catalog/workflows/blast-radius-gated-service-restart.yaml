schema_version: "1.0.0"
name: blast-radius-gated-service-restart
version: "1.0.0"
description: >-
  Restart one service only when its ontology blast radius stays within the reviewed ceiling, then require independent approval.
trigger:
  kind: signal
  signal_type: change.request.submitted
default_mode: shadow
promotion_gate:
  min_shadow_days: 21
  min_samples: 40
  min_accuracy: 0.98
  max_policy_escapes: 0
steps:
  - id: blast_radius
    kind: gate
    gate_ref: ontology-function:decision.blast_radius
  - id: restart_approval
    kind: approval
    approval_role: owner
    quorum: 2
    no_self_approval: true
    timeout_seconds: 3600
  - id: restart_service
    kind: action
    action_type_ref: ops.restart-service
    params:
      target_resource_ref: "${event.resource_ref}"
      restart_reason: "${change.reason}"
anti_scope: >-
  This workflow never restarts a service whose blast radius is unknown, incomplete, or above
  the ceiling, never self-approves, and never treats proposal dispatch as an effect. A restart
  is forward-only, so recovery is a separate reviewed action.
