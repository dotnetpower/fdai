# FDAI-authored taint-mode verifier rules for C#.
#
# Sources are ASP.NET request collections, model-bound string parameters, and uploaded filenames.
# Hits only raise confidence when the measured promotion gate admits the verifier.
rules:
  - id: fdai.verify.csharp.command-injection
    languages: [csharp]
    severity: ERROR
    message: Request input reaches an operating-system command.
    metadata: {cwe: ["CWE-78"], category: security, confidence: HIGH, fdai_verifier: true}
    mode: taint
    pattern-sources: &cs-sources
      - pattern-either:
          - pattern: Request.Query[...]
          - pattern: Request.Form[...]
          - pattern: Request.Headers[...]
          - pattern: Request.Cookies[...]
          - pattern: Request.QueryString[...]
          - pattern: Request.Params[...]
          - pattern: HttpContext.Request.Query[...]
          - patterns:
              - pattern-inside: |
                  public $RET $METHOD(..., IFormFile $UPLOAD, ...) { ... }
              - pattern: $UPLOAD.FileName
          - patterns:
              - pattern-inside: |
                  public $RET $METHOD(..., [$ATTR] string $PARAM, ...) { ... }
              - metavariable-regex: {metavariable: $ATTR, regex: '^(FromQuery|FromRoute|FromForm|FromBody|FromHeader)$'}
              - pattern: $PARAM
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      [$HTTP(...)]
                      public $RET $METHOD(..., string $PARAM, ...) { ... }
                  - pattern-inside: |
                      [$HTTP]
                      public $RET $METHOD(..., string $PARAM, ...) { ... }
              - metavariable-regex: {metavariable: $HTTP, regex: '^Http(Get|Post|Put|Patch|Delete)$'}
              - pattern: $PARAM
    pattern-sanitizers: &cs-numeric-sanitizers
      - pattern-either:
          - pattern: int.Parse(...)
          - pattern: long.Parse(...)
          - pattern: Guid.Parse(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Process.Start(..., $CMD, ...)
              - pattern: new ProcessStartInfo(..., $CMD, ...)
              - pattern: (Process $PROCESS).StartInfo.Arguments = $CMD
              - pattern: (ProcessStartInfo $INFO).Arguments = $CMD
              - pattern: (Process $PROCESS).StartInfo.FileName = $CMD
              - pattern: (ProcessStartInfo $INFO).FileName = $CMD
              - pattern: |
                  new ProcessStartInfo { ..., Arguments = $CMD, ... }
              - pattern: |
                  new ProcessStartInfo { ..., FileName = $CMD, ... }
          - focus-metavariable: $CMD
  - id: fdai.verify.csharp.sql-injection
    languages: [csharp]
    severity: ERROR
    message: Request input is concatenated into a SQL command.
    metadata: {cwe: ["CWE-89"], category: security, confidence: HIGH, fdai_verifier: true}
    mode: taint
    pattern-sources: *cs-sources
    pattern-sanitizers: *cs-numeric-sanitizers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new SqlCommand($SQL, ...)
              - pattern: new SqliteCommand($SQL, ...)
              - pattern: $CMD.CommandText = $SQL
              - pattern: $DB.Database.ExecuteSqlRaw($SQL, ...)
              - pattern: $SET.FromSqlRaw($SQL, ...)
              - pattern: $SET.FromSql($SQL, ...)
          - focus-metavariable: $SQL
  - id: fdai.verify.csharp.path-traversal
    languages: [csharp]
    severity: ERROR
    message: Request input selects a file path.
    metadata: {cwe: ["CWE-22"], category: security, confidence: HIGH, fdai_verifier: true}
    mode: taint
    pattern-sources: *cs-sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: int.Parse(...)
          - pattern: long.Parse(...)
          - pattern: Guid.Parse(...)
          - pattern: Path.GetFileName(...)
          - pattern: System.IO.Path.GetFileName(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: File.ReadAllText($P, ...)
              - pattern: File.ReadAllBytes($P)
              - pattern: File.OpenRead($P)
              - pattern: File.Delete($P)
              - pattern: File.WriteAllText($P, ...)
              - pattern: System.IO.File.ReadAllText($P, ...)
              - pattern: System.IO.File.ReadAllBytes($P)
              - pattern: new FileStream($P, ...)
              - pattern: Path.Combine(..., $P, ...)
          - focus-metavariable: $P
