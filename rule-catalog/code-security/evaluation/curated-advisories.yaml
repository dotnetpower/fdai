# FDAI code-security evaluation corpus: curated from real advisories.
#
# Every case models one package as Trivy and OSV-Scanner would report it. Trivy reports the CVE id
# with the NVD (or CNA) CVSS v3 base score; OSV-Scanner reports the GHSA id with its CVE alias and
# the GitHub-reviewed score. Package names keep the spelling each source uses, so the same PyPI
# package can appear as `PyJWT`, `pyjwt`, or `pyJWT`. The reviewer band is the severity the GitHub
# Advisory Database assigned on review, an independent label FDAI never produced. Advisories were
# published between 2025-07-01 and 2026-09-30. Each `-fixed` case is a clean negative: the package
# at a patched version reports nothing. Cases are split by a hash of the case id into `dev` and
# `holdout`; no rule or threshold was tuned on the holdout split.
#
# Data: GitHub Advisory Database reviewed advisories (CC-BY 4.0) and NVD CVE records (public
# domain), retrieved 2026-10-07. Only identifiers, scores, and package names are kept.
#
# Run: python -m fdai.delivery.code_security_cli evaluate --corpus <this file>
schema_version: 1
corpus_id: fdai.code-security.curated-advisories
version: 1.0.0
provenance: curated
line_shift: 7
acceptance:
  dedup_precision: 1.0
  dedup_recall: 1.0
  detection_precision: 1.0
  detection_recall: 1.0
  severity_range_containment: 1.0
