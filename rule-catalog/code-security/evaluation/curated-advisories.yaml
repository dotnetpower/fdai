# FDAI code-security evaluation corpus: curated from real advisories.
#
# Dependency cases model one package as Trivy and OSV-Scanner would report it. Trivy reports the CVE
# id with the NVD (or CNA) CVSS v3 base score; OSV-Scanner reports the GHSA id with its CVE alias and
# the GitHub-reviewed score. Package names keep the spelling each source uses, so the same PyPI
# package can appear as `PyJWT`, `pyjwt`, or `pyJWT`.
#
# Code cases (`kind: code`) model one source-code weakness as two SAST lanes would report it at the
# fix site: the first line the advisory's single fix commit removed from its only changed non-test
# source file. Advisories were selected mechanically: for each of CWE 89, 78, 94, 22, 918, 79, 502,
# and 611, the first two reviewed advisories in GHSA id order with a CVSS v3 vector, exactly one
# commit reference, and a fix that modifies exactly one non-test source file. Their facts come from
# the advisory's CVSS v3 vector without judgment: AV, PR, and UI map directly; impact is
# `code_execution` for command injection, code injection, and unsafe deserialization with I:H, then
# `data_write` for I:H, `data_read` for C:H, `denial_of_service` for A:H, `info_disclosure` for C:L,
# and `limited` otherwise. The rubric has no attack-complexity fact, so AC is not mapped.
#
# The reviewer band is the severity the GitHub Advisory Database assigned on review, an independent
# label FDAI never produced. Advisories were published between 2025-07-01 and 2026-09-30. Each
# `-fixed` case is a clean negative: the patched package or revision reports nothing. Dependency
# cases are split by a hash of the case id into `dev` and `holdout`; code cases use the parity of
# the SHA-256 of their case id. No rule, rubric value, or threshold was tuned on this corpus.
#
# Data: GitHub Advisory Database reviewed advisories (CC-BY 4.0) and NVD CVE records (public
# domain), retrieved 2026-10-07 (dependency cases) and 2026-10-08 (code cases). Only identifiers,
# scores, vectors, package names, and fix-site paths and lines are kept; no third-party code.
#
# Run: python -m fdai.delivery.code_security_cli evaluate --corpus <this file>
schema_version: 1
corpus_id: fdai.code-security.curated-advisories
version: 1.1.0
provenance: curated
line_shift: 7
acceptance:
  dedup_precision: 1.0
  dedup_recall: 1.0
  detection_precision: 1.0
  detection_recall: 1.0
  severity_range_containment: 1.0
