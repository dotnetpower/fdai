# FDAI weakness-verifier precision corpus: public, intentionally vulnerable projects.
#
# Each source is fetched at an exact commit when the evaluation runs; no third-party code is
# stored in this repository. Labels come from each project's own documentation: Juice Shop's
# `vuln-code-snippet vuln-line` source annotations and coding-challenge `*.info.yml` verdicts,
# NodeGoat's OWASP Top 10 tutorial, WebGoat and pygoat lesson pages, the dvcsharp-api README,
# vulnerable-node's lab pages, `VULN:` comments, and SAST `ground-truth.yaml`, DVNA's solution
# pages and its `fixes` branch, the nodejs-goof README and exploit notes, dvws-node's
# CHALLENGES.md, AspGoat's lab list and `Vulnerable` source comments, the NotSecDotNet exercise
# list, and the OWASP Benchmark `expectedresults-*.csv` files. Safe labels mark sinks the projects
# present as correct fixes or clean controls, or that use only server-controlled values; each one
# cites its reason.
#
# Splits: `dev` locations may inform rule development; `holdout` locations must not. Every source
# that existed in 1.0.0 (NodeGoat, Juice Shop, WebGoat, dvcsharp-api, pygoat) informed rule
# development, as did the vulnerable-node shop routes and AspGoat, so they are `dev`. DVNA, the
# DVNA fixes branch, nodejs-goof, dvws-node, NotSecDotNet, and the vulnerable-node SAST seeds were
# evaluated only after the rules were frozen, so they are `holdout`. The OWASP Benchmark sources
# split their expected results by a hash of the test name; rules were never tuned on either half.
# Whole-file labels (from expected-results files) count any verifier hit in the labeled file.
#
# A verifier is promoted only when its precision meets the floor with at least
# `min_true_positives` true positives in both the dev and the holdout split; everything else stays
# in shadow.
#
# Run: python -m fdai.delivery.code_security_cli evaluate-verifiers --work-root <dir> --engine <opengrep|semgrep>
schema_version: 1
corpus_id: fdai.code-security.verifier-real
version: 1.1.0
provenance: curated
precision_floor: 0.90
min_true_positives: 1
sources:
