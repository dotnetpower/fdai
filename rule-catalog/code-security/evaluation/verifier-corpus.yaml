    repository: https://github.com/OWASP/NodeGoat
    commit: c5cb68a7084e4ae7dcc60e6a98768720a81841e8
    license: Apache-2.0
    label_source: NodeGoat tutorial, A1 server-side JavaScript injection
    locations:
