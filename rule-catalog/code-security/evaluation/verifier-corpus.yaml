# FDAI weakness-verifier precision corpus: public, intentionally vulnerable projects.
#
# Each source is fetched at an exact commit when the evaluation runs; no third-party code is
# stored in this repository. Labels come from each project's own documentation: Juice Shop's
# `vuln-code-snippet vuln-line` source annotations and coding-challenge `*.info.yml` verdicts,
# NodeGoat's OWASP Top 10 tutorial, WebGoat and pygoat lesson pages, and the dvcsharp-api README.
# Safe labels mark sinks the projects present as correct fixes or that use only server-controlled
# values; each one cites its reason.
#
# This corpus informed rule development (implicit ASP.NET binding and EF `FromSql` were added after
# inspecting dvcsharp-api), so it is not a held-out set. Samples are small. A verifier is promoted
# only when its measured precision meets the floor; everything else stays in shadow.
#
# Run: python -m fdai.delivery.code_security_cli evaluate-verifiers --work-root <dir> --engine <opengrep|semgrep>
schema_version: 1
corpus_id: fdai.code-security.verifier-real
version: 1.0.0
provenance: curated
precision_floor: 0.90
min_true_positives: 1
sources:
