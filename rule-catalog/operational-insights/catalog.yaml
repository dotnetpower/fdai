version: 1
recipes:
  - recipe_id: infrastructure.cpu-saturation
    title: CPU saturation
    category: reliability
    severity: high
    operator: above
    metric: system.cpu.utilization
    threshold: 0.90
    min_samples: 5
    description: Detect sustained compute saturation on a host or workload.
  - recipe_id: infrastructure.memory-pressure
    title: Memory pressure
    category: reliability
    severity: high
    operator: ratio_below
    metric: system.memory.available_bytes
    comparison_metric: system.memory.total_bytes
    threshold: 0.10
    min_samples: 5
    description: Detect when available memory falls below a safe share of capacity.
  - recipe_id: infrastructure.disk-pressure
    title: Disk capacity pressure
    category: reliability
    severity: high
    operator: ratio_below
    metric: system.disk.free_bytes
    comparison_metric: system.disk.total_bytes
    threshold: 0.10
    min_samples: 5
    description: Detect a volume approaching capacity exhaustion.
  - recipe_id: infrastructure.container-restart-surge
    title: Container restart surge
    category: reliability
    severity: high
    operator: delta_above
    metric: container.restarts
    threshold: 3
    description: Detect a burst of container restarts within one window.
  - recipe_id: infrastructure.process-disappearance
    title: Required process disappearance
    category: reliability
    severity: critical
    operator: absent
    metric: process.heartbeat
    threshold: 1
    description: Detect that a required process heartbeat is absent.
  - recipe_id: telemetry.freshness-gap
    title: Telemetry freshness gap
    category: reliability
    severity: high
    operator: stale
    metric: telemetry.heartbeat
    threshold: 300
    description: Detect a telemetry source that has stopped reporting.
  - recipe_id: telemetry.ingestion-drop
    title: Metric ingestion drop
    category: reliability
    severity: high
    operator: percent_change_below
    metric: telemetry.points_ingested
    threshold: -50
    min_samples: 5
    description: Detect a sharp drop in ingested telemetry volume.
  - recipe_id: telemetry.cardinality-surge
    title: Metric cardinality surge
    category: cost
    severity: medium
    operator: percent_change_above
    metric: telemetry.active_series
    threshold: 100
    min_samples: 5
    description: Detect a rapid increase in active metric series.
  - recipe_id: infrastructure.peer-hotspot
    title: Peer resource hotspot
    category: reliability
    severity: high
    operator: ratio_above
    metric: resource.load
    comparison_metric: peer.median_load
    threshold: 2
    min_samples: 5
    description: Detect one resource running substantially hotter than its peers.
  - recipe_id: change.latency-regression
    title: Deployment latency regression
    category: reliability
    severity: high
    operator: percent_change_above
    metric: deployment.request_latency_p95_ms
    threshold: 20
    min_samples: 20
    description: Detect latency regression after a deployment.
  - recipe_id: change.error-regression
    title: Deployment error regression
    category: reliability
    severity: critical
    operator: percent_change_above
    metric: deployment.error_rate
    threshold: 25
    min_samples: 20
    description: Detect an error-rate regression after a deployment.
  - recipe_id: change.throughput-regression
    title: Deployment throughput regression
    category: reliability
    severity: high
    operator: percent_change_below
    metric: deployment.requests_per_second
    threshold: -30
    min_samples: 20
    description: Detect a throughput drop after a deployment.
  - recipe_id: apm.request-error-rate
    title: Request error rate
    category: reliability
    severity: critical
    operator: above
    metric: service.request_error_rate
    threshold: 0.05
    min_samples: 20
    description: Detect a service request error rate above its operating band.
  - recipe_id: apm.request-latency-p99
    title: Request p99 latency
    category: reliability
    severity: high
    operator: above
    metric: service.request_latency_p99_ms
    threshold: 2000
    min_samples: 20
    description: Detect tail request latency above the service limit.
  - recipe_id: apm.apdex-drop
    title: Application performance score drop
    category: reliability
    severity: high
    operator: below
    metric: service.apdex
    threshold: 0.85
    min_samples: 20
    description: Detect degraded user-perceived application performance.
  - recipe_id: apm.dependency-error-amplification
    title: Dependency error amplification
    category: reliability
    severity: high
    operator: ratio_above
    metric: dependency.error_rate
    comparison_metric: service.error_rate
    threshold: 1.5
    min_samples: 20
    description: Detect a dependency contributing disproportionate request errors.
  - recipe_id: apm.critical-path-dominance
    title: Trace critical path dominance
    category: reliability
    severity: medium
    operator: ratio_above
    metric: trace.critical_path_ms
    comparison_metric: trace.duration_ms
    threshold: 0.70
    min_samples: 20
    description: Detect a critical span consuming most of an end-to-end trace.
  - recipe_id: apm.span-error-rate
    title: Span error rate
    category: reliability
    severity: high
    operator: above
    metric: trace.span_error_rate
    threshold: 0.05
    min_samples: 20
    description: Detect elevated errors in distributed trace spans.
  - recipe_id: database.slow-query-rate
    title: Slow query rate
    category: reliability
    severity: high
    operator: above
    metric: database.slow_query_rate
    threshold: 0.10
    min_samples: 20
    description: Detect an excessive share of slow database queries.
  - recipe_id: database.lock-wait-ratio
    title: Database lock wait ratio
    category: reliability
    severity: high
    operator: above
    metric: database.lock_wait_ratio
    threshold: 0.20
    min_samples: 20
    description: Detect database work dominated by lock contention.
  - recipe_id: stream.consumer-lag
    title: Stream consumer lag
    category: reliability
    severity: high
    operator: above
    metric: stream.consumer_lag
    threshold: 10000
    min_samples: 5
    description: Detect a stream consumer falling behind producers.
  - recipe_id: stream.dead-letter-growth
    title: Dead-letter growth
    category: reliability
    severity: critical
    operator: delta_above
    metric: stream.dead_letter_messages
    threshold: 100
    description: Detect rapid growth in dead-lettered messages.
  - recipe_id: synthetic.availability-drop
    title: Synthetic availability drop
    category: reliability
    severity: critical
    operator: below
    metric: synthetic.availability
    threshold: 0.99
    min_samples: 5
    description: Detect failed external availability checks.
  - recipe_id: synthetic.latency-regression
    title: Synthetic latency regression
    category: reliability
    severity: high
    operator: percent_change_above
    metric: synthetic.latency_ms
    threshold: 20
    min_samples: 5
    description: Detect a user-journey latency regression.
  - recipe_id: slo.fast-burn
    title: Fast SLO burn
    category: reliability
    severity: critical
    operator: above
    metric: slo.fast_burn_rate
    threshold: 14.4
    min_samples: 5
    description: Detect fast error-budget consumption requiring immediate review.
  - recipe_id: slo.slow-burn
    title: Slow SLO burn
    category: reliability
    severity: high
    operator: above
    metric: slo.slow_burn_rate
    threshold: 1
    min_samples: 5
    description: Detect sustained error-budget consumption across a long window.
  - recipe_id: slo.error-budget-low
    title: Error budget low
    category: reliability
    severity: high
    operator: below
    metric: slo.error_budget_remaining_ratio
    threshold: 0.10
    min_samples: 5
    description: Detect an SLO with little error budget remaining.
  - recipe_id: alert.storm
    title: Alert storm
    category: reliability
    severity: high
    operator: delta_above
    metric: alert.notifications
    threshold: 50
    description: Detect a burst of alert notifications in one window.
  - recipe_id: alert.flapping
    title: Alert state flapping
    category: reliability
    severity: medium
    operator: above
    metric: alert.state_transitions
    threshold: 6
    description: Detect an alert repeatedly changing state.
  - recipe_id: alert.evaluation-stale
    title: Alert evaluation stale
    category: reliability
    severity: high
    operator: stale
    metric: alert.last_evaluated
    threshold: 300
    description: Detect an alert definition that is no longer being evaluated.
  - recipe_id: alert.no-data
    title: Alert input no data
    category: reliability
    severity: high
    operator: absent
    metric: alert.input_signal
    threshold: 1
    description: Detect a monitor whose input signal has disappeared.
  - recipe_id: ownership.missing
    title: Service ownership missing
    category: config_drift
    severity: medium
    operator: absent
    metric: service.owner_binding
    threshold: 1
    description: Detect an operational service without an accountable owner binding.
  - recipe_id: log.volume-regression
    title: Log volume regression
    category: reliability
    severity: medium
    operator: percent_change_above
    metric: log.events
    threshold: 100
    min_samples: 5
    description: Detect an unexpected increase in log event volume.
  - recipe_id: log.new-pattern-surge
    title: New log pattern surge
    category: reliability
    severity: high
    operator: delta_above
    metric: log.new_patterns
    threshold: 5
    description: Detect the emergence of several previously unseen log patterns.
  - recipe_id: log.rare-error-growth
    title: Rare error growth
    category: reliability
    severity: high
    operator: delta_above
    metric: log.rare_error_events
    threshold: 3
    description: Detect growth in low-frequency error signatures.
  - recipe_id: cost.daily-spend-change
    title: Daily spend change
    category: cost
    severity: high
    operator: percent_change_above
    metric: cost.daily_amortized
    threshold: 20
    min_samples: 5
    description: Detect a material daily spend increase.
  - recipe_id: cost.budget-overrun
    title: Budget overrun
    category: cost
    severity: high
    operator: ratio_above
    metric: cost.actual
    comparison_metric: cost.budget
    threshold: 1
    min_samples: 5
    description: Detect actual spend exceeding the configured budget.
  - recipe_id: cost.unallocated-spend
    title: Unallocated spend share
    category: cost
    severity: medium
    operator: ratio_above
    metric: cost.unallocated
    comparison_metric: cost.total
    threshold: 0.10
    min_samples: 5
    description: Detect spend that cannot be attributed to an owner or service.
  - recipe_id: cost.idle-resource-share
    title: Idle resource cost share
    category: cost
    severity: medium
    operator: ratio_above
    metric: cost.idle_resources
    comparison_metric: cost.total
    threshold: 0.15
    min_samples: 5
    description: Detect a high share of cost from idle resources.
  - recipe_id: cost.unit-cost-regression
    title: Unit cost regression
    category: cost
    severity: high
    operator: percent_change_above
    metric: cost.per_service_unit
    threshold: 10
    min_samples: 5
    description: Detect increased cost per request, job, or business unit.
  - recipe_id: cost.container-request-waste
    title: Container request waste
    category: cost
    severity: medium
    operator: ratio_above
    metric: container.requested_capacity
    comparison_metric: container.used_capacity
    threshold: 2
    min_samples: 20
    description: Detect container requests materially above measured use.
  - recipe_id: security.misconfiguration
    title: Critical security misconfiguration
    category: security
    severity: critical
    operator: above
    metric: security.critical_misconfigurations
    threshold: 0
    description: Detect one or more critical cloud configuration findings.
  - recipe_id: security.excess-privilege
    title: Excess privilege exposure
    category: security
    severity: critical
    operator: above
    metric: security.excess_privilege_findings
    threshold: 0
    description: Detect identities with privileges beyond their declared role.
  - recipe_id: security.sensitive-data-growth
    title: Sensitive data finding growth
    category: security
    severity: high
    operator: delta_above
    metric: security.sensitive_data_findings
    threshold: 0
    description: Detect newly observed sensitive data in telemetry or storage scans.
  - recipe_id: security.runtime-threat-growth
    title: Runtime threat signal growth
    category: security
    severity: critical
    operator: delta_above
    metric: security.runtime_threat_signals
    threshold: 0
    description: Detect new process, file, or network runtime threat signals.
  - recipe_id: security.vulnerability-exposure
    title: Reachable vulnerability exposure
    category: security
    severity: high
    operator: above
    metric: security.reachable_vulnerabilities
    threshold: 0
    description: Detect reachable vulnerabilities in running services.
  - recipe_id: impact.user-session-error-share
    title: User session impact
    category: reliability
    severity: high
    operator: ratio_above
    metric: impact.error_sessions
    comparison_metric: impact.total_sessions
    threshold: 0.05
    min_samples: 20
    description: Detect an incident affecting a material share of user sessions.
  - recipe_id: certificate.expiry-window
    title: Certificate expiry window
    category: security
    severity: high
    operator: below
    metric: certificate.days_remaining
    threshold: 30
    description: Detect a certificate approaching expiration.
  - recipe_id: backup.freshness-gap
    title: Backup freshness gap
    category: reliability
    severity: critical
    operator: stale
    metric: backup.last_success
    threshold: 86400
    description: Detect a backup target without a recent successful backup.
  - recipe_id: network.retransmit-rate
    title: Network retransmit rate
    category: reliability
    severity: high
    operator: above
    metric: network.tcp_retransmit_rate
    threshold: 0.05
    min_samples: 20
    description: Detect network degradation through elevated TCP retransmissions.
  - recipe_id: database.replication-lag
    title: Database read replica lag
    category: reliability
    severity: high
    operator: above
    metric: database.replication_lag_seconds
    threshold: 30
    min_samples: 5
    description: Detect asynchronous read-replica lag causing stale reads after writes.
  - recipe_id: database.connection-pool-saturation
    title: Database connection pool saturation
    category: reliability
    severity: high
    operator: ratio_above
    metric: database.active_connections
    comparison_metric: database.max_connections
    threshold: 0.85
    min_samples: 5
    description: Detect active database connections approaching the configured pool ceiling.
  - recipe_id: database.deadlock-surge
    title: Database deadlock surge
    category: reliability
    severity: high
    operator: delta_above
    metric: database.deadlocks_total
    threshold: 3
    description: Detect a burst of transaction deadlocks within one evaluation window.
  - recipe_id: infrastructure.scaling-oscillation
    title: Autoscaling thrashing oscillation
    category: reliability
    severity: medium
    operator: delta_above
    metric: autoscale.direction_reversals
    threshold: 4
    description: Detect rapid scale-out and scale-in oscillation caused by aggressive cooldowns.
  - recipe_id: infrastructure.inode-pressure
    title: Filesystem inode exhaustion pressure
    category: reliability
    severity: high
    operator: ratio_below
    metric: system.filesystem.inodes_free
    comparison_metric: system.filesystem.inodes_total
    threshold: 0.10
    min_samples: 5
    description: Detect a volume running out of free inodes despite available byte capacity.
  - recipe_id: infrastructure.oom-kill-surge
    title: Kernel or container OOM kill surge
    category: reliability
    severity: critical
    operator: delta_above
    metric: system.memory.oom_kills
    threshold: 1
    description: Detect one or more kernel or container out-of-memory terminations.
  - recipe_id: infrastructure.zombie-process-surge
    title: Defunct zombie process accumulation
    category: reliability
    severity: medium
    operator: above
    metric: system.processes.zombie_count
    threshold: 50
    min_samples: 5
    description: Detect accumulation of unreaped defunct child processes on a host.
  - recipe_id: infrastructure.load-average-saturation
    title: Host run-queue load average saturation
    category: reliability
    severity: high
    operator: ratio_above
    metric: system.load.average_5m
    comparison_metric: system.cpu.logical_cores
    threshold: 1.5
    min_samples: 5
    description: Detect sustained run-queue or I/O-wait load exceeding logical CPU cores.
  - recipe_id: infrastructure.cross-zone-load-imbalance
    title: Cross-zone instance load imbalance
    category: reliability
    severity: high
    operator: ratio_above
    metric: zone.max_instance_load
    comparison_metric: zone.min_instance_load
    threshold: 1.8
    min_samples: 5
    description: Detect asymmetric load across availability zones from uneven instance distribution.
  - recipe_id: network.connection-timeout-surge
    title: Network connection timeout surge
    category: reliability
    severity: high
    operator: delta_above
    metric: network.connection_timeouts
    threshold: 10
    description: Detect silent packet drops or unreachable routes causing connection timeouts.
  - recipe_id: network.connection-refused-surge
    title: Network connection refused surge
    category: reliability
    severity: high
    operator: delta_above
    metric: network.connection_refused
    threshold: 10
    description: Detect closed listener ports or crashed daemons returning TCP RST or ICMP reject.
  - recipe_id: network.dns-lookup-failure-rate
    title: DNS lookup failure rate
    category: reliability
    severity: high
    operator: above
    metric: network.dns_lookup_failure_rate
    threshold: 0.02
    min_samples: 10
    description: Detect elevated NXDOMAIN, SERVFAIL, or resolver timeout responses.
  - recipe_id: network.lb-unhealthy-host-ratio
    title: Load balancer unhealthy backend ratio
    category: reliability
    severity: critical
    operator: ratio_above
    metric: lb.unhealthy_targets
    comparison_metric: lb.total_targets
    threshold: 0.30
    min_samples: 5
    description: Detect a material share of backend pool targets failing health probes.
  - recipe_id: network.sticky-session-imbalance
    title: Load balancer sticky-session skew
    category: reliability
    severity: medium
    operator: ratio_above
    metric: lb.max_backend_sessions
    comparison_metric: lb.median_backend_sessions
    threshold: 2.5
    min_samples: 10
    description: Detect severe session concentration on a single backend from cookie affinity.
  - recipe_id: network.connection-draining-timeout-surge
    title: Connection draining forced termination surge
    category: reliability
    severity: medium
    operator: delta_above
    metric: lb.draining_forced_terminations
    threshold: 5
    description: Detect active client connections dropped when scale-in draining expires.
  - recipe_id: change.canary-analysis-failure-rate
    title: Canary rollout analysis failure rate
    category: reliability
    severity: high
    operator: above
    metric: deployment.canary_analysis_failure_rate
    threshold: 0.10
    min_samples: 5
    description: Detect failing automated canary or blue-green rollout verification checks.
  - recipe_id: change.gitops-out-of-sync-duration
    title: GitOps application out-of-sync staleness
    category: config_drift
    severity: medium
    operator: stale
    metric: gitops.last_in_sync_timestamp
    threshold: 900
    description: Detect a workload remaining OutOfSync from its declared GitOps manifest.
  - recipe_id: change.state-lock-wait-duration
    title: Infrastructure state lock contention
    category: config_drift
    severity: medium
    operator: above
    metric: iac.state_lock_wait_seconds
    threshold: 120
    min_samples: 3
    description: Detect prolonged Terraform or IaC remote state lock contention.
  - recipe_id: cost.spot-eviction-surge
    title: Spot instance eviction surge
    category: cost
    severity: high
    operator: delta_above
    metric: compute.spot_evictions
    threshold: 2
    description: Detect a surge of Spot or preemptible compute evictions in one window.
  - recipe_id: cost.unattached-storage-spend-share
    title: Orphaned storage spend share
    category: cost
    severity: medium
    operator: ratio_above
    metric: cost.unattached_storage
    comparison_metric: cost.total_storage
    threshold: 0.10
    min_samples: 5
    description: Detect an excessive share of storage spend from unattached disks and stale snapshots.
  - recipe_id: infrastructure.ephemeral-storage-pressure
    title: Container ephemeral storage pressure
    category: reliability
    severity: high
    operator: ratio_below
    metric: container.ephemeral_storage_free_bytes
    comparison_metric: container.ephemeral_storage_total_bytes
    threshold: 0.10
    min_samples: 5
    description: Detect a Pod or node approaching ephemeral-storage eviction limits.
  - recipe_id: infrastructure.file-descriptor-saturation
    title: Open file descriptor saturation
    category: reliability
    severity: high
    operator: ratio_above
    metric: system.fd.allocated
    comparison_metric: system.fd.max
    threshold: 0.85
    min_samples: 5
    description: Detect open file descriptors approaching process ulimit or kernel file-max capacity.
  - recipe_id: infrastructure.clock-skew-drift
    title: Host NTP clock-skew drift
    category: reliability
    severity: high
    operator: above
    metric: system.ntp.offset_ms
    threshold: 250
    min_samples: 3
    description: Detect host clock drift risking TLS validation or lease-ordering failures.
  - recipe_id: infrastructure.cpu-cfs-throttling
    title: Container CPU CFS bandwidth throttling
    category: reliability
    severity: high
    operator: ratio_above
    metric: container.cpu.cfs_throttled_periods
    comparison_metric: container.cpu.cfs_periods
    threshold: 0.25
    min_samples: 10
    description: Detect containers throttled by restrictive CPU CFS quota limits.
  - recipe_id: infrastructure.swap-thrashing
    title: Host swap paging thrashing
    category: reliability
    severity: high
    operator: above
    metric: system.swap.pages_swapped_per_sec
    threshold: 100
    min_samples: 5
    description: Detect active swap-in and swap-out paging thrashing degrading host latency.
  - recipe_id: infrastructure.disk-io-await-spike
    title: Disk I/O await latency spike
    category: reliability
    severity: high
    operator: above
    metric: system.disk.io_await_ms
    threshold: 50
    min_samples: 5
    description: Detect elevated block-device I/O wait latency from storage saturation or burst depletion.
  - recipe_id: infrastructure.kubelet-pleg-latency
    title: Kubelet PLEG relist latency
    category: reliability
    severity: high
    operator: above
    metric: kubelet.pleg_relist_duration_ms
    threshold: 3000
    min_samples: 5
    description: Detect slow Pod Lifecycle Event Generator relist cycles risking NodeNotReady transitions.
  - recipe_id: infrastructure.conntrack-table-saturation
    title: Netfilter conntrack table saturation
    category: reliability
    severity: critical
    operator: ratio_above
    metric: system.netfilter.conntrack_count
    comparison_metric: system.netfilter.conntrack_max
    threshold: 0.85
    min_samples: 5
    description: Detect Linux netfilter connection-tracking table exhaustion before packet drops occur.
  - recipe_id: network.snat-port-exhaustion
    title: Outbound SNAT port exhaustion
    category: reliability
    severity: critical
    operator: ratio_above
    metric: network.snat.used_ports
    comparison_metric: network.snat.allocated_ports
    threshold: 0.85
    min_samples: 5
    description: Detect NAT Gateway or load balancer outbound SNAT port exhaustion risk.
  - recipe_id: network.subnet-ip-exhaustion
    title: VNet subnet available IP exhaustion
    category: reliability
    severity: high
    operator: ratio_below
    metric: network.subnet.available_ips
    comparison_metric: network.subnet.total_ips
    threshold: 0.10
    min_samples: 3
    description: Detect a VNet subnet running out of allocatable IP addresses for scale-out.
  - recipe_id: network.tls-handshake-failure-rate
    title: TLS handshake failure rate
    category: security
    severity: high
    operator: above
    metric: network.tls_handshake_failure_rate
    threshold: 0.02
    min_samples: 10
    description: Detect elevated TLS handshake failures from certificate or cipher mismatches.
  - recipe_id: network.bgp-route-flap-surge
    title: Hybrid gateway BGP route flap surge
    category: reliability
    severity: high
    operator: delta_above
    metric: network.bgp.route_flaps
    threshold: 5
    description: Detect BGP peer route instability across VPN or ExpressRoute links.
  - recipe_id: network.ephemeral-port-exhaustion
    title: Host ephemeral source port exhaustion
    category: reliability
    severity: high
    operator: ratio_above
    metric: system.net.ephemeral_ports_in_use
    comparison_metric: system.net.ephemeral_ports_range
    threshold: 0.85
    min_samples: 5
    description: Detect unpooled outbound connections exhausting local ephemeral ports in TIME_WAIT.
  - recipe_id: network.waf-blocked-request-surge
    title: Application Gateway WAF block surge
    category: security
    severity: medium
    operator: percent_change_above
    metric: gateway.waf_blocked_requests
    threshold: 100
    min_samples: 10
    description: Detect a sharp surge in WAF-blocked requests indicating an attack or false-positive rule.
  - recipe_id: database.autovacuum-dead-tuple-ratio
    title: PostgreSQL dead tuple bloat ratio
    category: reliability
    severity: medium
    operator: ratio_above
    metric: database.dead_tuples
    comparison_metric: database.live_tuples
    threshold: 0.25
    min_samples: 5
    description: Detect MVCC dead-tuple bloat from blocked or lagging autovacuum workers.
  - recipe_id: database.temp-files-spill-surge
    title: Database temporary disk spill surge
    category: reliability
    severity: medium
    operator: delta_above
    metric: database.temp_bytes_written
    threshold: 104857600
    description: Detect large unindexed sort or hash queries spilling to temporary disk files.
  - recipe_id: database.cache-hit-ratio-drop
    title: Database buffer cache hit ratio drop
    category: reliability
    severity: high
    operator: below
    metric: database.buffer_cache_hit_ratio
    threshold: 0.90
    min_samples: 10
    description: Detect degraded buffer-pool locality forcing frequent physical disk reads.
  - recipe_id: database.xid-wraparound-age-ratio
    title: PostgreSQL transaction ID wraparound risk
    category: reliability
    severity: critical
    operator: ratio_above
    metric: database.max_xid_age
    comparison_metric: database.autovacuum_freeze_max_age
    threshold: 0.80
    min_samples: 3
    description: Detect transaction ID age approaching autovacuum freeze wraparound limits.
  - recipe_id: database.redis-eviction-surge
    title: Distributed cache key eviction surge
    category: reliability
    severity: high
    operator: delta_above
    metric: cache.evicted_keys
    threshold: 500
    description: Detect a burst of Redis memory evictions risking downstream database stampedes.
