schema_version: 1.0.0
name: governance.promote-action-type
version: 1.0.0
operation: update
interfaces:
- ControlPlane
rollback_contract: scripted
irreversible: false
default_mode: shadow
promotion_gate:
  min_shadow_days: 7
  min_samples: 20
  min_accuracy: 1.0
  max_policy_escapes: 0
preconditions:
- kind: graph_fresh_within_seconds
  value: 300
stop_conditions:
- kind: provider_api_error_streak
  count: 3
- kind: time_box_exceeded_seconds
  seconds: 300
blast_radius:
  computation: static_enum
  static_bucket: resource
description: Apply one exact, durable operational-promotion receipt to the runtime ActionType
  mode registry after Owner HIL. Demotion is the scripted rollback.
category: governance
trigger_kind:
  kind: operator_request
execution_path: direct_api
ceiling_by_tier:
  t0:
    max_autonomy: enforce_hil
    min_role: approver
  t1:
    max_autonomy: shadow_only
    min_role: approver
  t2:
    max_autonomy: shadow_only
    min_role: owner
argument_schema:
  type: object
  additionalProperties: false
  required:
  - action_type_id
  - target_mode
  - fdai_revision
  - scenario_set_version
  - evidence_digest
  - justification
  properties:
    action_type_id:
      type: string
      pattern: ^[a-z][a-z0-9_\.\-]{0,79}$
      description: The ActionType.name whose default_mode flips shadow -> enforce.
    target_mode:
      type: string
      enum:
      - enforce
    fdai_revision:
      type: string
      pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
    scenario_set_version:
      type: string
      pattern: ^[A-Za-z0-9._-]{1,160}$
    evidence_digest:
      type: string
      pattern: ^[0-9a-f]{64}$
    justification:
      type: string
      x-fdai-audit-safe: true
      minLength: 20
      maxLength: 500
provenance:
  source_url: https://github.com/dotnetpower/fdai
  resolved_ref: action-type:governance.promote-action-type@1.0.0
  content_hash: sha256:ac721fd4ab10c1e152df3a92fbdda7c2950f2a8753585eb056f6f92635c8bb47
  license: MIT
  retrieved_at: "2026-07-29T00:00:00Z"
