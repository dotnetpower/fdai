schema_version: 1.0.0
name: ops.flush-cache
version: 1.0.0
operation: purge
interfaces:
- DataPlaneMutating
rollback_contract: state_forward_only
irreversible: true
default_mode: shadow
promotion_gate:
  min_shadow_days: 14
  min_samples: 30
  min_accuracy: 0.98
  max_policy_escapes: 0
preconditions:
- kind: graph_fresh_within_seconds
  value: 300
stop_conditions:
- kind: provider_api_error_streak
  count: 3
- kind: time_box_exceeded_seconds
  seconds: 300
blast_radius:
  computation: static_enum
  static_bucket: resource
description: Redis or CDN cache flush. Data-plane mutating; forward-only (cached content will
  be refetched on the next read).
category: ops
trigger_kind:
  kind: both
execution_path: direct_api
ceiling_by_tier:
  t0:
    max_autonomy: enforce_hil
    min_role: contributor
  t1:
    max_autonomy: shadow_only
    min_role: contributor
  t2:
    max_autonomy: shadow_only
    min_role: approver
argument_schema:
  type: object
  additionalProperties: false
  required:
  - target_resource_ref
  - reason
  properties:
    target_resource_ref:
      type: string
      x-fdai-audit-safe: true
      minLength: 1
    scope:
      type: string
      enum:
      - all
      - key_prefix
      - region
      default: all
    key_prefix:
      type: string
      x-fdai-audit-safe: true
      default: ''
    reason:
      type: string
      x-fdai-audit-safe: true
      minLength: 10
      maxLength: 200
prod_downgrade:
  mode: enforce_hil
  detection_ref: risk-classification/env-detector
provenance:
  source_url: https://github.com/dotnetpower/fdai
  resolved_ref: action-type:ops.flush-cache@1.0.0
  content_hash: sha256:30dcc5715c3755032059eb6b01def4f56fdda32a9a821b344dd1f3b824497e91
  license: MIT
  retrieved_at: "2026-07-29T00:00:00Z"
