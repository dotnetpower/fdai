schema_version: 1.0.0
name: governance.demote-effect-model
version: 1.0.0
operation: update
interfaces:
- ControlPlane
rollback_contract: scripted
irreversible: false
default_mode: shadow
promotion_gate:
  min_shadow_days: 1
  min_samples: 1
  min_accuracy: 1.0
  max_policy_escapes: 0
preconditions:
- kind: graph_fresh_within_seconds
  value: 300
stop_conditions:
- kind: provider_api_error_streak
  count: 3
- kind: time_box_exceeded_seconds
  seconds: 300
blast_radius:
  computation: static_enum
  static_bucket: resource
description: Restore the retained prior GraphEffectModel active pointer after reviewed regression evidence.
category: governance
trigger_kind:
  kind: operator_request
execution_path: direct_api
ceiling_by_tier:
  t0:
    max_autonomy: enforce_hil
    min_role: owner
  t1:
    max_autonomy: shadow_only
    min_role: owner
  t2:
    max_autonomy: shadow_only
    min_role: owner
argument_schema:
  type: object
  additionalProperties: false
  required:
  - scope_digest
  - expected_active_ref
  - promotion_receipt_digest
  - justification
  properties:
    scope_digest:
      type: string
      pattern: ^[0-9a-f]{64}$
    expected_active_ref:
      type: string
      pattern: ^[A-Za-z0-9._-]+@[A-Za-z0-9._-]+:r[1-9][0-9]*$
    promotion_receipt_digest:
      type: string
      pattern: ^[0-9a-f]{64}$
    justification:
      type: string
      x-fdai-audit-safe: true
      minLength: 20
      maxLength: 500
provenance:
  source_url: https://github.com/dotnetpower/fdai
  resolved_ref: action-type:governance.demote-effect-model@1.0.0
