schema_version: 1.0.0
name: governance.promote-effect-model
version: 1.0.0
operation: update
interfaces:
- ControlPlane
rollback_contract: scripted
irreversible: false
default_mode: shadow
promotion_gate:
  min_shadow_days: 7
  min_samples: 20
  min_accuracy: 1.0
  max_policy_escapes: 0
preconditions:
- kind: graph_fresh_within_seconds
  value: 300
stop_conditions:
- kind: provider_api_error_streak
  count: 3
- kind: time_box_exceeded_seconds
  seconds: 5
blast_radius:
  computation: static_enum
  static_bucket: resource
description: Apply one exact reviewed GraphEffectModel promotion receipt after Owner HIL by
  atomically changing only its active pointer. The scripted rollback restores the prior active ref.
category: governance
trigger_kind:
  kind: operator_request
execution_path: direct_api
ceiling_by_tier:
  t0:
    max_autonomy: enforce_hil
    min_role: owner
  t1:
    max_autonomy: shadow_only
    min_role: owner
  t2:
    max_autonomy: shadow_only
    min_role: owner
argument_schema:
  type: object
  additionalProperties: false
  required:
  - receipt_digest
  - slot_digest
  - transition
  - justification
  properties:
    receipt_digest:
      type: string
      pattern: ^[0-9a-f]{64}$
    slot_digest:
      type: string
      pattern: ^[0-9a-f]{64}$
    transition:
      type: string
      enum:
      - promote
      - rollback
    justification:
      type: string
      x-fdai-audit-safe: true
      minLength: 20
      maxLength: 500
provenance:
  source_url: https://github.com/dotnetpower/fdai
  resolved_ref: action-type:governance.promote-effect-model@1.0.0
  content_hash: sha256:63b83308b979e7cd80a5250991aecd1c50320fd7b69da732dc8e68ce89d9aa9c
  license: MIT
  retrieved_at: "2026-08-12T00:00:00Z"
