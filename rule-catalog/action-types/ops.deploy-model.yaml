schema_version: 1.0.0
name: ops.deploy-model
version: 1.0.0
operation: create
interfaces:
- ControlPlane
- IdempotentByKey
- RateLimited
- RequiresInventoryFresh
rollback_contract: scripted
irreversible: false
default_mode: shadow
promotion_gate:
  min_shadow_days: 14
  min_samples: 30
  min_accuracy: 0.99
  max_policy_escapes: 0
preconditions:
- kind: no_conflicting_open_action_on_resource
stop_conditions:
- kind: provider_api_error_streak
  count: 3
- kind: time_box_exceeded_seconds
  seconds: 300
blast_radius:
  computation: static_enum
  static_bucket: resource
description: Create one pinned Global Standard model deployment after quota, role, dry-run, and exact-target checks. The executor verifies the resulting deployment by ARM readback.
category: ops
trigger_kind:
  kind: operator_request
execution_path: direct_api
ceiling_by_tier:
  t0:
    max_autonomy: enforce_hil
    min_role: owner
  t1:
    max_autonomy: shadow_only
    min_role: owner
  t2:
    max_autonomy: shadow_only
    min_role: owner
argument_schema:
  type: object
  additionalProperties: false
  required:
  - target_resource_ref
  - resource_group
  - account_name
  - deployment_name
  - model_name
  - model_version
  - sku_name
  - capacity_tpm
  - reason
  properties:
    target_resource_ref:
      type: string
      x-fdai-audit-safe: true
      pattern: ^/resourcegroups/[a-z0-9_.()-]+/providers/microsoft\.cognitiveservices/accounts/[a-z0-9_.()-]+/deployments/[a-z0-9_.()-]+$
      maxLength: 512
    resource_group:
      type: string
      x-fdai-audit-safe: true
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.()-]{0,127}$
    account_name:
      type: string
      x-fdai-audit-safe: true
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.()-]{0,127}$
    deployment_name:
      type: string
      x-fdai-audit-safe: true
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.()-]{0,127}$
    model_name:
      type: string
      x-fdai-audit-safe: true
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.()-]{0,127}$
    model_version:
      type: string
      x-fdai-audit-safe: true
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.()-]{0,127}$
    sku_name:
      type: string
      x-fdai-audit-safe: true
      const: GlobalStandard
    capacity_tpm:
      type: integer
      x-fdai-audit-safe: true
      minimum: 1000
      maximum: 10000000
      multipleOf: 1000
    reason:
      type: string
      x-fdai-audit-safe: true
      minLength: 10
      maxLength: 200
prod_downgrade:
  mode: enforce_hil
  detection_ref: risk-classification/env-detector
provenance:
  source_url: https://github.com/dotnetpower/fdai
  resolved_ref: action-type:ops.deploy-model@1.0.0
  content_hash: sha256:5e71416a83da736a07503112aeb8d36f1fa8c673e3ae1ec3b4976ce2370ef7d6
  license: MIT
  retrieved_at: "2026-09-06T00:00:00Z"
