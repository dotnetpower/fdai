apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdai-lifecycle-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fdai-lifecycle-hub
  template:
    metadata:
      labels:
        app: fdai-lifecycle-hub
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lifecycle-hub
          image: fdai-hub:distroless
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: hub-state
              mountPath: /state
      volumes:
        - name: hub-state
          emptyDir: {}
