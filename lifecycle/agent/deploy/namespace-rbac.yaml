apiVersion: v1
kind: Namespace
metadata:
  name: fdai-agent-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: fdai-nginx-dev
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fdai-lifecycle-agent
  namespace: fdai-agent-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fdai-lifecycle-workload
  namespace: fdai-nginx-dev
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fdai-lifecycle-workload
  namespace: fdai-nginx-dev
subjects:
  - kind: ServiceAccount
    name: fdai-lifecycle-agent
    namespace: fdai-agent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fdai-lifecycle-workload
