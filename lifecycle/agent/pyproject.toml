[project]
name = "fdai-lifecycle-agent"
version = "0.1.0"
description = "Hub-managed lifecycle agent skeleton: poll, admit, dry-run, and report without applying"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45,<51",
    "fdai-deployment-cli==0.1.1",
    "httpx>=0.27,<1",
]

[project.scripts]
fdai-lifecycle-agent = "fdai_lifecycle_agent.cli:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdai_lifecycle_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/fdai_lifecycle_agent", "pyproject.toml", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# Same rule set as the repository root; this file's ruff table takes precedence over the root.
select = ["E", "F", "I", "B", "UP", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/fdai_lifecycle_agent", "tests"]
mypy_path = ["src", "tests", "../../packages/deployment-cli/src", "../../packages/service-contracts/src"]
explicit_package_bases = true

[tool.uv.sources]
# Lifecycle I0 imports the pure lifecycle checks from the deployment CLI (#1948 fallback)
# until they move to a shared lifecycle-contracts package in Lifecycle I1.
fdai-deployment-cli = { path = "../../packages/deployment-cli", editable = true }
