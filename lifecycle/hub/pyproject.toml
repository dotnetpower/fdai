[project]
name = "fdai-lifecycle-hub"
version = "0.1.0"
description = "FDAI Lifecycle Hub that computes signed Lifecycle Plans for Hub-managed installations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45,<51",
    "fdai-deployment-cli>=0.1.1,<0.2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0,<3",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.35,<1",
]

[project.scripts]
fdai-lifecycle-hub = "fdai_lifecycle_hub.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.uv.sources]
fdai-deployment-cli = { path = "../../packages/deployment-cli", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fdai_lifecycle_hub"]
