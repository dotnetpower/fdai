<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FDAI design review access</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f8fa; color: #29313a; font: 16px/1.5 "Segoe UI", sans-serif; }
    main { width: min(34rem, calc(100% - 2rem)); border: 1px solid #d9dee5; background: #fff; padding: 2rem; }
    h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
    p { color: #5b6570; }
    a { color: #315f86; }
  </style>
</head>
<body>
  <main>
    <h1>Reviewer access required</h1>
    <p>This design-review site is available only to invited reviewers.</p>
    <a href="/.auth/logout">Sign out</a>
  </main>
</body>
</html>
