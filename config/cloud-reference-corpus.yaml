    summary_en: >-
      Covers migrating Key Vault from legacy access policies to Azure RBAC, enforcing
      soft delete plus purge protection against ransomware/accidental deletion, and automated rotation.
    summary_ko: >-
      Key Vault를 레거시 액세스 정책에서 Azure RBAC 권한 모델로 전환하고,
      랜섬웨어 및 실수로 인한 영구 삭제를 막는 Purge Protection과 자동 키/시크릿 회전을 적용합니다.
