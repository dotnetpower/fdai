swagger: "2.0"
info:
  title: FDAI governed SharePoint intake
  description: Pushes cross-tenant SharePoint changes into the FDAI ingestion boundary.
  version: "1.0"
host: fdai-ingestion.example.com
basePath: /
schemes:
  - https
consumes:
  - application/octet-stream
produces:
  - application/json
securityDefinitions:
  oauth2:
    type: oauth2
    flow: accessCode
    authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
    scopes:
      api://<fdai-connector-app-id>/DocumentConnector.Ingest: Ingest governed documents
security:
  - oauth2:
      - api://<fdai-connector-app-id>/DocumentConnector.Ingest
paths:
  /ingestion/connectors/power-platform/{connector_id}/items/{source_item_id}/content:
    put:
      operationId: IngestSharePointContent
      summary: Ingest one created or changed SharePoint file
      parameters:
        - $ref: "#/parameters/connectorId"
        - $ref: "#/parameters/sourceItemId"
        - $ref: "#/parameters/sourceRevision"
        - $ref: "#/parameters/eventSequence"
        - $ref: "#/parameters/sourceName"
        - name: body
          in: body
          required: true
          schema:
            type: string
            format: binary
      responses:
        "202":
          description: Content accepted into the governed ingestion lifecycle
        "400":
          description: Invalid bounded request
        "401":
          description: Token verification failed
        "403":
          description: Connector policy denied the request
  /ingestion/connectors/power-platform/{connector_id}/items/{source_item_id}/deleted:
    post:
      operationId: DeleteSharePointContent
      summary: Propagate one SharePoint deletion
      consumes:
        - application/json
      parameters:
        - $ref: "#/parameters/connectorId"
        - $ref: "#/parameters/sourceItemId"
        - $ref: "#/parameters/sourceRevision"
        - $ref: "#/parameters/eventSequence"
      responses:
        "202":
          description: Deletion intent accepted
        "401":
          description: Token verification failed
        "403":
          description: Connector policy denied the request
parameters:
  connectorId:
    name: connector_id
    in: path
    required: true
    type: string
    default: <fdai-connector-id>
    x-ms-visibility: internal
  sourceItemId:
    name: source_item_id
    in: path
    required: true
    type: string
    x-ms-summary: SharePoint item ID
  sourceRevision:
    name: x-fdai-source-revision
    in: header
    required: true
    type: string
    x-ms-summary: SharePoint ETag or deletion revision
  sourceName:
    name: x-fdai-source-name
    in: header
    required: true
    type: string
    x-ms-summary: Source filename
  eventSequence:
    name: x-fdai-event-sequence
    in: header
    required: true
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
    x-ms-summary: Monotonic sequence assigned by the flow
